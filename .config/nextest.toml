# Nextest is this repository's Rust test harness in every environment: local
# `mise run test:*` lanes and GitHub Actions alike. CI needs no extra setup —
# workflows invoke `mise run <task>`, and `jdx/mise-action` installs the
# `cargo:cargo-nextest` pin from `[tools]` in mise.toml.
#
# The deciding reason for nextest over `cargo test` is process-per-test
# isolation, not speed. The harness installs the production telemetry stack once
# per process — a global metrics recorder and tracing subscriber
# (crates/wyrd/wyrd-testing/src/bifrost/cluster.rs:578-611) — and tier-1 tests
# assert on `checkpoint()` deltas of those process-global counters. Two tests
# sharing one process fold each other's Forge counters into their own delta, so
# `cargo test --test-threads=6` fails
# convergence::pg_bifrost_forge_small_files_converges_without_query_dependency
# at convergence.rs:240 while nextest passes it. Serialization was the old way
# to avoid that; per-test processes make it correct instead of merely avoided.

# The Forge integration binary boots a Postgres-backed fixture per test, each
# retaining its own connection pools, so its concurrency is bounded by Postgres
# connections rather than CPU — the same constraint the journey profile states.
# The crate lane already runs it under that profile; the family lanes
# (scripts/run-family-tests.sh) run it under the default profile, where CPU
# parallelism oversubscribes the fixtures and their deterministic bounds are
# missed. This group applies the same ceiling wherever that binary runs.
[test-groups.postgres-fixtures]
max-threads = 6

# pg-embed downloads and unpacks its Postgres binaries into one per-user cache
# on first use, guarded only by an in-process mutex. Nextest runs each test in
# its own process, so on a cold cache (every hosted runner) two embedded-boot
# tests unpack over each other and one runs `initdb` against a half-written
# tree, failing with `PgInitFailure`. A warm local cache never shows it.
[test-groups.embedded-postgres]
max-threads = 1

[profile.default]
# nextest reports LEAK when a test's process has not fully quiesced within this
# window after the test function returns. The test still passes. Fixtures here
# tear down an in-process server and drop an ephemeral database, which
# occasionally exceeds the 100ms default under load without anything actually
# leaking.
leak-timeout = "2s"
# A test still running after 15 minutes is hung: fail it rather than let it
# hold its CI job until the job timeout.
slow-timeout = { period = "300s", terminate-after = 3 }
# Match the old lanes' `--no-fail-fast`: one broken test must not hide the rest
# of a binary.
fail-fast = false

[[profile.default.overrides]]
filter = 'package(vala-bifrost-redux) and binary(integration)'
test-group = 'postgres-fixtures'

# The router smoke module's Forge readiness matrix boots one WyrdTestServer per
# case for the same reason: each case mutates durable scheduler, demand, or
# quarantine state that a shared server could not isolate. It carries the same
# per-fixture connection cost, so it takes the same ceiling.
[[profile.default.overrides]]
filter = 'package(wyrd-server) and binary(integration) and test(/^pg_router_smoke::/)'
test-group = 'postgres-fixtures'

# The platform administration journeys also boot one WyrdTestServer per test;
# unbounded default-profile parallelism exhausts Postgres connections at boot.
[[profile.default.overrides]]
filter = 'package(wyrd-server) and binary(integration) and test(/^platform_admin_e2e::/)'
test-group = 'postgres-fixtures'

[[profile.default.overrides]]
filter = 'package(wyrd-sql) and test(/embedded/)'
test-group = 'embedded-postgres'

# The capacity binary starts replica 0 on the release server's fixed public
# port 8080, as a real deployment does, and two of its proofs boot a stand-in
# there. Run together, the second fails with `Address already in use`.
[test-groups.release-server-ports]
max-threads = 1

[[profile.default.overrides]]
filter = 'package(wyrd-testing) and binary(capacity) and (test(=tests::a_stalled_tenant_setup_stops_the_run_by_its_deadline) or test(=tests::a_slow_replica_stop_leaves_the_runtime_free))'
test-group = 'release-server-ports'
# Every other server-booting test starts its own WyrdTestServer. A server
# opens one set of serving pools and its fixture keeps another, each capped by
# scripts/postgres/with-test-postgres.sh: an 8-connection app pool
# (WYRD_DB_MAX_CONNECTIONS), an 8-connection Vala pool
# (WYRD_DB_MAX_CONNECTIONS_VALA), and a 2-connection platform-admin pool, so
# about 36 at most, plus brief migrator and superuser connections while its
# database is created. Pools fill lazily and a test rarely holds more than a
# third of that. The default profile runs one test per CPU, so a wide host
# oversubscribes max_connections=400 (docker-compose.yml), and SQLx reports the
# refused connections as pool timeouts. A `PgFixture` opens the same serving
# pools, so every `pg_*tests` module and the wyrd-sql and vala-sql `pg_*`
# integration modules cost as much as a server and share the cap. Sixteen at
# once plus the six `postgres-fixtures` stays under the limit at typical use.
# Binaries already in `postgres-fixtures` keep that group: the first matching
# override wins.
[test-groups.pg-servers]
max-threads = 16

[[profile.default.overrides]]
filter = '((package(wyrd-server) | package(wyrd-sql) | package(vala-sql)) and binary(integration) and test(/^pg_/)) or test(/pg_[a-z_]*tests::/)'
test-group = 'pg-servers'

[profile.journey]
# Tier-1 journey binaries boot a WyrdTestServer per test, each retaining its own
# connection pools. Concurrency is bounded by Postgres connections rather than
# CPU: with WYRD_DB_MAX_CONNECTIONS=8 (scripts/postgres/with-test-postgres.sh)
# against max_connections=400 (docker-compose.yml), six concurrent journeys sit
# well inside the ceiling. Raise both together, never this alone.
test-threads = 6
leak-timeout = "5s"
fail-fast = false

# The sustained journey asserts that a pod lending one vector to four
# concurrent tenants refuses at least once. That refusal only happens when the
# four tenants are genuinely in flight together, which is why the test runs its
# own multi-threaded runtime. Five sibling journeys competing for the same cores
# serialize those tenants instead, and the run then observes no refusal at all
# and fails. Reserving every slot keeps the contention it measures a property of
# the pod rather than of the host.
[[profile.journey.overrides]]
filter = 'test(=sustained::scribe_sustained_ingest_oracle_hot_read_journey)'
threads-required = 'num-test-threads'

# The paced drift journey asserts that client-owned bytes stay flat because
# the server drains as fast as the client emits. Sibling journeys slowing the
# server's drain make the client queue grow for reasons of the host, not of
# the client, so it reserves every slot for the same reason.
[[profile.journey.overrides]]
filter = 'package(wyrd-testing) and binary(server) and test(=observe_ingest::sustained_hundred_feature_drift_lands_exactly_once_with_flat_client_bytes)'
threads-required = 'num-test-threads'

# Every Bifrost peer cluster gives its pods the canonical public, gRPC, and
# peer ports on distinct loopback addresses starting at 127.0.0.2, as a real
# deployment does. Two clusters alive together therefore bind the same sockets
# and the second fails with `Address already in use`. One cluster at a time
# keeps pod-like addressing without sharing sockets between tests.
[test-groups.peer-clusters]
max-threads = 1

[[profile.journey.overrides]]
filter = 'package(wyrd-testing) and binary(oracle) and test(/^(analytical_activation|peer_network|mcp)::/)'
test-group = 'peer-clusters'
