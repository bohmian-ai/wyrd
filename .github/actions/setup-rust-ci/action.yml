name: Setup Rust CI
description: >-
  Shared CI bring-up for Rust jobs: free disk space, add swap, install mise,
  and restore the shared cargo build cache. Assumes the repo is already checked
  out. Every Rust job goes through this action so all of them build with
  rustc's default linker and the same environment, which the cache key hashes.

inputs:
  free-disk:
    description: Run the free-disk-space step (Linux only).
    default: "true"
  docker-images:
    description: Let free-disk-space remove preinstalled Docker images. Set false when the job needs Docker (emulators, OIDC providers).
    default: "true"
  preinstalled-runtimes:
    description: Let free-disk-space remove preinstalled language runtimes (the hosted-tool cache).
    default: "true"
  large-packages:
    description: Let free-disk-space remove large apt packages, including azure-cli. Set false when the job needs `az`.
    default: "true"
  cache-key:
    description: >-
      The shared Rust cache this job restores. Jobs that build the same graph
      share one: `test` (cargo test builds and the Python extension, which
      share third-party artifacts through workspace-hack), `clippy`
      (check-only artifacts), `napi` (the TypeScript addons' --target tree),
      and `journeys-typescript` (the RunsOn job's test and addon trees). The
      backend follows the runner: GitHub's cache on hosted runners, RunsOn's S3
      cache on RunsOn, so equal keys on the two never share entries.
    default: test
  save-cache:
    description: >-
      "true" saves the cache after a successful job on main only, so pull
      requests restore main's cache instead of evicting it with their own. One
      job per cache-key and backend saves.
    default: "false"

outputs:
  cache-hit:
    description: "true when the Rust cache restored an exact key match. Cargo still runs; a hit never proves a build unnecessary."
    value: ${{ steps.rust-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Free disk space
      if: inputs.free-disk == 'true' && runner.os == 'Linux'
      uses: jlumbroso/free-disk-space@v2
      with:
        preinstalled-runtimes: ${{ inputs.preinstalled-runtimes }}
        android: true
        dotnet: true
        haskell: true
        large-packages: ${{ inputs.large-packages }}
        docker-images: ${{ inputs.docker-images }}
        swap-storage: true

    # Linking several server-sized test binaries at once exceeds the runner's
    # RAM; without enough swap the runner is killed mid-link.
    - name: Add swap
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo swapoff -a
        sudo rm -f /mnt/swapfile
        sudo fallocate -l 16G /mnt/swapfile
        sudo chmod 600 /mnt/swapfile
        sudo mkswap /mnt/swapfile
        sudo swapon /mnt/swapfile
        free -h

    - name: Set up mise
      uses: jdx/mise-action@v5
      with:
        install: true
        cache: true

    # The key hashes the job's CARGO*/RUST* environment, so no later step may
    # change it. The default workspace mapping caches all of target/, including
    # napi's target/<triple>/ tree and the image builder's target/ubuntu-22.04/.
    - name: Cache Rust
      id: rust-cache
      uses: Swatinem/rust-cache@v2
      with:
        # v1: every earlier entry was linked with forced GNU BFD.
        prefix-key: v1-rust
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save-cache == 'true' && github.ref == 'refs/heads/main' }}
