name: Setup Rust CI
description: >-
  Shared CI bring-up for Rust jobs: free disk space, install mise, restore the
  shared cargo build cache, and select the GNU BFD linker on Linux. Assumes the
  repo is already checked out. Every Rust job goes through this action so all
  of them build with the same RUSTFLAGS and can reuse one another's caches.

inputs:
  free-disk:
    description: Run the free-disk-space step (Linux only).
    default: "true"
  docker-images:
    description: Let free-disk-space remove preinstalled Docker images. Set false when the job needs Docker (emulators, OIDC providers).
    default: "true"
  tool-cache:
    description: Let free-disk-space remove the hosted-tool cache.
    default: "true"
  cache-key:
    description: >-
      The shared Rust cache this job restores. Jobs that build the same graph
      share one: `test` (cargo test builds and the Python extension, which
      share third-party artifacts through workspace-hack), `clippy`
      (check-only artifacts), and `napi` (the TypeScript addons' --target tree).
    default: test
  save-cache:
    description: >-
      Save the cache after the job: "true" saves on main only, so pull
      requests restore main's cache instead of evicting it with their own;
      "always" also saves on pull requests, for the one deps job whose cache
      the run's shards restore. One job per cache-key saves.
    default: "false"
  bfd-linker:
    description: Force the GNU BFD linker on Linux (workaround for lld issues).
    default: "true"

outputs:
  cache-hit:
    description: "true when the Rust cache restored an exact key match."
    value: ${{ steps.rust-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Free disk space
      if: inputs.free-disk == 'true' && runner.os == 'Linux'
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: ${{ inputs.tool-cache }}
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: ${{ inputs.docker-images }}
        swap-storage: true

    # Linking several server-sized test binaries at once exceeds the runner's
    # RAM; without enough swap the runner is killed mid-link.
    - name: Add swap
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo swapoff -a
        sudo rm -f /mnt/swapfile
        sudo fallocate -l 16G /mnt/swapfile
        sudo chmod 600 /mnt/swapfile
        sudo mkswap /mnt/swapfile
        sudo swapon /mnt/swapfile
        free -h

    - name: Set up mise
      uses: jdx/mise-action@v3
      with:
        install: true
        cache: true

    - name: Cache Rust
      id: rust-cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save-cache == 'always' || (inputs.save-cache == 'true' && github.ref == 'refs/heads/main') }}
        # A red run still compiled the dependency set; saving it keeps the next
        # run from starting cold.
        cache-on-failure: true

    - name: Use GNU BFD linker on Linux
      if: inputs.bfd-linker == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        command -v cc
        command -v ld.bfd
        rustflags="${RUSTFLAGS:-}"
        rustflags="${rustflags:+$rustflags }-C linker-features=-lld -C link-arg=-fuse-ld=bfd"
        {
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=cc"
          echo "RUSTFLAGS=$rustflags"
        } >> "$GITHUB_ENV"
