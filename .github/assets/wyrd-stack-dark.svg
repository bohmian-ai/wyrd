<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-label="Where does Wyrd sit next to my app, CI, and coding agent?"><style>/* SVG grammar */
text {
  font-family: "Familjen Grotesk", system-ui, sans-serif;
}
.wd-t-title {
  fill: #e6e4da;
  font-size: 13.5px;
  font-weight: 600;
}
.wd-t-sub {
  fill: #8f92a5;
  font: 10.5px "Fragment Mono", ui-monospace, monospace;
}
.wd-t-code {
  fill: #e6e4da;
  font: 12px "Fragment Mono", ui-monospace, monospace;
  font-weight: 600;
}
.wd-t-ink {
  fill: #0b0c12;
}
.wd-t-col,
.wd-t-yes {
  fill: #e6e4da;
  font: 11px "Fragment Mono", ui-monospace, monospace;
}
.wd-t-colk,
.wd-t-no {
  fill: #8f92a5;
  font: 11px "Fragment Mono", ui-monospace, monospace;
}
.wd-t-group,
.wd-t-lane {
  fill: #8f92a5;
  font: 10.5px "Fragment Mono", ui-monospace, monospace;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.wd-t-target {
  fill: #e6e4da;
  font: 12.5px "Fragment Mono", ui-monospace, monospace;
  font-weight: 600;
}
.wd-t-label {
  fill: #8f92a5;
  font: 10.5px "Fragment Mono", ui-monospace, monospace;
  paint-order: stroke;
  stroke: #12141c;
  stroke-width: 4px;
  stroke-linejoin: round;
}
.wd-t-x {
  fill: #e2484d;
  font: 12px "Fragment Mono", ui-monospace, monospace;
}
.wd-t-stage {
  fill: #e6e4da;
  font: 11px "Fragment Mono", ui-monospace, monospace;
}
.wd-t-stagesub {
  fill: #8f92a5;
  font: 10.5px "Familjen Grotesk", system-ui, sans-serif;
}
.wd-f-surface {
  fill: #12141c;
}
.wd-f-surface2 {
  fill: #1a1d28;
}
.wd-f-declare {
  fill: #1a2040;
}
.wd-f-evidence {
  fill: #c5f23b;
}
.wd-s-border {
  stroke: #252838;
  stroke-width: 1;
}
.wd-s-declare {
  stroke: #7a8cff;
  stroke-width: 1;
}
.wd-s-text {
  stroke: #e6e4da;
  stroke-width: 1;
}
.wd-s-dash {
  stroke-dasharray: 4 3;
}
.wd-group {
  fill: none;
  stroke: #252838;
  stroke-dasharray: 2 4;
}
.wd-tone-progress {
  stroke: #7a8cff;
  stroke-width: 2;
}
.wd-tone-ok {
  stroke: #3dbe5a;
  stroke-width: 2;
}
.wd-tone-warn {
  stroke: #f0a13c;
  stroke-width: 2;
}
.wd-tone-danger {
  stroke: #e2484d;
  stroke-width: 2;
}
.wd-tone-muted {
  stroke: #8f92a5;
  stroke-width: 2;
}
.wd-line {
  fill: none;
  stroke-width: 1;
}
.wd-k-data .wd-line {
  stroke: #e6e4da;
}
.wd-k-control .wd-line {
  stroke: #7a8cff;
}
.wd-k-ref .wd-line {
  stroke: #8f92a5;
  stroke-dasharray: 3 3;
}
.wd-k-best .wd-line {
  stroke: #e6e4da;
  stroke-dasharray: 5 4;
}
.wd-mk-data {
  fill: #e6e4da;
}
.wd-mk-control {
  fill: #7a8cff;
}
.wd-mk-ref {
  fill: #8f92a5;
}
.wd-hit {
  fill: none;
  stroke: transparent;
  stroke-width: 14;
  cursor: pointer;
}
.wd-n,
.wd-e {
  transition: opacity 220ms ease-out;
}
.wd-focus .wd-n:not(.on),
.wd-focus .wd-e:not(.on) {
  opacity: 0.22;
}
.wd-e.on .wd-line {
  stroke-width: 2;
}
.wd-n.clickable {
  cursor: pointer;
}
.wd-n:focus-visible {
  outline: none;
}
.wd-n .wd-halo {
  fill: none;
}
.wd-n.sel .wd-halo,
.wd-n:focus-visible .wd-halo {
  stroke: #7a8cff;
  stroke-width: 2;
}
.wd-pk-data {
  fill: #c5f23b;
  stroke: #0b0c12;
  stroke-width: 1;
}
.wd-pk-control {
  fill: #7a8cff;
}
.wd-lifeline {
  stroke: #252838;
  stroke-dasharray: 2 4;
}
.wd-lane {
  fill: #1a1d28;
}
.wd-axis {
  stroke: #252838;
}
.wd-tick {
  stroke: #8f92a5;
}
.wd-cursor {
  stroke: #7a8cff;
  stroke-width: 1.5;
}
.wd-peer {
  fill: none;
  stroke: #7a8cff;
  stroke-dasharray: 2 3;
}
.wd-pod > .wd-box {
  fill: #12141c;
  stroke: #252838;
}
.wd-pod.hl > .wd-box {
  stroke: #7a8cff;
  stroke-width: 2;
}
.wd-facet .wd-pod.dim,
.wd-facet .wd-chip.dim {
  opacity: 0.3;
}
.wd-chip rect {
  fill: #1a1d28;
  stroke: #252838;
}
.wd-chip.off rect {
  fill: none;
  stroke-dasharray: 3 3;
}
.wd-chip.hl rect {
  fill: #1a2040;
  stroke: #7a8cff;
  stroke-width: 2;
}
.wd-pod,
.wd-chip {
  transition: opacity 220ms ease-out;
}
