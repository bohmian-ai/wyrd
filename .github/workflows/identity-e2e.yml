name: identity-e2e

# Runs real OIDC providers (Keycloak + Dex) and asserts the full identity
# journey suite: discovery, human login, workload jwt-bearer, TTL, revocation,
# key rotation, and multi-tenant isolation.
#
# Gated by the `identity` path filter so docs/UI/storage-only PRs skip the OIDC
# bring-up. No credentials required — all providers are local containers.
# Hosted-provider tests (Okta, Entra, Auth0) run only on nightly, gated by
# WYRD_IDENTITY_EXTERNAL=1 and repo secrets.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  MISE_LOCKED: "true"

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      identity: ${{ steps.filter.outputs.identity }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        shell: bash
        env:
          WYRD_CHANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          WYRD_CHANGE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/detect-changes.sh

  identity-e2e:
    name: identity e2e (keycloak + dex)
    needs: changes
    if: needs.changes.outputs.identity == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust-ci
        with:
          docker-images: "false"

      - name: Run identity e2e suite
        run: mise run test:identity:journey
