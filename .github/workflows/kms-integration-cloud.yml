name: kms-integration-cloud

# Runs the WyrdKms provider checks against real Google Cloud KMS and AWS KMS:
# seal a fixed value, open it with a second facade built from the same
# configuration, and refuse it under another owner. Protocol fixtures cannot
# verify real credential acceptance, AWS SigV4 signing, provider request and
# response compatibility, or provider-side context binding.
#
# Triggers only on pushes to main: no schedule and no manual dispatch, and never
# on pull requests (credential exposure risk). Before merging a KMS adapter
# change, run the same `test:kms:<provider>:cloud` tasks locally with the
# WYRD_KMS_* settings below in an untracked mise.local.toml.
#
# Keys are provisioned before this runs; the tests never create, rotate, or
# delete one, and need only encrypt and decrypt access. Until the secrets below
# are provisioned the jobs fail naming the missing setting rather than
# silently skipping.

on:
  push:
    branches: [main]

# Required secrets in the `kms-integration` environment:
#   AWS_KMS_ROLE_ARN   — IAM role ARN for OIDC assumption, allowed kms:Encrypt
#                        and kms:Decrypt on AWS_KMS_KEY_ARN
#   AWS_KMS_REGION     — the key's region (e.g. us-east-1)
#   AWS_KMS_KEY_ARN    — symmetric ENCRYPT_DECRYPT key ARN (aliases are refused)
#   GOOGLE_APPLICATION_CREDENTIALS_JSON — service-account key JSON holding
#                        roles/cloudkms.cryptoKeyEncrypterDecrypter on
#                        GCP_KMS_KEY; written to a file, the form the KMS
#                        credential loader reads
#   GCP_KMS_KEY        — CryptoKey resource name without a version:
#                        projects/<p>/locations/<l>/keyRings/<r>/cryptoKeys/<k>

# A newer push to main supersedes the previous push's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write   # Required for AWS OIDC credential federation

env:
  MISE_LOCKED: "true"

jobs:
  aws-cloud:
    name: AWS KMS real-cloud
    runs-on: ubuntu-24.04
    environment: kms-integration
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust-ci
        with:
          docker-images: "false"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_KMS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_KMS_REGION }}

      - name: Run AWS KMS cloud test
        env:
          WYRD_KMS_BACKEND: aws_kms
          WYRD_KMS_ACTIVE_KEY: ${{ secrets.AWS_KMS_KEY_ARN }}
        run: mise run test:kms:aws:cloud

  gcp-cloud:
    name: Cloud KMS real-cloud
    runs-on: ubuntu-24.04
    environment: kms-integration
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust-ci
        with:
          docker-images: "false"

      - name: Write the GCP service-account key file
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          umask 077
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/gcp-kms-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-kms-key.json" >> "$GITHUB_ENV"

      - name: Run Cloud KMS cloud test
        env:
          WYRD_KMS_BACKEND: gcp_kms
          WYRD_KMS_ACTIVE_KEY: ${{ secrets.GCP_KMS_KEY }}
        run: mise run test:kms:gcp:cloud
