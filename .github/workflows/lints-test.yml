name: lints-test

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: read

env:
  MISE_LOCKED: "true"

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      docs: ${{ steps.filter.outputs.docs }}
      ui: ${{ steps.filter.outputs.ui }}
      generated: ${{ steps.filter.outputs.generated }}
      workflow: ${{ steps.filter.outputs.workflow }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        shell: bash
        env:
          WYRD_CHANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          WYRD_CHANGE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/detect-changes.sh

  matrix-plan:
    name: matrix plan
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      os: ${{ steps.plan.outputs.os }}
      python: ${{ steps.plan.outputs.python }}
    steps:
      - id: plan
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo 'os=["ubuntu-24.04"]'                                >> "$GITHUB_OUTPUT"
            echo 'python=["3.12"]'                                    >> "$GITHUB_OUTPUT"
            echo "scope=pr"                                           >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-24.04","macos-15","windows-latest"]'    >> "$GITHUB_OUTPUT"
            echo 'python=["3.10","3.11","3.12"]'                      >> "$GITHUB_OUTPUT"
            echo "scope=release"                                      >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  rust:
    name: rust (${{ matrix.os }})
    needs: [changes, matrix-plan]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix-plan.outputs.os) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Run Rust test gate
        run: mise run test:unit

  rust-gates:
    name: rust gates
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.generated == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Rust components
        run: rustup component add --toolchain "$RUSTUP_TOOLCHAIN" rustfmt clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Format, lint, and check
        run: mise run check

      - name: Boundary checks
        run: |
          mise run cardkind:check
          mise run check:client-tier
          mise run check:registry-no-server-routes
          mise run check:registry-tx-coupling
          mise run check:registry-immutable-spec-hash
          mise run check:registry-single-table
          mise run check:pyo3-scope
          mise run check:mocks-scope
          mise run check:unwrap-audit
          mise run check:test-contracts
          mise run check:wasm

  codegen:
    name: codegen
    needs: changes
    if: needs.changes.outputs.generated == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check generated contracts
        run: mise run codegen:check

  python:
    name: python (${{ matrix.os }} / py${{ matrix.python-version }})
    needs: [changes, matrix-plan]
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix-plan.outputs.os) }}
        python-version: ${{ fromJSON(needs.matrix-plan.outputs.python) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.x"

      - name: Install Protocol Buffers Compiler
        uses: arduino/setup-protoc@v3
        with:
          version: "33.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev pkg-config

      - name: Install libomp on macOS
        if: runner.os == 'macOS'
        run: brew install libomp curl openssl pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.python-version }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Python format and lint
        run: |
          mise run py:format:check
          mise run py:lints
          mise run py:typecheck
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Python tests
        run: mise run py:test:unit
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: TensorFlow Python tests
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: mise run py:test:tensorflow
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Python examples
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        run: mise run examples:python:datacard
        env:
          UV_PYTHON: ${{ matrix.python-version }}

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Check docs
        run: mise run docs:check

  ui:
    name: ui
    needs: changes
    if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Check UI package
        working-directory: crates/wyrd/wyrd-server/wyrd-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm exec svelte-kit sync
          pnpm exec vite --version

  ci-complete:
    name: ci complete
    needs: [changes, matrix-plan, rust, rust-gates, codegen, python, docs, ui]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "${{ needs.rust.result }}" \
            "${{ needs.rust-gates.result }}" \
            "${{ needs.codegen.result }}" \
            "${{ needs.python.result }}" \
            "${{ needs.docs.result }}" \
            "${{ needs.ui.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "CI job failed or was cancelled: $result"; exit 1 ;;
            esac
          done
