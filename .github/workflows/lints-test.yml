name: lints-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request supersedes the running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_LOCKED: "true"

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      python: ${{ steps.filter.outputs.python }}
      typescript: ${{ steps.filter.outputs.typescript }}
      rust_client: ${{ steps.filter.outputs.rust_client }}
      docs: ${{ steps.filter.outputs.docs }}
      ui: ${{ steps.filter.outputs.ui }}
      full_gate: ${{ steps.filter.outputs.full_gate }}
      rust_packages: ${{ steps.filter.outputs.rust_packages }}
      ci_jobs: ${{ steps.filter.outputs.ci_jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        shell: bash
        env:
          WYRD_CHANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          WYRD_CHANGE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/detect-changes.sh

  # The full gate's shards already run every Linux lane, so a full-gate change
  # runs the SDK platform jobs on macOS only; a selected change runs them on
  # both. Main pushes add the older supported Python versions on Linux.
  matrix-plan:
    name: matrix plan
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      os: ${{ steps.plan.outputs.os }}
      python: ${{ steps.plan.outputs.python }}
    steps:
      - id: plan
        shell: bash
        run: |
          if [[ "${{ needs.changes.outputs.full_gate }}" == "true" ]]; then
            echo 'os=["macos-15"]' >> "$GITHUB_OUTPUT"
            python='[{"os":"macos-15","python-version":"3.12"}'
          else
            echo 'os=["ubuntu-24.04","macos-15"]' >> "$GITHUB_OUTPUT"
            python='[{"os":"ubuntu-24.04","python-version":"3.12"},{"os":"macos-15","python-version":"3.12"}'
          fi
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            python+=',{"os":"ubuntu-24.04","python-version":"3.10"},{"os":"ubuntu-24.04","python-version":"3.11"}'
          fi
          echo "python=$python]" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # select-ci.py plans the Linux jobs. Mixed, global, unclassified, and
  # unresolvable changes take the complete gate as one parallel job per
  # `gate:*` shard in mise.toml, so every lane runs exactly once. Any other
  # change runs format, lint, the boundary checks, and exactly the lanes
  # selected for its affected packages, with the identity and storage journeys
  # as their own jobs when selected.
  # Compiles the third-party dependency set once, before any shard starts:
  # building the workspace's tests compiles every dependency with the features
  # the shards' test builds use, and the cache keeps only those dependencies.
  # Each shard restores it from the `test` cache instead of compiling it. An
  # exact cache hit already holds the set, so the build is skipped.
  deps:
    name: deps
    needs: changes
    if: needs.changes.outputs.ci_jobs != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - id: setup
        uses: ./.github/actions/setup-rust-ci
        with:
          save-cache: always

      - name: Build the shared dependencies
        if: steps.setup.outputs.cache-hit != 'true'
        run: >-
          mise exec -- cargo build --locked --workspace --tests
          --exclude wyrd-sdk-python --exclude wyrd-sdk-ts --exclude wyrd-sdk-ts-testing

  ci:
    name: ci (${{ matrix.job.name }})
    needs: [changes, deps]
    if: needs.changes.outputs.ci_jobs != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.changes.outputs.ci_jobs) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust-ci
        with:
          docker-images: "false"
          cache-key: ${{ matrix.job.cache }}
          save-cache: ${{ matrix.job.save && 'true' || 'false' }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Shards that never run uv have nothing to cache.
          ignore-nothing-to-cache: true
          python-version: "3.12"

      - name: Install Rust components
        run: rustup component add --toolchain "$RUSTUP_TOOLCHAIN" rustfmt clippy

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep libcurl4-openssl-dev pkg-config

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Run lanes
        env:
          RUST_LOG: info,vala_bifrost_redux::oracle=debug,wyrd_server::http::router=debug
          WYRD_TEST_PACKAGES: ${{ needs.changes.outputs.rust_packages }}
          CI_LANES: ${{ matrix.job.lanes }}
        run: |
          printf '### Lane timings\n\n| lane | duration |\n| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          for lane in $CI_LANES; do
            started=$SECONDS
            echo "::group::mise run $lane"
            mise run "$lane"
            echo "::endgroup::"
            echo "| \`$lane\` | $((SECONDS - started))s |" >> "$GITHUB_STEP_SUMMARY"
          done

  rust-client:
    name: rust client (${{ matrix.os }})
    needs: [changes, matrix-plan]
    if: needs.changes.outputs.full_gate == 'true' || needs.changes.outputs.rust_client == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix-plan.outputs.os) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust-ci
        with:
          save-cache: ${{ runner.os == 'macOS' && 'true' || 'false' }}

      - name: Run Rust client and SDK tests
        run: |
          mise run test:wyrd-sdk
          mise exec -- cargo nextest run --locked -p wyrd-client --lib

  typescript:
    name: typescript (${{ matrix.os }})
    needs: [changes, matrix-plan]
    if: needs.changes.outputs.full_gate == 'true' || needs.changes.outputs.typescript == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix-plan.outputs.os) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust-ci
        with:
          cache-key: napi
          save-cache: ${{ runner.os == 'macOS' && 'true' || 'false' }}

      - name: Run TypeScript SDK tests
        run: |
          mise run ts:typecheck
          mise run ts:test:unit

  python:
    name: python (${{ matrix.os }} / py${{ matrix.python-version }})
    needs: [changes, matrix-plan]
    if: needs.changes.outputs.full_gate == 'true' || needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix-plan.outputs.python) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust-ci

      - name: Install build dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev pkg-config

      - name: Install libomp on macOS
        if: runner.os == 'macOS'
        run: brew install libomp curl openssl pkg-config

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Python format and lint
        run: |
          mise run py:format:check
          mise run py:lints
          mise run py:typecheck
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Python tests
        run: mise run py:test:unit
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: TensorFlow Python tests
        if: matrix.python-version == '3.12'
        run: mise run py:test:tensorflow
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Python examples
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        run: mise run examples:python:datacard
        env:
          UV_PYTHON: ${{ matrix.python-version }}

  docs:
    name: docs
    needs: changes
    # The full gate's gate:checks shard already runs docs:check.
    if: needs.changes.outputs.full_gate != 'true' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Check docs (includes docs:a11y)
        run: mise run docs:check

  ui:
    name: ui
    needs: changes
    if: needs.changes.outputs.full_gate == 'true' || needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Check UI package
        working-directory: crates/wyrd/wyrd-server/wyrd-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm exec svelte-kit sync
          pnpm exec vite --version

      - name: Token drift lock
        working-directory: crates/wyrd/wyrd-server/wyrd-ui
        run: node brand/gen-theme.mjs --check

  ci-complete:
    name: ci complete
    needs: [changes, matrix-plan, deps, ci, rust-client, typescript, python, docs, ui]
    # Not always(): a superseded run must stop here, or the next push's run
    # waits for this job before the concurrency group lets it start.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify required jobs
        shell: bash
        run: >-
          .github/scripts/verify-required-jobs.sh
          "${{ needs.changes.result }}"
          "${{ needs.matrix-plan.result }}"
          "${{ needs.deps.result }}"
          "${{ needs.ci.result }}"
          "${{ needs.rust-client.result }}"
          "${{ needs.typescript.result }}"
          "${{ needs.python.result }}"
          "${{ needs.docs.result }}"
          "${{ needs.ui.result }}"
