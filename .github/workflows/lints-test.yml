name: lints-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      docs: ${{ steps.filter.outputs.docs }}
      ui: ${{ steps.filter.outputs.ui }}
      generated: ${{ steps.filter.outputs.generated }}
      workflow: ${{ steps.filter.outputs.workflow }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        shell: bash
        env:
          WYRD_CHANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          WYRD_CHANGE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/detect-changes.sh

  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Test Rust workspace
        run: mise run test:unit

  rust-gates:
    name: rust gates
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.generated == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Format, lint, and check
        run: mise run check

      - name: Boundary checks
        run: |
          mise run cardkind:check
          mise run check:client-tier
          mise run check:pyo3-scope
          mise run check:mocks-scope
          mise run check:unwrap-audit
          mise run check:test-contracts
          mise run check:wasm
          mise run check:deny

  codegen:
    name: codegen
    needs: changes
    if: needs.changes.outputs.generated == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check generated contracts
        run: mise run codegen:check

  python:
    name: python (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Python format and lint
        run: |
          mise run py:format:check
          mise run py:lints
          mise run py:typecheck

      - name: Python tests
        run: mise run py:test:unit

      - name: Python examples
        run: mise run examples:python:datacard

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Check docs
        run: mise run docs:check

  ui:
    name: ui
    needs: changes
    if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Check UI package
        working-directory: crates/wyrd/wyrd-server/wyrd-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm exec svelte-kit sync
          pnpm exec vite --version

  ci-complete:
    name: ci complete
    needs: [changes, rust, rust-gates, codegen, python, docs, ui]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "${{ needs.rust.result }}" \
            "${{ needs.rust-gates.result }}" \
            "${{ needs.codegen.result }}" \
            "${{ needs.python.result }}" \
            "${{ needs.docs.result }}" \
            "${{ needs.ui.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "CI job failed or was cancelled: $result"; exit 1 ;;
            esac
          done
