name: lints-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  MISE_LOCKED: "true"

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      docs: ${{ steps.filter.outputs.docs }}
      ui: ${{ steps.filter.outputs.ui }}
      workflow: ${{ steps.filter.outputs.workflow }}
      bifrost_only: ${{ steps.filter.outputs.bifrost_only }}
      full_gate: ${{ steps.filter.outputs.full_gate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        shell: bash
        env:
          WYRD_CHANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          WYRD_CHANGE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/detect-changes.sh

  matrix-plan:
    name: matrix plan
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      os: ${{ steps.plan.outputs.os }}
      python: ${{ steps.plan.outputs.python }}
    steps:
      - id: plan
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo 'os=["ubuntu-24.04"]'                                >> "$GITHUB_OUTPUT"
            echo 'python=["3.12"]'                                    >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-24.04","macos-15","windows-latest"]'    >> "$GITHUB_OUTPUT"
            echo 'python=["3.10","3.11","3.12"]'                      >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # Mixed, global, and unclassified changes take the complete repository gate.
  # Any other non-Bifrost Rust change runs format, lint, and Linux Rust tests
  # here; rust-compat adds macOS and Windows on main.
  ci:
    name: ci
    needs: changes
    if: needs.changes.outputs.full_gate == 'true' || ((needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true') && needs.changes.outputs.bifrost_only != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Rust components
        run: rustup component add --toolchain "$RUSTUP_TOOLCHAIN" rustfmt clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep libcurl4-openssl-dev pkg-config

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Run selected CI lane
        run: |
          if [[ "${{ needs.changes.outputs.full_gate }}" == "true" ]]; then
            mise run gate
          else
            mise run check
            mise run test:rust
          fi

  bifrost:
    name: bifrost
    needs: changes
    if: needs.changes.outputs.bifrost_only == 'true' && needs.changes.outputs.workflow != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Rust components
        run: rustup component add --toolchain "$RUSTUP_TOOLCHAIN" rustfmt clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep libcurl4-openssl-dev pkg-config

      - name: Run Bifrost gate
        run: mise run verify:bifrost

  # Cross-platform Rust compatibility: tests on macOS and Windows.
  # Format/lint/boundary checks run only in the ci job above (Linux only).
  rust-compat:
    name: rust compat (${{ matrix.os }})
    needs: [changes, matrix-plan]
    if: (needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true') && needs.changes.outputs.bifrost_only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix-plan.outputs.os) }}
        exclude:
          - os: ubuntu-24.04   # covered by the ci job
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust-ci

      - name: Run Rust test gate
        run: mise run test:rust

  python:
    name: python (${{ matrix.os }} / py${{ matrix.python-version }})
    needs: [changes, matrix-plan]
    if: (needs.changes.outputs.python == 'true' || needs.changes.outputs.workflow == 'true') && needs.changes.outputs.bifrost_only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix-plan.outputs.os) }}
        python-version: ${{ fromJSON(needs.matrix-plan.outputs.python) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install build dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev pkg-config

      - name: Install libomp on macOS
        if: runner.os == 'macOS'
        run: brew install libomp curl openssl pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.python-version }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Python format and lint
        run: |
          mise run py:format:check
          mise run py:lints
          mise run py:typecheck
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Python tests
        run: mise run py:test:unit
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: TensorFlow Python tests
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: mise run py:test:tensorflow
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Python examples
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        run: mise run examples:python:datacard
        env:
          UV_PYTHON: ${{ matrix.python-version }}

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Check docs
        run: mise run docs:check

      - name: docs:a11y — landmarks, heading order, contrast, keyboard controls
        run: mise run docs:a11y

  ui:
    name: ui
    needs: changes
    if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Check UI package
        working-directory: crates/wyrd/wyrd-server/wyrd-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm exec svelte-kit sync
          pnpm exec vite --version

      - name: Token drift lock
        run: mise run check:tokens

  ci-complete:
    name: ci complete
    needs: [changes, matrix-plan, ci, bifrost, rust-compat, python, docs, ui]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify required jobs
        shell: bash
        run: >-
          .github/scripts/verify-required-jobs.sh
          "${{ needs.changes.result }}"
          "${{ needs.matrix-plan.result }}"
          "${{ needs.ci.result }}"
          "${{ needs.bifrost.result }}"
          "${{ needs.rust-compat.result }}"
          "${{ needs.python.result }}"
          "${{ needs.docs.result }}"
          "${{ needs.ui.result }}"
