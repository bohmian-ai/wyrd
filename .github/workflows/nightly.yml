name: nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  # release.yml calls this as its qualification gate on the release commit.
  workflow_call:

permissions:
  contents: read

env:
  MISE_LOCKED: "true"

jobs:
  # gate plus the lanes it does not reach. gate already covers the storage
  # emulator matrix, the real-server journeys, the Python and TypeScript
  # integration suites, and the identity journey; live cloud and performance
  # run elsewhere.
  gate:
    name: nightly ${{ matrix.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        task:
          - gate
          - py:test:testing
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Rust components
        run: rustup component add --toolchain "$RUSTUP_TOOLCHAIN" rustfmt clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep libcurl4-openssl-dev pkg-config

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Run ${{ matrix.task }}
        run: mise run ${{ matrix.task }}

  postgres:
    name: isolated Postgres checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust-ci
        with:
          docker-images: "false"

      - name: Run isolated Postgres contract checks
        run: mise run test:postgres:contract

      - name: Run isolated Postgres concurrency checks
        run: mise run test:postgres:concurrency

      - name: Run isolated Postgres role checks
        run: mise run test:postgres:roles

      - name: Run isolated Postgres inventory checks
        run: mise run test:postgres:inventory
