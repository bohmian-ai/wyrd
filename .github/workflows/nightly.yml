name: nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_LOCKED: "true"

jobs:
  gate:
    name: full repository gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Rust components
        run: rustup component add --toolchain "$RUSTUP_TOOLCHAIN" rustfmt clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep libcurl4-openssl-dev pkg-config

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Run full gate
        run: mise run gate

  identity:
    name: identity journey
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust-ci
        with:
          docker-images: "false"

      - name: Run identity journey
        run: mise run test:identity:journey

  postgres:
    name: isolated Postgres checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust-ci
        with:
          docker-images: "false"

      - name: Run isolated Postgres contract checks
        run: mise run test:postgres:contract

      - name: Run isolated Postgres concurrency checks
        run: mise run test:postgres:concurrency

      - name: Run isolated Postgres role checks
        run: mise run test:postgres:roles

      - name: Run isolated Postgres inventory checks
        run: mise run test:postgres:inventory

  # Real-server journeys the gate does not reach. Live-cloud storage and
  # performance stay in their own workflows.
  rust-journeys:
    name: real-server Rust journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust-ci
        with:
          docker-images: "false"

      - name: Run Card registration integration
        run: mise run test:cards:integration

      - name: Run CLI journey
        run: mise run test:cli:journey

      - name: Run WyrdState journey
        run: mise run test:wyrdstate:journey

  python-journeys:
    name: Python harness and integration journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust-ci
        with:
          docker-images: "false"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Run Python harness tests
        run: mise run py:test:testing

      - name: Run Python integration journeys
        run: mise run py:test:integration

  typescript-journeys:
    name: TypeScript integration journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust-ci
        with:
          docker-images: "false"

      - name: Run TypeScript integration journeys
        run: mise run ts:test:integration

  storage-emulators:
    name: storage emulator matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust-ci
        with:
          docker-images: "false"

      - name: Start storage emulators
        run: mise run storage:up

      - name: Run storage emulator matrix
        run: mise run test:storage:matrix

      - name: Stop storage emulators
        if: always()
        run: mise run storage:down
