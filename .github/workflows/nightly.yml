name: nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_LOCKED: "true"

jobs:
  gate:
    name: full repository gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Rust components
        run: rustup component add --toolchain "$RUSTUP_TOOLCHAIN" rustfmt clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep libcurl4-openssl-dev pkg-config

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Run full gate
        run: mise run gate
