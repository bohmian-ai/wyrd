name: nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_LOCKED: "true"

jobs:
  plan:
    name: gate shards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ci_jobs: ${{ steps.plan.outputs.ci_jobs }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        run: python3 .github/scripts/select-ci.py --gate

  # The complete gate, one parallel job per `gate:*` shard in mise.toml except
  # the TypeScript and Rust journey shards, which share one RunsOn job: the
  # same jobs a full-gate pull request runs. Live cloud and production-geometry
  # qualification run in their own workflows.
  gate:
    name: nightly ${{ matrix.job.name }}
    needs: plan
    runs-on: ${{ matrix.job.runs_on && format('runs-on={0}/runner=8cpu-linux-x64/ram=16/volume=100gb/extras=s3-cache', github.run_id) || 'ubuntu-24.04' }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.ci_jobs) }}
    steps:
      - if: matrix.job.runs_on
        uses: runs-on/action@v2

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust-ci
        with:
          docker-images: "false"
          cache-key: ${{ matrix.job.cache }}
          save-cache: ${{ matrix.job.save && 'true' || 'false' }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          # Shards that never run uv have nothing to cache.
          ignore-nothing-to-cache: true
          python-version: "3.13"

      - name: Install Rust components
        run: rustup component add --toolchain "$RUSTUP_TOOLCHAIN" rustfmt clippy

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep libcurl4-openssl-dev pkg-config

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Run ${{ matrix.job.lanes }}
        env:
          CI_LANES: ${{ matrix.job.lanes }}
        run: |
          for lane in $CI_LANES; do
            echo "::group::mise run $lane"
            mise run "$lane"
            echo "::endgroup::"
          done

      - name: Print Rust SDK journey log
        if: always() && hashFiles('.dev/ci-logs/rust-sdk-journeys.log') != ''
        run: cat .dev/ci-logs/rust-sdk-journeys.log

      - name: Upload Rust SDK journey log
        if: always() && hashFiles('.dev/ci-logs/rust-sdk-journeys.log') != ''
        uses: actions/upload-artifact@v7
        with:
          name: rust-sdk-journey-log
          path: .dev/ci-logs/rust-sdk-journeys.log
          include-hidden-files: true
          retention-days: 7

  postgres:
    name: isolated Postgres checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust-ci
        with:
          docker-images: "false"

      - name: Run isolated Postgres contract checks
        run: mise run test:postgres:contract

      - name: Run isolated Postgres concurrency checks
        run: mise run test:postgres:concurrency

      - name: Run isolated Postgres inventory checks
        run: mise run test:postgres:inventory
