name: nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  # release.yml calls this as its qualification gate on the release commit.
  workflow_call:

permissions:
  contents: read

env:
  MISE_LOCKED: "true"

jobs:
  plan:
    name: gate shards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ci_jobs: ${{ steps.plan.outputs.ci_jobs }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: python3 .github/scripts/select-ci.py --gate

  # The complete gate, one parallel job per `gate:*` shard in mise.toml: the
  # same jobs a full-gate pull request runs. Live cloud and production-geometry
  # qualification run in their own workflows.
  gate:
    name: nightly ${{ matrix.job.name }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.ci_jobs) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust-ci
        with:
          docker-images: "false"
          cache-key: ${{ matrix.job.cache }}
          save-cache: ${{ matrix.job.save && 'true' || 'false' }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Rust components
        run: rustup component add --toolchain "$RUSTUP_TOOLCHAIN" rustfmt clippy

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep libcurl4-openssl-dev pkg-config

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Run ${{ matrix.job.lanes }}
        run: mise run ${{ matrix.job.lanes }}

  postgres:
    name: isolated Postgres checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust-ci
        with:
          docker-images: "false"

      - name: Run isolated Postgres contract checks
        run: mise run test:postgres:contract

      - name: Run isolated Postgres concurrency checks
        run: mise run test:postgres:concurrency

      - name: Run isolated Postgres inventory checks
        run: mise run test:postgres:inventory
