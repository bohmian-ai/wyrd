name: nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_LOCKED: "true"

jobs:
  plan:
    name: gate shards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ci_jobs: ${{ steps.plan.outputs.ci_jobs }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        run: python3 .github/scripts/select-ci.py --gate

  # Compiles the third-party dependency set once, before any shard starts:
  # building the workspace's tests compiles every dependency with the features
  # the shards' test builds use, and the cache keeps only those dependencies.
  # Each shard restores it from the `test` cache instead of compiling it. An
  # exact cache hit already holds the set, so the build is skipped.
  deps:
    name: deps
    needs: plan
    if: needs.plan.outputs.ci_jobs != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - id: setup
        uses: ./.github/actions/setup-rust-ci
        with:
          save-cache: always

      - name: Build the shared dependencies
        if: steps.setup.outputs.cache-hit != 'true'
        run: >-
          mise exec -- cargo build --locked --workspace --tests
          --exclude wyrd-sdk-python --exclude wyrd-sdk-ts --exclude wyrd-sdk-ts-testing

  # The complete gate, one parallel job per `gate:*` shard in mise.toml: the
  # same jobs a full-gate pull request runs. Live cloud and production-geometry
  # qualification run in their own workflows.
  gate:
    name: nightly ${{ matrix.job.name }}
    needs: [plan, deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.ci_jobs) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust-ci
        with:
          docker-images: "false"
          cache-key: ${{ matrix.job.cache }}
          save-cache: ${{ matrix.job.save && 'true' || 'false' }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          # Shards that never run uv have nothing to cache.
          ignore-nothing-to-cache: true
          python-version: "3.13"

      - name: Install Rust components
        run: rustup component add --toolchain "$RUSTUP_TOOLCHAIN" rustfmt clippy

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep libcurl4-openssl-dev pkg-config

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Run ${{ matrix.job.lanes }}
        run: mise run ${{ matrix.job.lanes }}

  postgres:
    name: isolated Postgres checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust-ci
        with:
          docker-images: "false"

      - name: Run isolated Postgres contract checks
        run: mise run test:postgres:contract

      - name: Run isolated Postgres concurrency checks
        run: mise run test:postgres:concurrency

      - name: Run isolated Postgres inventory checks
        run: mise run test:postgres:inventory
