name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "openapi.yaml"
      - "crates/wyrd-spec/schemas/**"
      - "**/examples/**"
      - "python/py-wyrd/**"
      - "mise.toml"
      - ".github/workflows/publish-docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "openapi.yaml"
      - "crates/wyrd-spec/schemas/**"
      - "**/examples/**"
      - "python/py-wyrd/**"
      - "mise.toml"
      - ".github/workflows/publish-docs.yml"

permissions:
  contents: read

jobs:
  check:
    name: docs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Check docs
        run: mise run docs:check
