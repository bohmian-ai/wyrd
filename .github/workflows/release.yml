name: release

# push to main = build every deliverable on every supported platform; publish
# nothing.
# release published = the publish jobs, over the bytes the commit's successful
# push run already built and tested; the builds rerun here only when no such
# run's artifacts remain (see locate-build).
# Each build job records the SHA-256 of its outputs after
# its package checks pass; publication verifies those exact bytes, attests
# their provenance for this commit, and fails closed on a missing record,
# unrecorded file, or changed byte.
on:
  push:
    branches: [main]
  release:
    types: [published]

# A newer push to main supersedes the previous push's run; release runs never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

env:
  RUSTFLAGS: "-C debuginfo=0"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.13"
  MISE_LOCKED: "true"

jobs:
  # ── Release commit ─────────────────────────────────────────────────────────

  # The release's one approval: every publish job needs this job, and the
  # release-approval environment's reviewer approves it once.
  release-commit:
    name: release commit
    if: github.event_name == 'release'
    environment: release-approval
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Every artifact in this run is built from GITHUB_SHA; the tag must still
      # name that commit, or the tested bytes are not the release's bytes.
      - name: Verify the release tag names the built commit
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tag_commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          echo "tag $TAG -> $tag_commit, built $GITHUB_SHA"
          test "$tag_commit" = "$GITHUB_SHA"

  # A release reuses the commit's successful push run of this workflow when
  # every one of its artifacts is still retained; otherwise run_id is empty and
  # this run builds. A push run cancelled by a newer push, a failed one, or
  # one whose one-day artifacts expired therefore rebuilds rather than fails.
  # Attestations still name this release run, for the same commit and workflow.
  locate-build:
    name: locate build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run_id: ${{ steps.locate.outputs.run_id }}
    steps:
      - id: locate
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run_id="$(gh run list --workflow release.yml --commit "$GITHUB_SHA" --event push \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$run_id" ]; then
            read -r total expired < <(gh api "repos/$GH_REPO/actions/runs/$run_id/artifacts?per_page=100" \
              --jq '"\(.total_count) \([.artifacts[] | select(.expired)] | length)"')
            echo "push run $run_id: $total artifacts, $expired expired"
            if [ "$total" -eq 0 ] || [ "$expired" -ne 0 ]; then run_id=""; fi
          fi
          echo "reusing run: ${run_id:-none, building here}"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  # ── Python SDK ─────────────────────────────────────────────────────────────

  build-sdist:
    name: python sdist
    needs: locate-build
    if: needs.locate-build.outputs.run_id == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          ignore-nothing-to-cache: true

      - run: pip install "twine>=6.1.0" "packaging>=24.2"

      # protoc at the version mise.toml pins.
      - uses: jdx/mise-action@v5
        with:
          install_args: protoc
          cache: true

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          maturin-version: 1.8.3
          rust-toolchain: stable
          working-directory: sdks/wyrd-sdk-python

      - name: Check and record sdist digest
        working-directory: sdks/wyrd-sdk-python/dist
        run: |
          twine check --strict ./*
          shasum -a 256 ./* | sed 's|  \./|  |' | sudo tee SHA256SUMS.pypi_sdist

      - uses: actions/upload-artifact@v7
        with:
          name: pypi_sdist
          path: sdks/wyrd-sdk-python/dist
          retention-days: 1

  build-linux:
    name: python - ${{ matrix.target }}
    needs: locate-build
    if: needs.locate-build.outputs.run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            docker-options: "-e CI"
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            docker-options: "-e CI"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          ignore-nothing-to-cache: true

      - run: pip install "twine>=6.1.0" "packaging>=24.2"

      - run: echo "OPENSSL_DIR=/usr" >> $GITHUB_ENV

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --profile dist --out dist
          rust-toolchain: stable
          docker-options: ${{ matrix.docker-options }}
          working-directory: sdks/wyrd-sdk-python
          # manylinux containers don't have mise; install build deps manually.
          # wyrd only needs openssl headers + protoc (no cmake, no kafka deps).
          before-script-linux: |
            if command -v yum &> /dev/null; then
              yum update -y && yum install -y perl-core openssl openssl-devel pkgconfig libatomic curl-devel
              if [[ ! -d "/usr/lib64" ]]; then
                ln -s /usr/lib/libatomic.so.1 /usr/lib/libatomic.so
              fi
            else
              apt update -y && apt-get install -y libssl-dev openssl pkg-config unzip
            fi
            ARCH=$(uname -m)
            if [[ "$ARCH" == "x86_64" ]]; then PROTOC_ARCH="linux-x86_64"
            elif [[ "$ARCH" == "aarch64" ]]; then PROTOC_ARCH="linux-aarch_64"
            else echo "Unsupported: $ARCH"; exit 1; fi
            curl -fsSLO --retry 5 "https://github.com/protocolbuffers/protobuf/releases/download/v33.2/protoc-33.2-${PROTOC_ARCH}.zip"
            unzip "protoc-33.2-${PROTOC_ARCH}.zip" -d /usr/local
            rm "protoc-33.2-${PROTOC_ARCH}.zip"
            chmod +x /usr/local/bin/protoc && protoc --version

      - run: twine check --strict sdks/wyrd-sdk-python/dist/*

      - name: Record wheel digests
        working-directory: sdks/wyrd-sdk-python/dist
        run: shasum -a 256 ./*.whl | sed 's|  \./|  |' | sudo tee SHA256SUMS.pypi_ubuntu_${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: pypi_ubuntu_${{ matrix.target }}
          path: sdks/wyrd-sdk-python/dist
          retention-days: 1

  build-macos:
    name: python - ${{ matrix.target }}
    needs: locate-build
    if: needs.locate-build.outputs.run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          ignore-nothing-to-cache: true

      - run: pip install "twine>=6.1.0" "packaging>=24.2"

      # protoc at the version mise.toml pins.
      - uses: jdx/mise-action@v5
        with:
          install_args: protoc
          cache: true

      - run: brew install libomp curl openssl pkg-config

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --profile dist --out dist
          rust-toolchain: stable
          working-directory: sdks/wyrd-sdk-python

      - run: twine check --strict sdks/wyrd-sdk-python/dist/*

      - name: Record wheel digests
        working-directory: sdks/wyrd-sdk-python/dist
        run: shasum -a 256 ./*.whl | sed 's|  \./|  |' > SHA256SUMS.pypi_macos_${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: pypi_macos_${{ matrix.target }}
          path: sdks/wyrd-sdk-python/dist
          retention-days: 1

  inspect-wheels:
    name: inspect wheels
    needs: [build-sdist, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pypi_*
          merge-multiple: true
          path: dist
      - run: ls -lh dist/ && echo "$(ls dist | wc -l) files"

  test-wheels:
    name: smoke - ${{ matrix.os }}
    needs: [build-sdist, build-linux, build-macos]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos]
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/download-artifact@v8
        with:
          pattern: pypi_${{ matrix.os }}_*
          merge-multiple: true
          path: dist

      - name: Verify recorded wheel digests
        if: runner.os == 'Linux'
        run: bash .github/scripts/verify-release-artifacts.sh dist

      - name: Install and smoke-test
        shell: bash
        run: |
          pip install wyrd-ai --no-deps --no-index --force-reinstall --find-links dist
          python -c "import wyrd; from importlib.metadata import version; print(version('wyrd-ai'))"

  publish-pypi:
    name: publish python
    # A build or smoke job skipped because locate-build found a reusable run
    # is not a failure; in a building run every need must have succeeded.
    if: &publish-if >-
      !cancelled() && github.event_name == 'release'
      && needs.release-commit.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && (needs.locate-build.outputs.run_id != '' || !contains(needs.*.result, 'skipped'))
    needs: [release-commit, locate-build, test-wheels]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read     # artifacts of a reused push run
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify version matches release tag
        working-directory: sdks/wyrd-sdk-python
        run: |
          VERSION=$(cargo pkgid | cut -d '#' -f2)
          echo "crate version: v$VERSION  tag: ${{ github.ref_name }}"
          test "v$VERSION" = "${{ github.ref_name }}"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install "twine>=6.1.0" "packaging>=24.2"

      - uses: actions/download-artifact@v8
        with:
          pattern: pypi_*
          merge-multiple: true
          path: dist
          run-id: ${{ needs.locate-build.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Verify the tested package bytes
        run: bash .github/scripts/verify-release-artifacts.sh dist

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.whl, dist/*.tar.gz

      - run: twine check --strict dist/*.whl dist/*.tar.gz

      # PyPI trusted publishing: the action exchanges this job's OIDC token,
      # so wyrd-ai names release.yml and the release environment on pypi.org.
      - run: mkdir upload && cp dist/*.whl dist/*.tar.gz upload/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/

  # ── TypeScript SDK + napi platform addons ────────────────────────────────

  build-typescript:
    name: typescript - ${{ matrix.target }}
    needs: locate-build
    if: needs.locate-build.outputs.run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: linux-x64-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package: linux-arm64-gnu
          - os: macos-15
            target: aarch64-apple-darwin
            package: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sdks/wyrd-sdk-ts/pnpm-lock.yaml

      # protoc at the version mise.toml pins.
      - uses: jdx/mise-action@v5
        with:
          install_args: protoc
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile
        working-directory: sdks/wyrd-sdk-ts

      - name: Build napi addon for the exact release target
        working-directory: sdks/wyrd-sdk-ts/wyrd
        shell: bash
        run: |
          rm -f index.js wyrd.*.node
          pnpm exec napi build --profile dist --platform --target ${{ matrix.target }} --manifest-path ../native/Cargo.toml --output-dir . --package-json-path package.json
          test -f index.js && mv index.js index.generated.cjs
          cp index.d.ts index.d.cts
          pnpm exec tsc -p tsconfig.build.json

      - name: Stage and pack addon and root facade
        shell: bash
        run: |
          version=$(node -p 'require("./sdks/wyrd-sdk-ts/wyrd/package.json").version')
          echo "TS_VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p dist/addon
          cp sdks/wyrd-sdk-ts/wyrd-${{ matrix.package }}/package.json dist/addon/package.json
          addon=$(find sdks/wyrd-sdk-ts/wyrd -maxdepth 1 -name 'wyrd.*.node' -print -quit)
          test -n "$addon"
          cp "$addon" "dist/addon/wyrd.${{ matrix.package }}.node"
          npm pack ./dist/addon --pack-destination "$PWD/dist" --json
          npm pack ./sdks/wyrd-sdk-ts/wyrd --pack-destination "$PWD/dist" --json
          test -f "dist/wyrd-ai-${version}.tgz"
          test -f "dist/wyrd-ai-${{ matrix.package }}-${version}.tgz"

      - name: Install and smoke-test native package
        shell: bash
        run: |
          smoke=$(mktemp -d)
          trap 'rm -rf "$smoke"' EXIT
          printf '{"type":"module","private":true}\n' > "$smoke/package.json"
          root_tgz=$(realpath "dist/wyrd-ai-${TS_VERSION}.tgz")
          addon_tgz=$(realpath "dist/wyrd-ai-${{ matrix.package }}-${TS_VERSION}.tgz")
          # Omit the other platform optional dependencies; install the exact
          # addon built on this runner explicitly below.
          npm install --ignore-scripts --no-audit --no-fund --omit=optional \
            --package-lock=false "$root_tgz" --prefix "$smoke"
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false \
            "$addon_tgz" --prefix "$smoke"
          (cd "$smoke" && node --input-type=module -e '
            import { WyrdClient } from "wyrd-ai";
            const client = new WyrdClient("http://127.0.0.1:1", "release-smoke-token");
            if (!(client instanceof WyrdClient)) throw new Error("WyrdClient construction failed");
          ')

      - name: Record tested package digests
        shell: bash
        run: (cd dist && shasum -a 256 ./*.tgz | sed 's|  \./|  |' > SHA256SUMS.typescript_${{ matrix.package }})

      - uses: actions/upload-artifact@v7
        with:
          name: typescript-${{ matrix.package }}
          path: |
            dist/*.tgz
            dist/SHA256SUMS.*
          retention-days: 1

  # Every runner packs the same root facade; the x64 Linux one is published
  # after the four platform addons it optionally depends on.
  publish-npm:
    name: publish typescript
    if: *publish-if
    needs: [release-commit, locate-build, build-typescript]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read     # artifacts of a reused push run
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify version matches release tag
        run: test "v$(node -p 'require("./sdks/wyrd-sdk-ts/wyrd/package.json").version')" = "${{ github.ref_name }}"

      - uses: actions/download-artifact@v8
        with:
          pattern: typescript-*
          path: dist
          run-id: ${{ needs.locate-build.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Verify the tested package bytes
        run: for dir in dist/typescript-*; do bash .github/scripts/verify-release-artifacts.sh "$dir"; done

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/typescript-*/*.tgz

      # npm trusted publishing authenticates with this job's OIDC token and
      # needs npm 11.5.1 or newer; each package names release.yml and the
      # release environment as its trusted publisher on npmjs.com.
      - run: npm install -g npm@latest

      - name: Publish addons, then the root package
        run: |
          for addon in dist/typescript-*/wyrd-ai-*-*.tgz; do
            npm publish "$addon" --access public
          done
          version=$(node -p 'require("./sdks/wyrd-sdk-ts/wyrd/package.json").version')
          npm publish "dist/typescript-linux-x64-gnu/wyrd-ai-${version}.tgz" --access public

  # ── Server bundles + Docker ────────────────────────────────────────────────

  # One bundle per local-server target `wyrd server install` selects by
  # `wyrd-server-<target>.tar.gz`; the Linux bundles also feed the images.
  # Linux bundles build in a docker/builder/ image whose glibc is the oldest
  # each supports (ubuntu-22.04 for the gnu bundles the debian images and
  # native installs run, rockylinux-9 for rocky), so the runner's own glibc
  # never reaches a bundle. Every bundle carries the
  # production UI in ui/; native installs run it on the system Node. The arm
  # runner cannot finish the fat LTO link of wyrd-server even with swap: it
  # thrashes until the runner loses contact with GitHub, so arm links with thin
  # LTO.
  build-server:
    name: server - ${{ matrix.bundle }}
    needs: locate-build
    if: needs.locate-build.outputs.run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            build: bundle-in ubuntu-22.04
            bundle: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            build: bundle-in rockylinux-9
            bundle: x86_64-unknown-linux-gnu-rocky
          - os: ubuntu-22.04-arm
            build: bundle-in ubuntu-22.04
            bundle: aarch64-unknown-linux-gnu
            lto: thin
    runs-on: ${{ matrix.os }}
    env:
      BUNDLE: wyrd-server-${{ matrix.bundle }}.tar.gz
      WYRD_PROFILE: dist
      CARGO_PROFILE_DIST_LTO: ${{ matrix.lto || 'fat' }}
    steps: &build-server-steps
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: rust protoc cmake node pnpm
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.bundle }}

      # Even the thin LTO link of wyrd-server presses the arm runner's
      # memory; swap keeps it from being killed mid-link.
      - name: Add swap for the LTO link
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          sudo fallocate -l 16G /mnt/wyrd-build.swap
          sudo chmod 600 /mnt/wyrd-build.swap
          sudo mkswap /mnt/wyrd-build.swap
          sudo swapon /mnt/wyrd-build.swap
          free -h

      - name: Build bundle
        run: scripts/build.sh ${{ matrix.build }}

      - name: Package and record the server bundle
        run: |
          tar -czf "$BUNDLE" -C release .
          tar -tzf "$BUNDLE" | grep -qx './wyrd-server'
          tar -tzf "$BUNDLE" | grep -qx './ui/build/index.js'
          shasum -a 256 "$BUNDLE" > SHA256SUMS.wyrd-server-${{ matrix.bundle }}

      - uses: actions/upload-artifact@v7
        with:
          name: wyrd-server-${{ matrix.bundle }}
          path: |
            ${{ env.BUNDLE }}
            SHA256SUMS.wyrd-server-${{ matrix.bundle }}
          retention-days: 1

  # The macOS bundle is its own job so the images, which never use it, do not
  # wait on the slowest build. Fat LTO on the 7 GB macOS runner takes about
  # three hours; thin LTO keeps this local-development bundle near an hour.
  build-server-macos:
    name: server - ${{ matrix.bundle }}
    needs: locate-build
    if: needs.locate-build.outputs.run_id == ''
    strategy:
      matrix:
        include:
          - os: macos-15
            build: bundle
            bundle: aarch64-apple-darwin
            lto: thin
    runs-on: ${{ matrix.os }}
    env:
      BUNDLE: wyrd-server-${{ matrix.bundle }}.tar.gz
      WYRD_PROFILE: dist
      CARGO_PROFILE_DIST_LTO: ${{ matrix.lto }}
    steps: *build-server-steps

  # Each image copies a tested Linux bundle and compiles nothing; arm64 builds
  # on an arm runner, not under emulation.
  publish-docker:
    name: docker - ${{ matrix.distro }}-${{ matrix.arch }}
    if: *publish-if
    needs: [release-commit, locate-build, build-server]
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read     # artifacts of a reused push run
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            arch: amd64
            runner: ubuntu-24.04
            bundle: x86_64-unknown-linux-gnu
          - distro: rocky
            arch: amd64
            runner: ubuntu-24.04
            bundle: x86_64-unknown-linux-gnu-rocky
          - distro: debian
            arch: arm64
            runner: ubuntu-24.04-arm
            bundle: aarch64-unknown-linux-gnu
    env:
      IMAGE: bohmian/wyrd:${{ matrix.distro }}-${{ matrix.arch }}-${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: actions/download-artifact@v8
        with:
          name: wyrd-server-${{ matrix.bundle }}
          path: ./artifacts
          run-id: ${{ needs.locate-build.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Verify the tested server bundle
        run: bash .github/scripts/verify-release-artifacts.sh artifacts

      - name: Extract the server bundle
        run: |
          mkdir -p release
          tar -xzf ./artifacts/wyrd-server-${{ matrix.bundle }}.tar.gz -C release

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The image is new bytes built from the verified bundle, so it is
      # smoke-tested locally and published as that exact digest.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/official/${{ matrix.distro }}/Dockerfile
          load: true
          platforms: linux/${{ matrix.arch }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ matrix.distro }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.distro }}-${{ matrix.arch }}

      - name: Smoke-test and push the image
        id: push
        run: |
          docker run --rm --entrypoint /usr/local/bin/wyrd-server "$IMAGE" --version
          docker push "$IMAGE"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: index.docker.io/bohmian/wyrd
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # `docker pull bohmian/wyrd` resolves through these multi-arch tags: one per
  # distro, and the debian image as the bare version and latest.
  publish-docker-manifests:
    name: docker manifests
    if: ${{ !cancelled() && github.event_name == 'release' && needs.publish-docker.result == 'success' }}
    needs: publish-docker
    runs-on: ubuntu-24.04
    environment: release
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish the multi-arch tags
        run: |
          repo=bohmian/wyrd
          docker buildx imagetools create -t "$repo:$TAG" -t "$repo:latest" \
            -t "$repo:debian-$TAG" -t "$repo:debian-latest" \
            "$repo:debian-amd64-$TAG" "$repo:debian-arm64-$TAG"
          docker buildx imagetools create -t "$repo:rocky-$TAG" -t "$repo:rocky-latest" \
            "$repo:rocky-amd64-$TAG"
          for t in "$TAG" debian-"$TAG" rocky-"$TAG"; do
            docker buildx imagetools inspect "$repo:$t" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  publish-binaries:
    name: publish binaries
    if: *publish-if
    needs: [release-commit, locate-build, build-server, build-server-macos]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write   # gh release upload
      id-token: write
      attestations: write
      actions: read     # artifacts of a reused push run
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: wyrd-server-*
          merge-multiple: true
          path: dist
          run-id: ${{ needs.locate-build.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Verify the tested server bundles
        run: |
          bash .github/scripts/verify-release-artifacts.sh dist
          cat dist/SHA256SUMS.* > checksums.txt

      # `wyrd server install` trusts a bundle only through checksums.txt
      # signed by this key; the CLI embeds its public half. Refuse to publish
      # when the secret is not that key.
      - name: Sign the release checksums
        env:
          WYRD_RELEASE_SIGNING_KEY: ${{ secrets.WYRD_RELEASE_SIGNING_KEY }}
          PUBLIC_KEY: crates/wyrd/wyrd-cli/src/server/release-signing-key.pem
        run: |
          test -n "$WYRD_RELEASE_SIGNING_KEY"
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$WYRD_RELEASE_SIGNING_KEY" > "$key"
          openssl pkey -in "$key" -pubout | cmp - "$PUBLIC_KEY"
          openssl pkeyutl -sign -inkey "$key" -rawin -in checksums.txt -out checksums.txt.sig
          openssl pkeyutl -verify -pubin -inkey "$PUBLIC_KEY" -rawin -in checksums.txt -sigfile checksums.txt.sig

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in dist/*.tar.gz checksums.txt checksums.txt.sig; do
            gh release upload ${{ github.event.release.tag_name }} "$f" --clobber
          done

  # ── Rust crates ────────────────────────────────────────────────────────────

  package-crates:
    name: rust crate package
    needs: locate-build
    if: needs.locate-build.outputs.run_id == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true

      # release-plz publishes the crates named in release-plz.toml.
      - name: Package and record published crates
        run: |
          cargo package --locked --no-verify $(python3 -c 'import tomllib; print(" ".join("-p " + p["name"] for p in tomllib.load(open("release-plz.toml", "rb"))["package"] if p.get("publish")))')
          mkdir -p dist
          cp target/package/*.crate dist/

      # crates.io resolves a published crate's dev-dependencies, but release-plz
      # orders publishing by normal dependencies only, so a versioned
      # dev-dependency on a sibling stops the publish halfway. Workspace
      # dev-dependencies must be path-only so cargo strips them.
      - name: Check no workspace crate is a published dev-dependency
        run: |
          python3 - <<'EOF'
          import glob, json, subprocess, sys, tarfile, tomllib
          members = {p["name"] for p in json.loads(subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version", "1"]))["packages"]}
          found = []
          for path in glob.glob("dist/*.crate"):
              with tarfile.open(path) as crate:
                  manifest = tomllib.load(crate.extractfile(next(m for m in crate.getmembers() if m.name.count("/") == 1 and m.name.endswith("/Cargo.toml"))))
              tables = [manifest.get("dev-dependencies", {})] + [t.get("dev-dependencies", {}) for t in manifest.get("target", {}).values()]
              found += [f"{path}: {key}" for table in tables for key, spec in table.items() if (spec.get("package", key) if isinstance(spec, dict) else key) in members]
          if found:
              sys.exit("versioned workspace dev-dependencies; make them path-only:\n" + "\n".join(found))
          EOF
          (cd dist && shasum -a 256 ./*.crate | sed 's|  \./|  |' > SHA256SUMS.rust-crates)

      - uses: actions/upload-artifact@v7
        with:
          name: rust-crates
          path: dist
          retention-days: 1

  publish-crates:
    name: publish rust crates
    if: *publish-if
    needs: [release-commit, locate-build, package-crates, test-wheels, build-server]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write   # release-plz
      id-token: write
      attestations: write
      actions: read     # artifacts of a reused push run
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev pkg-config

      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true

      - uses: actions/download-artifact@v8
        with:
          name: rust-crates
          path: dist
          run-id: ${{ needs.locate-build.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      # release-plz packages again at publish time; cargo's .crate archives
      # are reproducible, so the repackaged bytes must equal the tested ones.
      - name: Verify the tested crate bytes
        run: |
          bash .github/scripts/verify-release-artifacts.sh dist
          cargo package --locked --no-verify $(python3 -c 'import tomllib; print(" ".join("-p " + p["name"] for p in tomllib.load(open("release-plz.toml", "rb"))["package"] if p.get("publish")))')
          (cd target/package && sha256sum --check --strict ../../dist/SHA256SUMS.rust-crates)

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.crate

      - name: Publish crates via release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
