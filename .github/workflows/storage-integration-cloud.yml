name: storage-integration-cloud

# Runs credentialed storage tests against real S3, GCS, and Azure Blob: the
# StorageHandle data-plane CRUD suite (read/write/list/delete) plus the real
# WyrdStorageClient client/server upload and verified-download journey.
# Emulators cannot verify: real IAM/role assumption, GCS service-account
# signed URLs, Azure user-delegation SAS, virtual-host vs path-style addressing
# against real endpoints, and provider-specific error shapes.
#
# Triggers only on pushes to main: no schedule and no manual dispatch, and never
# on pull requests (credential exposure risk). Before merging a cloud-backend
# change, run the same `test:storage:<provider>:cloud` tasks locally against dev
# buckets configured in an untracked mise.local.toml.
#
# Until the secrets below are provisioned the jobs fail at credential setup and
# surface a clear error rather than silently skipping.

on:
  push:
    branches: [main]

# Required secrets in the `storage-integration` environment:
#   AWS_CLOUD_ROLE_ARN          — IAM role ARN for OIDC assumption (e.g. arn:aws:iam::ACCOUNT:role/wyrd-ci-storage)
#   AWS_CLOUD_BUCKET_NAME       — S3 bucket name (e.g. wyrd-ci-storage)
#   AWS_CLOUD_REGION            — S3 region (e.g. us-east-1)
#   GOOGLE_APPLICATION_CREDENTIALS_JSON — GCS service-account key JSON; object_store
#                                   reads no workload-identity (external_account)
#                                   credentials, and V4 URL signing needs the key
#   GCP_CLOUD_BUCKET_NAME       — GCS bucket name
#   AZURE_CLOUD_CLIENT_ID       — Azure AD app client ID for OIDC federation
#   AZURE_CLOUD_TENANT_ID       — Azure AD tenant ID
#   AZURE_CLOUD_SUBSCRIPTION_ID — Azure subscription ID
#   AZURE_CLOUD_ACCOUNT_NAME    — Azure storage account name
#   AZURE_CLOUD_CONTAINER_NAME  — Azure blob container name
#
# Postgres for the server e2e is provisioned locally by the mise task chain
# (build:postgres → db:setup-roles → db:migrate), so no database secret is
# required.

permissions:
  contents: read
  id-token: write   # Required for S3 and Azure OIDC credential federation

env:
  MISE_LOCKED: "true"

jobs:
  s3-cloud:
    name: S3 real-cloud
    runs-on: ubuntu-24.04
    environment: storage-integration
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust-ci
        with:
          docker-images: "false"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_CLOUD_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_CLOUD_REGION }}

      - name: Run S3 cloud tests
        env:
          WYRD_STORAGE_URL: s3://${{ secrets.AWS_CLOUD_BUCKET_NAME }}
        run: mise run test:storage:s3:cloud

  gcs-cloud:
    name: GCS real-cloud
    runs-on: ubuntu-24.04
    environment: storage-integration
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust-ci
        with:
          docker-images: "false"

      - name: Run GCS cloud tests
        env:
          WYRD_STORAGE_URL: gs://${{ secrets.GCP_CLOUD_BUCKET_NAME }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: mise run test:storage:gcs:cloud

  azure-cloud:
    name: Azure real-cloud
    runs-on: ubuntu-24.04
    environment: storage-integration
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust-ci
        with:
          docker-images: "false"
          # azure/login and the tests' credential both shell out to `az`.
          large-packages: "false"

      - name: Authenticate to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLOUD_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_CLOUD_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_CLOUD_SUBSCRIPTION_ID }}

      - name: Run Azure cloud tests
        env:
          WYRD_STORAGE_URL: az://${{ secrets.AZURE_CLOUD_ACCOUNT_NAME }}/${{ secrets.AZURE_CLOUD_CONTAINER_NAME }}
          # object_store reads this and takes its token from the azure/login session.
          AZURE_USE_AZURE_CLI: "true"
        run: mise run test:storage:azure:cloud
