name: storage-integration-emulator

# Runs the full storage test surface against the local docker emulators
# (RustFS / fake-gcs-server / Azurite) on every PR and main-branch push that
# touches storage code. This is the "any CI" lane: signer-tier integration
# tests, the StorageHandle data-plane CRUD suite (read/write/list/delete), and
# the server HTTP multipart e2e — the same set of tests for local, S3, GCS, and
# Azure.
#
# Gated by the `storage` path filter so docs/UI/python-only PRs skip the heavy
# emulator bring-up. The credentialed real-cloud matrix lives in
# storage-integration-cloud.yml and runs only on merge-to-main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  MISE_LOCKED: "true"

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      storage: ${{ steps.filter.outputs.storage }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        shell: bash
        env:
          WYRD_CHANGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          WYRD_CHANGE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/detect-changes.sh

  emulator-matrix:
    name: storage emulator matrix
    needs: changes
    if: needs.changes.outputs.storage == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust-ci
        with:
          docker-images: "false"

      - name: Start storage emulators
        run: mise run storage:up

      - name: Run storage emulator matrix
        run: mise run test:storage:matrix

      - name: Stop storage emulators
        if: always()
        run: mise run storage:down
