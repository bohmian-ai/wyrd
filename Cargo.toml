[workspace]
resolver = "2"
members = [
    "crates/wyrd/*",
    "crates/vala/*",
    "crates/skald/*",
    "crates/shared/*",
    "crates/wyrd-spec",
    "examples/rust",
    "python/py-wyrd",
]
exclude = []
default-members = [
    "crates/wyrd/wyrd-server",
    "crates/wyrd/wyrd-cli",
    "crates/wyrd/wyrd-mcp",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94.0"
repository = "https://github.com/wyrd-ai/wyrd"
authors = ["Thorrester <sjforrester32@gmail.com>"]

[workspace.dependencies]
wyrd-spec = { path = "crates/wyrd-spec", version = "0.0.1" }
wyrd-client = { path = "crates/shared/wyrd-client", version = "0.0.1" }
skald-spec = { path = "crates/skald/skald-spec", version = "0.1.0" }
skald-cache = { path = "crates/skald/skald-cache", version = "0.0.1" }
skald-tool = { path = "crates/skald/skald-tool", version = "0.0.1" }
skald-providers = { path = "crates/skald/skald-providers", version = "0.0.1" }
skald-runtime = { path = "crates/skald/skald-runtime", version = "0.0.1" }
skald-prompt = { path = "crates/skald/skald-prompt", version = "0.0.1" }
skald-agent = { path = "crates/skald/skald-agent", version = "0.0.1" }
skald-workflow = { path = "crates/skald/skald-workflow", version = "0.0.1" }
vala-bifrost = { path = "crates/vala/vala-bifrost", version = "0.0.1" }
vala-bifrost-redux = { path = "crates/vala/vala-bifrost-redux", version = "0.0.1" }
vala-sdk = { path = "crates/vala/vala-sdk", version = "0.0.1" }
vala-sql = { path = "crates/vala/vala-sql", version = "0.0.1" }
vala-core = { path = "crates/vala/vala-core", version = "0.0.1" }
vala-ingest = { path = "crates/vala/vala-ingest", version = "0.0.1" }
vala-drift = { path = "crates/vala/vala-drift", version = "0.0.1" }
vala-eval = { path = "crates/vala/vala-eval", version = "0.0.1" }
skald-observer = { path = "crates/skald/skald-observer", version = "0.0.1" }
wyrd-utils = { path = "crates/shared/wyrd-utils", version = "0.0.1" }
wyrd-version = { path = "crates/shared/wyrd-version", version = "0.0.1" }
wyrd-test-contract-macros = { path = "crates/shared/wyrd-test-contract-macros", version = "0.0.1" }
wyrd-error-derive = { path = "crates/shared/wyrd-error-derive", version = "0.0.1" }
wyrd-config = { path = "crates/wyrd/wyrd-config", version = "0.0.1" }
wyrd-interfaces = { path = "crates/wyrd/wyrd-interfaces", version = "0.0.1" }
wyrd-cards = { path = "crates/wyrd/wyrd-cards", version = "0.0.1" }
wyrd-runtime = { path = "crates/shared/wyrd-runtime", version = "0.0.1" }
wyrd-queue = { path = "crates/shared/wyrd-queue", version = "0.0.1" }
wyrd-auth-issue = { path = "crates/shared/wyrd-auth-issue", version = "0.0.1" }
wyrd-auth-oidc = { path = "crates/shared/wyrd-auth-oidc", version = "0.0.1" }
wyrd-auth-verify = { path = "crates/shared/wyrd-auth-verify", version = "0.0.1" }
wyrd-auth-check = { path = "crates/shared/wyrd-auth-check", version = "0.0.1" }
wyrd-auth = { path = "crates/wyrd/wyrd-auth", version = "0.0.1" }
wyrd-dev-fixtures = { path = "crates/shared/wyrd-dev-fixtures", version = "0.0.1" }
wyrd-sql = { path = "crates/wyrd/wyrd-sql", version = "0.0.1" }
wyrd-storage = { path = "crates/wyrd/wyrd-storage", version = "0.0.1" }
wyrd-server = { path = "crates/wyrd/wyrd-server", version = "0.0.1" }
wyrd-testing = { path = "crates/wyrd/wyrd-testing", version = "0.0.1" }
wyrd-tonic = { path = "crates/wyrd/wyrd-tonic", version = "0.0.1" }
wyrd-semver = { path = "crates/shared/wyrd-semver", version = "0.0.1" }
tokio = { version = "1.49", features = ["macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
async-trait = "0.1"
async-stream = "0.3"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2.2", features = ["pkcs8"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "stream", "blocking"] }
axum = "0.8"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.1"
serde_json = "1"
serde_yaml = "0.9"
strum = { version = "0.27", features = ["derive"] }
jsonschema = { version = "0.18", default-features = false }
schemars = { version = "0.8", features = ["chrono", "uuid1"] }
utoipa = { version = "5", features = ["chrono", "uuid"] }
thiserror = "2.0"
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
criterion = { version = "0.5", features = ["async_tokio"] }
hdrhistogram = "7.5"
blake3 = "1"
insta = { version = "1.43", features = ["json"] }
wiremock = "0.6"
temp-env = "0.3"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
dashmap = "6.1"
crossbeam-queue = "0.3"
flate2 = "1.*"
zstd = "0.13"
walkdir = "2.*"
sha2 = "0.10"
uuid = { version = "1", default-features = false, features = ["serde"] }
crc32c = "0.6"
semver = { version = "1", features = ["serde"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
metrics = { version = "0.24", default-features = false }
metrics-exporter-prometheus = { version = "0.16", default-features = false }
mini-moka = { version = "0.10", features = ["sync"] }
proptest = "1"
serial_test = "3"
aes-gcm = "0.10"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
secrecy = "0.10"
subtle = "2.6"
zeroize = "1"
governor = "0.10"
tower_governor = { version = "0.8", features = ["axum"] }
rand = "0.9"
pg-embed = { version = "1.0.0", default-features = false, features = ["rt_tokio"] }
url = "2"
urlencoding = "2"
httpdate = "1"
regex = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
jsonwebtoken = "9"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "migrate", "chrono", "uuid", "json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
paste = "1"
time = "0.3"
ulid = "1"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
opentelemetry-proto = { version = "0.27", default-features = false, features = ["gen-tonic", "gen-tonic-messages", "trace", "metrics", "logs", "with-serde"] }
arrow = "58"
arrow-array = "58"
arrow-schema = "58"
statrs = "0.18"
jsonpath-rust = "0.7"
tracing-opentelemetry = "0.28"
pyo3 = { version = "0.28", features = ["abi3-py310", "chrono", "py-clone"] }
toml = "0.8"
shellexpand = "3"
ipnetwork = "0.20"
wyrd-telemetry = { path = "crates/shared/wyrd-telemetry", version = "0.0.1" }
arc-swap = "1.7"
# Client-safe baseline (no `transport`/`server` → no axum). `wyrd-tonic` adds the
# client `channel`/`tls` features and gates `tonic/server` behind its `server`
# feature. Only `wyrd-tonic` may depend on tonic (check:no-tonic-outside-wyrd-tonic).
tonic = { version = "0.12", default-features = false, features = ["codegen", "prost"] }
tonic-health = "0.12"
tonic-reflection = "0.12"
tonic-types = "0.12"
tonic-build = "0.12"
prost = "0.13"

# Cloud SDKs are server-tier only.
aws-sdk-s3 = "=1.75.0"
aws-config = { version = "1", features = ["sso", "behavior-version-latest"] }
aws-types = "1"
gcloud-storage = { version = "1", features = ["auth"] }
gcloud-auth = "1"
azure_core = "0.21.0"
azure_identity = "0.21.0"
azure_storage = "0.21.0"
azure_storage_blobs = "0.21.0"
# opendal 0.57 pinned as the wyrd-storage substrate (stage0) and the future
# iceberg-storage-opendal substrate (stage1). reqwest-rustls-tls is mandatory:
# default-features=false drops it, leaving an HTTP-only client that fails all
# cloud HTTPS requests.
opendal = { version = "0.57", default-features = false, features = [
  "services-fs", "services-s3", "services-gcs", "services-azblob",
  "reqwest-rustls-tls",
] }
# =53.1.0 matches the iceberg-rust arrow-58 line; git-pinned until iceberg 0.10 publishes.
datafusion = "=53.1.0"
parquet = "58"
iceberg = { git = "https://github.com/mitari-ai/iceberg-rust", branch = "wyrd/rewrite-files-action" }
# sqlx 0.8.1 is a hard dep in this crate — there is no sqlx feature flag to add.
iceberg-catalog-sql = { git = "https://github.com/mitari-ai/iceberg-rust", branch = "wyrd/rewrite-files-action" }
iceberg-datafusion = { git = "https://github.com/mitari-ai/iceberg-rust", branch = "wyrd/rewrite-files-action" }
iceberg-storage-opendal = { git = "https://github.com/mitari-ai/iceberg-rust", branch = "wyrd/rewrite-files-action", features = ["opendal-s3", "opendal-gcs", "opendal-azdls", "opendal-fs", "opendal-memory"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
# Idiomatic Rust for namespaced crates (wyrd_cards::CardRef, skald_agent::AgentSpec, etc.);
# the "repetition" is the crate namespace, not accidental noise. Blanket-allowed to
# avoid 11+ per-crate `#![allow]` lines and per-site `// justification:` overhead.
module_name_repetitions = "allow"
