[workspace]
resolver = "2"
members = [
    "crates/wyrd/*",
    "crates/vala/*",
    "crates/shared/*",
    "crates/wyrd-spec",
    "python/py-wyrd",
]
default-members = [
    "crates/wyrd/wyrd-server",
    "crates/wyrd/wyrd-cli",
    "crates/wyrd/wyrd-mcp",
    "crates/vala/wyrd-observability-server",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.87.0"
repository = "https://github.com/wyrd-ai/wyrd"
authors = ["Thorrester <sjforrester32@gmail.com>"]

[workspace.dependencies]
tokio = { version = "1.49", features = ["macros", "rt-multi-thread"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = { version = "0.8", features = ["chrono", "uuid1"] }
utoipa = { version = "5", features = ["chrono", "uuid"] }
thiserror = "2.0"
chrono = { version = "0.4", default-features = false, features = ["serde"] }
uuid = { version = "1", default-features = false, features = ["serde"] }
ulid = { version = "1", features = ["serde"] }
semver = { version = "1", features = ["serde"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
proptest = "1"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
jsonwebtoken = "9"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
