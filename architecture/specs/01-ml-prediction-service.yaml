# =============================================================================
# Example 1 — Tabular churn prediction service
#
# Scenario: A small data-science team trains a sklearn churn classifier weekly,
# serves it behind an HTTP service, watches it for population drift with PSI,
# routes runs and drift observations to Datadog, and triggers a retrain when
# drift breaches threshold.
#
# Card inventory:
#   - Data        churn-events                # source dataset
#   - Artifact    churn-clf-bytes             # trained sklearn pickle
#   - Model       churn-classifier            # callable model card
#   - Service     ddog-sink                   # Datadog observation sink (declared once, reused)
#   - Service     churn-prediction-svc        # the deployed prediction service
#   - Drift       churn-feature-drift         # PSI monitor watching the model
#   - Operator    churn-retrain               # gated retrain runner
#   - Trigger     churn-retrain-on-drift      # fires the operator when drift fires
# =============================================================================

apiVersion: wyrd/v1
kind: Data
metadata:
  name: churn-events
  version: "2026.06.01"
  space: prod
  labels:
    team: churn-ml
    domain: customer
  annotations:
    acme.com/owner: data-platform
spec:
  interface:
    kind: parquet
    meta:
      uri: s3://acme-data/churn/events/2026-06-01/
      compression: zstd
  schema:
    columns:
      - { name: customer_id,     dtype: string,   nullable: false }
      - { name: tenure_months,   dtype: int32,    nullable: false }
      - { name: monthly_charge,  dtype: float64,  nullable: false }
      - { name: contract_type,   dtype: string,   nullable: false }
      - { name: support_tickets, dtype: int32,    nullable: true  }
      - { name: churned,         dtype: bool,     nullable: false }
  target_columns: [churned]
  splits:
    train:
      kind: row_fraction
      meta: { fraction: 0.8, seed: 42 }
    test:
      kind: row_fraction
      meta: { fraction: 0.2, seed: 42 }
  stats:
    kind: local
    meta:
      rows: 1480221
      bytes: 188_440_120

---
apiVersion: wyrd/v1
kind: Artifact
metadata:
  name: churn-clf-bytes
  version: "1.4.2"
  space: prod
spec:
  artifact_kind: sklearn_pickle
  artifact_uris:
    - s3://acme-models/churn/1.4.2/model.pkl
  content_type: application/octet-stream
  size_bytes: 4_823_104
  integrity: sha256:9c1b6a4f2e0d8b5c1a7f3e9d2b6c0f1a8e5d3c7b9a1f2e6d4c8b0a3f5e7d9c1b2a
  framework_adapter:
    name: sklearn
    version: "1.5.x"

---
apiVersion: wyrd/v1
kind: Model
metadata:
  name: churn-classifier
  version: "1.4.2"
  space: prod
  labels:
    team: churn-ml
    domain: customer
spec:
  interface:
    kind: Sklearn
    meta:
      sklearn_estimator: sklearn.ensemble.GradientBoostingClassifier
      sklearn_version: "1.5.x"
  task_type: BinaryClassification
  signature:
    inputs:
      - { name: tenure_months,   dtype: int32,    nullable: false }
      - { name: monthly_charge,  dtype: float64,  nullable: false }
      - { name: contract_type,   dtype: string,   nullable: false }
      - { name: support_tickets, dtype: int32,    nullable: true  }
    outputs:
      - { name: churn_probability, dtype: float64, nullable: false }
  sample_input:
    rows:
      - { tenure_months: 12, monthly_charge: 65.30, contract_type: month-to-month, support_tickets: 3 }
  artifact_refs:
    - { kind: Artifact, name: churn-clf-bytes, version: "1.4.2", space: prod }

---
# Datadog declared as a Service Card. service_type drives routing semantics;
# `runtime: { kind: api, framework: datadog }` says: external API, not in-process.
# Every card that wants to emit to Datadog references this service via
# `observation_hooks.route_refs`.
apiVersion: wyrd/v1
kind: Service
metadata:
  name: ddog-sink
  version: "1.0.0"
  space: prod
  labels:
    role: observability-sink
    vendor: datadog
spec:
  description: Datadog sink for runs, drift, and eval observations.
  service_type: observability
  runtime:
    kind: api
    framework: datadog
    strict: true
    config:
      site: { type: str, value: datadoghq.com }
      env:  { type: str, value: prod }
      tags: { type: list, value: [
        { type: str, value: "team:churn-ml" },
        { type: str, value: "service:churn-prediction-svc" }
      ]}
  credential_refs:
    - { provider: aws_secrets_manager, name: prod/datadog/api_key }
    - { provider: aws_secrets_manager, name: prod/datadog/app_key }

---
apiVersion: wyrd/v1
kind: Service
metadata:
  name: churn-prediction-svc
  version: "1.4.2"
  space: prod
  labels:
    team: churn-ml
spec:
  description: HTTP prediction service for churn probability.
  service_type: api
  components:
    - alias: model
      ref: { kind: Model, name: churn-classifier, version: "1.4.2", space: prod }
    - alias: ddog
      ref: { kind: Service, name: ddog-sink, version: "1.0.0", space: prod }
  entry_point: acme.churn.service:app
  deployment:
    image:    { type: str, value: registry.acme.com/churn-svc:1.4.2 }
    replicas: { type: number, value: 3 }
  runtime:
    kind: api
    mode: in_process
    strict: true
    policy:
      runtime_hooks: true

---
# Drift declares its targets (DriftSpec.target_refs). The model is monitored,
# not the other way around. PSI baseline = the training dataset version that
# produced this model.
apiVersion: wyrd/v1
kind: Drift
metadata:
  name: churn-feature-drift
  version: "1.0.0"
  space: prod
  labels:
    monitors: churn-classifier
spec:
  description: PSI population stability on inference features versus the v1.4.2 training set.
  method: Psi
  profile:
    type: Psi
    config:
      categorical_features: [contract_type]
      binning_strategy: quantile_10
      alert_threshold: 0.2
  baseline_ref: { kind: Data,    name: churn-events,      version: "2026.06.01", space: prod }
  target_refs:
    - { kind: Model,   name: churn-classifier,  version: "1.4.2",      space: prod }
    - { kind: Service, name: churn-prediction-svc, version: "1.4.2",   space: prod }
  features: [tenure_months, monthly_charge, contract_type, support_tickets]
  thresholds:
    psi: 0.2

---
apiVersion: wyrd/v1
kind: Operator
metadata:
  name: churn-retrain
  version: "1.0.0"
  space: prod
spec:
  adapter:
    name: sklearn_train
    version: "1.5.x"
    config:
      pipeline:  { type: str, value: acme.churn.pipelines:gb_v1 }
      max_depth: { type: number, value: 6 }
  inputs:
    - { name: dataset_ref,    schema_ref: wyrd.CardRef }
    - { name: baseline_model, schema_ref: wyrd.CardRef }
  pre_invoke: []
  post_invoke: []
  budget:
    max_wall_seconds: 7200
    max_memory_mb:    16384

---
apiVersion: wyrd/v1
kind: Trigger
metadata:
  name: churn-retrain-on-drift
  version: "1.0.0"
  space: prod
spec:
  source:
    kind: drift_observation
    card: { kind: Drift, name: churn-feature-drift, version: "1.0.0", space: prod }
  target: { kind: Operator, name: churn-retrain, version: "1.0.0", space: prod }
  cooldown_seconds: 86400
  config:
    severity_min: { type: str, value: warning }
