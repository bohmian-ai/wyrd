# =============================================================================
# Example 3 — Internal-docs RAG workflow service
#
# Scenario: A team has internal documentation indexed in a vector store. They
# want a workflow that retrieves relevant chunks, asks the model to answer
# grounded in those chunks, then evaluates groundedness. The service exposes
# the workflow over HTTP.
#
# Card inventory:
#   - Data      docs-corpus              # the indexed corpus
#   - Tool      vector-retrieve          # retrieval API tool
#   - Prompt    rag-answer-prompt        # grounded-answer prompt
#   - Agent     rag-answer-agent         # agent binding the prompt + retrieval tool
#   - Workflow  rag-answer-flow          # retrieve -> answer -> eval
#   - Prompt    grounded-judge-prompt    # judge prompt
#   - Eval      rag-groundedness-eval    # judge eval
#   - Service   docs-rag-svc             # deployed workflow service
# =============================================================================

apiVersion: wyrd/v1
kind: Data
metadata:
  name: docs-corpus
  version: "2026.06.01"
  space: prod
  labels:
    role: rag-corpus
spec:
  interface:
    kind: vector
    meta:
      provider:  qdrant
      url:       https://vectors.acme.internal
      collection: internal-docs
      dim:        1536
      embedding:  text-embedding-3-large
  schema:
    columns:
      - { name: doc_id,    dtype: string, nullable: false }
      - { name: chunk_id,  dtype: string, nullable: false }
      - { name: text,      dtype: string, nullable: false }
      - { name: source_url, dtype: string, nullable: true  }
  stats:
    kind: local
    meta:
      rows:  482_113
      bytes: 1_822_000_000

---
apiVersion: wyrd/v1
kind: Tool
metadata:
  name: vector-retrieve
  version: "1.0.0"
  space: prod
spec:
  name: retrieve
  description: Retrieve top-k relevant chunks for a query.
  tool_type: api
  args_schema:
    type: object
    required: [query]
    properties:
      query: { type: string, minLength: 1, maxLength: 4000 }
      top_k: { type: integer, minimum: 1, maximum: 20, default: 5 }
  output_schema:
    type: object
    properties:
      chunks:
        type: array
        items:
          type: object
          properties:
            text:       { type: string }
            doc_id:     { type: string }
            source_url: { type: string }
            score:      { type: number }
  api_config:
    base_url: { type: str, value: https://vectors.acme.internal/v1 }
    method:   { type: str, value: POST }
    path:     { type: str, value: /collections/internal-docs/query }
  credential_refs:
    - { provider: aws_secrets_manager, name: prod/qdrant/api_key }

---
apiVersion: wyrd/v1
kind: Prompt
metadata:
  name: rag-answer-prompt
  version: "1.0.0"
  space: prod
spec:
  provider: anthropic
  model: claude-opus-4-7
  messages:
    - role: system
      content: |
        Answer using ONLY the provided chunks. If the answer is not present,
        reply "I don't know based on the indexed docs."
        Cite chunk doc_ids inline like [doc_id].
    - role: user
      content: |
        Chunks:
        {{chunks}}
        Question: {{question}}
  variables: [chunks, question]
  response_format: text

---
apiVersion: wyrd/v1
kind: Agent
metadata:
  name: rag-answer-agent
  version: "1.0.0"
  space: prod
spec:
  prompt:
    kind: Prompt
    name: rag-answer-prompt
    version: "1.0.0"
    space: prod
  tool_names: [retrieve]
  run_config:
    max_iterations: 4
    timeout_ms:    30000

---
apiVersion: wyrd/v1
kind: Workflow
metadata:
  name: rag-answer-flow
  version: "1.0.0"
  space: prod
spec:
  description: Retrieve, answer with citations, score groundedness.
  inputs:
    question: { type: str, value: "" }
  steps:
    - id: retrieve
      action:
        type: tool
        target: { kind: Tool, name: vector-retrieve, version: "1.0.0", space: prod }
      inputs:
        query: { type: str, value: "{{ inputs.question }}" }
        top_k: { type: int, value: 5 }
      timeout_seconds: 8
      retry:
        max_retries: 2
        initial_backoff_ms: 250
    - id: answer
      action:
        type: agent
        target: { kind: Agent, name: rag-answer-agent, version: "1.0.0", space: prod }
      depends_on: [retrieve]
      inputs:
        chunks:   { type: json, value: "{{ steps.retrieve.output.chunks }}" }
        question: { type: str,  value: "{{ inputs.question }}" }
      timeout_seconds: 30
    - id: judge
      action:
        type: prompt
        target: { kind: Prompt, name: grounded-judge-prompt, version: "1.0.0", space: eval }
      depends_on: [answer]
      inputs:
        chunks:   { type: json, value: "{{ steps.retrieve.output.chunks }}" }
        question: { type: str,  value: "{{ inputs.question }}" }
        answer:   { type: str,  value: "{{ steps.answer.output }}" }
  outputs:
    answer:        "{{ steps.answer.output }}"
    citations:     "{{ steps.answer.output.citations }}"
    grounded_score: "{{ steps.judge.output.score }}"
  observation_hooks:
    route_refs:
      - { kind: Service, name: ddog-sink, version: "1.0.0", space: prod }
    events: [workflow.run.finished, workflow.step.failed]

---
apiVersion: wyrd/v1
kind: Prompt
metadata:
  name: grounded-judge-prompt
  version: "1.0.0"
  space: eval
spec:
  provider: anthropic
  model: claude-opus-4-7
  messages:
    - role: system
      content: |
        Score whether the answer is fully supported by the supplied chunks.
        Score = 1.0 if every claim is supported, 0.0 if none.
    - role: user
      content: |
        Chunks:   {{chunks}}
        Question: {{question}}
        Answer:   {{answer}}
        Return JSON: { score: number, unsupported_claims: string[] }
  variables: [chunks, question, answer]
  response_format:
    kind: json_schema
    schema:
      type: object
      required: [score, unsupported_claims]
      properties:
        score:              { type: number, minimum: 0, maximum: 1 }
        unsupported_claims: { type: array, items: { type: string } }

---
apiVersion: wyrd/v1
kind: Eval
metadata:
  name: rag-groundedness-eval
  version: "1.0.0"
  space: eval
spec:
  description: Groundedness eval over a sampled question set.
  eval_type: Judge
  target_refs:
    - { kind: Workflow, name: rag-answer-flow, version: "1.0.0", space: prod }
  judge_refs:
    - { kind: Prompt, name: grounded-judge-prompt, version: "1.0.0", space: eval }
  pass_gates:
    - { name: score, operator: ">=", threshold: 0.80 }
  dataset_refs:
    - { kind: Data, name: docs-eval-questions, version: "2026.06.01", space: eval }
  profile:
    type: Judge
    config:
      prompt_refs:
        - { kind: Prompt, name: grounded-judge-prompt, version: "1.0.0", space: eval }
      rubric:
        - { name: grounded,  description: "All claims supported by retrieved chunks.", weight: 0.8 }
        - { name: cited,     description: "Inline citations present for each claim.",  weight: 0.2 }

---
apiVersion: wyrd/v1
kind: Service
metadata:
  name: docs-rag-svc
  version: "1.0.0"
  space: prod
spec:
  description: HTTP service exposing the RAG workflow.
  service_type: workflow
  components:
    - alias: flow
      ref: { kind: Workflow, name: rag-answer-flow, version: "1.0.0", space: prod }
    - alias: ddog
      ref: { kind: Service,  name: ddog-sink,      version: "1.0.0", space: prod }
  entry_point: acme.docs.rag:app
  deployment:
    image:    { type: str, value: registry.acme.com/docs-rag-svc:1.0.0 }
    replicas: { type: number, value: 2 }
  runtime:
    kind: workflow
    mode: in_process
    strict: true
