# =============================================================================
# Example 4 — Wyrd referencing an externally-trained MLflow model
#
# Scenario: A platform team already has an MLflow tracking server. Models are
# registered in MLflow (`models:/<name>/<stage>` URIs). The Wyrd-side data
# scientist wants to pull that model into Wyrd governance without re-uploading
# bytes — just declare the linkage, gain governance, drift, and lineage.
#
# Pattern: ArtifactCard.external_uri + FrameworkAdapterRef("mlflow") carries
# the linkage. A ModelCard with ModelInterface::Custom references the artifact.
# Drift, eval, and policy all attach to the Wyrd-side ModelCard normally.
#
# Card inventory:
#   - Artifact     mlflow-fraud-v7      # pointer to MLflow registered model
#   - Model        fraud-detector       # Wyrd-side model card, custom interface
#   - Data         fraud-baseline       # baseline scoring dataset
#   - Drift        fraud-score-drift    # SPC on score distribution
#   - Service      fraud-scoring-svc    # service composing the model
# =============================================================================

apiVersion: wyrd/v1
kind: Artifact
metadata:
  name: mlflow-fraud-v7
  version: "7.0.0"
  space: prod
  labels:
    vendor:   mlflow
    upstream: mlflow-prod
  annotations:
    acme.com/mlflow-run-id:       run-9f3c2b18e2af40f08e1aa3c5d6e7f
    acme.com/mlflow-experiment:   fraud-detection
    acme.com/mlflow-stage:        Production
spec:
  artifact_kind: external_model
  # No artifact_uris because bytes stay in MLflow; only external_uri is set.
  external_uri: "models:/fraud-detector/Production"
  framework_adapter:
    name: mlflow
    version: "2.14.x"
    config:
      tracking_uri:    { type: str, value: https://mlflow.acme.internal }
      load_flavor:     { type: str, value: pyfunc }
      stage:           { type: str, value: Production }
  metadata:
    runtime_signature:
      type: object
      value:
        inputs:
          type: list
          value:
            - { type: str, value: "amount:float64" }
            - { type: str, value: "merchant_category:string" }
            - { type: str, value: "country:string" }
            - { type: str, value: "time_of_day:int32" }
        outputs:
          type: list
          value:
            - { type: str, value: "fraud_score:float64" }

---
# Wyrd ModelCard with Custom interface. The loader metadata names the MLflow
# adapter; loading happens via the FrameworkAdapterRef on the artifact.
apiVersion: wyrd/v1
kind: Model
metadata:
  name: fraud-detector
  version: "7.0.0"
  space: prod
  labels:
    upstream: mlflow
spec:
  interface:
    kind: Custom
    meta:
      loader: mlflow.pyfunc
      load_version: "7.0.0"
  task_type: BinaryClassification
  signature:
    inputs:
      - { name: amount,            dtype: float64, nullable: false }
      - { name: merchant_category, dtype: string,  nullable: false }
      - { name: country,           dtype: string,  nullable: false }
      - { name: time_of_day,       dtype: int32,   nullable: false }
    outputs:
      - { name: fraud_score, dtype: float64, nullable: false }
  artifact_refs:
    - { kind: Artifact, name: mlflow-fraud-v7, version: "7.0.0", space: prod }

---
apiVersion: wyrd/v1
kind: Data
metadata:
  name: fraud-baseline
  version: "2026.05.01"
  space: prod
spec:
  interface:
    kind: parquet
    meta:
      uri: s3://acme-data/fraud/baseline-2026-05/
  schema:
    columns:
      - { name: amount,            dtype: float64, nullable: false }
      - { name: merchant_category, dtype: string,  nullable: false }
      - { name: country,           dtype: string,  nullable: false }
      - { name: time_of_day,       dtype: int32,   nullable: false }
      - { name: fraud_score,       dtype: float64, nullable: false }
  stats:
    kind: local
    meta:
      rows:  3_200_000
      bytes: 412_000_000

---
apiVersion: wyrd/v1
kind: Drift
metadata:
  name: fraud-score-drift
  version: "1.0.0"
  space: prod
spec:
  description: SPC chart on the score distribution of the MLflow-hosted model.
  method: Spc
  profile:
    type: Spc
    config:
      sample_size: 1000
      alert_threshold: 3.0
      feature_map:
        fraud_score: numeric
  baseline_ref: { kind: Data,  name: fraud-baseline, version: "2026.05.01", space: prod }
  target_refs:
    - { kind: Model, name: fraud-detector, version: "7.0.0", space: prod }
  features: [fraud_score]
  thresholds:
    spc_sigma: 3.0

---
apiVersion: wyrd/v1
kind: Service
metadata:
  name: fraud-scoring-svc
  version: "7.0.0"
  space: prod
spec:
  description: Real-time fraud scoring service backed by the MLflow-hosted model.
  service_type: api
  components:
    - alias: model
      ref: { kind: Model, name: fraud-detector, version: "7.0.0", space: prod }
  entry_point: acme.fraud.scoring:app
  deployment:
    image:    { type: str, value: registry.acme.com/fraud-scoring:7.0.0 }
    replicas: { type: number, value: 4 }
  runtime:
    kind: api
    mode: in_process
    strict: true
