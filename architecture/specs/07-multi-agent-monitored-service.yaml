# =============================================================================
# Example 7 — Multi-agent service with per-agent observability and policy
#
# Scenario: An internal "ops copilot" Service hosts two specialized agents:
#   - incident-triage-agent: triages incoming PagerDuty alerts
#   - runbook-executor-agent: executes documented runbooks
#
# Each agent has its OWN prompt, its OWN eval, its OWN drift on output
# quality, and its OWN runtime policy. The Service also carries a SERVICE-WIDE
# policy (tenancy + rate limits) and a SERVICE-WIDE drift on latency. When the
# service-wide latency drift fires, an Operator pages SRE via a Trigger.
#
# Card inventory (16 cards):
#
#   PROMPTS (3)
#     - Prompt   triage-prompt
#     - Prompt   runbook-prompt
#     - Prompt   ops-copilot-judge-prompt          # shared by both Evals
#
#   AGENTS (2)
#     - Agent    incident-triage-agent
#     - Agent    runbook-executor-agent
#
#   POLICIES (3)
#     - Policy   triage-runtime-policy             # per-agent gates
#     - Policy   runbook-runtime-policy            # per-agent gates
#     - Policy   ops-copilot-service-policy        # service-wide gates
#
#   OBSERVATION (5)
#     - Eval     triage-eval                       # judge eval, targets triage agent
#     - Eval     runbook-eval                      # judge eval, targets runbook agent
#     - Drift    triage-output-quality-drift       # PSI, targets triage agent
#     - Drift    runbook-output-quality-drift      # SPC, targets runbook agent
#     - Drift    ops-copilot-latency-drift         # SPC, targets the Service
#
#   REACTION (2)
#     - Operator pageroncall-operator
#     - Trigger  latency-drift-page-trigger        # drift → operator
#
#   COMPOSITION + SINK (2)
#     - Service  ddog-sink-prod                    # observability sink
#     - Service  ops-copilot-svc                   # the composing Service
#
# Design choices worth noticing while reading:
#
#   1. Drifts and Evals all declare their OWN target_refs. They sit OUTSIDE the
#      Service composition. The Service knows nothing about them. They link
#      themselves to the Agents/Service via target_refs.
#
#   2. ObservationHooks lives on Eval today (per current spec) but NOT on
#      ServiceSpec, AgentSpec, or DriftSpec. The service-wide fanout to
#      ddog-sink-prod is therefore expressed two ways:
#         a) Eval.observation_hooks (works today, lives in spec).
#         b) Drift/Service-level fanout (PROPOSED, commented in this file).
#      Open issue: lift observation_hooks to a foundation on every run-
#      producing spec.
#
#   3. Per-agent Policy binding has no first-class field on ServiceComponent
#      today. The workaround is to list each Policy as its own component and
#      scope the rule expressions by `agent.name`. The PROPOSED alternative is
#      a `policy_refs:` field on ServiceComponent — shown commented out where
#      it would live.
#
#   4. Service-wide Policy is composed as a Service component without an
#      `agent.name` gate; the runtime applies it to every invocation.
#
#   5. The reaction chain (Drift → Trigger → Operator) lives entirely OUTSIDE
#      the Service. Authoring or removing the trigger does not modify the
#      Service or the Drift.
# =============================================================================

# -----------------------------------------------------------------------------
# PROMPTS
# -----------------------------------------------------------------------------
apiVersion: wyrd/v1
kind: Prompt
metadata:
  name: triage-prompt
  version: "1.0.0"
  space: prod
spec:
  provider: anthropic
  model: claude-opus-4-7
  messages:
    - role: system
      content: |
        You triage incoming PagerDuty alerts. Classify severity (sev0-sev4),
        suggest the right runbook, identify the on-call owner. Never auto-page
        a sev0 without human review.
    - role: user
      content: |
        Alert:
        {{alert_json}}
  variables: [alert_json]
  response_format: text

---
apiVersion: wyrd/v1
kind: Prompt
metadata:
  name: runbook-prompt
  version: "1.0.0"
  space: prod
spec:
  provider: anthropic
  model: claude-opus-4-7
  messages:
    - role: system
      content: |
        You execute documented runbooks. Walk the steps. Stop at any step that
        requires human approval. Report progress after each step.
    - role: user
      content: |
        Runbook: {{runbook_id}}
        Context: {{context}}
  variables: [runbook_id, context]
  response_format: text

---
apiVersion: wyrd/v1
kind: Prompt
metadata:
  name: ops-copilot-judge-prompt
  version: "1.0.0"
  space: prod
spec:
  provider: anthropic
  model: claude-opus-4-7
  messages:
    - role: system
      content: |
        You are a judge. Given an agent's output and the expected behavior,
        rate {correctness, completeness, safety} on a 1-5 scale and explain.
    - role: user
      content: |
        Agent output:
        {{output}}
        Expected:
        {{expected}}
  variables: [output, expected]
  response_format: structured

# -----------------------------------------------------------------------------
# AGENTS
# -----------------------------------------------------------------------------
---
apiVersion: wyrd/v1
kind: Agent
metadata:
  name: incident-triage-agent
  version: "1.0.0"
  space: prod
spec:
  prompt: { kind: Prompt, name: triage-prompt, version: "1.0.0", space: prod }
  tool_names: [pagerduty_get_incident, runbook_search, oncall_lookup, pagerduty_ack, pagerduty_create_incident]
  run_config:
    max_iterations: 6
    timeout_ms:    30000

---
apiVersion: wyrd/v1
kind: Agent
metadata:
  name: runbook-executor-agent
  version: "1.0.0"
  space: prod
spec:
  prompt: { kind: Prompt, name: runbook-prompt, version: "1.0.0", space: prod }
  tool_names: [runbook_fetch, kube_exec, datadog_query, slack_post]
  run_config:
    max_iterations: 20
    timeout_ms:    600000

# -----------------------------------------------------------------------------
# POLICIES
#
# Per-agent policies scope by `agent.name` in expressions today, because
# ServiceComponent does not yet carry policy_refs. Once that binding lands,
# expressions drop the agent.name scoping.
# -----------------------------------------------------------------------------
---
apiVersion: wyrd/v1
kind: Policy
metadata:
  name: triage-runtime-policy
  version: "1.0.0"
  space: prod
spec:
  description: Runtime gates specific to the incident-triage-agent.
  rules:
    - name: no-auto-page-sev0
      expression: >
        agent.name == 'incident-triage-agent'
        and tool.name == 'pagerduty_create_incident'
        and tool.args.severity == 'sev0'
      action: block
    - name: ack-requires-confidence
      expression: >
        agent.name == 'incident-triage-agent'
        and tool.name == 'pagerduty_ack'
        and run.confidence < 0.85
      action: approval_required
      metadata:
        approver_role: { type: str, value: sre-lead }
  enforcement: pre_invoke

---
apiVersion: wyrd/v1
kind: Policy
metadata:
  name: runbook-runtime-policy
  version: "1.0.0"
  space: prod
spec:
  description: Runtime gates specific to the runbook-executor-agent.
  rules:
    - name: kube-exec-prod-requires-approval
      expression: >
        agent.name == 'runbook-executor-agent'
        and tool.name == 'kube_exec'
        and tool.args.cluster == 'prod'
      action: approval_required
      metadata:
        approver_role: { type: str, value: oncall-sre }
    - name: limit-slack-volume
      expression: >
        agent.name == 'runbook-executor-agent'
        and tool.name == 'slack_post'
        and run.tool_calls('slack_post') > 10
      action: warn
  enforcement: pre_invoke

---
# Service-wide policy: no agent.name gate. Applies to every invocation.
apiVersion: wyrd/v1
kind: Policy
metadata:
  name: ops-copilot-service-policy
  version: "1.0.0"
  space: prod
spec:
  description: Service-wide tenancy and rate-limit gates.
  rules:
    - name: tenant-isolation
      expression: "request.tenant_id != run.context.tenant_id"
      action: block
    - name: per-tenant-rps-cap
      expression: "service.tenant_rps > 50"
      action: warn
  enforcement: pre_invoke

# -----------------------------------------------------------------------------
# OBSERVATION — Evals and Drifts
#
# Each Eval/Drift declares its target via target_refs. Authors never edit the
# Agent or Service to "register" the observation. The Service composes the
# Agents; the Evals/Drifts attach independently.
# -----------------------------------------------------------------------------
---
apiVersion: wyrd/v1
kind: Eval
metadata:
  name: triage-eval
  version: "1.0.0"
  space: prod
spec:
  description: Judge correctness + safety of the incident-triage-agent.
  eval_type: Judge
  target_refs:
    - { kind: Agent,  name: incident-triage-agent,    version: "1.0.0", space: prod }
  judge_refs:
    - { kind: Prompt, name: ops-copilot-judge-prompt, version: "1.0.0", space: prod }
  dataset_refs:
    - { kind: Data,   name: triage-eval-set,          version: "2026.06.01", space: prod }
  pass_gates:
    - { metric: correctness_mean, op: ">=", value: 4.0 }
    - { metric: safety_min,       op: ">=", value: 4.0 }
  profile:
    type: Judge
    config:
      rubric: [correctness, completeness, safety]
  observation_hooks:
    route_refs:
      - { kind: Service, name: ddog-sink-prod, version: "1.0.0", space: prod }
    events: [eval.run.finished, eval.gate.failed]

---
apiVersion: wyrd/v1
kind: Eval
metadata:
  name: runbook-eval
  version: "1.0.0"
  space: prod
spec:
  description: Judge correctness of the runbook-executor-agent.
  eval_type: Judge
  target_refs:
    - { kind: Agent,  name: runbook-executor-agent,   version: "1.0.0", space: prod }
  judge_refs:
    - { kind: Prompt, name: ops-copilot-judge-prompt, version: "1.0.0", space: prod }
  dataset_refs:
    - { kind: Data,   name: runbook-eval-set,         version: "2026.06.01", space: prod }
  pass_gates:
    - { metric: correctness_mean, op: ">=", value: 4.2 }
  profile:
    type: Judge
    config:
      rubric: [correctness, safety]
  observation_hooks:
    route_refs:
      - { kind: Service, name: ddog-sink-prod, version: "1.0.0", space: prod }
    events: [eval.run.finished, eval.gate.failed]

---
# Per-agent drift: PSI on triage severity distribution.
apiVersion: wyrd/v1
kind: Drift
metadata:
  name: triage-output-quality-drift
  version: "1.0.0"
  space: prod
spec:
  description: PSI drift on triage severity distribution vs baseline.
  method: Psi
  target_refs:
    - { kind: Agent, name: incident-triage-agent, version: "1.0.0", space: prod }
  baseline_ref:
    { kind: Data,  name: triage-baseline-distribution, version: "2026.05.01", space: prod }
  features: [predicted_severity]
  profile:
    type: Psi
    config:
      sample_size: 500
      alert_threshold: 0.2
  thresholds:
    psi: 0.2
  # PROPOSED: observation_hooks foundation on DriftSpec (commented).
  # observation_hooks:
  #   route_refs: [{ kind: Service, name: ddog-sink-prod, version: "1.0.0", space: prod }]
  #   events: [drift.alert.fired, drift.score.computed]

---
apiVersion: wyrd/v1
kind: Drift
metadata:
  name: runbook-output-quality-drift
  version: "1.0.0"
  space: prod
spec:
  description: SPC drift on per-step runbook success rate.
  method: Spc
  target_refs:
    - { kind: Agent, name: runbook-executor-agent, version: "1.0.0", space: prod }
  baseline_ref:
    { kind: Data,  name: runbook-success-baseline, version: "2026.05.01", space: prod }
  features: [step_success_rate]
  profile:
    type: Spc
    config:
      sample_size: 200
      alert_threshold: 3.0
  thresholds:
    spc_sigma: 3.0

---
# Service-wide drift: SPC on end-to-end latency.
apiVersion: wyrd/v1
kind: Drift
metadata:
  name: ops-copilot-latency-drift
  version: "1.0.0"
  space: prod
spec:
  description: Service latency drift versus rolling baseline.
  method: Spc
  target_refs:
    - { kind: Service, name: ops-copilot-svc, version: "1.0.0", space: prod }
  baseline_ref:
    { kind: Data, name: ops-copilot-latency-baseline, version: "2026.05.01", space: prod }
  features: [p95_latency_ms]
  profile:
    type: Spc
    config:
      sample_size: 1000
      alert_threshold: 3.0
  thresholds:
    spc_sigma: 3.0

# -----------------------------------------------------------------------------
# REACTION — Operator and Trigger
# -----------------------------------------------------------------------------
---
apiVersion: wyrd/v1
kind: Operator
metadata:
  name: pageroncall-operator
  version: "1.0.0"
  space: prod
spec:
  description: Pages SRE on-call via PagerDuty Events API.
  operator_kind: webhook
  details:
    url:    { type: str, value: "https://events.pagerduty.com/v2/enqueue" }
    method: { type: str, value: "POST" }
    routing_key_secret:
      { type: str, value: "${secrets.pagerduty_routing_key}" }

---
apiVersion: wyrd/v1
kind: Trigger
metadata:
  name: latency-drift-page-trigger
  version: "1.0.0"
  space: prod
spec:
  source:
    kind: drift_observation
    card: { kind: Drift, name: ops-copilot-latency-drift, version: "1.0.0", space: prod }
  target:
    { kind: Operator, name: pageroncall-operator, version: "1.0.0", space: prod }
  cooldown_seconds: 600

# -----------------------------------------------------------------------------
# OBSERVABILITY SINK
# -----------------------------------------------------------------------------
---
apiVersion: wyrd/v1
kind: Service
metadata:
  name: ddog-sink-prod
  version: "1.0.0"
  space: prod
  labels:
    role:   observability-sink
    vendor: datadog
spec:
  description: Datadog sink for ops-copilot observations.
  service_type: observability
  runtime:
    kind: api
    framework: datadog
    strict: true
    config:
      site:    { type: str, value: datadoghq.com }
      env:     { type: str, value: prod }
      service: { type: str, value: ops-copilot }
  credential_refs:
    - { provider: aws_secrets_manager, name: prod/datadog/api_key }

# -----------------------------------------------------------------------------
# COMPOSING SERVICE
#
# Today: per-agent policies are listed as flat components and scoped by
#        `agent.name` in their rule expressions.
#
# Proposed (commented): ServiceComponent gains an optional `policy_refs`
# binding so per-agent gates apply only when that agent is invoked.
# -----------------------------------------------------------------------------
---
apiVersion: wyrd/v1
kind: Service
metadata:
  name: ops-copilot-svc
  version: "1.0.0"
  space: prod
spec:
  description: Two-agent ops copilot. Triages alerts, runs runbooks.
  service_type: agent
  components:
    # Agents
    - alias: triage
      ref: { kind: Agent, name: incident-triage-agent, version: "1.0.0", space: prod }
      # PROPOSED — per-component policy binding (commented; pending lock):
      # policy_refs:
      #   - { kind: Policy, name: triage-runtime-policy, version: "1.0.0", space: prod }
    - alias: executor
      ref: { kind: Agent, name: runbook-executor-agent, version: "1.0.0", space: prod }
      # policy_refs:
      #   - { kind: Policy, name: runbook-runtime-policy, version: "1.0.0", space: prod }

    # Policies — flat list today; per-agent binding pending lock.
    - alias: triage_policy
      ref: { kind: Policy, name: triage-runtime-policy,    version: "1.0.0", space: prod }
    - alias: executor_policy
      ref: { kind: Policy, name: runbook-runtime-policy,   version: "1.0.0", space: prod }
    - alias: service_policy
      ref: { kind: Policy, name: ops-copilot-service-policy, version: "1.0.0", space: prod }

    # Observability sink (referenced by Evals via observation_hooks).
    - alias: ddog
      ref: { kind: Service, name: ddog-sink-prod, version: "1.0.0", space: prod }

  entry_point: acme.opscopilot.service:app
  deployment:
    image:    { type: str, value: registry.acme.com/ops-copilot:1.0.0 }
    replicas: { type: number, value: 3 }
  runtime:
    kind: agent
    mode:   in_process
    strict: true
    policy:
      runtime_hooks: true

  # PROPOSED — observation_hooks lifted to a foundation on ServiceSpec
  # (commented; pending lock). Today, fanout is expressed by each Eval/Drift
  # declaring its own observation_hooks. Once lifted, this lets the Service
  # fan out service-level events (start/finish/tool.failed) too.
  #
  # observation_hooks:
  #   route_refs:
  #     - { kind: Service, name: ddog-sink-prod, version: "1.0.0", space: prod }
  #   events:
  #     - service.run.started
  #     - service.run.finished
  #     - service.tool.failed
