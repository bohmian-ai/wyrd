# =============================================================================
# Example 8 — External Source Cards for a production ML platform
#
# Scenario: An AI platform team manages model evaluation and drift detection
# across five external data systems: a Snowflake warehouse (SQL row sets),
# a GCS archive (Parquet blobs), Datadog metrics (time series), Grafana Loki
# (log records), and Grafana Tempo (spans). Each system is declared once as a
# SourceCard; Drift and Eval Cards reference them by CardRef.
#
# `source.kind` is the read-shape bucket, not the vendor. Drift and Eval bind
# to a shape ("row set", "time series") and are never vendor-aware.
#
# Card inventory:
#   - Source   telemetry-warehouse     # Snowflake row set; env-var keypair auth
#   - Source   telemetry-archive       # GCS Parquet blobs; ambient Workload Identity
#   - Source   service-metrics         # Datadog time series; multi-env api+app key
#   - Source   service-logs            # Loki log records; bearer token
#   - Source   service-traces          # Tempo spans; no auth (internal cluster)
#
# Design notes:
#
#   1. Auth shapes: each bucket demonstrates a distinct SourceAuth variant.
#      object_store uses None (ambient GKE Workload Identity via IAM binding).
#      sql_warehouse uses MultiEnv (Snowflake keypair requires user + private_key
#        as separate env vars: SNOWFLAKE_USER and SNOWFLAKE_PRIVATE_KEY).
#      metrics uses MultiEnv (Datadog requires both api_key and app_key).
#      logs uses Env (bearer token).
#      traces uses None (Tempo is internal-only, network policy is the gate).
#
#   2. No secret values are present anywhere in this file. Every auth field
#      carries a server-side env-var name resolved at read time (Doctrine #7).
#      The Card is safe to commit, store in the registry, and return from the
#      API without redaction.
#
#   3. `defaults` carries non-secret read hints (page size, retention window).
#      These are `NonSecretValue` blobs — opaque to the Card schema, consumed
#      by the vala read adapter as configuration hints.
#
#   4. source.kind is the inner discriminator. The outer field `source` on
#      SourceSpec avoids the field-name collision that `kind: { kind: ... }`
#      would create. Wire shape: `spec.source.kind = "sql_warehouse"`.
#
#   5. SecretStore auth (`scheme: secret_store`) is not shown here. Use it
#      when credentials live in Vault, AWS SSM, or GCP Secret Manager instead
#      of env vars. Fields: `provider` (e.g. `vault`) and `name` (secret path).
# =============================================================================

---
# SourceCard — Snowflake telemetry warehouse
# sql_warehouse bucket → row set for DriftSignal::Distribution or EvalTask::Query
apiVersion: wyrd/v1
kind: Source
metadata:
  space: prod
  name: telemetry-warehouse
  version: 1.0.0
  labels:
    team: ml-platform
    tier: gold

spec:
  description: >
    Run-level telemetry rows for online evaluation and distribution drift.
    Snowflake analytics warehouse, reader role, keypair auth via env.
  source:
    kind: sql_warehouse
    connection:
      vendor: snowflake
      account: acme-prod
      warehouse: analytics
      database: telemetry
      schema: public
      role: reader
      auth:
        scheme: multi_env
        vars:
          user: SNOWFLAKE_USER
          private_key: SNOWFLAKE_PRIVATE_KEY   # names only; server resolves at read time

  defaults:
    page_size:
      type: number
      value: 5000

---
# SourceCard — GCS Parquet archive
# object_store bucket → record stream for archival evaluation
# No explicit auth: GKE Workload Identity provides ambient IAM credentials.
apiVersion: wyrd/v1
kind: Source
metadata:
  space: prod
  name: telemetry-archive
  version: 1.0.0
  labels:
    team: ml-platform
    tier: silver

spec:
  description: >
    Archived Parquet run records from GCS. Used for historical evaluation
    and offline drift baseline computation. Ambient Workload Identity auth.
  source:
    kind: object_store
    uri: gs://acme-telemetry-archive/runs
    format: parquet

  defaults:
    page_size:
      type: number
      value: 10000

---
# SourceCard — Datadog metrics
# metrics bucket → labeled time series for DriftSignal::Metric
# MultiEnv auth: Datadog requires both an API key and an App key.
apiVersion: wyrd/v1
kind: Source
metadata:
  space: prod
  name: service-metrics
  version: 1.0.0
  labels:
    team: ml-platform
    vendor: datadog

spec:
  description: >
    Service p99 latency and error-rate metrics from Datadog. Used by metric
    drift checks. Two env-var names (api_key, app_key) — values resolved
    server-side at read time.
  source:
    kind: metrics
    connection:
      vendor: datadog
      site: datadoghq.com
      api_scopes:
        - metrics_read
      auth:
        scheme: multi_env
        vars:
          api_key: DD_API_KEY     # logical name → server-side env-var name
          app_key: DD_APP_KEY

---
# SourceCard — Grafana Loki log store
# logs bucket → log records
# Env auth: single bearer token env var.
apiVersion: wyrd/v1
kind: Source
metadata:
  space: prod
  name: service-logs
  version: 1.0.0
  labels:
    team: ml-platform
    vendor: loki

spec:
  description: >
    Service error logs from Loki. Used for log-volume drift detection.
    Bearer-token auth via a single env var.
  source:
    kind: logs
    connection:
      vendor: loki
      endpoint: https://loki.acme.internal
      auth:
        scheme: env
        env: LOKI_TOKEN

---
# SourceCard — Grafana Tempo trace store
# traces bucket → spans for EvalTask::TraceAssertion
# No auth: Tempo is an internal cluster endpoint protected by network policy.
apiVersion: wyrd/v1
kind: Source
metadata:
  space: prod
  name: service-traces
  version: 1.0.0
  labels:
    team: ml-platform
    vendor: tempo

spec:
  description: >
    Service spans from Grafana Tempo. Used for trace-level evaluation
    (latency assertions, span count checks). Internal cluster endpoint;
    no credential required — network policy is the access gate.
  source:
    kind: traces
    connection:
      vendor: tempo
      endpoint: https://tempo.acme.internal
