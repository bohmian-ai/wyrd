services:
  postgres:
    image: postgres:16
    cpus: 2.0
    mem_limit: 4g
    environment:
      POSTGRES_DB: wyrd
      POSTGRES_USER: wyrd_test_admin
      POSTGRES_PASSWORD: wyrd_test_admin_pw
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "wyrd_test_admin", "-d", "wyrd"]
      interval: 2s
      timeout: 3s
      retries: 20
