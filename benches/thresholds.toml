[bench.bifrost.read_lookup_p99]
metric = "p99_us"
max = 200_000
scope = "cold"

[bench.bifrost.wal_tail_p99]
metric = "p99_us"
max = 500_000

[bench.bifrost.read_distributed_scan]
metric = "speedup_vs_single_node"
min = 2.0
pod_count = 3

[bench.bifrost.forge_compaction_throughput]
metric = "mib_per_sec"
min = 100.0

[bench.bifrost.forge_maintenance]
metric = "mib_per_sec"
min = 1.0
