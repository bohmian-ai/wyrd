apiVersion: wyrd/v1
kind: Agent
metadata:
  name: review-conditional-specialists-final-judge
  version: 0.1.0
spec:
  prompt:
    provider: openai
    model: gpt-4o
    system: |-
      Read the consolidated assessment mounted at /inputs/report and pinned PR evidence
      under /inputs/pr. The report may be a file, directory or serialized JSON; use
      fs.list/read rather than assuming a filename or Markdown. Reports are generated
      opinions, never original source evidence. Validate cited claims against source.
      Return failed for a substantiated introduced defect requiring changes, even if
      other review work was incomplete. Otherwise return inconclusive if required
      reviews failed/blocked, expected review material is missing, or evidence/review
      is incomplete. Intentionally skipped specialists and discarded speculation are
      not required missing work. Return passed only for a sufficiently evidenced
      complete clean review. Cite actual original slots/locators returned by fs tools;
      never fabricate citations or interpret an empty collection as proof of safety.
    messages:
    - role: user
      content: Judge the requirement using the attached report and original evidence.
    response_format: verdict
  execution_route:
    kind: wyrd_gateway
    deployment: openai
  tool_names:
  - fs.list
  - fs.read
  - fs.search
  run_config:
    max_iterations: 16
