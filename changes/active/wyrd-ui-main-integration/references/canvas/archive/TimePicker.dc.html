<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Time picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&amp;family=Fragment+Mono&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0c12}
a{color:#7a8cff;text-decoration:none}a:hover{color:#a9b4ff}
.p{display:block;padding:7px 10px;font:12px "Fragment Mono",monospace;color:#e6e4da;border-radius:2px}
.p:hover{background:#1f2230;color:#e6e4da}
.h{font:11px "Fragment Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:#8f92a5}
.in{height:32px;box-sizing:border-box;width:100%;background:#0b0c12;border:1px solid #252838;color:#e6e4da;font:12px "Fragment Mono",monospace;padding:0 8px}
</style>
</helmet>
<div style="width: 520px; height: 600px; box-sizing: border-box; padding: 24px; background: #0b0c12; color: #e6e4da; font-family: 'Familjen Grotesk', sans-serif;">
  <a href="Main.dc.html" style="width: 220px; height: 34px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 10px; background: #1a2040; border: 1px solid #3a4170; color: #e6e4da; font-size: 13px;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
    <span>Last 1 hour</span>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 15l-6-6-6 6"></path></svg>
  </a>
  <div role="dialog" aria-label="Time range" style="margin-top: 6px; width: 472px; box-sizing: border-box; background: #12141c; border: 1px solid #252838; border-radius: 2px; box-shadow: 0 12px 32px #00000080; display: grid; grid-template-columns: 180px minmax(0, 1fr);">
    <div style="padding: 10px; border-right: 1px solid #252838;">
      <div class="h" style="padding: 4px 10px 8px;">Relative</div>
      <a class="p" href="Main.dc.html">Last 5 minutes</a>
      <a class="p" href="Main.dc.html">Last 15 minutes</a>
      <a class="p" href="Main.dc.html">Last 30 minutes</a>
      <a class="p" href="Main.dc.html" aria-current="true" style="background: #1a2040; color: #e6e4da;">Last 1 hour ✓</a>
      <a class="p" href="Main.dc.html">Last 6 hours</a>
      <a class="p" href="Main.dc.html">Last 24 hours</a>
      <a class="p" href="Main.dc.html">Last 7 days</a>
      <a class="p" href="Main.dc.html">Last 30 days</a>
    </div>
    <form style="padding: 14px; display: flex; flex-direction: column; gap: 10px;">
      <div class="h">Custom range</div>
      <label style="display: flex; flex-direction: column; gap: 4px; font: 11px 'Fragment Mono', monospace; color: #8f92a5;">From<input class="in" value="2026-10-13 19:02:10"></label>
      <label style="display: flex; flex-direction: column; gap: 4px; font: 11px 'Fragment Mono', monospace; color: #8f92a5;">To<input class="in" value="now"></label>
      <div style="font: 11px 'Fragment Mono', monospace; color: #8f92a5;">Also accepts now-2h, yesterday, an ISO time.</div>
      <div role="group" aria-label="Time zone" style="display: inline-flex;">
        <button type="button" aria-pressed="true" style="height: 28px; padding: 0 12px; background: #1a2040; border: 1px solid #3a4170; color: #e6e4da; font: 12px 'Fragment Mono', monospace;">UTC</button>
        <button type="button" style="height: 28px; padding: 0 12px; background: #12141c; border: 1px solid #252838; color: #8f92a5; font: 12px 'Fragment Mono', monospace; margin-left: -1px;">Local</button>
      </div>
      <button type="submit" style="height: 34px; background: #7a8cff; border: 0; color: #0b0c12; font: 600 13px 'Familjen Grotesk', sans-serif; cursor: pointer;">Apply range</button>
      <div class="h" style="margin-top: 6px;">Recent</div>
      <a class="p" href="Main.dc.html" style="padding-left: 0;">19:02:10 → 19:14:40 (zoom)</a>
      <a class="p" href="Main.dc.html" style="padding-left: 0;">Last 6 hours</a>
    </form>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":600}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
