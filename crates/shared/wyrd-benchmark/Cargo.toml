[package]
name = "wyrd-benchmark"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false
description = "Opt-in high-resolution recording for benchmark-owned Wyrd servers."

[features]
# Benchmark recording: `install`, every timing and scan recorder, and the
# allocation sampler with its pprof rendering. Only benchmark builds enable it;
# without it `enabled` is a constant `false`, nothing can install the recorder,
# every recorder call returns at once, and every site `enabled` guards compiles
# away, so shipped binaries carry only operational metrics.
bench = ["dep:backtrace", "dep:flate2", "dep:prost"]

[dependencies]
backtrace = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
hdrhistogram = { workspace = true }
http = { workspace = true }
metrics = { workspace = true }
num-traits = { workspace = true }
prost = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
workspace-hack.workspace = true
# The recorder's own tests install it.
wyrd-benchmark = { path = ".", features = ["bench"] }

[lints]
workspace = true
