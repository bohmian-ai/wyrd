[package]
name = "wyrd-benchmark"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false
description = "Opt-in high-resolution recording for benchmark-owned Wyrd servers."

[features]
# Benchmark recording: `install`, the registry and its snapshots, the
# standard `metrics` recorder, every timing and scan recorder, observation
# state, and the allocation sampler with its pprof rendering. Only benchmark
# builds enable it; without it the crate is a stateless facade: `enabled` is a
# constant `false`, `Observation` is a zero-sized no-op, every recorder call is
# empty, no registry, histogram, or recorder type exists, and none of these
# dependencies is built, so shipped binaries carry only operational metrics.
bench = [
    "dep:backtrace",
    "dep:flate2",
    "dep:hdrhistogram",
    "dep:metrics",
    "dep:num-traits",
    "dep:prost",
    "dep:serde",
    "dep:ulid",
]

[dependencies]
backtrace = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
hdrhistogram = { workspace = true, optional = true }
http = { workspace = true }
metrics = { workspace = true, optional = true }
num-traits = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ulid = { workspace = true, optional = true }

[dev-dependencies]
workspace-hack.workspace = true
# The recorder's own tests install it.
wyrd-benchmark = { path = ".", features = ["bench"] }

[lints]
workspace = true
