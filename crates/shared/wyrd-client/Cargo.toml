[package]
name = "wyrd-client"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false
description = "Shared Wyrd client: transport, authentication, and composed client capabilities."

[lib]
path = "src/lib.rs"

[features]
# Exposes the raw Bifrost ingest transport to test harnesses. Never enabled by
# an SDK package.
test-support = []

[dependencies]
arrow = { workspace = true }
arrow-schema = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
indicatif = { workspace = true }
reqwest = { workspace = true }
schemars = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_jcs = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
serde_yaml = { workspace = true }
skald-spec = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
wyrd-cards = { workspace = true }
wyrd-loader = { workspace = true }
wyrd-queue = { workspace = true }
wyrd-runtime = { workspace = true }
wyrd-semver = { workspace = true }
wyrd-spec = { workspace = true }
wyrd-tls = { workspace = true }
wyrd-tonic = { workspace = true, features = ["client"] }
wyrd-utils = { workspace = true }

[dev-dependencies]
workspace-hack.workspace = true
secrecy = { workspace = true }
sqlx = { workspace = true, features = ["postgres"] }
vala-bifrost-redux = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
wiremock = { workspace = true }
wyrd-testing = { workspace = true }

[[test]]
name = "pg_bifrost_e2e"
required-features = ["test-support"]
