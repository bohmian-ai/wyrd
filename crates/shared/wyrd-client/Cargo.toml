[package]
name = "wyrd-client"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false
description = "External Wyrd client transport runtime."

[lib]
path = "src/lib.rs"

[features]
default = ["transport-grpc", "transport-http"]
transport-grpc = ["dep:wyrd-tonic"]
transport-http = []

[dependencies]
chrono = { workspace = true }
reqwest = { workspace = true }
schemars = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shellexpand = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
wyrd-spec = { workspace = true }
wyrd-tonic = { workspace = true, optional = true }

[dev-dependencies]
secrecy = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
wyrd-testing = { workspace = true }
