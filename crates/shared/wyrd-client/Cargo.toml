[package]
name = "wyrd-client"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false
description = "External Wyrd client transport runtime."

[lib]
path = "src/lib.rs"

[features]
default = ["transport-grpc", "transport-http"]
transport-grpc = ["dep:wyrd-tonic"]
transport-http = []
# PyO3 boundary for the tenant-admin SDK surface. Owned here (the client crate),
# never in wyrd-spec / wyrd-auth-oidc; the async admin calls block on a Tokio
# runtime, so the runtime drivers are pulled in alongside pyo3.
python = [
    "dep:pyo3",
    "dep:wyrd-utils",
    "wyrd-utils/python",
    "transport-http",
    "tokio/rt",
    "tokio/net",
    "tokio/time",
]

[dependencies]
chrono = { workspace = true }
reqwest = { workspace = true }
schemars = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shellexpand = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
wyrd-spec = { workspace = true }
wyrd-tonic = { workspace = true, optional = true }

pyo3 = { workspace = true, optional = true }
wyrd-utils = { workspace = true, optional = true }

[dev-dependencies]
secrecy = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
wiremock = { workspace = true }
wyrd-semver = { workspace = true }
wyrd-testing = { workspace = true }
