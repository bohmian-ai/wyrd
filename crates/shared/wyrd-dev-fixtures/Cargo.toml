[package]
name = "wyrd-dev-fixtures"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }

[features]
default = []
dev = []
pg = [
    "dep:secrecy",
    "dep:sqlx",
    "dep:thiserror",
    "dep:tokio",
    "dep:url",
    "dep:vala-sql",
    "vala-sql/testing",
    "dep:wyrd-sql",
    "dep:wyrd-spec",
]

[dependencies]
secrecy = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["macros", "rt-multi-thread"] }
url = { workspace = true, optional = true }
vala-sql = { path = "../../vala/vala-sql", version = "0.0.1", optional = true }
wyrd-sql = { path = "../../wyrd/wyrd-sql", version = "0.0.1", optional = true }
wyrd-spec = { workspace = true, optional = true }
