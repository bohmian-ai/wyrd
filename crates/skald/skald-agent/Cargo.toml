[package]
name = "wyrd-skald-agent"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
description = "Live Skald agent: identity, single provider, tools, bounded tool loop."

[lib]
name = "skald_agent"
path = "src/lib.rs"

[dependencies]
jsonschema = { workspace = true }
skald-spec = { workspace = true }
skald-prompt = { workspace = true }
skald-runtime = { workspace = true }
skald-providers = { workspace = true }
skald-tool = { workspace = true }
wyrd-spec = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
async-trait = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
futures = "0.3"
chrono = { workspace = true }
uuid = { workspace = true, features = ["std", "v7"] }

[dev-dependencies]
workspace-hack.workspace = true
wyrd-telemetry = { path = "../../shared/wyrd-telemetry", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
serde_json = { workspace = true }
skald-providers = { path = "../skald-providers", package = "wyrd-skald-providers" }

[lints]
workspace = true
