[package]
name = "skald-observer"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false
description = "Observer trait and observation primitives for Skald agent runs."

[lib]
path = "src/lib.rs"

[features]
default = []
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk"]
python = [
    "dep:pyo3",
    "dep:skald-prompt",
    "skald-prompt/python",
]

[dependencies]
skald-spec = { workspace = true }
skald-prompt = { workspace = true, optional = true }
wyrd-spec = { workspace = true }
wyrd-utils = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["macros", "rt"] }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true, features = ["rt-tokio"] }
pyo3 = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
