[package]
name = "wyrd-skald-prompt"
version = { workspace = true }
edition = { workspace = true }
description = "Client-safe Prompt authoring builder for native Skald requests."
license = { workspace = true }
rust-version = "1.95"
repository = { workspace = true }
authors = { workspace = true }

[features]
default = []
python = ["dep:pyo3", "wyrd-utils/python", "wyrd-interfaces/python"]

[dependencies]
skald-spec = { workspace = true }
wyrd-spec = { workspace = true }
wyrd-interfaces = { workspace = true }
wyrd-utils = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
base64 = { workspace = true }
pyo3 = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
workspace-hack.workspace = true

[lib]
name = "skald_prompt"
