[package]
name = "skald-workflow"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false
description = "Skald workflow engine: DAG scheduling, tasks, cross-provider handoff."

[lib]
path = "src/lib.rs"

[features]
default = []
otel = ["wyrd-observe/otel"]
python = [
    "dep:pyo3",
    "dep:wyrd-runtime",
    "dep:wyrd-utils",
    "skald-agent/python",
    "wyrd-observe/python",
    "wyrd-utils/python",
]

[dependencies]
skald-spec = { workspace = true }
skald-prompt = { workspace = true }
skald-runtime = { workspace = true }
skald-agent = { workspace = true }
skald-tool = { workspace = true }
wyrd-spec = { workspace = true }
wyrd-observe = { workspace = true }
wyrd-runtime = { workspace = true, optional = true }
wyrd-utils = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
ulid = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
futures = "0.3"
jsonschema = { workspace = true }
anyhow = "1"
url = { workspace = true }
pyo3 = { workspace = true, optional = true }

[[example]]
name = "with_observer"
required-features = ["otel"]

[dev-dependencies]
skald-providers = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
