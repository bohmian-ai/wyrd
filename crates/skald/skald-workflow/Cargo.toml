[package]
name = "skald-workflow"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false
description = "Skald workflow engine: explicit-binding DAG execution over Skald agents and routes."

[lib]
path = "src/lib.rs"

[features]
default = []
python = [
    "dep:pyo3",
    "dep:wyrd-utils",
    "wyrd-utils/python",
]

[dependencies]
skald-spec = { workspace = true }
skald-prompt = { workspace = true }
skald-runtime = { workspace = true }
skald-agent = { workspace = true }
skald-providers = { workspace = true }
skald-tool = { workspace = true }
wyrd-spec = { workspace = true }
wyrd-utils = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true, features = ["std", "v7"] }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tokio-util = { workspace = true }
http = { workspace = true }
secrecy = { workspace = true }
tracing = { workspace = true }
jsonschema = { workspace = true }
futures-util = { workspace = true }
url = { workspace = true }
pyo3 = { workspace = true, optional = true }

[dev-dependencies]
workspace-hack.workspace = true
wyrd-telemetry = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = { workspace = true }

[lints]
workspace = true
