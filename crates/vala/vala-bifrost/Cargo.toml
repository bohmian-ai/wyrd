[package]
name = "vala-bifrost"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Vala OLAP write/read engine built on Apache Iceberg and DataFusion."

[lib]
path = "src/lib.rs"

[features]
default = []
python = ["dep:pyo3", "arrow/pyarrow"]
testing = ["vala-sql/testing"]
bench-bin = ["dep:criterion", "dep:clap", "dep:rand", "dep:tempfile", "dep:serde_json", "vala-sql/testing"]

[dependencies]
wyrd-spec    = { workspace = true }
wyrd-storage = { workspace = true, features = ["iceberg"] }
vala-sql     = { path = "../vala-sql", version = "0.0.1" }

iceberg             = { workspace = true }
iceberg-catalog-sql = { workspace = true }
iceberg-datafusion  = { workspace = true }

datafusion = { workspace = true }
arrow      = { workspace = true }
parquet    = { workspace = true }

sqlx         = { workspace = true }
sqlx_catalog = { package = "sqlx", version = "=0.8.1", default-features = false, features = ["postgres", "runtime-tokio", "any"] }

tokio      = { workspace = true, features = ["full"] }
tracing    = { workspace = true }
thiserror  = { workspace = true }
dashmap    = { workspace = true }
async-trait = { workspace = true }
url        = { workspace = true }
uuid       = { workspace = true, features = ["v7"] }
serde      = { workspace = true, features = ["derive"] }
sha2       = { workspace = true }
hex        = { workspace = true }

pyo3 = { workspace = true, optional = true }

criterion  = { version = "0.5", features = ["async_tokio"], optional = true }
clap       = { workspace = true, optional = true }
rand       = { workspace = true, optional = true }
tempfile   = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
# Self-reference activates `testing` feature for integration tests in `tests/`
# (cfg(test) does not apply to the lib when building integration test binaries).
vala-bifrost = { path = ".", features = ["testing"] }
tempfile   = { workspace = true }
serde_json = { workspace = true }
vala-sql   = { path = "../vala-sql", version = "0.0.1", features = ["testing"] }
wyrd-dev-fixtures = { path = "../../shared/wyrd-dev-fixtures", version = "0.0.1", features = ["pg"] }

[[bench]]
name = "write_throughput"
path = "benches/write_throughput.rs"
harness = false
required-features = ["bench-bin"]

[[bench]]
name = "commit_latency"
path = "benches/commit_latency.rs"
harness = false
required-features = ["bench-bin"]

[[bench]]
name = "scan_cold_warm"
path = "benches/scan_cold_warm.rs"
harness = false
required-features = ["bench-bin"]

[[bench]]
name = "selectivity"
path = "benches/selectivity.rs"
harness = false
required-features = ["bench-bin"]

[[bench]]
name = "projection"
path = "benches/projection.rs"
harness = false
required-features = ["bench-bin"]

[[bench]]
name = "plan_overhead"
path = "benches/plan_overhead.rs"
harness = false
required-features = ["bench-bin"]

[[bench]]
name = "registry_hit"
path = "benches/registry_hit.rs"
harness = false
required-features = ["bench-bin"]

[[bin]]
name = "bench_workload"
path = "benches/bin/bench_workload.rs"
required-features = ["bench-bin"]

[[bin]]
name = "bench_check"
path = "benches/bin/bench_check.rs"
required-features = ["bench-bin"]

[lints]
workspace = true
