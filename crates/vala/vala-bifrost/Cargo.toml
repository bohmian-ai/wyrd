[package]
name = "vala-bifrost"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Vala OLAP read engine built on Apache Iceberg and DataFusion."

[lib]
path = "src/lib.rs"

[dependencies]
wyrd-spec       = { workspace = true }
wyrd-storage    = { workspace = true }
vala-sql        = { workspace = true }
iceberg                 = { workspace = true }
iceberg-catalog-sql     = { workspace = true }
iceberg-datafusion      = { workspace = true }
iceberg-storage-opendal = { workspace = true }

datafusion = { workspace = true }
arrow      = { workspace = true }
parquet    = { workspace = true }

sqlx         = { workspace = true }
sqlx_catalog = { package = "sqlx", version = "=0.8.1", default-features = false, features = ["postgres", "runtime-tokio", "any"] }

tokio      = { workspace = true, features = ["full"] }
tracing    = { workspace = true }
thiserror  = { workspace = true }
dashmap    = { workspace = true }
async-trait = { workspace = true }
uuid       = { workspace = true, features = ["v7"] }
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2       = { workspace = true }
hex        = { workspace = true }
chrono     = { workspace = true }

[lints]
workspace = true
