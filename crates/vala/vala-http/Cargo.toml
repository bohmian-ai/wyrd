[package]
name = "vala-http"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false
description = "Vala HTTP route handlers mounted by the unified Wyrd server."

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros"] }
tower = { workspace = true }
tracing = { workspace = true }
vala-eval = { workspace = true, features = ["orchestrator"] }
wyrd-error-derive = { workspace = true }
wyrd-observe = { workspace = true }
wyrd-spec = { workspace = true }

[dev-dependencies]
wyrd-semver = { workspace = true }
hyper = { version = "1", features = ["full"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tower = { workspace = true, features = ["util"] }
