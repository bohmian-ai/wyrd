[package]
name = "vala-sdk"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false
description = "Vala client SDK: Bifrost ingest sink, pooled producers, and fire-and-forget observe surface."

[lib]
path = "src/lib.rs"

[features]
default = []
python = ["dep:pyo3"]
testing = []
bench-bin = ["dep:criterion"]

[dependencies]
wyrd-queue = { workspace = true }
wyrd-client = { workspace = true }
wyrd-spec = { workspace = true }
wyrd-runtime = { workspace = true }
arrow-schema = { workspace = true }
async-trait = { workspace = true }
secrecy = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

pyo3 = { workspace = true, optional = true }
criterion = { version = "0.5", features = ["async_tokio"], optional = true }

[dev-dependencies]
wyrd-queue = { workspace = true }
wyrd-runtime = { workspace = true }
wyrd-testing = { workspace = true }
wyrd-client = { workspace = true }
arrow-schema = { workspace = true }
async-trait = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "bifrost_throughput"
path = "benches/bifrost_throughput.rs"
harness = false
required-features = ["bench-bin"]
