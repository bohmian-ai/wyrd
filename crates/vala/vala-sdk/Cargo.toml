[package]
name = "vala-sdk"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false
description = "Vala client SDK: Bifrost ingest sink, pooled producers, and fire-and-forget observe surface."

[lib]
path = "src/lib.rs"

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
wyrd-queue = { workspace = true }
wyrd-client = { workspace = true }
wyrd-tonic = { workspace = true, features = ["client"] }
wyrd-spec = { workspace = true }
wyrd-runtime = { workspace = true }
arrow-schema = { workspace = true }
async-trait = { workspace = true }
secrecy = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tokio-stream = "0.1"
uuid = { workspace = true, features = ["v7"] }

pyo3 = { workspace = true, optional = true }

[dev-dependencies]
arrow = { workspace = true }
reqwest = { workspace = true }
sqlx = { workspace = true, features = ["postgres"] }
vala-bifrost = { workspace = true }
wyrd-queue = { workspace = true }
wyrd-runtime = { workspace = true }
wyrd-testing = { workspace = true }
wyrd-client = { workspace = true }
arrow-schema = { workspace = true }
async-trait = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
