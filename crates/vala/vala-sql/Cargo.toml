[package]
name = "vala-sql"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false
description = "Server-tier SQL migrations for Vala observability storage."

[lib]
path = "src/lib.rs"

[features]
diagnostics = []
testing = ["dep:tokio", "wyrd-sql/testing"]

[dependencies]
sha2 = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, optional = true, features = ["sync", "macros", "rt-multi-thread"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
wyrd-spec = { workspace = true }
wyrd-sql = { path = "../../wyrd/wyrd-sql", version = "0.0.1" }

[dev-dependencies]
secrecy = { workspace = true }
# Self-reference activates `testing` feature for integration tests in `tests/`
# (cfg(test) does not apply to the lib when building integration test binaries).
vala-sql = { path = ".", features = ["testing"] }
wyrd-sql = { workspace = true, features = ["testing"] }
