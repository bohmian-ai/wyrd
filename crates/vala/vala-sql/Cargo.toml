[package]
name = "vala-sql"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false
description = "Server-tier SQL migrations for Vala observability storage."

[lib]
path = "src/lib.rs"

[dependencies]
sha2 = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
metrics = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
wyrd-runtime = { workspace = true }
wyrd-spec = { workspace = true }
wyrd-sql = { path = "../../wyrd/wyrd-sql", version = "0.0.1" }

[dev-dependencies]
workspace-hack.workspace = true
secrecy = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wyrd-semver = { workspace = true }
wyrd-sql = { workspace = true }
wyrd-dev-fixtures = { workspace = true, features = ["pg"] }

[lints]
workspace = true
