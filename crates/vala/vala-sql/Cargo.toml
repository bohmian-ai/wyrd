[package]
name = "vala-sql"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false
description = "Server-tier SQL migrations for Vala observability storage."

[lib]
path = "src/lib.rs"

[features]
diagnostics = []
testing = ["wyrd-sql/testing"]

[dependencies]
sqlx = { workspace = true }
tracing = { workspace = true }
wyrd-sql = { path = "../../wyrd/wyrd-sql", version = "0.0.1" }

# The `testing` module is gated on `any(test, feature = "testing")`, so it
# compiles under `cargo test -p vala-sql` even when the `testing` feature is
# off. Its body calls `wyrd_sql::testing`, which only exists when wyrd-sql is
# built with its `testing` feature. Enable it here so the crate's own test
# build is self-sufficient (the `testing` feature still chains it for external
# consumers like vala-bifrost).
[dev-dependencies]
wyrd-sql = { workspace = true, features = ["testing"] }
