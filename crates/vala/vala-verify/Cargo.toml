[package]
name = "vala-verify"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
description = "The Verifier engine: building-block steps, requirement checks, operator runtime, and the decide rule over the wyrd-spec verification contract."

[lib]
path = "src/lib.rs"

[dependencies]
arrow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
jsonpath-rust = { workspace = true }
jsonschema = { workspace = true }
metrics = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
skald-agent = { workspace = true }
skald-prompt = { workspace = true }
skald-providers = { workspace = true }
skald-runtime = { workspace = true }
skald-spec = { workspace = true }
skald-tool = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt-multi-thread", "macros"] }
tracing = { workspace = true }
uuid = { workspace = true }
vala-drift = { workspace = true }
wyrd-spec = { workspace = true }

[dev-dependencies]
metrics-exporter-prometheus = { workspace = true }
workspace-hack.workspace = true
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
