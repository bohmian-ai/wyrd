[package]
name = "wyrd-spec"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
description = "Wyrd foundation types: Card envelope, SpecKinds, and pure data contracts."

[lib]
path = "src/lib.rs"

[features]
default = []
server = ["dep:utoipa"]
test-utils = []
wasm = []

[dependencies]
chrono = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
schemars = { workspace = true }
semver = { workspace = true }
skald-spec = { workspace = true, features = ["schemars"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }
sha2 = { workspace = true }
wyrd-error-derive = { path = "../shared/wyrd-error-derive", version = "0.0.1" }

[dev-dependencies]
proptest = { workspace = true }
[[example]]
name = "gen_schemas"
path = "examples/gen_schemas.rs"
