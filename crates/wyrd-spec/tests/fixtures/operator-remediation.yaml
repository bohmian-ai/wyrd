# Operator Card - server-owned notification template.

apiVersion: wyrd/v1
kind: Operator
metadata:
  space: retention
  name: churn-retrain-on-drift
  version: 1.0.0

spec:
  kind: notify
  channel:
    kind: slack
    connection: ops-slack
    channel_id: C0123456789
    text: "Churn drift exceeded its configured threshold."

  budget:
    max_wall_seconds: 600
    max_tool_calls: 20
