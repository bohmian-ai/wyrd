# Verifier Card - PSI drift of one samples slot over a version-pinned baseline Data Card.

apiVersion: wyrd/v1
kind: Verifier
metadata:
  name: churn-input-drift
  version: 1.0.0

spec:
  description: Churn model input distribution drift.
  inputs:
    current:
      type: samples
      features: [tenure_months, monthly_spend]
  requirements:
    - id: inputs-stable
      statement: Churn model inputs keep their training distribution.
      check:
        kind: drift
        on: inputs.current
        method: Psi
        signal:
          kind: Distribution
          baseline_ref:
            kind: Data
            name: churn-training
            version: 1.0.0
          features: [tenure_months, monthly_spend]
        condition:
          kind: Statistical
        profile:
          kind: Psi
          binning_strategy:
            kind: Quantile
            n_bins: 10
          threshold:
            kind: Fixed
            value: 0.25
