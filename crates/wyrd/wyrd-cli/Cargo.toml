[package]
name = "wyrd-cli"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false
autotests = false
description = "Wyrd command-line interface."

[lib]
name = "wyrd_cli"
path = "src/lib.rs"

[[bin]]
name = "wyrd"
path = "src/main.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[dependencies]
arrow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
ed25519-dalek = { workspace = true, features = ["pem"] }
indicatif = { workspace = true }
reqwest = { workspace = true }
# Stdio MCP server for the host-facing `wyrd mcp proxy`, bridged to Wyrd's
# `/mcp` through the Streamable HTTP client `wyrd-mcp` authenticates.
rmcp = { workspace = true, features = [
    "client",
    "server",
    "transport-io",
    "transport-streamable-http-client-reqwest",
] }
secrecy = { workspace = true }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
shellexpand = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
vala-eval = { workspace = true }
webbrowser = { workspace = true }
wyrd-client = { workspace = true, features = ["internal"] }
wyrd-error-derive = { workspace = true }

wyrd-loader = { workspace = true }
wyrd-mcp = { workspace = true }
wyrd-runtime = { workspace = true }
wyrd-semver = { workspace = true }
wyrd-spec = { workspace = true }
wyrd-tls = { workspace = true }

[dev-dependencies]
workspace-hack.workspace = true
assert_cmd = "2"
axum = { workspace = true }
base64 = { workspace = true }
predicates = "3"
sqlx = { workspace = true }
tokio = { workspace = true, features = ["process"] }
tokio-util = { workspace = true }
uuid = { workspace = true }
wiremock = { workspace = true }
wyrd-server = { workspace = true }
wyrd-storage = { workspace = true }
wyrd-dev-fixtures = { workspace = true, features = ["pg"] }
wyrd-testing = { workspace = true }

[lints]
workspace = true
