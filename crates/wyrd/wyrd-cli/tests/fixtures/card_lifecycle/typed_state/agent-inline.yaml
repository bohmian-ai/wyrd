apiVersion: wyrd/v1
kind: Agent
metadata:
  name: inline
  version: 1.0.0
spec:
  prompt:
    provider: google
    model: gpt-4o
    format: generate_content
    body:
      contents:
      - role: user
        parts:
        - text: Inline triage
  execution_route:
    kind: native
  run_config:
    max_iterations: 2
    timeout_ms: 1000
