apiVersion: wyrd/v1
kind: Agent
metadata:
  name: triage
  version: 1.0.0
  space: default
spec:
  prompt:
    kind: Prompt
    name: triage-prompt
    version: 1.0.0
    space: default
  run_config:
    max_iterations: 2
    timeout_ms: 1000
  publishes_to:
    - kind: Eval
      name: quality
      version: 1.0.0
      space: default
