apiVersion: wyrd/v1
kind: Verifier
metadata:
  name: model-drift
  version: 1.0.0
  space: default
spec:
  description: fixture drift
  inputs:
    current:
      type: samples
      features: [feature]
  requirements:
    - id: feature-stable
      statement: The feature keeps its training distribution.
      check:
        kind: drift
        on: inputs.current
        method: Psi
        signal:
          kind: Distribution
          baseline_ref:
            kind: Data
            name: training
            version: 1.0.0
            space: default
          features: [feature]
        condition:
          kind: Statistical
        profile:
          kind: Psi
          binning_strategy:
            kind: Quantile
            n_bins: 10
          threshold:
            kind: Fixed
            value: 0.2
