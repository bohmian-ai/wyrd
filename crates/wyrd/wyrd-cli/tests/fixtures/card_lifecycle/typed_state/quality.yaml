apiVersion: wyrd/v1
kind: Verifier
metadata:
  name: quality
  version: 1.0.0
  space: default
spec:
  inputs:
    answer:
      type: json
  requirements:
    - id: answered
      statement: The agent produced an answer.
      check:
        kind: assert
        path: inputs.answer
        operator: is_not_null
