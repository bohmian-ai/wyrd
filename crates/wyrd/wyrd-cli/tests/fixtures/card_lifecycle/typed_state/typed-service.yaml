apiVersion: wyrd/v1
kind: Service
metadata:
  name: typed-service
  version: 1.0.0
  space: default
spec:
  service_type: agent
  components:
    - alias: model_primary
      ref:
        kind: Model
        name: primary
        version: 1.0.0
        space: default
      verified_by:
        - verifier: ./model-drift.yaml
          runs_on:
            kind: schedule
            cron: "0 * * * *"
    - alias: model_shadow
      ref:
        kind: Model
        name: shadow
        version: 1.0.0
        space: default
    - alias: agent_triage
      ref: ./agent-triage.yaml
      verified_by:
        - verifier: ./quality.yaml
          runs_on:
            kind: observations_ready
    - alias: agent_inline
      ref: ./agent-inline.yaml
    - alias: triage_prompt
      ref: ./triage-prompt.yaml
    - alias: shared_prompt
      ref: ./triage-prompt.yaml
    - alias: runtime_workflow
      ref: ./runtime.yaml
