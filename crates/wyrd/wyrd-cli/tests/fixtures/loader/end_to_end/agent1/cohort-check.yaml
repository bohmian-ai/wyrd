apiVersion: wyrd/v1
kind: Verifier
metadata:
  name: cohort-check
  version: "1.0.0"
spec:
  # One requirement over one input. Bound without `runs_on`, it runs only
  # when a caller invokes it explicitly.
  inputs:
    cohort:
      type: json
  requirements:
    - id: cohort-valid
      statement: The cohort is a supported campaign cohort.
      check:
        kind: assert
        path: inputs.cohort
        operator: in
        expected: [loyal_win_back, price_sensitive, service_frustrated, unreachable]
