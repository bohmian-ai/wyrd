apiVersion: wyrd/v1
kind: Eval
metadata:
  space: wyrd-team
  name: churn-triage-eval
  version: "1.0.0"
spec:
  # NO subject_ref. Publishers bind at observation time; Triggers narrow with
  # `subject_filter`. Multiple agents share this Eval without reversioning it.

  pass_gate:
    kind: all_pass

  tasks:
    lookup_called:
      kind: assertion
      id: lookup_called
      context_path: $.tool_call_names
      operator: contains
      expected: customer_lookup

    cohort_valid:
      kind: assertion
      id: cohort_valid
      context_path: $.cohort
      operator: in
      expected: [loyal_win_back, price_sensitive, service_frustrated, unreachable]
      depends_on: [lookup_called]

    runbook_grounded:
      kind: llm_judge
      id: runbook_grounded
      # The Eval composes a constrained Agent judge, which resolves its Prompt.
      judge_ref:
        prompt: ./judge-prompt.yaml
        tool_names: []
        run_config:
          max_iterations: 1
      context_path: $.score
      operator: equals
      expected: { passed: true }
      depends_on: [cohort_valid]
      max_retries: 3
