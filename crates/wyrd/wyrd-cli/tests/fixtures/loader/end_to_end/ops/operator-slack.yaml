apiVersion: wyrd/v1
kind: Operator
metadata:
  space: wyrd-team
  name: slack-ops-alerts
  version: "1.0.0"
spec:
  # Operator is a pure side-effect template. Every verification binding that
  # wants this reaction lists it under `on_failure`; one Operator card serves
  # N bindings across the whole org.
  kind: notify
  channel:
    kind: slack
    text: |
      [{{ severity }}] {{ trigger.name }} fired on {{ subject.name }}@{{ subject.version }}
      → {{ observation.summary }}
