apiVersion: wyrd/v1
kind: Operator
metadata:
  space: wyrd-team
  name: slack-ops-alerts
  version: "1.0.0"
spec:
  # Operator is a pure side-effect template. Every verification binding that
  # wants this reaction lists it under `on_failure`; one Operator card serves
  # N bindings across the whole org.
  kind: notify
  channel:
    kind: slack
    # Names the tenant's `slack` connection; registration refuses the Card
    # unless an active connection with this name exists.
    connection: ops-slack
    channel_id: C0123456789
    text: "[{{verdict}}] {{verifier_ref}} failed on {{subject_ref}}: {{summary}}"
