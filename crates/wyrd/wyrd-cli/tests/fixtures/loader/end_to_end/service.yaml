apiVersion: wyrd/v1
kind: Service
metadata:
  name: churn-response-service
  version: "1.0.0"
  labels:
    team: churn-ml
spec:
  description: |
    Score churn risk on incoming customer events, triage the high-risk cohort,
    and execute the matched retention runbook.
  service_type: api

  # Service-level binding: the whole deployment is verified by an org-wide
  # Verifier that was registered on its own, so every leg is an exact `ref:`.
  # `on_failure` carries one inline Operator body, owned by this binding.
  verified_by:
    - verifier:
        kind: Verifier
        name: retention-guardrail
        version: "1.0.0"
      # Explicit-only: callers verify or submit evidence for it directly.
      on_failure:
        - kind: notify
          channel:
            kind: slack
            connection: ops-slack
            channel_id: C0123456789
            text: retention guardrail failed for the churn response service
    # Explicit-only: no `runs_on`, so a caller invokes this task Verifier directly.
    - verifier: agent1/cohort-check.yaml

  # Every component uses the unified ref variant: `path` (sibling submission)
  # or `ref` (external, identity by kind+name+exact version). Inline is
  # not legal at component positions.
  components:
    - alias: model
      # `ref:` — external card with an exact identity pin.
      ref:
        kind: Model
        name: churn-classifier
        version: "1.4.2"
      # Monitoring is deployment-specific, so the Service binds this reusable
      # model to the sibling Drift Verifier on a referenced schedule Trigger.
      verified_by:
        - verifier: ./model/drift.yaml
          runs_on: ./ops/trigger-drift-schedule.yaml
          on_failure:
            - ./ops/operator-slack.yaml

    - alias: agent1
      # `path:` — sibling submission in this composite; loader binds to its
      # resolved identity at wire assembly.
      ref: agent1/agent.yaml
      verified_by:
        - verifier: agent1/verifier.yaml
          on_failure:
            - ./ops/operator-slack.yaml
        - verifier: agent1/cohort-check.yaml

    - alias: agent2
      ref: agent2/agent.yaml
      verified_by:
        - verifier: agent1/verifier.yaml
