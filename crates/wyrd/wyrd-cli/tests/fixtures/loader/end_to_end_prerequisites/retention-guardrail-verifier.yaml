apiVersion: wyrd/v1
kind: Verifier
metadata:
  space: wyrd-team
  name: retention-guardrail
  version: "1.0.0"
spec:
  description: |
    Org-wide guardrail registered on its own. Subjects in other bundles bind it
    by exact `ref:`, which is why it is a prerequisite rather than a sibling.
  inputs:
    response_text:
      type: json
  requirements:
    - id: no-refund-promise
      statement: The response never promises a guaranteed refund.
      check:
        kind: assert
        path: inputs.response_text
        operator: not_contains
        expected: guaranteed refund
