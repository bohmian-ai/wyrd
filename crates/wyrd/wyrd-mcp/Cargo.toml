[package]
name = "wyrd-mcp"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
autotests = false

[[bin]]
name = "wyrd-mcp"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

# Single owner for MCP journeys. `autotests = false` is required alongside it:
# with auto-discovery on, `bifrost_rbac.rs` would become a target of its own in
# addition to being a `#[path]` module of `mcp`, compiling that source into two
# binaries. A new MCP journey is registered by adding a `#[path]` line in
# `tests/mcp.rs`, not a `mise.toml` line.
[[test]]
name = "mcp"
path = "tests/mcp.rs"

[dependencies]
arrow = { workspace = true }
vala-sdk = { workspace = true }
wyrd-client = { workspace = true }
wyrd-spec = { workspace = true }
wyrd-runtime = { workspace = true }
skald-tool = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
wyrd-testing = { workspace = true }
wyrd-client = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
secrecy = { workspace = true }
