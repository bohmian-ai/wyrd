[package]
name = "wyrd-server"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }

[features]
enterprise = ["dep:wyrd-enterprise"]

[[bin]]
name = "wyrd-server"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }
secrecy = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
vala-sql = { path = "../../vala/vala-sql", version = "0.0.1" }
wyrd-sql = { path = "../wyrd-sql", version = "0.0.1" }
wyrd-enterprise = { path = "../wyrd-enterprise", version = "0.0.1", optional = true }
