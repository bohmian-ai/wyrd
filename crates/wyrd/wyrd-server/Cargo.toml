[package]
name = "wyrd-server"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }

[features]
cloud = ["wyrd-storage/cloud"]
storage-emulator = ["cloud", "wyrd-storage/emulator"]
test-support = ["dep:iceberg", "vala-bifrost-redux/test-support", "wyrd-telemetry/test-support"]

[[bin]]
name = "wyrd-server"
path = "src/main.rs"

[dependencies]
async-stream = { workspace = true }
futures-util = { workspace = true }
arc-swap = { workspace = true }
arrow = { workspace = true }
async-trait = { workspace = true }
crc32c = { workspace = true }
opendal = { workspace = true }
datafusion = { workspace = true }
iceberg = { workspace = true, optional = true }
hex = { workspace = true }
clap = { workspace = true }
wyrd-tonic = { workspace = true, features = ["server"] }
shellexpand = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["signal", "net"] }
tokio-util = { workspace = true }
url = { workspace = true }
axum = { workspace = true }
vala-eval = { workspace = true }
wyrd-telemetry = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
base64 = { workspace = true }
chrono = { workspace = true }
jsonwebtoken = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
moka = { version = "0.12", features = ["future"] }
rand = { workspace = true }
rustix = { workspace = true }
secrecy = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
vala-sql = { path = "../../vala/vala-sql", version = "0.0.1" }
vala-bifrost-redux = { workspace = true }
wyrd-runtime = { workspace = true }
wyrd-auth-issue = { workspace = true }
wyrd-auth-oidc = { workspace = true }
wyrd-auth-verify = { workspace = true }
wyrd-auth-check = { workspace = true }
wyrd-auth = { workspace = true }
wyrd-crypt = { path = "../../shared/wyrd-crypt", version = "0.0.1" }
wyrd-sql = { path = "../wyrd-sql", version = "0.0.1", features = ["embedded-postgres"] }
tower = { workspace = true, features = ["util", "timeout", "limit", "load-shed"] }
tower-http = { workspace = true, features = ["trace", "catch-panic"] }
tower_governor = { workspace = true }
http-body-util = "0.1"
wyrd-spec = { workspace = true, features = ["server"] }
wyrd-semver = { workspace = true }
wyrd-client = { path = "../../shared/wyrd-client", version = "0.0.1" }
wyrd-storage = { workspace = true }
wyrd-tls = { workspace = true }
ed25519-dalek = { workspace = true }
utoipa = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
reqwest = { workspace = true }
wyrd-storage = { workspace = true }
temp-env = { workspace = true }
tempfile = { workspace = true }
tokio-stream = "0.1"
tower = { workspace = true, features = ["util"] }
wiremock = { workspace = true }
wyrd-dev-fixtures = { path = "../../shared/wyrd-dev-fixtures", version = "0.0.1", features = ["pg"] }
wyrd-auth-check = { workspace = true, features = ["test-helpers"] }
wyrd-testing = { path = "../wyrd-testing", version = "0.0.1" }
wyrd-tonic = { workspace = true, features = ["client"] }
wyrd-cli = { path = "../wyrd-cli", version = "0.0.1" }
wyrd-sql = { path = "../wyrd-sql", version = "0.0.1" }
vala-sql = { path = "../../vala/vala-sql", version = "0.0.1" }

[[test]]
name = "pg_grpc_smoke"

[[test]]
name = "pg_grpc_ingest_smoke"

[[test]]
name = "pg_authz_check_route"

[[test]]
name = "pg_router_smoke"

[[test]]
name = "pg_merge_http_protected"

[[test]]
name = "pg_bootstrap_key"

[[test]]
name = "pg_eval_v1_protocol"

[[test]]
name = "storage_e2e"
required-features = ["storage-emulator"]
