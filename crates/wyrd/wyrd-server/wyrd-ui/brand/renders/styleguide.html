<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wyrd — Evidence Thread</title>
<link rel="icon" href="../app-icon.svg">
<!-- Local fonts from the workbench install (`pnpm install`); no font service is contacted. -->
<link rel="stylesheet" href="../../node_modules/@fontsource/familjen-grotesk/400.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/familjen-grotesk/600.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/familjen-grotesk/700.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/fragment-mono/400.css">
<link rel="stylesheet" href="../theme.css">
<style>
  /* Layout only. Every colour resolves from ../theme.css; this page restates no hex. */
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); }
  .modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 620px), 1fr)); }
  .mode { background: var(--bg); color: var(--text); padding: 28px 16px 48px; min-width: 0; }
  @media (min-width: 720px) { .mode { padding: 32px 32px 56px; } }
  h1 { font-size: 30px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 13px; font-weight: 700; margin: 32px 0 10px; }
  p, li { font-size: 14px; line-height: 1.6; }
  .meta, code, .mono { font-family: var(--font-mono); font-size: 12px; }
  .meta { color: var(--muted); }
  .head { display: flex; align-items: center; gap: 14px; }
  .head img { width: 40px; height: 40px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .sw { border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); overflow: hidden; }
  .sw i { display: block; height: 36px; border-bottom: 1px solid var(--border-soft); }
  .sw div { padding: 6px 8px; }
  .sw b { display: block; font-size: 12px; }

  .btn { font: 600 14px var(--font-sans); min-height: 40px; padding: 0 16px; border-radius: var(--r); border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
  .btn:hover { background: var(--surface-hover); }
  .btn:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--declare); outline-offset: 2px; }
  .btn.primary { background: var(--declare); border-color: var(--declare); color: var(--declare-ink); }
  .btn.secondary { background: var(--surface-2); }
  .btn:disabled { color: var(--muted); background: var(--surface-2); cursor: not-allowed; }
  a { color: var(--declare); }
  label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; }
  input { font: 14px var(--font-sans); min-height: 40px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); color: var(--text); }

  .badge { display: inline-flex; gap: 5px; align-items: center; font: 12px var(--font-mono); padding: 2px 8px; border-radius: var(--r); border: 1px solid currentColor; }
  .badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); } .badge.danger { color: var(--danger); background: var(--danger-soft); }
  .badge.neutral { color: var(--muted); border-color: var(--border); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font: 12px var(--font-mono); color: var(--muted); border-bottom: 1px solid var(--border); padding: 8px 10px; font-weight: 400; }
  td { border-bottom: 1px solid var(--border-soft); padding: 0 10px; height: 52px; }
  tr:last-child td { border-bottom: 0; }
  tr.sel td { background: var(--declare-soft); } tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--declare); }
  .scroll { overflow-x: auto; }

  pre { margin: 0; background: var(--code-bg); color: var(--code-text); border-radius: var(--r); padding: 14px 16px; overflow-x: auto; font: 13px/1.6 var(--font-mono); }
  .code { position: relative; }
  .copied { position: absolute; top: 8px; right: 8px; font: 12px var(--font-mono); background: var(--evidence); color: var(--evidence-ink); border-radius: var(--r); padding: 2px 8px; }

  .state { border: 1px dashed var(--border); border-radius: var(--r); padding: 14px 16px; background: var(--surface); }
  .state b { display: block; font-size: 14px; }
  .state.failure { border-style: solid; border-color: var(--danger); background: var(--danger-soft); }

  /* Evidence thread: drawn only between real Declaration → Evidence records. */
  .thread { display: grid; gap: 0; }
  .step { display: grid; grid-template-columns: 18px 1fr; gap: 10px; }
  .step .node { position: relative; }
  .step .node::before { content: ''; position: absolute; left: 8px; top: 0; bottom: 0; width: 1px; background: var(--border); }
  .step:first-child .node::before { top: 18px; } .step:last-child .node::before { bottom: calc(100% - 18px); }
  .step .node i { position: absolute; left: 3px; top: 12px; width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--text); background: var(--surface); }
  .step.declare .node i { background: var(--declare); border-color: var(--declare); }
  .step.observe .node i { background: var(--observe); border-color: var(--observe); }
  .step.judgment .node i { background: var(--danger); border-color: var(--danger); }
  .step.evidence .node i { background: var(--evidence); border-color: var(--evidence-ink); }
  .step .body { padding: 8px 0 12px; }
  .step .kind { font: 12px var(--font-mono); color: var(--muted); }
  .kind .tag { color: var(--declare); } .observe .kind .tag { color: var(--observe); } .judgment .kind .tag { color: var(--danger); }
</style>
</head>
<body>
<div class="modes">
  <template id="sheet">
    <header class="head">
      <img data-mark src="../logo-light.svg" alt="">
      <div><h1>Wyrd</h1><div class="meta">Evidence Thread · <span data-mode-name></span></div></div>
    </header>
    <p>Declare → Observe → Verify. One token source, two complete modes, flat ruled geometry.</p>

    <h2>Semantic roles</h2>
    <div class="swatches" data-swatches></div>

    <h2>Type</h2>
    <div class="panel">
      <div style="font-size:30px;font-weight:700">Verify the exact version</div>
      <p style="margin:6px 0">Familjen Grotesk carries interface, navigation, headings, and reading.</p>
      <div class="mono">Fragment Mono · card_model_02 · v11 · 2026-09-24T15:20:18Z · 4.21s</div>
    </div>

    <h2>Actions and inputs</h2>
    <div class="panel row">
      <button class="btn primary">Run verification</button>
      <button class="btn secondary">Compare</button>
      <button class="btn">Cancel</button>
      <button class="btn" disabled>Disabled</button>
      <a href="#">Open Card</a>
    </div>
    <div class="panel" style="margin-top:8px"><label>Card name<input value="ranker"></label></div>

    <h2>Status — glyph and word, never colour alone</h2>
    <div class="panel row">
      <span class="badge ok">✓ passed</span><span class="badge warn">! drifting</span>
      <span class="badge danger">✕ failed</span><span class="badge neutral">● running</span>
    </div>

    <h2>Table</h2>
    <div class="panel scroll" tabindex="0" role="region" aria-label="Verifiers">
      <table>
        <thead><tr><th>Verifier</th><th>Version</th><th>Judgment</th></tr></thead>
        <tbody>
          <tr><td>latency-p95</td><td class="mono">v3</td><td><span class="badge ok">✓ passed</span></td></tr>
          <tr class="sel"><td>groundedness</td><td class="mono">v7</td><td><span class="badge danger">✕ failed</span></td></tr>
        </tbody>
      </table>
    </div>

    <h2>Code — copy confirms capture</h2>
    <div class="code"><pre>wyrd cards verify ranker --version v11</pre><span class="copied">✓ copied</span></div>

    <h2>States</h2>
    <div class="row" style="align-items:stretch">
      <div class="state" style="flex:1"><b>empty</b><span class="meta">No Observations in this range.</span></div>
      <div class="state" style="flex:1" role="status" aria-busy="true"><b>loading</b><span class="meta">Loading Cards</span></div>
      <div class="state" style="flex:1"><b>unauthorized</b><span class="meta">WYRD-AUTHZ-FORBIDDEN</span></div>
      <div class="state failure" style="flex:1"><b>✕ error</b><span class="meta">WYRD-STORAGE-UNAVAILABLE</span></div>
    </div>

    <h2>Evidence thread — a failed verification</h2>
    <div class="panel thread">
      <div class="step declare"><div class="node"><i></i></div><div class="body"><div class="kind"><span class="tag">Declaration</span> · Agent support-bot v4</div>groundedness ≥ 0.80</div></div>
      <div class="step observe"><div class="node"><i></i></div><div class="body"><div class="kind"><span class="tag">Observation</span> · run_7f21</div>0.74 over 1,200 turns</div></div>
      <div class="step"><div class="node"><i></i></div><div class="body"><div class="kind">Verifier · groundedness v7</div>threshold judged by the server</div></div>
      <div class="step judgment"><div class="node"><i></i></div><div class="body"><div class="kind"><span class="tag">Judgment</span></div><span class="badge danger">✕ failed</span></div></div>
      <div class="step evidence"><div class="node"><i></i></div><div class="body"><div class="kind">Retained Evidence</div><span class="mono">evd_3c09 · retained 2026-09-24</span></div></div>
    </div>
  </template>
  <section class="mode" data-mode="light"></section>
  <section class="mode" data-mode="dark"></section>
</div>
<script>
  // Token names only — values are read back from ../theme.css so the page never drifts.
  const roles = [
    ['--bg', 'Canvas'], ['--surface', 'Surface'], ['--surface-2', 'Surface secondary'],
    ['--surface-hover', 'Surface hover'], ['--text', 'Ink'], ['--muted', 'Muted ink'],
    ['--border', 'Rule'], ['--border-soft', 'Rule soft'], ['--declare', 'Declare / primary'],
    ['--declare-soft', 'Declare soft'], ['--observe', 'Observe'], ['--observe-soft', 'Observe soft'],
    ['--evidence', 'Retained Evidence'], ['--ok', 'Success'], ['--warn', 'Warning'],
    ['--danger', 'Failure'], ['--danger-soft', 'Failure soft'], ['--code-bg', 'Code surface'],
    ['--code-text', 'Code ink']
  ];
  const sheet = document.getElementById('sheet');
  for (const section of document.querySelectorAll('.mode')) {
    const mode = section.dataset.mode;
    section.append(sheet.content.cloneNode(true));
    section.querySelector('[data-mark]').src = mode === 'light' ? '../logo-light.svg' : '../logo.svg';
    section.querySelector('[data-mode-name]').textContent = mode;
    const styles = getComputedStyle(section);
    section.querySelector('[data-swatches]').innerHTML = roles
      .map(([token, role]) => `<div class="sw"><i style="background:var(${token})"></i><div><b>${role}</b><code>${token}</code><div class="meta">${styles.getPropertyValue(token).trim()}</div></div></div>`)
      .join('');
  }
</script>
</body>
</html>
