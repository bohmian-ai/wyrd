[package]
name = "wyrd-sql"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }

[features]
# Exposes `WyrdPostgres::from_pools`, the lazy-pool seam for DB-free tests.
test-support = []

[dependencies]
blake3 = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
croner = { workspace = true }
regex = { workspace = true }
metrics = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
wyrd-runtime = { workspace = true }
wyrd-semver = { workspace = true }
wyrd-spec = { workspace = true }
wyrd-tls = { workspace = true }

[dev-dependencies]
workspace-hack.workspace = true
paste = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "uuid", "json"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
url = { workspace = true }
wyrd-dev-fixtures = { workspace = true, features = ["pg"] }

[lints]
workspace = true
