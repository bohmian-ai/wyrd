[package]
name = "wyrd-sql"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }

[features]
embedded-postgres = ["dep:pg-embed", "dep:rand", "dep:urlencoding"]

[dependencies]
chrono = { workspace = true }
regex = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
wyrd-runtime = { workspace = true }
wyrd-semver = { workspace = true }
wyrd-spec = { workspace = true }
wyrd-tls = { workspace = true }

[dependencies.pg-embed]
workspace = true
optional = true

[dependencies.rand]
workspace = true
optional = true

[dependencies.urlencoding]
workspace = true
optional = true

[dev-dependencies]
paste = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "uuid", "json"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
url = { workspace = true }
wyrd-dev-fixtures = { workspace = true, features = ["pg"] }

[[test]]
name = "pg_cards"

[[test]]
name = "pg_migration"

[[test]]
name = "pg_query_compile"
