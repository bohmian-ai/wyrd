[package]
name = "wyrd-storage"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
description = "Server-tier storage handles and backend signers for Wyrd artifacts."

[lib]
path = "src/lib.rs"

[features]
cloud = [
    "dep:aws-sdk-s3",
    "dep:aws-config",
    "dep:gcloud-storage",
    "dep:gcloud-auth",
    "dep:azure_core",
    "dep:azure_identity",
    "dep:azure_storage",
    "dep:azure_storage_blobs",
]
emulator = ["cloud"]

[dependencies]
wyrd-sql = { path = "../wyrd-sql", version = "0.0.1" }
wyrd-spec = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true, features = ["std", "v7"] }
url = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }
tempfile = { workspace = true }
opendal = { workspace = true }
aws-sdk-s3 = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
gcloud-storage = { workspace = true, optional = true }
gcloud-auth = { workspace = true, optional = true }
azure_core = { workspace = true, optional = true }
azure_identity = { workspace = true, optional = true }
azure_storage = { workspace = true, optional = true }
azure_storage_blobs = { workspace = true, optional = true }

[dev-dependencies]
temp-env = { workspace = true, features = ["async_closure"] }
wyrd-dev-fixtures = { path = "../../shared/wyrd-dev-fixtures", version = "0.0.1", features = ["pg"] }
wyrd-testing = { path = "../wyrd-testing", version = "0.0.1" }

[[test]]
name = "backend_contracts"
required-features = ["cloud"]

[[test]]
name = "integration_rustfs"
required-features = ["emulator"]

[[test]]
name = "integration_gcs"
required-features = ["emulator"]

[[test]]
name = "integration_azurite"
required-features = ["emulator"]

[[test]]
name = "handle_crud"
required-features = ["emulator"]

[lints]
workspace = true
