[package]
name = "wyrd-storage"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
description = "Server-tier storage handles and backend signers for Wyrd artifacts."

[lib]
path = "src/lib.rs"

[features]
emulator = []

[dependencies]
wyrd-sql = { path = "../wyrd-sql", version = "0.0.1" }
wyrd-spec = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true, features = ["std", "v7"] }
url = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }
secrecy = { workspace = true }
object_store = { workspace = true }
opendal = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-config = { workspace = true }
aws-types = { workspace = true }
gcloud-storage = { workspace = true }
gcloud-auth = { workspace = true }
azure_core = { workspace = true }
azure_identity = { workspace = true }
azure_storage = { workspace = true }
azure_storage_blobs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
temp-env = { workspace = true, features = ["async_closure"] }
wyrd-dev-fixtures = { path = "../../shared/wyrd-dev-fixtures", version = "0.0.1", features = ["pg"] }
wyrd-testing = { path = "../wyrd-testing", version = "0.0.1" }

[[test]]
name = "integration_gcs"
required-features = ["emulator"]

[[test]]
name = "integration_azurite"
required-features = ["emulator"]

[[test]]
name = "handle_crud"
required-features = ["emulator"]

[lints]
workspace = true
