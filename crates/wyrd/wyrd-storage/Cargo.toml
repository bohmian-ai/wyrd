[package]
name = "wyrd-storage"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
description = "Server-tier storage handles and backend signers for Wyrd artifacts."

[lib]
path = "src/lib.rs"

[features]
cloud = ["object_store/aws", "object_store/gcp", "object_store/azure"]
emulator = ["cloud"]

[dependencies]
wyrd-sql = { workspace = true }
vala-sql = { workspace = true }
wyrd-spec = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
time = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true, features = ["std", "v7"] }
url = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }
tempfile = { workspace = true }
bytes = { workspace = true }
object_store = { workspace = true }
futures-util = { workspace = true }
wyrd-tls = { workspace = true }

[dev-dependencies]
workspace-hack.workspace = true
temp-env = { workspace = true, features = ["async_closure"] }
wyrd-dev-fixtures = { workspace = true, features = ["pg"] }
wyrd-testing = { workspace = true }

[lints]
workspace = true
