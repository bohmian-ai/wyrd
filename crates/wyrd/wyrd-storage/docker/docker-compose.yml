services:
  # Image pins audited 2026-06-15. To add SHA256 digests after initial pull:
  #   docker inspect --format='{{index .RepoDigests 0}}' <image>:<tag>
  # then append @sha256:<digest> to each image line.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: wyrd-storage-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: wyrd-test-key
      MINIO_ROOT_PASSWORD: wyrd-test-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-setup:
    image: minio/mc:RELEASE.2025-04-16T18-16-33Z
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "/setup/setup-buckets.sh"]
    volumes:
      - ./setup-buckets.sh:/setup/setup-buckets.sh:ro

  fake-gcs-server:
    image: fsouza/fake-gcs-server:1.50.2
    container_name: wyrd-storage-gcs
    command:
      - "-scheme"
      - "http"
      - "-port"
      - "4443"
      - "-data"
      - "/data"
      - "-public-host"
      - "localhost:4443"
    ports:
      - "4443:4443"
    volumes:
      - gcs-data:/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.34.0
    container_name: wyrd-storage-azurite
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000"]
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data

volumes:
  minio-data:
  gcs-data:
  azurite-data:
