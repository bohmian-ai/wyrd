[package]
name = "wyrd-testing"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }

[features]
default = []
python = ["dep:pyo3", "dep:wyrd-utils"]

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
arrow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { workspace = true, features = ["pkcs8"] }
futures-util = { workspace = true }
hdrhistogram = { workspace = true }
iceberg = { workspace = true }
http = { workspace = true }
opendal = { workspace = true }
parquet = { workspace = true }
pyo3 = { workspace = true, optional = true }
rand = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["postgres"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }
tokio-stream = "0.1"
tokio-util = { workspace = true }
tower = { workspace = true, features = ["util"] }
wyrd-tonic = { workspace = true, features = ["server", "client"] }
uuid = { workspace = true, features = ["v4", "v7"] }
vala-bifrost = { workspace = true }
vala-bifrost-redux = { workspace = true }
vala-sql = { workspace = true }
wyrd-auth = { workspace = true }
wyrd-auth-check = { workspace = true, features = ["test-helpers"] }
wyrd-auth-issue = { workspace = true }
wyrd-auth-oidc = { workspace = true }
wyrd-auth-verify = { workspace = true }
wyrd-bench = { workspace = true }
wyrd-crypt = { path = "../../shared/wyrd-crypt", version = "0.0.1" }
wyrd-dev-fixtures = { workspace = true, features = ["pg"] }
wyrd-runtime = { workspace = true }
wyrd-semver = { workspace = true }
wyrd-server = { workspace = true }
wyrd-spec = { workspace = true, features = ["test-utils"] }
wyrd-sql = { workspace = true }
wyrd-storage = { workspace = true }
wyrd-utils = { workspace = true, features = ["python"], optional = true }

[[bench]]
name = "bench_real_bifrost_workload"
harness = false
