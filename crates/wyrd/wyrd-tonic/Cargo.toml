[package]
name = "wyrd-tonic"
version = "0.4.0"
edition = "2021"
description = "Wyrd-owned tonic facade with the client-safe tonic surface."
license = { workspace = true }
repository = { workspace = true }

# tonic's default features pull `transport` → `server` → `router` → axum. We take
# only the client-safe surface here so client-tier consumers (wyrd-client) never
# inherit the server stack; the `server` feature below opts back into `tonic/server`.
[dependencies]
tonic = { workspace = true, features = ["channel", "tls-aws-lc", "tls-native-roots"] }
tonic-prost = { workspace = true }
tonic-types = { workspace = true }
prost = { workspace = true }
wyrd-spec = { workspace = true }
wyrd-tls = { workspace = true }
serde_json = { workspace = true }
arc-swap = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tokio-stream = "0.1"
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[dependencies.tonic-health]
workspace = true
optional = true

[dependencies.tonic-reflection]
workspace = true
optional = true

# Inbound W3C trace context for the public listener's request span. Gated
# behind the `server` feature so the client tier never links the process
# telemetry pipeline.
[dependencies.wyrd-telemetry]
workspace = true
optional = true

# OTLP collector proto surface (server-side tonic codegen). Gated behind the
# `server` feature so the client tier stays axum-free.
[dependencies.opentelemetry-proto]
workspace = true
optional = true

[build-dependencies]
tonic-prost-build = { workspace = true }

[features]
default = []
# `tls-connect-info` publishes the accepted peer certificate chain into request
# extensions. The private Bifrost peer listener authenticates a workload
# credential against the certificate that carried it, so the server surface
# needs the connection's verified identity, not only its bytes.
server = ["dep:tonic-reflection", "dep:tonic-health", "tonic/server", "tonic/router", "tonic/tls-connect-info", "dep:opentelemetry-proto", "dep:wyrd-telemetry"]
# Marker feature: opts the generated `wyrd::v1` client stub into codegen (see
# build.rs). No extra tonic surface needed — the client rides the default
# `channel` transport already enabled above.
client = []

[dev-dependencies]
workspace-hack.workspace = true
# `default = []` leaves the server and client conversions uncompiled, so the
# tests that cover them own their feature union here rather than in a lane.
wyrd-tonic = { path = ".", features = ["server", "client"] }

[lints]
workspace = true
