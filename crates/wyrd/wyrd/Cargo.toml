[package]
name = "wyrd"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false
description = "Public Wyrd Rust umbrella crate; sanctioned re-exports for downstream consumers."

[lib]
path = "src/lib.rs"

[[example]]
name = "tracing_stdout"
path = "examples/tracing_stdout.rs"
required-features = ["otel"]

[features]
default = []
otel = ["wyrd-observe/otel"]

[dependencies]
skald-agent = { workspace = true }
skald-prompt = { workspace = true }
skald-runtime = { workspace = true }
skald-tool = { workspace = true }
skald-workflow = { workspace = true }
wyrd-observe = { workspace = true }
wyrd-observe-impl = { workspace = true }
wyrd-spec = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-stdout = { version = "0.27", features = ["trace"] }
skald-spec = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
