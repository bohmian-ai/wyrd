[package]
name = "wyrd"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false
description = "Public Wyrd Rust umbrella crate; sanctioned re-exports for downstream consumers."

[lib]
path = "src/lib.rs"

[features]
default = []

[dependencies]
skald-agent = { workspace = true }
skald-prompt = { workspace = true }
skald-runtime = { workspace = true }
skald-tool = { workspace = true }
wyrd-observe = { workspace = true }
wyrd-observe-impl = { workspace = true }
wyrd-spec = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
skald-spec = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
