[package]
name = "wyrd"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false
description = "Public Wyrd Rust umbrella crate; sanctioned re-exports for downstream consumers."

[lib]
path = "src/lib.rs"

[features]
default = []
otel = ["skald-observer/otel"]

[dependencies]
skald-agent = { workspace = true }
skald-observer = { workspace = true }
skald-prompt = { workspace = true }
skald-runtime = { workspace = true }
skald-tool = { workspace = true }
skald-workflow = { workspace = true }
wyrd-spec = { workspace = true }

[dev-dependencies]
workspace-hack.workspace = true
async-trait = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-stdout = { version = "0.31", features = ["trace"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
skald-spec = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
