[package]
name = "wyrd"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false
description = "Public Wyrd Rust umbrella crate; sanctioned re-exports for downstream consumers."

[lib]
path = "src/lib.rs"

[[example]]
name = "tracing_stdout"
path = "examples/tracing_stdout.rs"
required-features = ["otel"]

[[example]]
name = "agent_openai"
path = "examples/agent_openai.rs"

[[example]]
name = "workflow_openai"
path = "examples/workflow_openai.rs"

[[example]]
name = "workflow_anthropic"
path = "examples/workflow_anthropic.rs"

[[example]]
name = "workflow_gemini"
path = "examples/workflow_gemini.rs"

[[example]]
name = "workflow_gateway"
path = "examples/workflow_gateway.rs"

[features]
default = []
otel = ["wyrd-observe/otel"]

[dependencies]
skald-agent = { workspace = true }
skald-prompt = { workspace = true }
skald-runtime = { workspace = true }
skald-tool = { workspace = true }
skald-workflow = { workspace = true }
wyrd-observe = { workspace = true }
wyrd-observe-impl = { workspace = true }
wyrd-spec = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-stdout = { version = "0.27", features = ["trace"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
skald-spec = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
