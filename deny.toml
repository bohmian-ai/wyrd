[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "ISC",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { name = "sqlx" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
