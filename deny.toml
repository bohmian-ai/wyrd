[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "ISC",
  "Zlib",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { name = "sqlx", wrappers = ["wyrd-sql"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
