apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wyrd-bifrost-ingest
spec:
  serviceName: wyrd-bifrost-private
  replicas: 2
  selector:
    matchLabels: {app: wyrd-bifrost-ingest}
  template:
    metadata:
      labels: {app: wyrd-bifrost-ingest, wyrd.ai/bifrost-scribe: "true", wyrd.ai/bifrost-private: "true"}
    spec:
      # Above the server's 35-second shutdown drain, which holds the
      # verification runtime's 30-second in-flight drain.
      terminationGracePeriodSeconds: 45
      containers:
        - name: wyrd-server
          image: wyrd/server:latest
          ports: [{name: http, containerPort: 8080}, {name: grpc, containerPort: 50051}]
          env:
            - {name: WYRD_TARGET, value: server}
            - {name: WYRD_BIFROST_DATA_DIR, value: /var/lib/wyrd/bifrost}
          volumeMounts:
            - {name: bifrost-data, mountPath: /var/lib/wyrd/bifrost}
          readinessProbe: {httpGet: {path: /readyz, port: http}}
  volumeClaimTemplates:
    - metadata: {name: bifrost-data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 50Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wyrd-bifrost-query
spec:
  replicas: 2
  selector:
    matchLabels: {app: wyrd-bifrost-query}
  template:
    metadata:
      labels: {app: wyrd-bifrost-query, wyrd.ai/bifrost-oracle: "true", wyrd.ai/bifrost-private: "true"}
    spec:
      # Above the server's 35-second shutdown drain, which holds the
      # verification runtime's 30-second in-flight drain.
      terminationGracePeriodSeconds: 45
      volumes:
        - name: bifrost-data
          emptyDir: {}
      containers:
        - name: wyrd-server
          image: wyrd/server:latest
          ports: [{name: http, containerPort: 8080}, {name: grpc, containerPort: 50051}]
          env:
            - {name: WYRD_TARGET, value: oracle}
            - {name: WYRD_BIFROST_DATA_DIR, value: /var/lib/wyrd/bifrost}
          volumeMounts:
            - {name: bifrost-data, mountPath: /var/lib/wyrd/bifrost}
          readinessProbe: {httpGet: {path: /readyz, port: http}}
