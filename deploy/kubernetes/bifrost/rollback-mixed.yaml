apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wyrd-bifrost-rollback-mixed
spec:
  serviceName: wyrd-bifrost-private
  selector: {matchLabels: {app: wyrd-bifrost-rollback-mixed}}
  template:
    metadata:
      labels:
        app: wyrd-bifrost-rollback-mixed
        wyrd.ai/bifrost-scribe: "true"
        wyrd.ai/bifrost-oracle: "true"
        wyrd.ai/bifrost-private: "true"
    spec:
      # Above the server's 35-second shutdown drain, which holds the
      # verification runtime's 30-second in-flight drain.
      terminationGracePeriodSeconds: 45
      containers:
        - name: wyrd-server
          image: wyrd/server:stable
          ports: [{name: http, containerPort: 8080}, {name: grpc, containerPort: 50051}]
          env:
            - {name: WYRD_TARGET, value: all}
            - {name: WYRD_BIFROST_DATA_DIR, value: /var/lib/wyrd/bifrost}
          volumeMounts:
            - {name: bifrost-data, mountPath: /var/lib/wyrd/bifrost}
          readinessProbe: {httpGet: {path: /readyz, port: http}}
  volumeClaimTemplates:
    - metadata: {name: bifrost-data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 50Gi}}}
