# One-off migration as the platform login, which then owns Wyrd's objects.
apiVersion: batch/v1
kind: Job
metadata: {name: wyrd-migrate, namespace: wyrd-kind}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: wyrd:kind
          imagePullPolicy: Never
          command: [wyrd-server, migrate]
          env:
            - name: WYRD_DATABASE_URL
              valueFrom: {secretKeyRef: {name: wyrd-secrets, key: database-url}}
            - name: WYRD_PLATFORM_DATABASE_URL
              valueFrom: {secretKeyRef: {name: wyrd-secrets, key: platform-database-url}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
