# One-off migration: the only workload that receives the database-owner URL.
apiVersion: batch/v1
kind: Job
metadata: {name: wyrd-migrate, namespace: wyrd-kind}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: wyrd:kind
          imagePullPolicy: Never
          command: [wyrd-server, migrate]
          env:
            - name: WYRD_DATABASE_URL
              valueFrom: {secretKeyRef: {name: wyrd-owner, key: database-url}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
