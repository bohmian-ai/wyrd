services:
  postgres:
    image: postgres:16
    command:
      - postgres
      - "-c"
      - "max_connections=400"
      - "-c"
      - "shared_buffers=512MB"
    environment:
      POSTGRES_DB: wyrd
      POSTGRES_USER: wyrd_test_admin
      POSTGRES_PASSWORD: wyrd_test_admin_pw
    # Ephemeral test database: keep PGDATA in RAM, not the postgres:16 image's
    # built-in anonymous volume. The anonymous volume survived `compose down`
    # and carried a stale _sqlx_migrations ledger across runs, which broke the
    # migration checksum gate. The long-form `type: tmpfs` mount reliably
    # overrides the image's `VOLUME /var/lib/postgresql/data` (the short
    # `tmpfs:` list form does not), so the DB starts clean every time and is
    # faster (RAM-backed).
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data
    ports:
      - "127.0.0.1::5432"
    # Probe over TCP, not the Unix socket: the image's first-boot init runs a
    # temporary socket-only server, so a socket probe reports healthy before
    # the real server listens and host clients race a refused connection.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "wyrd_test_admin", "-d", "wyrd"]
      interval: 2s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "false"
      KC_LOG_LEVEL: WARN
    volumes:
      - ./tests/fixtures/identity/keycloak-realm.json:/opt/keycloak/data/import/keycloak-realm.json:ro
    # Published on the loopback address only. A wildcard publication binds
    # 0.0.0.0:8080, which occupies port 8080 on every 127.x.y.z address and so
    # steals the canonical public HTTP port out from under the Bifrost process
    # cluster's pod-like loopback addresses whenever the identity lane and a
    # Bifrost lane run concurrently.
    ports:
      - "127.0.0.1:8080:8080"
    # The Keycloak 24 image (UBI-micro) ships no curl or wget, so the old
    # `curl -sf .../health/ready` probe could never run and `docker compose up
    # --wait` always reported the container unhealthy — the identity e2e gate
    # aborted before any test ran. bash + /dev/tcp is present and checks real
    # readiness: /health/ready returns 200 only once realm import has completed.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/localhost/8080 && printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3 && grep -q "200 OK" <&3'
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  dex:
    image: ghcr.io/dexidp/dex:v2.38.0
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./tests/fixtures/identity/dex-config.yaml:/etc/dex/config.yaml:ro
    # Loopback-only for the same reason as Keycloak above.
    ports:
      - "127.0.0.1:5556:5556"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5556/healthz 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
