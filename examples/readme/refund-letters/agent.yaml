# refund-letters/agent.yaml
apiVersion: wyrd/v1
kind: Agent
metadata: {name: letter-writer, version: 1.0.0 }
spec:
  prompt:
    provider: openai
    model: gpt-4o
    messages:
      - role: user
        content: "Write a refund decision letter for order {{order_id}}: {{question}}"
  execution_route: {kind: native}
  tool_names: []
