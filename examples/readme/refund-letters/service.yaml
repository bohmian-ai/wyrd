# refund-letters/service.yaml
apiVersion: wyrd/v1
kind: Service
metadata: {name: refund-letters, version: 1.0.0 }
spec:
  service_type: agent
  tables:
    - name: letters
      schema:
        type: object
        properties:
          order_id: {type: string}
          letter: {type: string}
        required: [order_id, letter]
  components:
    - alias: agent
      ref: ./agent.yaml
      verified_by:
        - verifier: ./no-refund-promise.yaml
        - verifier: ./names-order.yaml
