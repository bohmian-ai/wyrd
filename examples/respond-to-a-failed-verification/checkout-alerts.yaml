apiVersion: wyrd/v1
kind: Service
metadata:
  name: checkout-alerts
  version: 1.0.0
spec:
  verified_by:
    # Each minute's window is judged by the schedule; a failed one pages on-call.
    - verifier: ./latency-budget.yaml
      runs_on: ./every-minute.yaml
      on_failure:
        - ./page-on-call.yaml
