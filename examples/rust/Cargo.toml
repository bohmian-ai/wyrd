[package]
name = "wyrd-rust-examples"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false
description = "Runnable Wyrd Rust examples."

[[bin]]
name = "agent_openai"
path = "agent_openai.rs"

[[bin]]
name = "agent_smoke"
path = "agent_smoke.rs"

[[bin]]
name = "tracing_stdout"
path = "tracing_stdout.rs"

[[bin]]
name = "transport_grpc"
path = "transport_grpc.rs"

[[bin]]
name = "transport_http"
path = "transport_http.rs"

[[bin]]
name = "transport_mock"
path = "transport_mock.rs"

[[bin]]
name = "transport_secrets"
path = "transport_secrets.rs"

[[bin]]
name = "workflow_anthropic"
path = "workflow_anthropic.rs"

[[bin]]
name = "workflow_from_builder"
path = "workflow_from_builder.rs"

[[bin]]
name = "workflow_from_yaml"
path = "workflow_from_yaml.rs"

[[bin]]
name = "workflow_gateway"
path = "workflow_gateway.rs"

[[bin]]
name = "workflow_gemini"
path = "workflow_gemini.rs"

[[bin]]
name = "workflow_openai"
path = "workflow_openai.rs"

[[bin]]
name = "workflow_parallel"
path = "workflow_parallel.rs"

[[bin]]
name = "workflow_structured_output"
path = "workflow_structured_output.rs"

[[bin]]
name = "workflow_with_observer"
path = "workflow_with_observer.rs"

[[bin]]
name = "client_request"
path = "client_request.rs"

[dependencies]
anyhow = "1"
reqwest = { workspace = true }
async-trait = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-stdout = { version = "0.27", features = ["trace"] }
opentelemetry_sdk = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
skald-agent = { workspace = true }
skald-prompt = { workspace = true }
skald-runtime = { workspace = true }
skald-spec = { workspace = true }
skald-tool = { workspace = true }
skald-workflow = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wyrd = { path = "../../crates/wyrd/wyrd", features = ["otel"] }
wyrd-client = { workspace = true }
skald-observer = { workspace = true, features = ["otel"] }
wyrd-spec = { workspace = true }
