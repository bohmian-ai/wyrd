[package]
name = "wyrd-rust-examples"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false
description = "Runnable Wyrd Rust examples."

[[bin]]
name = "transport_grpc"
path = "transport_grpc.rs"

[[bin]]
name = "transport_http"
path = "transport_http.rs"

[[bin]]
name = "client_request"
path = "client_request.rs"

[[bin]]
name = "support_desk"
path = "../support-desk/rust/main.rs"

[dependencies]
anyhow = "1"
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
wyrd-ai = { path = "../../sdks/wyrd-sdk-rust", features = ["otel"] }

[dev-dependencies]
workspace-hack.workspace = true

[lints]
workspace = true
