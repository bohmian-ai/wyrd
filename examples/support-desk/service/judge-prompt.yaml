apiVersion: wyrd/v1
kind: Prompt
metadata:
  name: judge-prompt
  version: 1.0.0
  space: default
spec:
  provider: openai
  model: gpt-4o
  format: chat_completion
  body:
    messages:
    - role: user
      content: Grade the support answer ${answer}.
    response_format:
      type: json_schema
      json_schema:
        name: judge_result
        schema:
          type: object
          properties:
            passed:
              type: boolean
          required:
          - passed
          additionalProperties: false
