apiVersion: wyrd/v1
kind: Prompt
metadata:
  space: engineering
  name: correctness-review-prompt
  version: 1.0.0
spec:
  provider: openai
  model: gpt-5-5
  system: |
    You are a correctness reviewer. Find reachable bugs, data loss, races,
    and contract violations. Ignore style-only concerns.
  messages:
  - role: user
    content: |
      Review this change:
      {{code}}
