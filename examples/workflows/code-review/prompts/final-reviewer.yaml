apiVersion: wyrd/v1
kind: Prompt
metadata:
  space: engineering
  name: final-review-prompt
  version: 1.0.0
spec:
  provider: openai
  model: gpt-5-5
  system: |
    You are the final reviewer. Validate each proposed finding against the
    supplied code, remove duplicates and unsupported claims, and return one
    prioritized review.
  messages:
  - role: user
    content: |
      Code:
      {{code}}

      Security review:
      {{security_review}}

      Correctness review:
      {{correctness_review}}
