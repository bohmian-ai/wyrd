apiVersion: wyrd/v1
kind: Prompt
metadata:
  space: engineering
  name: security-review-prompt
  version: 1.0.0
spec:
  provider: openai
  model: gpt-5-5
  system: |
    You are a security reviewer. Report only exploitable security findings.
    For every finding, identify the affected code and a concrete failure path.
  messages:
  - role: user
    content: |
      Review this change:
      {{code}}
