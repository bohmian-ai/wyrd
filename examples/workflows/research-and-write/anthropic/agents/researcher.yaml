apiVersion: wyrd/v1
kind: Agent
metadata:
  space: examples
  name: researcher
  version: "0.1.0"
spec:
  prompt:
    model: claude-3-5-haiku-20241022
    request:
      provider: anthropic_message
      body:
        model: claude-3-5-haiku-20241022
        system: You are a concise researcher. Use the web_search tool to find 3 key facts about the topic, then summarise them.
        max_tokens: 4096
        messages:
          - role: user
            content:
              - type: text
                text: "Research: {{topic}}"
    variables: [topic]
    response_type: text
  tool_names: [web_search]
