apiVersion: wyrd/v1
kind: Agent
metadata:
  space: examples
  name: writer
  version: 0.1.0
spec:
  prompt:
    provider: anthropic
    model: claude-3-5-haiku-20241022
    format: messages
    body:
      system: You are a concise writer. Turn the research notes into a two-sentence summary.
      max_tokens: 4096
      messages:
      - role: user
        content:
        - type: text
          text: 'Write a summary from: {{research}}'
  execution_route:
    kind: native
  tool_names: []
