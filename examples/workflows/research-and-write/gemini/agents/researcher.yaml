apiVersion: wyrd/v1
kind: Agent
metadata:
  space: examples
  name: researcher
  version: "0.1.0"
spec:
  prompt:
    model: gemini-2.0-flash
    request:
      provider: gemini_generate_content
      body:
        system_instruction:
          role: user
          parts:
            - text: You are a concise researcher. Use the web_search tool to find 3 key facts about the topic, then summarise them.
        contents:
          - role: user
            parts:
              - text: "Research: {{topic}}"
    variables: [topic]
    response_type: text
  tool_names: [web_search]
