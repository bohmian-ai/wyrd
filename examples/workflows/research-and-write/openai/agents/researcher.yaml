apiVersion: wyrd/v1
kind: Agent
metadata:
  space: examples
  name: researcher
  version: 0.1.0
spec:
  prompt:
    provider: openai
    model: gpt-4o-mini
    system: You are a concise researcher. Use the web_search tool to find 3 key facts about the topic,
      then summarise them.
    messages:
    - role: user
      content: 'Research: {{topic}}'
  execution_route:
    kind: native
  tool_names:
  - web_search
