apiVersion: wyrd/v1
kind: Agent
metadata:
  space: examples
  name: writer
  version: 0.1.0
spec:
  prompt:
    provider: openai
    model: gpt-4o-mini
    system: You are a concise writer. Turn the research notes into a two-sentence summary.
    messages:
    - role: user
      content: 'Write a summary from: {{research}}'
  execution_route:
    kind: native
  tool_names: []
