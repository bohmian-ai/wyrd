# Mounts guarded-docs 1.0.0's guide for a probe whose key may not call every declared tool.
apiVersion: wyrd/v1
kind: Verifier
metadata:
  name: denied-desk-check
  version: 1.0.0
spec:
  inputs:
    script: {type: json, schema: {type: array}}
  steps:
    - id: probe
      action:
        kind: agent
        agent: ./guarded-probe.yaml
        inputs: {script: inputs.script}
        workspace:
          /inputs/guide.md:
            artifact:
              card: {kind: Artifact, name: guarded-docs, version: 1.0.0}
              path: docs/guide.md
  requirements:
    - id: probed
      statement: The probe played its script
      check: {kind: assert, path: steps.probe.output.done, operator: equals, expected: true}
