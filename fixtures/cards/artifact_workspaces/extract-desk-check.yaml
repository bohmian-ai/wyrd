# Mounts all of extractable-docs 1.0.0 for explicit extraction.
apiVersion: wyrd/v1
kind: Verifier
metadata:
  name: extract-desk-check
  version: 1.0.0
spec:
  inputs:
    script: {type: json, schema: {type: array}}
  steps:
    - id: probe
      action:
        kind: agent
        agent: ./file-probe.yaml
        inputs: {script: inputs.script}
        workspace:
          /inputs/docs:
            artifact:
              card: {kind: Artifact, name: extractable-docs, version: 1.0.0}
  requirements:
    - id: probed
      statement: The probe played its script
      check: {kind: assert, path: steps.probe.output.done, operator: equals, expected: true}
