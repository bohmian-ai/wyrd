# Plays the file tool calls its script names, one per turn, and returns every result.
apiVersion: wyrd/v1
kind: Agent
metadata:
  name: file-probe
  version: 1.0.0
spec:
  execution_route: {kind: wyrd_gateway, deployment: openai}
  tool_names: [fs.list, fs.read, fs.search, fs.extract, code.run, bifrost.query]
  run_config: {max_iterations: 24}
  prompt:
    provider: openai
    model: gpt-4o
    messages:
      - role: user
        content: "FS PROBE: {{script}}"
    response_format:
      type: object
      properties:
        done: {type: boolean}
        results: {type: array}
      required: [done, results]
