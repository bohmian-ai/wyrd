# Refused: a selection mounts only under /inputs.
apiVersion: wyrd/v1
kind: Verifier
metadata:
  name: outside-inputs-check
  version: 1.0.0
spec:
  inputs:
    script: {type: json, schema: {type: array}}
  steps:
    - id: probe
      action:
        kind: agent
        agent: ./file-probe.yaml
        inputs: {script: inputs.script}
        workspace:
          /work/guide.md:
            artifact:
              card: {kind: Artifact, name: guarded-docs, version: 1.0.0}
              path: docs/guide.md
  requirements:
    - id: probed
      statement: The probe played its script
      check: {kind: assert, path: steps.probe.output.done, operator: equals, expected: true}
