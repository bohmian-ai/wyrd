# Refused: a workspace selects only Artifact Cards.
apiVersion: wyrd/v1
kind: Verifier
metadata:
  name: wrong-kind-check
  version: 1.0.0
spec:
  inputs:
    script: {type: json, schema: {type: array}}
  steps:
    - id: probe
      action:
        kind: agent
        agent: ./file-probe.yaml
        inputs: {script: inputs.script}
        workspace:
          /inputs/x:
            artifact:
              card: {kind: Model, name: guarded-docs, version: 1.0.0}
  requirements:
    - id: probed
      statement: The probe played its script
      check: {kind: assert, path: steps.probe.output.done, operator: equals, expected: true}
