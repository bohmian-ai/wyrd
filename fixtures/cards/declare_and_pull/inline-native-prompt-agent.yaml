apiVersion: wyrd/v1
kind: Agent
metadata:
  name: inline-native-prompt-agent
  version: 1.0.0
spec:
  prompt:
    provider: openai
    model: gpt-4o
    format: chat_completion
    body:
      messages:
      - role: user
        content: Summarize {{ticket}}.
      seed: 123
      future_knob:
        enabled: true
  execution_route:
    kind: native
