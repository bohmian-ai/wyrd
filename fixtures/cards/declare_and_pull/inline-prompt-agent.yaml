apiVersion: wyrd/v1
kind: Agent
metadata:
  name: inline-prompt-agent
  version: 1.0.0
  space: default
spec:
  prompt:
    provider: anthropic
    model: claude-sonnet-4-5
    system: You answer for ${team}.
    messages:
    - role: user
      content:
      - type: text
        text: ${question}
      - type: image
        source: ${media:photo}
      - type: image
        source:
          type: base64
          mime_type: image/png
          data: iVBORw0KGgo=
      - type: document
        source: ${media:__wyrd_media_0}
    settings:
      temperature: 0.2
      max_output_tokens: 256
    response_format:
      type: object
      properties:
        answer:
          type: string
      required:
      - answer
  execution_route:
    kind: native
