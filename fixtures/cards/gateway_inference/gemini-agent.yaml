apiVersion: wyrd/v1
kind: Agent
metadata:
  name: gemini-agent
  version: 1.0.0
  space: default
spec:
  prompt:
    provider: google
    model: tuned/gemini-2.5-flash
    messages:
    - role: user
      content: ${question}
    settings:
      max_output_tokens: 16
  execution_route:
    kind: wyrd_gateway
    deployment: vertex
  tool_names: []
  run_config:
    max_iterations: 1
