apiVersion: wyrd/v1
kind: Agent
metadata:
  name: vertex-agent
  version: 1.0.0
spec:
  prompt:
    provider: vertex
    model: gemini-2.5-flash
    messages:
    - role: user
      content: ${question}
    settings:
      max_output_tokens: 16
  execution_route:
    kind: wyrd_gateway
    deployment: vertex
  tool_names: []
  run_config:
    max_iterations: 1
