apiVersion: wyrd/v1
kind: Prompt
metadata:
  name: jev-judge-prompt
  version: 1.0.0
  space: default
spec:
  provider: jev
  model: jev-latest
  format: system_one
  body:
    state: |-
      Question: ${question}
      Answer: ${answer}
    questions:
      helpful:
        type: noul
        instructions: Does the reply help the customer?
        criteria:
          'true': it resolves or advances the request
          'false': it ignores or deflects the request
      tone:
        type: choice
        instructions: What is the tone of the reply?
        criteria:
          polite: courteous and respectful
          rude: curt or dismissive
