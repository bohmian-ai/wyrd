apiVersion: wyrd/v1
kind: Prompt
metadata:
  name: jev-judge-prompt
  version: 1.0.0
  space: default
spec:
  provider: jev
  request:
    provider: jev_system_one
    body:
      model: jev-latest
      state: "Question: ${question}\nAnswer: ${answer}"
      questions:
        helpful:
          type: noul
          instructions: Does the reply help the customer?
          criteria:
            "true": it resolves or advances the request
            "false": it ignores or deflects the request
        tone:
          type: choice
          instructions: What is the tone of the reply?
          criteria:
            polite: courteous and respectful
            rude: curt or dismissive
  model: jev-latest
  variables: [question, answer]
  media_variables: []
