# Writes and revises files in its private scratch and publishes them, and a
# JSON value, under logical names for the steps that read them.
apiVersion: wyrd/v1
kind: Agent
metadata:
  name: drafter
  version: 1.0.0
spec:
  execution_route: {kind: wyrd_gateway, deployment: openai}
  tool_names: [fs.write, fs.read, publish]
  run_config: {max_iterations: 8}
  prompt:
    provider: openai
    model: gpt-4o
    messages:
      - role: user
        content: "DRAFT: {{question}}"
    response_format:
      type: object
      properties: {done: {type: boolean}}
      required: [done]
      additionalProperties: false
