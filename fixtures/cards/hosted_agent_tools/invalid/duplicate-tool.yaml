# Refused at declaration: its Agent selects publish twice, so two tools would share one provider name.
apiVersion: wyrd/v1
kind: Verifier
metadata:
  name: duplicate-tool
  version: 1.0.0
spec:
  inputs:
    question: {type: json, schema: {type: string}}
  steps:
    - id: draft
      action:
        kind: agent
        agent:
          execution_route: {kind: wyrd_gateway, deployment: openai}
          tool_names: [publish, publish]
          prompt:
            provider: openai
            model: gpt-4o
            messages:
              - role: user
                content: "NEVER CALLED: {{question}}"
        inputs: {question: inputs.question}
