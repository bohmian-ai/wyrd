# Lists its own private scratch after the scribe wrote its own.
apiVersion: wyrd/v1
kind: Agent
metadata:
  name: peeker
  version: 1.0.0
spec:
  execution_route: {kind: wyrd_gateway, deployment: openai}
  tool_names: [fs.list, fs.write]
  run_config: {max_iterations: 4}
  prompt:
    provider: openai
    model: gpt-4o
    messages:
      - role: user
        content: "PEEK: {{question}}"
    response_format:
      type: object
      properties: {done: {type: boolean}}
      required: [done]
      additionalProperties: false
