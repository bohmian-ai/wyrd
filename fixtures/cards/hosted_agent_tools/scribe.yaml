# Writes, replaces, and reads back files in private scratch with no
# declared input mount.
apiVersion: wyrd/v1
kind: Agent
metadata:
  name: scribe
  version: 1.0.0
spec:
  execution_route: {kind: wyrd_gateway, deployment: openai}
  tool_names: [fs.write, fs.read, fs.list]
  run_config: {max_iterations: 6}
  prompt:
    provider: openai
    model: gpt-4o
    messages:
      - role: user
        content: "SCRATCH: {{question}}"
    response_format:
      type: object
      properties: {done: {type: boolean}}
      required: [done]
      additionalProperties: false
