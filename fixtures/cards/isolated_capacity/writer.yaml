# Writes one file to its private scratch, then finishes.
apiVersion: wyrd/v1
kind: Agent
metadata:
  name: writer
  version: 1.0.0
spec:
  execution_route: {kind: wyrd_gateway, deployment: openai}
  tool_names: [fs.write]
  run_config: {max_iterations: 3}
  prompt:
    provider: openai
    model: gpt-4o
    messages:
      - role: user
        content: "WRITE: {{question}}"
    response_format:
      type: object
      properties: {done: {type: boolean}}
      required: [done]
      additionalProperties: false
