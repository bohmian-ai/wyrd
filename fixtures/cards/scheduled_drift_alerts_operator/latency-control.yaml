# Daily X-bar/S control chart of request latency against the fitted healthy
# baseline, five samples per subgroup.
apiVersion: wyrd/v1
kind: Verifier
metadata:
  name: latency-control
  version: 1.0.0
  space: default
spec:
  description: Daily check that request latency stays inside the baseline's control limits.
  inputs:
    latency: {type: samples, features: [latency]}
  requirements:
    - id: latency-in-control
      statement: Request latency stays inside the baseline's control limits
      check:
        kind: drift
        on: inputs.latency
        method: Spc
        signal:
          kind: Distribution
          baseline_ref: {kind: Data, name: latency-baseline, version: 1.0.0, space: default}
          features: [latency]
        condition: {kind: Statistical}
        profile: {kind: Spc, sample_size: 5}
