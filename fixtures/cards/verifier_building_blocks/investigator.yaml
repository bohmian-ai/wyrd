# Reads a Card, queries Bifrost, and runs Python before it answers.
apiVersion: wyrd/v1
kind: Agent
metadata:
  name: investigator
  version: 1.0.0
spec:
  execution_route: {kind: wyrd_gateway, deployment: openai}
  tool_names: [cards.get, bifrost.query, code.run]
  run_config: {max_iterations: 3}
  prompt:
    provider: openai
    model: gpt-4o
    messages:
      - role: user
        content: "INVESTIGATE: {{question}}"
    response_format:
      type: object
      properties: {done: {type: boolean}}
      required: [done]
      additionalProperties: false
