# A tool-less judge: it sees only the claim, the answer, and the refund rules
# injected into its Prompt, and returns a cited Verdict; its budget allows one
# repair of an answer outside its response schema.
apiVersion: wyrd/v1
kind: Agent
metadata:
  name: policy-judge
  version: 1.0.0
spec:
  execution_route: {kind: wyrd_gateway, deployment: openai}
  run_config: {max_iterations: 2}
  prompt:
    provider: openai
    model: gpt-4o
    messages:
      - role: user
        content: "Claim: {{claim}}. Answer: {{answer}}. Rules: {{rules}}. Cite the answer."
    response_format:
      type: object
      properties:
        outcome: {type: string, enum: [passed, failed, inconclusive]}
        reason: {type: string}
        citations:
          type: array
          items:
            type: object
            properties:
              slot: {type: string}
              locator:
                type: object
                properties: {json_pointer: {type: string}}
                required: [json_pointer]
                additionalProperties: false
            required: [slot, locator]
            additionalProperties: false
      required: [outcome, reason, citations]
      additionalProperties: false
