# Produces a first review quickly.
apiVersion: wyrd/v1
kind: Agent
metadata:
  name: bootstrapper
  version: 1.0.0
spec:
  execution_route: {kind: wyrd_gateway, deployment: openai}
  tool_names: []
  run_config: {max_iterations: 8}
  prompt:
    provider: openai
    model: gpt-4o
    messages:
      - role: user
        content: "BOOTSTRAP: {{question}}"
    response_format:
      type: object
      properties: {done: {type: boolean}}
      additionalProperties: false
