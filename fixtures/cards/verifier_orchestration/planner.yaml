# Decides which specialists the question needs; a decision may be null when it cannot tell.
apiVersion: wyrd/v1
kind: Agent
metadata:
  name: planner
  version: 1.0.0
spec:
  execution_route: {kind: wyrd_gateway, deployment: openai}
  tool_names: []
  run_config: {max_iterations: 8}
  prompt:
    provider: openai
    model: gpt-4o
    messages:
      - role: user
        content: "PLAN: {{question}}"
    response_format:
      type: object
      properties: {security: {type: [boolean, "null"]}, style: {type: boolean}}
      additionalProperties: false
