# The refiner rewrites its report one iteration at a time, seeing its
# previous answer and index, until its score reaches 2; the reader receives
# only the final iteration's report.
apiVersion: wyrd/v1
kind: Verifier
metadata:
  name: refine-report
  version: 1.0.0
spec:
  description: Sequential refinement consumed through its final report.
  inputs:
    question: {type: json, schema: {type: string}}
  steps:
    - id: draft
      repeat:
        max_iterations: 4
        until: {path: iteration.output.score, operator: greater_than_or_equals, expected: 2}
      action:
        kind: agent
        agent: ./refiner.yaml
        inputs: {question: inputs.question, index: iteration.index, previous: iteration.previous}
      requirements:
        - id: scored
          statement: Each iteration scored its report
          check: {kind: assert, path: steps.draft.output.text, operator: is_non_empty}
    - id: read
      action:
        kind: agent
        agent: ./report-reader.yaml
        inputs: {question: inputs.question}
        workspace:
          /inputs/report.json: steps.draft.publications.report
  requirements:
    - id: final
      statement: The refined report reached its score
      check: {kind: assert, path: steps.draft.output.score, operator: greater_than_or_equals, expected: 2}
