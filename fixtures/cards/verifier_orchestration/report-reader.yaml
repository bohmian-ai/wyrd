# Reads the final refined report it requires by name.
apiVersion: wyrd/v1
kind: Agent
metadata:
  name: report-reader
  version: 1.0.0
spec:
  execution_route: {kind: wyrd_gateway, deployment: openai}
  tool_names: [fs.read]
  run_config: {max_iterations: 8}
  prompt:
    provider: openai
    model: gpt-4o
    messages:
      - role: user
        content: "READ-REPORT: {{question}}"
    response_format:
      type: object
      properties: {done: {type: boolean}}
      additionalProperties: false
