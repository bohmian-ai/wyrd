# Reads the pinned question, keeps notes in its private scratch, and
# publishes its account.
apiVersion: wyrd/v1
kind: Agent
metadata:
  name: reviewer
  version: 1.0.0
spec:
  execution_route: {kind: wyrd_gateway, deployment: openai}
  tool_names: [fs.list, fs.read, fs.write, publish]
  run_config: {max_iterations: 8}
  prompt:
    provider: openai
    model: gpt-4o
    messages:
      - role: user
        content: "REVIEW: {{question}}"
    response_format:
      type: object
      properties: {done: {type: boolean}}
      required: [done]
      additionalProperties: false
