# Reviews one section of an extracted document and publishes its account.
apiVersion: wyrd/v1
kind: Agent
metadata:
  name: section-reviewer
  version: 1.0.0
spec:
  execution_route: {kind: wyrd_gateway, deployment: openai}
  tool_names: [publish]
  run_config: {max_iterations: 8}
  prompt:
    provider: openai
    model: gpt-4o
    messages:
      - role: user
        content: "SECTION: {{section}} at={{index}}"
    response_format:
      type: object
      properties: {done: {type: boolean}}
      additionalProperties: false
