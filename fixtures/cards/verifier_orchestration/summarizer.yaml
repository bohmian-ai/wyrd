# Summarizes the section accounts and the escalation's collection, refining
# its previous summary.
apiVersion: wyrd/v1
kind: Agent
metadata:
  name: summarizer
  version: 1.0.0
spec:
  execution_route: {kind: wyrd_gateway, deployment: openai}
  tool_names: [fs.read, publish]
  run_config: {max_iterations: 8}
  prompt:
    provider: openai
    model: gpt-4o
    messages:
      - role: user
        content: "SUMMARIZE: {{title}} index={{index}} previous={{previous}}"
    response_format:
      type: object
      properties: {score: {type: integer}, text: {type: string}}
      additionalProperties: false
