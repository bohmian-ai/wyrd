apiVersion: wyrd/v1
kind: Verifier
metadata:
  name: answer-check
  version: 1.0.0
  space: default
spec:
  description: The agent answers "yes".
  inputs:
    answer: {type: json}
  requirements:
    - id: says-yes
      statement: The answer is "yes"
      check: {kind: assert, path: inputs.answer, operator: equals, expected: "yes"}
