apiVersion: wyrd/v1
kind: Verifier
metadata:
  name: answer-is-yes
  version: 1.0.0
  space: default
spec:
  description: The agent answers "yes".
  implementation:
    kind: eval
    spec:
      pass_gate: {kind: all_pass}
      tasks:
        answer:
          kind: assertion
          id: answer
          context_path: $.answer
          operator: equals
          expected: "yes"
