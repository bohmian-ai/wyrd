apiVersion: wyrd/v1
kind: Service
metadata:
  name: assistant
  version: 1.0.0
  space: default
spec:
  service_type: agent
  components:
    - alias: agent
      ref: ./assistant-agent.yaml
      verified_by:
        - verifier: ./answer-check.yaml
        - verifier: ./answer-judged.yaml
    - alias: model
      ref:
        kind: Model
        name: latency-model
        version: 1.0.0
        space: default
      verified_by:
        - verifier: ./latency-drift.yaml
          runs_on: {kind: schedule, cron: "0 0 * * *"}
          inputs:
            latency: {features: [latency]}
