# cycle-a and cycle-b source each other.
apiVersion: wyrd/v1
kind: Service
metadata:
  name: coding-cycle
  version: 1.0.0
spec:
  service_type: agent
  components:
    - alias: agent
      ref: ./assistant-agent.yaml
      verified_by:
        - verifier: ./cycle-a.yaml
          runs_on: {kind: group_end, after: 3s}
        - verifier: ./cycle-b.yaml
          runs_on: {kind: group_end, after: 3s}
