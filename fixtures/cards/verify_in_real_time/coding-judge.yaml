# A check Agent that may read spans live through bifrost.query.
apiVersion: wyrd/v1
kind: Agent
metadata:
  name: coding-judge
  version: 1.0.0
  space: default
spec:
  prompt: ./judge-prompt.yaml
  execution_route: {kind: wyrd_gateway, deployment: openai}
  tool_names: [bifrost.query]
  run_config: {max_iterations: 2}
