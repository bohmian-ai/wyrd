apiVersion: wyrd/v1
kind: Verifier
metadata:
  name: cycle-a
  version: 1.0.0
  space: default
spec:
  description: Reads its own reader's slot, closing a source cycle.
  inputs:
    back: verifiers.cycle-b.inputs.forth
  requirements:
    - id: read
      statement: Every value was read
      check: {kind: assert, each: "inputs.back[*]", operator: is_not_null}
