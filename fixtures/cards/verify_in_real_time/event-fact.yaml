apiVersion: wyrd/v1
kind: Verifier
metadata:
  name: event-fact
  version: 1.0.0
spec:
  description: The application detected the door event it reports.
  inputs:
    event:
      type: json
      schema:
        type: object
        properties:
          event_id: {type: string}
          detected: {type: boolean}
        required: [event_id, detected]
  requirements:
    - id: detected
      statement: The event was detected
      check: {kind: assert, path: inputs.event.detected, operator: equals, expected: true}
