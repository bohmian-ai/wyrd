# A person-detection application: its sampled frames and the event fact it
# reports share the event id as group id, and event-verifier judges the event
# once the group comes due.
apiVersion: wyrd/v1
kind: Service
metadata:
  name: frames
  version: 1.0.0
  space: default
spec:
  service_type: agent
  components:
    - alias: agent
      ref: ./assistant-agent.yaml
      verified_by:
        - verifier: ./frame-verifier.yaml
        - verifier: ./event-fact.yaml
        - verifier: ./event-verifier.yaml
          runs_on: {kind: group_end, after: 3s}
