apiVersion: wyrd/v1
kind: Prompt
metadata:
  name: judge-portable-prompt
  version: 1.0.0
  space: default
spec:
  provider: openai
  model: gpt-4o
  messages:
  - role: user
    content: Grade the answer ${answer}.
  response_format:
    type: object
    properties:
      passed:
        type: boolean
    required:
    - passed
    additionalProperties: false
