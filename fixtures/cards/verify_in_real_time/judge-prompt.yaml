apiVersion: wyrd/v1
kind: Prompt
metadata:
  name: judge-prompt
  version: 1.0.0
spec:
  provider: openai
  model: gpt-4o
  messages:
  - role: user
    content: "Claim: {{claim}}. Answer: {{answer}}. Cite the answer."
  response_format:
    type: object
    properties:
      outcome: {type: string, enum: [passed, failed, inconclusive]}
      reason: {type: string}
      citations:
        type: array
        items:
          type: object
          properties:
            slot: {type: string}
            locator:
              type: object
              properties: {json_pointer: {type: string}}
              required: [json_pointer]
              additionalProperties: false
          required: [slot, locator]
          additionalProperties: false
    required: [outcome, reason, citations]
    additionalProperties: false
