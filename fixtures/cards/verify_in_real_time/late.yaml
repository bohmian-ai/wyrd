# A judged conversation whose whole-conversation group execution is slow, so turns
# can arrive while it runs and a turn's own judgment can land after the next
# execution pinned it.
apiVersion: wyrd/v1
kind: Service
metadata:
  name: late
  version: 1.0.0
spec:
  service_type: agent
  components:
    - alias: agent
      ref: ./assistant-agent.yaml
      verified_by:
        - verifier: ./answer-judged.yaml
        - verifier: ./late-verifier.yaml
          runs_on: {kind: group_end, after: 3s}
