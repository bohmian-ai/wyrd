apiVersion: wyrd/v1
kind: Verifier
metadata:
  name: latency-drift
  version: 1.0.0
spec:
  description: Request latency stays distributed like the healthy baseline.
  inputs:
    latency: {type: samples, features: [latency]}
  requirements:
    - id: latency-stable
      statement: Request latency is distributed like the healthy baseline
      check:
        kind: drift
        on: inputs.latency
        method: Psi
        signal:
          kind: Distribution
          baseline_ref: {kind: Data, name: latency-baseline, version: 1.0.0 }
          features: [latency]
        condition: {kind: Statistical}
        profile:
          kind: Psi
          binning_strategy: {kind: EqualWidth, n_bins: 10}
          threshold: {kind: Fixed, value: 0.25}
