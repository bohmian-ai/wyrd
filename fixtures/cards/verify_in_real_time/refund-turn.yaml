apiVersion: wyrd/v1
kind: Verifier
metadata:
  name: refund-turn
  version: 1.0.0
  space: default
spec:
  description: Each refund turn records the order fact it promised against.
  inputs:
    fact: {type: json}
  requirements:
    - id: valid-fact
      statement: The turn names the order it promises a refund for
      check: {kind: assert, path: inputs.fact.order, operator: not_equals, expected: ""}
