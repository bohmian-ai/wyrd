apiVersion: wyrd/v1
kind: Service
metadata:
  name: refund
  version: 1.0.0
  space: default
spec:
  service_type: agent
  components:
    - alias: agent
      ref: ./assistant-agent.yaml
      verified_by:
        - verifier: ./refund-turn.yaml
        - verifier: ./refund-review.yaml
          runs_on: {kind: group_end, idle: 3s, max_age: 1h, finality: 40s}
          on_verdict_change:
            - ./refund-alert.yaml
