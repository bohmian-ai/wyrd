# turn-check is bound twice on this site, so conversation-review's source matches two bindings.
apiVersion: wyrd/v1
kind: Service
metadata:
  name: support-ambiguous
  version: 1.0.0
  space: default
spec:
  service_type: agent
  components:
    - alias: agent
      ref: ./assistant-agent.yaml
      verified_by:
        - verifier: ./turn-check.yaml
        - verifier: ./turn-check-newer.yaml
        - verifier: ./conversation-review.yaml
          runs_on: {kind: group_end, idle: 3s, max_age: 1h, finality: 1d}
