apiVersion: wyrd/v1
kind: Verifier
metadata:
  name: tier-drift
  version: 1.0.0
spec:
  description: Control-chart the text-valued tier column, which SPC cannot fit, so its baseline never becomes ready.
  inputs:
    tier: {type: samples, features: [tier]}
  requirements:
    - id: tier-stable
      statement: The tier mix is in control
      check:
        kind: drift
        on: inputs.tier
        method: Spc
        signal:
          kind: Distribution
          baseline_ref: {kind: Data, name: latency-baseline, version: 1.0.0 }
          features: [tier]
        condition: {kind: Statistical}
        profile: {kind: Spc, sample_size: 5}
