apiVersion: wyrd/v1
kind: Service
metadata:
  name: unfitted-assistant
  version: 1.0.0
  space: default
spec:
  service_type: agent
  components:
    - alias: model
      ref:
        kind: Model
        name: latency-model
        version: 1.0.0
        space: default
      verified_by:
        - verifier: ./tier-drift.yaml
          runs_on: {kind: schedule, cron: "0 0 * * *"}
