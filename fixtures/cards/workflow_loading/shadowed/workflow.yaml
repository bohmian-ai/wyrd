apiVersion: wyrd/v1
kind: Workflow
metadata:
  space: workflow-loading
  name: shadowed-review
  version: "1.0.0"
spec:
  description: A local security sibling and the registered security Agent of the same identity, side by side.
  llm_route:
    kind: native
  inputs:
    code:
      type: str
      value: ""

  steps:
    - id: security
      action:
        type: agent
        target: ./agents/security.yaml
      inputs:
        code: input.code
      timeout_seconds: 60
      retry:
        max_retries: 1

    - id: registered_security
      action:
        type: agent
        target:
          kind: Agent
          name: security-reviewer
          version: "1.0.0"
      inputs:
        code: input.code
      timeout_seconds: 60
      retry:
        max_retries: 1

    - id: correctness
      action:
        type: agent
        target: ./agents/correctness.yaml
      inputs:
        code: input.code
      timeout_seconds: 60
      retry:
        max_retries: 1

    - id: final_review
      action:
        type: agent
        target: ./agents/final-reviewer.yaml
      depends_on: [security, correctness]
      inputs:
        code: input.code
        security_review: steps.security.output.text
        correctness_review: steps.correctness.output.text
      timeout_seconds: 60
      retry:
        max_retries: 1

  outputs:
    security: steps.security.output.text
    registered_security: steps.registered_security.output.text
    review: steps.final_review.output.text
