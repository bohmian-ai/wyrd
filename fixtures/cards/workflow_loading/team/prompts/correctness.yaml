apiVersion: wyrd/v1
kind: Prompt
metadata:
  space: workflow-loading
  name: correctness-review-prompt
  version: 1.0.0
spec:
  provider: mock
  model: gpt-5-5
  format: chat_completion
  body:
    messages:
    - role: system
      content: |
        You are a correctness reviewer. Find reachable bugs, data loss, races,
        and contract violations. Ignore style-only concerns.
    - role: user
      content: registered correctness review of {{code}}
