cargo nextest run --locked -p wyrd-server --lib --features test-support -E 'test(/^bifrost::/) | test(/^oracle::/) | test(/^query::/) | test(/^grpc::(query|scribe_tail)::/) | test(/bifrost|oracle|scribe|forge/)'
cargo nextest run --locked -p vala-sdk --lib -E 'test(/^query::/) | test(/^sdk::bifrost/)'
cargo nextest run --locked -p wyrd-mcp --lib -E 'test(/^bifrost::/)'
"""

