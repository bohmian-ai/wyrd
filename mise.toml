[tools]
node = "26.2.0"
uv = "0.11.16"
rust = "1.95.0"
"npm:pnpm" = "11.4.0"
cmake = "3.26.4"
protoc = "33.2"
"cargo:cargo-deny" = "0.19.8"

[settings]
env_shell_expand = false

[env]
UI_DIR = "crates/wyrd/wyrd-server/wyrd-ui"
PY_DIR = "python/py-wyrd"
WYRD_DEV_PG_CACHE = "${HOME}/.cache/wyrd/pg"

[tasks.fmt]
description = "Format all Rust code"
run = "cargo fmt --all"

[tasks.lints]
description = "Workspace clippy with -D warnings (all features, all targets)"
run = "cargo clippy --locked --workspace --all-features --all-targets -- -D warnings"

[tasks."test:unit"]
description = "Run all Rust unit tests"
run = """
cargo test --locked --workspace --exclude py-wyrd --exclude wyrd-server
cargo test --locked -p wyrd-server --features stub-auth
"""

[tasks."test:wyrd-spec"]
description = "Run wyrd-spec Rust tests"
run = "cargo test -p wyrd-spec --all-features"

[tasks."test:wyrd-spec:doc"]
description = "Run wyrd-spec Rust doc tests"
run = "cargo test --locked --doc --all-features -p wyrd-spec"

[tasks."test:wyrd-error-derive"]
description = "Run wyrd-error-derive tests"
run = "cargo test -p wyrd-error-derive --all-features"

[tasks."build:server:oss"]
description = "Build the OSS wyrd-server release binary"
run = "cargo build --release --locked -p wyrd-server"

[tasks."build:server:enterprise"]
description = "Build the enterprise wyrd-server release binary"
run = "cargo build --release --locked -p wyrd-server --features enterprise"

[tasks."docker:build:oss"]
description = "Build the OSS wyrd-server Docker image"
run = "docker build -f docker/Dockerfile --build-arg WYRD_FLAVOR=oss -t wyrd-server:oss ."

[tasks."docker:build:enterprise"]
description = "Build the enterprise wyrd-server Docker image"
run = "docker build -f docker/Dockerfile --build-arg WYRD_FLAVOR=enterprise -t wyrd-server:enterprise ."

[tasks."check:docs"]
description = "Build public Rust docs and doctests"
run = """
RUSTDOCFLAGS="-D missing_docs -D rustdoc::broken_intra_doc_links" cargo doc --locked --no-deps --all-features \
  -p wyrd-spec \
  -p wyrd-auth-issue \
  -p wyrd-auth-verify
cargo test --locked --doc --all-features \
  -p wyrd-spec \
  -p wyrd-auth-verify \
  -p wyrd-auth-issue
"""

[tasks."cardkind:check"]
description = "Verify CardKind native count and External serde shape"
run = "cargo test -p wyrd-spec --test cards kind:: --features server"

[tasks."check:client-tier"]
description = "Foundation invariants: wyrd-spec server-tier-free; shared shells pyo3+sqlx-free; Skald keeps only locked Wyrd foundation edges"
run = """
set -eu

forbidden_spec=$(cargo tree -p wyrd-spec --no-default-features -e normal | \
  rg '(^|[ ─└├])(utoipa|pyo3|sqlx|axum|opentelemetry|reqwest|tokio)' || true)
if [ -n "$forbidden_spec" ]; then
  echo "FAIL: wyrd-spec pulls forbidden deps at --no-default-features:"
  echo "$forbidden_spec"
  exit 1
fi

for crate in wyrd-auth-verify; do
  forbidden_shared=$(cargo tree -p "$crate" --all-features -e normal | \
    rg '(^|[ ─└├])(pyo3|sqlx)' || true)
  if [ -n "$forbidden_shared" ]; then
    echo "FAIL: $crate pulls forbidden deps:"
    echo "$forbidden_shared"
    exit 1
  fi
done

forbidden_skald_prompt=$(cargo tree -p skald-prompt --all-features -e normal | \
  rg '(^|[ ─└├])(reqwest|tokio|hyper|axum|sqlx|opentelemetry|skald-runtime|skald-providers|skald-cache|skald-tool)' || true)
if [ -n "$forbidden_skald_prompt" ]; then
  echo "FAIL: skald-prompt pulls forbidden client-unsafe deps:"
  echo "$forbidden_skald_prompt"
  exit 1
fi

for crate in skald-agent skald-workflow skald-tool skald-runtime; do
  forbidden_skald_member=$(cargo tree -p "$crate" --all-features -e normal | \
    rg '(^|[ ─└├])(wyrd-|vala-)' | \
    rg -v '(^|[ ─└├])(wyrd-spec|wyrd-interfaces|wyrd-utils|wyrd-runtime|wyrd-error-derive|wyrd-observe)' || true)
  if [ -n "$forbidden_skald_member" ]; then
    echo "FAIL: $crate pulls forbidden Wyrd/Vala deps outside the locked foundation set:"
    echo "$forbidden_skald_member"
    exit 1
  fi
done

if rg -n 'wyrd_spec|wyrd-' crates/skald \
  --glob '!crates/skald/skald-prompt/**' \
  --glob '!crates/skald/skald-agent/**' \
  --glob '!crates/skald/skald-agent/Cargo.toml' \
  --glob '!crates/skald/skald-tool/Cargo.toml' \
  --glob '!crates/skald/skald-workflow/**'; then
  echo 'Skald engine crates must remain free of Wyrd references outside locked boundary crates'
  exit 1
fi

if rg -n 'wyrd_cards|wyrd-cards' crates/skald/skald-agent; then
  echo 'skald-agent must not depend on wyrd-cards'
  exit 1
fi

if ! rg -q 'wyrd-(spec|interfaces|utils)' crates/skald/skald-prompt/Cargo.toml; then
  echo 'skald-prompt must remain the documented Skald/Wyrd boundary crate'
  exit 1
fi
"""

[tasks."check:pyo3-scope"]
description = "Assert PyO3 stays out of pure contracts and Python-free shared crates"
run = """
set -eu

if rg -n 'pyo3|pymodule|pyclass|pymethods' crates/wyrd-spec; then
  echo 'PyO3 scope violation detected in wyrd-spec'
  exit 1
fi

if rg -n 'pyo3|pymodule|pyclass|pymethods' crates/shared \
  --glob '!crates/shared/wyrd-utils/**' \
  --glob '!crates/shared/wyrd-observe/**'; then
  echo 'PyO3 scope violation detected in Python-free shared crates'
  exit 1
fi

if rg -n 'pyo3|pymodule|pyclass|pymethods|Python|Bound<|Py<|PyErr' crates/skald \
  --glob '!crates/skald/skald-prompt/**' \
  --glob '!crates/skald/skald-runtime/Cargo.toml' \
  --glob '!crates/skald/skald-runtime/src/lib.rs' \
  --glob '!crates/skald/skald-runtime/src/python.rs' \
  --glob '!crates/skald/skald-agent/Cargo.toml' \
  --glob '!crates/skald/skald-agent/src/agent.rs' \
  --glob '!crates/skald/skald-agent/src/lib.rs' \
  --glob '!crates/skald/skald-agent/src/py_error.rs' \
  --glob '!crates/skald/skald-agent/src/python.rs' \
  --glob '!crates/skald/skald-agent/src/run.rs' \
  --glob '!crates/skald/skald-agent/src/session.rs' \
  --glob '!crates/skald/skald-tool/Cargo.toml' \
  --glob '!crates/skald/skald-tool/src/lib.rs' \
  --glob '!crates/skald/skald-tool/src/python.rs' \
  --glob '!crates/skald/skald-workflow/Cargo.toml' \
  --glob '!crates/skald/skald-workflow/src/lib.rs' \
  --glob '!crates/skald/skald-workflow/src/python.rs' \
  --glob '!crates/skald/skald-workflow/src/run.rs' \
  --glob '!crates/skald/skald-workflow/src/task.rs' \
  --glob '!crates/skald/skald-workflow/src/workflow_surface.rs'; then
  echo 'PyO3 scope violation detected in Python-free Skald engine crates'
  exit 1
fi

for crate in skald-prompt skald-runtime skald-agent skald-tool skald-workflow; do
  manifest="crates/skald/$crate/Cargo.toml"
  if ! rg -q 'python = \\[' "$manifest" || ! rg -q 'dep:pyo3' "$manifest"; then
    echo "$crate must gate PyO3 behind its python feature"
    exit 1
  fi

  if ! rg -q 'pyo3 = \\{ workspace = true, optional = true \\}' "$manifest"; then
    echo "$crate PyO3 dependency must remain optional"
    exit 1
  fi
done

if ! rg -qF 'python = ["dep:pyo3"]' crates/shared/wyrd-utils/Cargo.toml; then
  echo 'wyrd-utils must gate PyO3 behind its python feature'
  exit 1
fi

if ! rg -q 'pyo3 = \\{ workspace = true, optional = true \\}' crates/shared/wyrd-utils/Cargo.toml; then
  echo 'wyrd-utils PyO3 dependency must remain optional'
  exit 1
fi

if ! rg -q '#\\[cfg\\(feature = "python"\\)\\]' crates/shared/wyrd-utils/src/lib.rs; then
  echo 'wyrd-utils Python helpers must remain cfg-gated'
  exit 1
fi

forbidden_utils_default=$(cargo tree -p wyrd-utils --no-default-features -e normal | \
  rg '(^|[ ─└├])pyo3' || true)
if [ -n "$forbidden_utils_default" ]; then
  echo "FAIL: wyrd-utils pulls PyO3 without its python feature:"
  echo "$forbidden_utils_default"
  exit 1
fi
"""

[tasks."check:mocks-scope"]
description = "Assert mock helpers stay out of production source"
run = """
if rg -n 'mockall|wiremock|mockito' crates \
  --glob '!crates/shared/wyrd-testing/**' \
  --glob '!crates/skald/skald-providers/Cargo.toml' \
  --glob '!crates/skald/skald-providers/tests/**'; then
  echo 'mock dependency leaked outside wyrd-testing'
  exit 1
fi
"""

[tasks."check:object-store-pin"]
description = "Assert the workspace resolves exactly one object_store 0.13 package"
run = """
cargo tree -e=no-dev -i object_store --all-features 2>&1 \
  | awk '/^object_store / { v=$2; count++ } END {
      if (count != 1) { print "FAIL: expected exactly 1 object_store version, got "count; exit 1 }
      if (v !~ /^v0\\.13\\./) { print "FAIL: object_store "v" is not 0.13.*"; exit 1 }
      print "OK: "v
    }'
"""

[tasks."storage:up"]
description = "Start local storage emulators: MinIO, fake-gcs-server, and Azurite"
run = "docker compose -f crates/wyrd/wyrd-storage/docker/docker-compose.yml up -d"

[tasks."storage:down"]
description = "Stop local storage emulators and remove their volumes"
run = "docker compose -f crates/wyrd/wyrd-storage/docker/docker-compose.yml down -v"

[tasks."storage:logs"]
description = "Tail local storage emulator logs"
run = "docker compose -f crates/wyrd/wyrd-storage/docker/docker-compose.yml logs -f"

[tasks."test:storage:local"]
description = "Run wyrd-storage local backend integration tests"
run = "cargo test -p wyrd-storage --all-features --test integration_local"

[tasks."test:storage:minio"]
description = "Run wyrd-storage MinIO integration tests; requires storage:up"
depends = ["storage:up"]
env = { WYRD_STORAGE_INTEGRATION_S3 = "1", AWS_ACCESS_KEY_ID = "wyrd-test-key", AWS_SECRET_ACCESS_KEY = "wyrd-test-secret", AWS_REGION = "us-east-1" }
run = "cargo test -p wyrd-storage --all-features --test integration_minio -- --nocapture"

[tasks."test:storage:gcs-emu"]
description = "Run wyrd-storage GCS emulator integration tests; requires storage:up"
depends = ["storage:up"]
env = { WYRD_STORAGE_INTEGRATION_GCS = "1", WYRD_GCS_EMULATOR_HOST = "http://localhost:4443/storage/v1/" }
run = "cargo test -p wyrd-storage --all-features --test integration_gcs -- --nocapture"

[tasks."test:storage:azurite"]
description = "Run wyrd-storage Azurite integration tests; requires storage:up"
depends = ["storage:up"]
env = { WYRD_STORAGE_INTEGRATION_AZURE = "1", WYRD_AZURE_EMULATOR_ENDPOINT = "http://127.0.0.1:10000" }
run = "cargo test -p wyrd-storage --all-features --test integration_azurite -- --nocapture"

[tasks."test:storage:matrix"]
description = "Run all storage emulator integration tests; requires storage:up"
depends = ["test:storage:local", "test:storage:gcs-emu", "test:storage:minio", "test:storage:azurite"]

[tasks."check:storage:drift"]
description = "Assert storage foundation guardrails against paths that exist in this workspace"
run = """
set -eu

rg_optional() {
  pattern="$1"
  shift
  existing=""
  for path in "$@"; do
    if [ -e "$path" ]; then
      existing="$existing $path"
    else
      echo "skip missing path: $path"
    fi
  done
  if [ -n "$existing" ]; then
    # shellcheck disable=SC2086
    rg -n "$pattern" $existing
  else
    return 1
  fi
}

rg_fixed_optional() {
  pattern="$1"
  shift
  existing=""
  for path in "$@"; do
    if [ -e "$path" ]; then
      existing="$existing $path"
    else
      echo "skip missing path: $path"
    fi
  done
  if [ -n "$existing" ]; then
    # shellcheck disable=SC2086
    rg -nF "$pattern" $existing
  else
    return 1
  fi
}

if rg_optional 'pyo3|pymodule|pyclass|pymethods' \
  crates/wyrd/wyrd-storage \
  crates/wyrd/wyrd-server/src/storage \
  crates/wyrd-spec/src/storage; then
  echo 'storage foundation must stay PyO3-free'
  exit 1
fi

if rg_optional 'session_uri|session_url|sas|presigned_url' \
  crates/wyrd/wyrd-sql/migrations \
  crates/wyrd/wyrd-sql/src/queries/storage; then
  echo 'bearer-equivalent upload tokens must not be persisted in migrations or storage queries'
  exit 1
fi

if rg_fixed_optional 'partial.state' \
  crates/wyrd/wyrd-client/src/artifacts \
  crates/wyrd/wyrd-client/src/cards; then
  echo 'upload sidecar state is forbidden'
  exit 1
fi

if rg_fixed_optional 'storage_multipart_upload_parts' crates/wyrd/wyrd-sql/migrations; then
  echo 'per-part multipart upload tables are forbidden'
  exit 1
fi

if rg_optional 'presign_batch|next_parts|part_batch_size|batch_presign|presign.*batch|batch.*presign' \
  crates/wyrd/wyrd-storage/src \
  crates/wyrd-spec/src/storage \
  crates/wyrd/wyrd-client/src; then
  echo 'per-part presign batching is forbidden'
  exit 1
fi

if rg_optional 'aws_sdk_s3|gcloud_storage|azure_storage|azure_core|object_store|sqlx' \
  crates/wyrd/wyrd-client/src \
  crates/wyrd/wyrd-client/Cargo.toml; then
  echo 'client tier must stay free of cloud SDK, object_store, and sqlx dependencies'
  exit 1
fi

if rg_optional '&PgPool' \
  crates/wyrd/wyrd-sql/src/queries/storage/multipart_uploads.rs \
  crates/wyrd/wyrd-sql/src/queries/storage/artifact_metadata.rs \
  crates/wyrd/wyrd-sql/src/queries/storage/access_ledger.rs \
  crates/wyrd/wyrd-sql/src/queries/storage/idempotency.rs; then
  echo 'tenant-scoped storage queries must use TenantConn, not PgPool'
  exit 1
fi

if rg_optional 'PendingMap|storage_pending' \
  crates/wyrd/wyrd-server/src \
  crates/wyrd-spec/src; then
  echo 'storage uploads must not rely on in-memory cross-request state'
  exit 1
fi

if rg -n --glob '*.rs' 'wire_protocol\\s*==\\s*"' crates; then
  echo 'WireProtocol dispatch must not use string equality'
  exit 1
fi

if rg_optional 'ArtifactRef' \
  crates/wyrd-spec/src/storage \
  .dev/plan/foundations/04-storage; then
  echo 'storage must not introduce a second artifact identity surface'
  exit 1
fi

if ! rg -q '#\\[serde\\(tag = "protocol", content = "data"' crates/wyrd-spec/src/storage/upload.rs; then
  echo 'UploadPlan must remain a closed tagged union'
  exit 1
fi

if rg -n -e '\\.unwrap\\(\\)' crates/wyrd/wyrd-storage/src crates/wyrd/wyrd-server/src/storage; then
  echo 'unwrap is forbidden in non-test storage code'
  exit 1
fi
"""

[tasks."check:unwrap-audit"]
description = "Audit unwrap/expect calls outside tests and examples"
run = "python scripts/check_unwrap_audit.py"

[tasks."check:error-coverage"]
description = "Assert emitted Skald error codes are mapped and SQL errors have coverage"
run = """
set -eu

emitted=$(mktemp)
mapped=$(mktemp)
sql_emitted=$(mktemp)
sql_tested=$(mktemp)
trap 'rm -f "$emitted" "$mapped" "$sql_emitted" "$sql_tested"' EXIT

{
  rg --no-filename -oN 'SKALD_AGENT_[0-9]{3}_[A-Z_]+' crates/skald/skald-agent/src || true
  rg --no-filename -oN 'SKALD_SESSION_[0-9]{3}_[A-Z_]+' crates/skald/skald-agent/src || true
  rg --no-filename -oN 'SKALD_WORKFLOW_[0-9]{3}_[A-Z_]+' crates/skald/skald-workflow/src || true
} | sort -u > "$emitted"

rg --no-filename -oN 'SKALD_(AGENT|SESSION|WORKFLOW)_[0-9]{3}_[A-Z_]+' \
  crates/shared/wyrd-observe/src/error_map.rs \
  | sort -u > "$mapped"

if comm -23 "$emitted" "$mapped" | rg .; then
  echo 'Observed Skald error map is missing emitted source codes'
  exit 1
fi

rg --no-filename -oN 'WYRD_SQL_[0-9]{3}_[A-Z_]+' \
  crates/wyrd/wyrd-sql/src/error.rs \
  | sort -u > "$sql_emitted"

sed -n '/#\\[cfg(test)\\]/,$p' crates/wyrd/wyrd-sql/src/error.rs \
  | rg --no-filename -oN 'WYRD_SQL_[0-9]{3}_[A-Z_]+' \
  | sort -u > "$sql_tested"

if comm -23 "$sql_emitted" "$sql_tested" | rg .; then
  echo 'SQL error coverage is missing stable WYRD_SQL_* codes'
  exit 1
fi
"""

[tasks."check:tenant-isolation"]
description = "Assert SQL foundation tenant isolation and server-tier boundaries"
run = "python scripts/check_tenant_isolation.py"

[tasks."check:test-contracts"]
description = "Verify Wyrd critical Rust contracts have explicit Python test markers"
run = "python scripts/check_test_contracts.py"

[tasks."check:wasm"]
description = "Build wyrd-spec for wasm32"
run = "cargo check --locked --target wasm32-unknown-unknown -p wyrd-spec --features wasm"

[tasks."check:deny"]
description = "cargo-deny check (licenses, advisories, sources, bans)"
run = "cargo deny check"

[tasks."sqlx:prepare"]
description = "Refresh committed sqlx offline query metadata"
run = "cargo sqlx prepare --workspace"

[tasks."py:setup"]
description = "Sync Python dev dependencies and build the Wyrd native extension"
dir = "python/py-wyrd"
depends = ["codegen:stubs"]
run = ["uv sync --all-extras --group dev", "uv run maturin develop"]

[tasks."py:test:unit"]
description = "Run Python unit tests except TensorFlow-marked tests"
dir = "python/py-wyrd"
depends = ["py:setup"]
run = "uv run python scripts/run_unit_tests.py"

[tasks."py:test:tensorflow"]
description = "Run TensorFlow-marked Python unit tests"
dir = "python/py-wyrd"
depends = ["py:setup"]
run = "uv run pytest -q -m tensorflow"

[tasks."py:format"]
description = "Format Wyrd Python package and tests with Ruff"
dir = "python/py-wyrd"
run = ["uv run ruff format python/wyrd tests scripts", "uv run ruff check --fix python/wyrd tests scripts"]

[tasks."py:format:check"]
description = "Check Wyrd Python formatting"
dir = "python/py-wyrd"
run = "uv run ruff format --check python/wyrd tests scripts"

[tasks."py:lints"]
description = "Run Wyrd Python Ruff lint checks"
dir = "python/py-wyrd"
run = "uv run ruff check python/wyrd tests scripts"

[tasks."py:typecheck"]
description = "Run ty over the generated Python stub surface"
dir = "python/py-wyrd"
run = "uv run ty check python/wyrd/*.pyi python/wyrd/*/__init__.pyi tests/cards/data/test_public_surface.py"

[tasks."examples:python:datacard"]
description = "Run the local DataCard Python example"
dir = "python/py-wyrd"
depends = ["py:setup"]
run = "uv run python ../../examples/python/datacard_local_workflow.py"

[tasks."examples:python:workflow:openai"]
description = "Run the sequential OpenAI workflow example"
dir = "python/py-wyrd"
depends = ["py:setup"]
run = "uv run python ../../examples/python/workflow_openai.py"

[tasks."examples:python:workflow:anthropic"]
description = "Run the sequential Anthropic workflow example"
dir = "python/py-wyrd"
depends = ["py:setup"]
run = "uv run python ../../examples/python/workflow_anthropic.py"

[tasks."examples:python:workflow:gemini"]
description = "Run the sequential Gemini workflow example"
dir = "python/py-wyrd"
depends = ["py:setup"]
run = "uv run python ../../examples/python/workflow_gemini.py"

[tasks."examples:python:workflow:gateway"]
description = "Run the split-registry gateway workflow example"
dir = "python/py-wyrd"
depends = ["py:setup"]
run = "uv run python ../../examples/python/workflow_gateway.py"

[tasks."check:examples"]
description = "Build all example binaries"
run = "cargo build -p skald-workflow --examples --all-features"

[tasks."dev:backend"]
description = "Build and run wyrd-server on :8080"
run = [
  "cargo build -p wyrd-server",
  "WYRD_SERVER_PORT=${WYRD_SERVER_PORT:-8080} ./target/debug/wyrd-server",
]

[tasks."dev:frontend"]
description = "SvelteKit dev server on :3000"
dir = "crates/wyrd/wyrd-server/wyrd-ui"
run = "pnpm run dev --host 0.0.0.0 --port ${WYRD_UI_PORT:-3000}"

[tasks."docs:install"]
description = "Install docs dependencies from the lockfile"
dir = "docs"
run = "pnpm install --frozen-lockfile"

[tasks."docs:generate"]
description = "Generate docs pages from Wyrd schemas and API metadata"
dir = "docs"
run = """
python scripts/generate_card_docs.py
python scripts/generate_api_docs.py
python scripts/generate_llms_txt.py
"""

[tasks."docs:check:commands"]
description = "Fail public docs snippets that bypass mise"
dir = "docs"
run = "python scripts/check_commands.py"

[tasks."docs:linkcheck"]
description = "Validate local Markdown links in the docs site"
dir = "docs"
run = "python scripts/check_links.py"

[tasks."docs:astro:check"]
description = "Run Astro type and content checks for the docs site"
dir = "docs"
run = "pnpm astro check"

[tasks."docs:build"]
description = "Build the Starlight docs site"
dir = "docs"
run = "pnpm astro build"

[tasks."docs:check"]
description = "Docs gate: install, generate, drift check, command check, link check, Astro check, and build"
depends = ["docs:install"]
run = """
mise run docs:generate
git diff --exit-code -- docs/src/content/docs/cards/ docs/src/content/docs/api/ || (echo "Generated docs are out of date. Run 'mise run docs:generate' and commit the result." && exit 1)
mise run docs:check:commands
mise run docs:linkcheck
mise run docs:astro:check
mise run docs:build
"""

[tasks."docs:dev"]
description = "Run the Starlight docs dev server on :4321"
depends = ["docs:install", "docs:generate"]
dir = "docs"
run = "pnpm astro dev --host 0.0.0.0 --port ${WYRD_DOCS_PORT:-4321}"

[tasks."dev:both"]
description = "Run wyrd-server (:8080) and UI (:3000) in parallel"
run = """
cargo build -p wyrd-server
WYRD_SERVER_PORT=${WYRD_SERVER_PORT:-8080} ./target/debug/wyrd-server &
BACKEND_PID=$!
cd crates/wyrd/wyrd-server/wyrd-ui && pnpm run dev --host 0.0.0.0 --port ${WYRD_UI_PORT:-3000} &
FRONTEND_PID=$!
trap 'kill $BACKEND_PID $FRONTEND_PID 2>/dev/null' EXIT INT TERM
wait $BACKEND_PID $FRONTEND_PID
"""

[tasks."dev:full"]
description = "Boot wyrd-server, wyrd-observability-server, and UI on :3000"
run = """
cargo build -p wyrd-server -p wyrd-observability-server
WYRD_SERVER_PORT=${WYRD_SERVER_PORT:-8080} ./target/debug/wyrd-server &
SERVER_PID=$!
WYRD_OBS_SERVER_PORT=${WYRD_OBS_SERVER_PORT:-8090} ./target/debug/wyrd-observability-server &
OBS_PID=$!
cd crates/wyrd/wyrd-server/wyrd-ui && pnpm install --frozen-lockfile && pnpm run dev --host 0.0.0.0 --port ${WYRD_UI_PORT:-3000} &
UI_PID=$!
trap 'kill $SERVER_PID $OBS_PID $UI_PID 2>/dev/null' EXIT INT TERM
wait $SERVER_PID $OBS_PID $UI_PID
"""

[tasks.check]
description = "Phase 0 gate: fmt --check + clippy + cargo check (workspace, all features)"
run = """
cargo fmt --all -- --check
cargo clippy --locked --workspace --all-features --all-targets -- -D warnings
cargo check --locked --workspace --all-features
"""

[tasks."codegen:regen"]
description = "Regenerate OpenAPI / JSON schemas / MCP tool list / pyi stubs from source"
run = """
cargo run --locked -p wyrd-spec --example gen_schemas --features server
mise run codegen:stubs
test -f openapi.yaml || { echo 'openapi.yaml missing'; exit 1; }
"""

[tasks."codegen:stubs"]
description = "Regenerate Python type stubs"
dir = "python/py-wyrd"
run = "uv run python scripts/assemble_stubs.py"

[tasks."codegen:check"]
description = "Fail if generated openapi/schemas/MCP/pyi drift from source"
run = """
snapshot_codegen() {
  {
    test -f openapi.yaml && printf '%s\n' openapi.yaml
    find crates/wyrd-spec/schemas crates/wyrd-spec/tests/schemas -type f -name '*.json'
    find python/py-wyrd/python/wyrd -type f -name '*.pyi' \
      ! -path 'python/py-wyrd/python/wyrd/stubs/*'
  } | sort | while IFS= read -r file; do
    shasum -a 256 "$file"
  done
}
BEFORE=$(mktemp)
AFTER=$(mktemp)
trap 'rm -f "$BEFORE" "$AFTER"' EXIT
snapshot_codegen > "$BEFORE"
mise run codegen:regen
snapshot_codegen > "$AFTER"
diff -u "$BEFORE" "$AFTER" \
  || { echo 'codegen drift detected - run mise run codegen:regen and commit'; exit 1; }
"""

[tasks."check:single-into-response-impl"]
description = "Assert Wyrd HTTP errors flow through one server IntoResponse mapper"
run = """
set -eu

matches=$(rg -n 'impl IntoResponse for (WyrdErrorResponse|.*Wyrd.*Error)' crates --glob '*.rs' || true)
count=$(printf '%s\n' "$matches" | sed '/^$/d' | wc -l | tr -d ' ')

if [ "$count" != "1" ]; then
  echo "expected exactly one Wyrd error IntoResponse mapper, found $count"
  printf '%s\n' "$matches"
  exit 1
fi

case "$matches" in
  crates/wyrd/wyrd-server/src/error.rs:*'impl IntoResponse for WyrdErrorResponse'*)
    ;;
  *)
    echo "Wyrd error IntoResponse mapper must stay in wyrd-server/src/error.rs"
    printf '%s\n' "$matches"
    exit 1
    ;;
esac
"""

[tasks."pre-pr"]
description = "Aggregate gate: check + codegen:check + Python package checks + docs and examples"
depends = ["check", "test:unit", "test:storage:local", "codegen:check", "cardkind:check", "check:client-tier", "check:pyo3-scope", "check:mocks-scope", "check:unwrap-audit", "check:storage:drift", "check:object-store-pin", "check:error-coverage", "check:tenant-isolation", "check:test-contracts", "check:wasm", "check:deny", "py:setup", "py:format:check", "py:lints", "py:typecheck", "py:test:unit", "examples:python:datacard", "check:examples", "check:docs"]

[tasks."test:sql"]
description = """Run live Postgres SQL integration tests.
Required env vars:
  WYRD_DATABASE_URL_MIGRATOR=postgres://wyrd_migrator:<pw>@localhost/wyrd
  WYRD_DATABASE_URL=postgres://wyrd_app:<pw>@localhost/wyrd  (required for cross-tenant RLS test)
"""
run = "cargo test --locked -p wyrd-sql --all-features --test migration_pg -- --nocapture"

[tasks."dev:pg:nuke"]
description = "Wipe embedded pg cache"
run = "rm -rf ${WYRD_DEV_PG_CACHE}"
