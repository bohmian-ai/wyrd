trap 'rm -f "$WYRD_CONTRACTS"' EXIT
(cd .. && cargo run --locked -q -p wyrd-spec --example gen_schemas --features server -- contracts) > "$WYRD_CONTRACTS"
WYRD_CONTRACTS="$WYRD_CONTRACTS" pnpm test
"""

