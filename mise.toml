[tasks."bench:l2:bifrost"]
description = "Level 2 Bifrost `competing` (120 s warmup, 3 x 360 s, 20-30 min): every repetition runs capacity, overload and recovery over the 100M-row Parquet fixture with Forge compaction, open-loop 50/30/20 spans/logs/native ingest at 70% of the mixed capacity calibrated from the newest compatible bench:l1:bifrost record (INVALID without one) times --server-cores (default 8), 32 mixed query clients, a full query queue, and three client-queue lanes. Opt-in benchmark experiment; part of no gate, CI or verify lane. Builds the release wyrd-server and capacity driver with frame pointers into target/profiling before the experiment clock starts, then runs under a fresh repository Postgres on the whole host (macOS arm64, Linux x86_64, Linux arm64) with a file:// store. Discards the run (exit 2) on a busy host, dirty source (unless --allow-dirty), overrun or unresolved evidence; fails (exit 1) on a declared criterion. Appends one v1 record under benchmarks/<engine>/<experiment>/ and prints its report; raw artifacts stay under target/benchmarks/. `--profile` adds optional samply captures, `--steps a,b` runs a declared subset that records its omissions. See benchmarks/README.md."
depends = ["bench:build"]
run = "scripts/postgres/with-test-postgres.sh -- target/profiling/release/capacity l2 bifrost"

[tasks."bench:l2:verification"]
description = "Level 2 Verification `competing` (120 s warmup, 3 x 360 s, 20-30 min): every repetition runs capacity, overload and recovery with open-loop direct and background verification and their evidence writes overlapping; direct overhead p99 < 500 us at capacity and recovery, backlog growth <= 1 s of offered work, drain <= 60 s and recovery <= 30 s. `--direct-rate`, `--submit-rate` and `--overload-factor` fix the declared rates. Opt-in benchmark experiment; part of no gate, CI or verify lane. Builds the release wyrd-server and capacity driver with frame pointers into target/profiling before the experiment clock starts, then runs under a fresh repository Postgres on the whole host (macOS arm64, Linux x86_64, Linux arm64) with a file:// store. Discards the run (exit 2) on a busy host, dirty source (unless --allow-dirty), overrun or unresolved evidence; fails (exit 1) on a declared criterion. Appends one v1 record under benchmarks/<engine>/<experiment>/ and prints its report; raw artifacts stay under target/benchmarks/. `--profile` adds optional samply captures, `--steps a,b` runs a declared subset that records its omissions. See benchmarks/README.md."
depends = ["bench:build"]
run = "scripts/postgres/with-test-postgres.sh -- target/profiling/release/capacity l2 verification"

[tasks."bench:l2:gateway"]
description = "Level 2 Gateway `capacity` (120 s warmup, 3 x 360 s, 20-30 min): every repetition runs capacity, overload and recovery with four contending tenants open-loop against a paced local upstream and payload capture; server p99 completion <= 200 ms, first token <= 350 ms and full stream <= 1,100 ms (overridable with --max-completion-ms, --max-first-token-ms, --max-stream-ms; inter-chunk lag is diagnostic only), only the two declared 429 refusals and only under overload, and every capture accounted for. `--rate` fixes the offered rate (default 250 calls/s). Opt-in benchmark experiment; part of no gate, CI or verify lane. Builds the release wyrd-server and capacity driver with frame pointers into target/profiling before the experiment clock starts, then runs under a fresh repository Postgres on the whole host (macOS arm64, Linux x86_64, Linux arm64) with a file:// store. Discards the run (exit 2) on a busy host, dirty source (unless --allow-dirty), overrun or unresolved evidence; fails (exit 1) on a declared criterion. Appends one v1 record under benchmarks/<engine>/<experiment>/ and prints its report; raw artifacts stay under target/benchmarks/. `--profile` adds optional samply captures, `--steps a,b` runs a declared subset that records its omissions. See benchmarks/README.md."
