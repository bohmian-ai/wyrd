[tasks."bench:l1:gateway"]
description = "Level 1 Gateway `overhead` (5 s warmup, 3 x 10 s per step, 15 min budget): buffered chat, chat-stream and 64 KiB chat-capture against an instant local upstream at 1/4/16/64 closed-loop clients, added overhead p99 < 500 us at 64 clients at every handoff point, requests per server CPU-second, and one staged capture per call with nothing lost or shed. Opt-in benchmark experiment; part of no gate, CI or verify lane. Builds the release wyrd-server and capacity driver with frame pointers into target/profiling before the experiment clock starts, then runs under a fresh repository Postgres on the whole host (macOS arm64, Linux x86_64, Linux arm64) with a file:// store. Discards the run (exit 2) on a busy host, dirty source (unless --allow-dirty), overrun or unresolved evidence; fails (exit 1) on a declared criterion. Appends one v1 record under benchmarks/<engine>/<experiment>/ and prints its report; raw artifacts stay under target/benchmarks/. `--profile` adds optional samply captures, `--steps a,b` runs a declared subset that records its omissions. See benchmarks/README.md."
