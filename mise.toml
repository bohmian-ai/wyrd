[tasks."ts:test:integration"]
description = """@wyrd/sdk client->server->client Bifrost journey (slice 13/13a).
Builds the public @wyrd/sdk addon and the private @wyrd/testing harness addon, then runs
Vitest, which boots WyrdTestServer IN-PROCESS (embedded Postgres, seeded tenant, minted key)
via the @wyrd/testing native harness and drives @wyrd/sdk against it, tearing down via
shutdown() in finally — symmetric with the Python journey. No external Postgres, no
out-of-process server, no shell orchestration.
"""
depends = ["ts:build", "ts:build:testing"]
dir = "typescript/wyrd"
run = "pnpm exec vitest run tests/integration"

