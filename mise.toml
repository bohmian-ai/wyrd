# ============================================================================
# Canonical developer loop — these are the tasks you run directly.
# `mise tasks` lists only these; every other task is a CI shard or invariant
# check that runs as a `gate` dependency (still runnable by name, just hidden).
#
#   mise run check       Fast pre-commit loop: fmt --check + clippy + cargo check.
#   mise run gate        Full nightly/release/fallback aggregate.
#
#   mise run test:rust   Broad Rust aggregate.
#   mise run verify:bifrost   Complete scoped Bifrost gate.
#   mise run test:wyrd/skald/vala/shared   Family lanes (skip pg_tests, no docker needed).
#   mise run py:test:unit   Python suite (builds the extension, then pytest).
#
#   mise exec -- cargo nextest run --locked -p <crate> --lib \
#     -E 'test(=module::tests::name)'                     Iterate on one named test.
#
# Need a hidden task? `mise run <name>` still works; `mise tasks --hidden` lists all.
# ============================================================================
[tools]
node = "26.2.0"
uv = "0.11.16"
rust = "1.95.0"
"npm:pnpm" = "11.4.0"
cmake = "3.26.4"
protoc = "33.2"
"cargo:cargo-nextest" = "0.9.143"

[settings]
env_shell_expand = false
# jobs = 1 keeps the repository task graph deterministic. Postgres-backed leaves
# own isolated Compose projects, so concurrent direct wrapper invocations remain
# safe even though mise itself schedules tasks serially by default.
jobs = 1

[env]
UI_DIR = "crates/wyrd/wyrd-server/wyrd-ui"
PY_DIR = "python/py-wyrd"
WYRD_DEV_PG_CACHE = "${HOME}/.cache/wyrd/pg"
# A panicking test should say where it panicked. Every lane below runs under
# this, so a failure report never costs a second run to reproduce with
# backtraces enabled.
RUST_BACKTRACE = "1"
# Canonical vala-bifrost-redux test feature union. wyrd-testing depends on
# vala-bifrost-redux with `test-support` + `bench-support` (a default-feature
# wyrd-testing unit test uses `vala_bifrost_redux::bench_support`), so every
# wyrd-testing test lane already compiles the crate at that union. The direct
# vala-bifrost-redux `--test integration` lanes reference this same string so
# they reuse that one compiled DataFusion cone instead of building a second
# `test-support`-only artifact.
WYRD_REDUX_TEST_FEATURES = "test-support,bench-support"

[tasks.fmt]
description = "Format all Rust code"
run = "cargo fmt --all"

[tasks.lints]
description = "Workspace clippy with -D warnings (all features, all targets)"
run = "cargo clippy --locked --workspace --all-features --all-targets -- -D warnings"

[tasks."impl:warm"]
hide = true
description = "Seed the shared cargo target dir by compiling the workspace before dispatching a wave. All executors share one CARGO_TARGET_DIR, so warming once builds the heavy deps (DataFusion/Arrow/Iceberg) a single time; each executor then reuses them instead of cold-building in parallel and racing on cargo's build lock."
run = "cargo build --workspace --all-features --all-targets"

[tasks."test:wyrd"]
hide = true
description = "Run wyrd family tests inside an isolated Postgres lifecycle; package list in scripts/test-families.sh"
run = "scripts/postgres/with-test-postgres.sh -- mise run test:wyrd:inner"

[tasks."test:wyrd:inner"]
hide = true
description = "Run wyrd family tests with the lifecycle already provisioned; package list in scripts/test-families.sh"
run = "bash scripts/run-family-tests.sh wyrd"

[tasks."test:skald"]
