# ============================================================================
# Canonical developer loop — these are the tasks you run directly.
# `mise tasks` lists only these; every other task is a CI shard or invariant
# check that runs as a `pre-pr` dependency (still runnable by name, just hidden).
#
#   mise run check       Fast pre-commit loop: fmt --check + clippy + cargo check.
#   mise run pre-pr      The full gate. Run this before pushing — it is the
#                        answer to "make sure everything passes" (Rust + Python +
#                        codegen + docs + every boundary invariant).
#
#   mise run test:unit   All Rust tests (workspace + storage emulators + sql).
#   mise run test:bifrost   DataFusion/Postgres Rust tests (separate CI job).
#   mise run py:test:unit   Python suite (builds the extension, then pytest).
#
#   cargo test -p <crate> <name> --all-features    Iterate on one crate/test.
#
# Need a hidden task? `mise run <name>` still works; `mise tasks --hidden` lists all.
# ============================================================================
[tools]
node = "26.2.0"
uv = "0.11.16"
rust = "1.95.0"
"npm:pnpm" = "11.4.0"
cmake = "3.26.4"
protoc = "33.2"

[settings]
env_shell_expand = false

[env]
UI_DIR = "crates/wyrd/wyrd-server/wyrd-ui"
PY_DIR = "python/py-wyrd"
WYRD_DEV_PG_CACHE = "${HOME}/.cache/wyrd/pg"

[tasks.fmt]
description = "Format all Rust code"
run = "cargo fmt --all"

[tasks.lints]
description = "Workspace clippy with -D warnings (all features, all targets)"
run = "cargo clippy --locked --workspace --all-features --all-targets -- -D warnings"

[tasks."build:postgres"]
hide = true
description = "Start a clean Postgres container via docker compose and wait for it to be healthy"
# --force-recreate --renew-anon-volumes guarantees a genuinely fresh container
# and storage even if a healthy container is already running (otherwise `up` is a
# no-op and reuses the old PGDATA). Combined with the postgres tmpfs mount, the
# test DB is empty on every invocation — no stale _sqlx_migrations ledger.
run = ["docker compose down --volumes --remove-orphans", "docker compose up -d --build --force-recreate --renew-anon-volumes postgres --wait"]

[tasks."impl:setup"]
hide = true
description = "One-time environment bring-up before the first wyrd-implement wave: shared docker Postgres that every worktree reaches at localhost:5432, plus the migrated wyrd_test DB the reset shard needs. Run once, not per worktree."
depends = ["build:postgres", "db:migrate:all"]
run = "echo 'impl env ready: shared Postgres up + wyrd_test migrated; mise supplies DATABASE_URL / WYRD_* per verify task'"

[tasks."impl:warm"]
hide = true
description = "Warm the shared sccache by compiling the workspace on the impl base before dispatching a wave. Per-worktree CARGO_TARGET_DIR means each executor is cold on disk; sccache turns those into warm object-cache hits. Requires sccache + RUSTC_WRAPPER=sccache in the environment."
run = "cargo build --workspace --all-features --all-targets"

[tasks."test:rust:workspace"]
hide = true
description = "Run workspace Rust unit tests (no DB required)"
run = """
cargo test --locked --workspace --exclude py-wyrd --exclude wyrd-server --exclude vala-bifrost --exclude vala-sql --exclude vala-core --exclude wyrd-client
cargo test --locked -p wyrd-client
cargo test --locked -p vala-core
cargo test --locked -p vala-sql --lib
"""

[tasks."test:bifrost"]
description = """Run vala-bifrost and vala-sql integration tests against the shared wyrd_test Postgres DB.
Runs serially because each test resets shared database state at test start.
"""
depends = ["build:postgres", "db:migrate:all", "test:pg"]
env = { WYRD_DATABASE_URL = "postgres://wyrd_app:wyrd_app_pw@localhost/wyrd_test", WYRD_DATABASE_MIGRATOR_PASSWORD = "wyrd_migrator_pw", WYRD_DATABASE_PLATFORM_ADMIN_PASSWORD = "wyrd_platform_admin_pw" }
# Default features only: --all-features would enable `python`, which links
# libpython at runtime and aborts outside the py env.
run = """
cargo test --locked -p vala-bifrost -- --test-threads=1
cargo test --locked -p vala-sql --all-features -- --test-threads=1
"""

[tasks."test:unit"]
description = """Aggregate Rust test gate: workspace + storage emulator matrix + sql + registry-e2e.
Bifrost (DataFusion-heavy) runs as a separate CI job via test:bifrost to avoid artifact-lock
contention; add test:bifrost to pre-pr or run it directly to include it locally.
Only real-credential cloud storage tests (test:storage:{s3,gcs,azure}:cloud) are gated to
storage-integration-cloud.yml; emulator-backed storage tests run here because they are just
docker containers, same difficulty as Postgres.
"""
depends = ["test:rust:workspace", "test:storage:matrix", "test:sql", "test:registry-e2e", "test:pg"]

[tasks."test:wyrd-spec"]
hide = true
description = "Run wyrd-spec Rust tests"
run = "cargo test -p wyrd-spec --all-features"

[tasks."test:wyrd-spec:doc"]
hide = true
description = "Run wyrd-spec Rust doc tests"
run = "cargo test --locked --doc --all-features -p wyrd-spec"

[tasks."test:wyrd-error-derive"]
hide = true
description = "Run wyrd-error-derive tests"
run = "cargo test -p wyrd-error-derive --all-features"

[tasks."test:wyrd-server"]
hide = true
description = """Run wyrd-server Rust tests against the shared wyrd_test Postgres DB."""
depends = ["test:pg"]
env = { WYRD_DATABASE_URL = "postgres://wyrd_app:wyrd_app_pw@localhost/wyrd_test", WYRD_DATABASE_MIGRATOR_PASSWORD = "wyrd_migrator_pw", WYRD_DATABASE_PLATFORM_ADMIN_PASSWORD = "wyrd_platform_admin_pw" }
run = "cargo test --locked -p wyrd-server --all-features -- --test-threads=1"

[tasks."test:wyrd-mcp"]
hide = true
description = "Run wyrd-mcp tests (MCP contract-artifact record types + projection). Narrow gate; no docker."
run = "cargo test -p wyrd-mcp --all-features"

[tasks."identity:e2e"]
hide = true
description = """Stand up real OIDC providers (Keycloak + Dex), seed test users via the Keycloak
admin REST API, export env gates, run the identity e2e suite against both issuers, then tear down.
Gated by WYRD_IDENTITY_E2E=1; skipped when the env var is unset so default local runs are fast.
"""
depends = ["build:postgres", "db:setup-roles", "db:migrate"]
env = { WYRD_IDENTITY_E2E = "1", WYRD_KEYCLOAK_ISSUER = "http://localhost:8080/realms/wyrd-test", WYRD_DEX_ISSUER = "http://localhost:5556", WYRD_DATABASE_URL = "postgres://wyrd_app:wyrd_app_pw@localhost/wyrd", WYRD_DATABASE_MIGRATOR_PASSWORD = "wyrd_migrator_pw", WYRD_DATABASE_PLATFORM_ADMIN_PASSWORD = "wyrd_platform_admin_pw" }
run = """
set -e

# Bring up Keycloak and Dex (postgres was brought up by depends)
docker compose up -d keycloak dex --wait

# Seed Keycloak users via admin REST API (realm import only defines clients/groups)
python3 - <<'PYEOF'
import json, urllib.request, urllib.parse, time, sys

BASE = "http://localhost:8080"
REALM = "wyrd-test"

def get_admin_token():
    data = urllib.parse.urlencode({
        "grant_type": "password",
        "client_id": "admin-cli",
        "username": "admin",
        "password": "admin",
    }).encode()
    req = urllib.request.Request(
        f"{BASE}/realms/master/protocol/openid-connect/token", data=data
    )
    resp = json.loads(urllib.request.urlopen(req).read())
    return resp["access_token"]

def api(method, path, body=None, token=None):
    url = f"{BASE}/admin/realms/{REALM}{path}"
    data = json.dumps(body).encode() if body else None
    headers = {"Content-Type": "application/json"}
    if token:
        headers["Authorization"] = f"Bearer {token}"
    req = urllib.request.Request(url, data=data, headers=headers, method=method)
    try:
        r = urllib.request.urlopen(req)
        raw = r.read()
        return json.loads(raw) if raw else None
    except urllib.error.HTTPError as e:
        body = e.read()
        if e.code == 409:  # already exists — idempotent
            return None
        raise RuntimeError(f"API {method} {path} → {e.code}: {body}") from e

for attempt in range(30):
    try:
        token = get_admin_token()
        break
    except Exception:
        time.sleep(2)
else:
    sys.exit("Keycloak admin API not ready after 60s")

def create_user(username, email, password, group_path):
    api("POST", "/users", {
        "username": username,
        "email": email,
        "firstName": username.capitalize(),
        "lastName": "Wyrd",
        "emailVerified": True,
        "enabled": True,
        "requiredActions": [],
    }, token)
    users = api("GET", f"/users?username={username}", token=token) or []
    if not users:
        sys.exit(f"user {username} not found after creation")
    uid = users[0]["id"]
    api("PUT", f"/users/{uid}/reset-password", {
        "type": "password",
        "temporary": False,
        "value": password,
    }, token)
    groups = api("GET", f"/groups?search={group_path.lstrip('/')}", token=token) or []
    if groups:
        api("PUT", f"/users/{uid}/groups/{groups[0]['id']}", token=token)

create_user("alice", "alice@wyrd.test", "alice-password", "wyrd-admins")
create_user("bob", "bob@wyrd.test", "wyrd-test", "wyrd-viewers")
print("Keycloak users seeded")
PYEOF

cargo test -p wyrd-server --all-features --test identity_e2e -- --nocapture --test-threads=1

docker compose stop keycloak dex
"""

[tasks."build:server:oss"]
hide = true
description = "Build the OSS wyrd-server release binary"
run = "cargo build --release --locked -p wyrd-server"

[tasks."build:server:enterprise"]
hide = true
description = "Build the enterprise wyrd-server release binary"
run = "cargo build --release --locked -p wyrd-server --features enterprise"

[tasks."docker:build:oss"]
hide = true
description = "Build the OSS wyrd-server Docker image"
run = "docker build -f docker/Dockerfile --build-arg WYRD_FLAVOR=oss -t wyrd-server:oss ."

[tasks."docker:build:enterprise"]
hide = true
description = "Build the enterprise wyrd-server Docker image"
run = "docker build -f docker/Dockerfile --build-arg WYRD_FLAVOR=enterprise -t wyrd-server:enterprise ."

[tasks."check:docs"]
hide = true
description = "Build public Rust docs and doctests"
run = """
RUSTDOCFLAGS="-D missing_docs -D rustdoc::broken_intra_doc_links" cargo doc --locked --no-deps --all-features \
  -p wyrd-spec \
  -p wyrd-auth-issue \
  -p wyrd-auth-verify
cargo test --locked --doc --all-features \
  -p wyrd-spec \
  -p wyrd-auth-verify \
  -p wyrd-auth-issue
"""

[tasks."cardkind:check"]
hide = true
description = "Verify CardKind native count and External serde shape"
run = "cargo test -p wyrd-spec --test cards kind:: --features server"

[tasks."check:client-tier"]
hide = true
description = "Foundation invariants: wyrd-spec server-tier-free; shared shells pyo3+sqlx-free; Skald keeps only locked Wyrd foundation edges"
run = """
set -eu

forbidden_spec=$(cargo tree -p wyrd-spec --no-default-features -e normal | \
  rg '(^|[ ─└├])(utoipa|pyo3|sqlx|axum|opentelemetry|reqwest|tokio)' || true)
if [ -n "$forbidden_spec" ]; then
  echo "FAIL: wyrd-spec pulls forbidden deps at --no-default-features:"
  echo "$forbidden_spec"
  exit 1
fi

for crate in wyrd-auth-verify; do
  forbidden_shared=$(cargo tree -p "$crate" --all-features -e normal | \
    rg '(^|[ ─└├])(pyo3|sqlx)' || true)
  if [ -n "$forbidden_shared" ]; then
    echo "FAIL: $crate pulls forbidden deps:"
    echo "$forbidden_shared"
    exit 1
  fi
done

# `tower-http` is intentionally absent: it is a non-optional transitive
# dependency of `reqwest` (client-side follow-redirect), the sanctioned async
# HTTP client for the auth exchange and HTTP transport. `axum` still flags the
# server HTTP stack.
forbidden_wyrd_client=$(cargo tree -p wyrd-client --all-features -e normal | \
  rg '(^|[ ─└├])(sqlx|tokio-postgres|postgres|deltalake|datafusion|axum|kube|aws-sdk|azure_|google-cloud|opendal|rdkafka|lapin|redis|deadpool-|vala-)' || true)
if [ -n "$forbidden_wyrd_client" ]; then
  echo "FAIL: wyrd-client pulls forbidden client-tier deps:"
  echo "$forbidden_wyrd_client"
  exit 1
fi

forbidden_skald_prompt=$(cargo tree -p skald-prompt --all-features -e normal | \
  rg '(^|[ ─└├])(reqwest|tokio|hyper|axum|sqlx|opentelemetry|skald-runtime|skald-providers|skald-cache|skald-tool)' || true)
if [ -n "$forbidden_skald_prompt" ]; then
  echo "FAIL: skald-prompt pulls forbidden client-unsafe deps:"
  echo "$forbidden_skald_prompt"
  exit 1
fi

for crate in skald-agent skald-workflow skald-tool skald-runtime; do
  forbidden_skald_member=$(cargo tree -p "$crate" --all-features -e normal | \
    rg '(^|[ ─└├])(wyrd-|vala-)' | \
    rg -v '(^|[ ─└├])(wyrd-spec|wyrd-semver|wyrd-interfaces|wyrd-utils|wyrd-runtime|wyrd-error-derive|wyrd-observe)' || true)
  if [ -n "$forbidden_skald_member" ]; then
    echo "FAIL: $crate pulls forbidden Wyrd/Vala deps outside the locked foundation set:"
    echo "$forbidden_skald_member"
    exit 1
  fi
done

if rg -n 'wyrd_spec|wyrd-' crates/skald \
  --glob '!crates/skald/skald-prompt/**' \
  --glob '!crates/skald/skald-agent/**' \
  --glob '!crates/skald/skald-agent/Cargo.toml' \
  --glob '!crates/skald/skald-tool/Cargo.toml' \
  --glob '!crates/skald/skald-workflow/**'; then
  echo 'Skald engine crates must remain free of Wyrd references outside locked boundary crates'
  exit 1
fi

if rg -n 'wyrd_cards|wyrd-cards' crates/skald/skald-agent; then
  echo 'skald-agent must not depend on wyrd-cards'
  exit 1
fi

if ! rg -q 'wyrd-(spec|interfaces|utils)' crates/skald/skald-prompt/Cargo.toml; then
  echo 'skald-prompt must remain the documented Skald/Wyrd boundary crate'
  exit 1
fi
"""

[tasks."check:registry-no-server-routes"]
hide = true
description = "wyrd-sql must not import axum/hyper/tower from any module (registry seam is durable, not route)"
run = """
rg -n 'use axum::|use hyper::|use tower::' crates/wyrd/wyrd-sql/src/ && exit 1 || exit 0
"""

[tasks."check:pyo3-scope"]
hide = true
description = "Assert PyO3 stays out of pure contracts and Python-free shared crates"
run = """
set -eu

if rg -n 'pyo3|pymodule|pyclass|pymethods' crates/wyrd-spec; then
  echo 'PyO3 scope violation detected in wyrd-spec'
  exit 1
fi

if rg -n 'pyo3|pymodule|pyclass|pymethods' crates/shared \
  --glob '!crates/shared/wyrd-utils/**' \
  --glob '!crates/shared/wyrd-observe/**'; then
  echo 'PyO3 scope violation detected in Python-free shared crates'
  exit 1
fi

if rg -n 'pyo3|pymodule|pyclass|pymethods|Python|Bound<|Py<|PyErr' crates/skald \
  --glob '!crates/skald/skald-prompt/**' \
  --glob '!crates/skald/skald-runtime/Cargo.toml' \
  --glob '!crates/skald/skald-runtime/src/lib.rs' \
  --glob '!crates/skald/skald-runtime/src/python.rs' \
  --glob '!crates/skald/skald-agent/Cargo.toml' \
  --glob '!crates/skald/skald-agent/src/agent.rs' \
  --glob '!crates/skald/skald-agent/src/lib.rs' \
  --glob '!crates/skald/skald-agent/src/py_error.rs' \
  --glob '!crates/skald/skald-agent/src/python.rs' \
  --glob '!crates/skald/skald-agent/src/run.rs' \
  --glob '!crates/skald/skald-agent/src/session.rs' \
  --glob '!crates/skald/skald-tool/Cargo.toml' \
  --glob '!crates/skald/skald-tool/src/lib.rs' \
  --glob '!crates/skald/skald-tool/src/python.rs' \
  --glob '!crates/skald/skald-workflow/Cargo.toml' \
  --glob '!crates/skald/skald-workflow/src/lib.rs' \
  --glob '!crates/skald/skald-workflow/src/python.rs' \
  --glob '!crates/skald/skald-workflow/src/run.rs' \
  --glob '!crates/skald/skald-workflow/src/task.rs' \
  --glob '!crates/skald/skald-workflow/src/workflow_surface.rs'; then
  echo 'PyO3 scope violation detected in Python-free Skald engine crates'
  exit 1
fi

for crate in skald-prompt skald-runtime skald-agent skald-tool skald-workflow; do
  manifest="crates/skald/$crate/Cargo.toml"
  if ! rg -q 'python = \\[' "$manifest" || ! rg -q 'dep:pyo3' "$manifest"; then
    echo "$crate must gate PyO3 behind its python feature"
    exit 1
  fi

  if ! rg -q 'pyo3 = \\{ workspace = true, optional = true \\}' "$manifest"; then
    echo "$crate PyO3 dependency must remain optional"
    exit 1
  fi
done

if ! rg -qF 'python = ["dep:pyo3"]' crates/shared/wyrd-utils/Cargo.toml; then
  echo 'wyrd-utils must gate PyO3 behind its python feature'
  exit 1
fi

if ! rg -q 'pyo3 = \\{ workspace = true, optional = true \\}' crates/shared/wyrd-utils/Cargo.toml; then
  echo 'wyrd-utils PyO3 dependency must remain optional'
  exit 1
fi

if ! rg -q '#\\[cfg\\(feature = "python"\\)\\]' crates/shared/wyrd-utils/src/lib.rs; then
  echo 'wyrd-utils Python helpers must remain cfg-gated'
  exit 1
fi

forbidden_utils_default=$(cargo tree -p wyrd-utils --no-default-features -e normal | \
  rg '(^|[ ─└├])pyo3' || true)
if [ -n "$forbidden_utils_default" ]; then
  echo "FAIL: wyrd-utils pulls PyO3 without its python feature:"
  echo "$forbidden_utils_default"
  exit 1
fi
"""

[tasks."check:mocks-scope"]
hide = true
description = "Assert mock helpers stay out of production source"
run = """
if rg -n 'mockall|wiremock|mockito' crates \
  --glob '!crates/shared/wyrd-testing/**' \
  --glob '!crates/skald/skald-providers/Cargo.toml' \
  --glob '!crates/skald/skald-providers/tests/**' \
  --glob '!crates/wyrd/wyrd-cli/Cargo.toml' \
  --glob '!crates/wyrd/wyrd-cli/tests/**' \
  --glob '!crates/shared/wyrd-auth-oidc/Cargo.toml' \
  --glob '!crates/shared/wyrd-auth-oidc/src/jwks.rs' \
  --glob '!crates/shared/wyrd-auth-oidc/src/provider.rs' \
  --glob '!crates/shared/wyrd-auth-verify/Cargo.toml' \
  --glob '!crates/shared/wyrd-auth-verify/src/lib.rs' \
  --glob '!crates/wyrd/wyrd-server/Cargo.toml' \
  --glob '!crates/wyrd/wyrd-server/src/auth/jwt_bearer.rs' \
  --glob '!crates/wyrd/wyrd-server/src/auth/callback.rs' \
  --glob '!crates/wyrd/wyrd-server/src/auth/admin.rs' \
  --glob '!crates/wyrd/wyrd-server/src/issuer_boot.rs' \
  --glob '!crates/wyrd/wyrd-cli/src/auth/trusted_issuer.rs'; then
  echo 'mock dependency leaked outside wyrd-testing'
  exit 1
fi
"""

[tasks."check:object-store-pin"]
hide = true
description = "Assert single versions of object_store/datafusion/arrow/parquet across the iceberg cone (stage1+)"
run = """
set -e
fail=0
for dep in object_store datafusion arrow parquet; do
  n=$(cargo tree --workspace -e=no-dev -d --all-features 2>/dev/null \
        | awk -v d="$dep" '$1==d {print $2}' | sort -u | wc -l | tr -d ' ')
  if [ "$n" != "0" ]; then
    echo "FAIL: $dep has multiple versions:"
    cargo tree --workspace -e=no-dev -d --all-features | awk -v d="$dep" '$1==d {print "  "$2}'
    fail=1
  fi
done
os=$(cargo tree --workspace -e=no-dev -i object_store --all-features 2>/dev/null | awk 'NR==1{print $2}')
case "$os" in v0.13.*) : ;; *) echo "FAIL: object_store $os is not 0.13.*"; fail=1 ;; esac
[ "$fail" = 0 ] && echo "OK: single object_store ($os) + single datafusion/arrow/parquet across the iceberg cone"
exit $fail
"""

[tasks."storage:up"]
description = """Start local storage emulators (RustFS, fake-gcs-server, Azurite) and
provision the shared test bucket/container on each. Setup sidecars run in the `setup`
compose profile so they are explicit one-shots, not background services.
"""
run = """
docker compose -f crates/wyrd/wyrd-storage/docker/docker-compose.yml up -d --wait
docker compose -f crates/wyrd/wyrd-storage/docker/docker-compose.yml run --rm rustfs-setup
docker compose -f crates/wyrd/wyrd-storage/docker/docker-compose.yml run --rm gcs-setup
docker compose -f crates/wyrd/wyrd-storage/docker/docker-compose.yml run --rm azurite-setup
"""

[tasks."storage:down"]
description = "Stop local storage emulators and remove their volumes"
run = "docker compose -f crates/wyrd/wyrd-storage/docker/docker-compose.yml down -v"

[tasks."storage:logs"]
hide = true
description = "Tail local storage emulator logs"
run = "docker compose -f crates/wyrd/wyrd-storage/docker/docker-compose.yml logs -f"

[tasks."test:storage:local"]
hide = true
description = "Run wyrd-storage local backend integration tests"
run = "cargo test -p wyrd-storage --all-features --test integration_local"

[tasks."test:storage:rustfs"]
hide = true
description = "Run wyrd-storage S3 integration tests against the local RustFS emulator; requires storage:up"
depends = ["storage:up"]
env = { WYRD_STORAGE_INTEGRATION_S3 = "1", AWS_ACCESS_KEY_ID = "wyrd-test-key", AWS_SECRET_ACCESS_KEY = "wyrd-test-secret", AWS_REGION = "us-east-1" }
run = "cargo test -p wyrd-storage --all-features --test integration_rustfs -- --nocapture"

[tasks."test:storage:gcs-emu"]
hide = true
description = "Run wyrd-storage GCS emulator integration tests; requires storage:up"
depends = ["storage:up"]
env = { WYRD_STORAGE_INTEGRATION_GCS = "1", WYRD_GCS_EMULATOR_HOST = "http://localhost:4443" }
run = "cargo test -p wyrd-storage --all-features --test integration_gcs -- --nocapture"

[tasks."test:storage:azurite"]
hide = true
description = "Run wyrd-storage Azurite integration tests; requires storage:up"
depends = ["storage:up"]
env = { WYRD_STORAGE_INTEGRATION_AZURE = "1", WYRD_AZURE_EMULATOR_ENDPOINT = "http://127.0.0.1:10000" }
run = "cargo test -p wyrd-storage --all-features --test integration_azurite -- --nocapture"

[tasks."test:storage:e2e"]
hide = true
description = "Run server-level storage HTTP e2e tests (local single-put + S3/GCS/Azure multipart) against the docker emulators + Postgres"
