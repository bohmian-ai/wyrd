run = "uv run python scripts/check_a11y.py"

[tasks."docs:svelte:check"]
hide = true
description = "Run svelte-check type and content checks for the docs site"
dir = "docs"
run = "pnpm check"

[tasks."docs:build"]
description = "Build the SvelteKit docs site"
dir = "docs"
run = "pnpm build"

[tasks."docs:preview"]
description = "Serve the production static build at http://localhost:4173/wyrd/"
depends = ["docs:build"]
dir = "docs"
run = "pnpm preview --host 0.0.0.0 --port ${WYRD_DOCS_PREVIEW_PORT:-4173}"

[tasks."docs:check"]
hide = true
description = "Docs gate: install, generate, drift check, unit tests, command check, link check, build, and a11y"
depends = ["docs:install"]
run = """
mise run docs:generate
GENERATED="docs/src/content/docs/api/ docs/public/llms.txt docs/public/llms-full.txt"
(git diff --exit-code -- $GENERATED && test -z "$(git ls-files --others --exclude-standard -- $GENERATED)") || (echo "Generated docs are out of date. Run 'mise run docs:generate' and commit the result." && exit 1)
mise run docs:test
mise run docs:check:commands
mise run docs:linkcheck
mise run docs:build
mise run docs:a11y
"""

[tasks."docs:dev"]
description = "Run the SvelteKit docs dev server on :4321"
depends = ["docs:install", "docs:generate"]
dir = "docs"
run = "pnpm dev --host 0.0.0.0 --port ${WYRD_DOCS_PORT:-4321}"

[tasks."docs:mocks"]
description = "Run the docs dev server with local mock pages from docs/mocks/pages (gitignored)"
depends = ["docs:install"]
dir = "docs"
run = "pnpm dev --mode mocks --host 0.0.0.0 --port ${WYRD_DOCS_PORT:-4321}"

[tasks."dev:both"]
description = "Run wyrd-server (:8080) and UI (:3000) in parallel"
run = """
cargo build -p wyrd-server
scripts/postgres/dev-server.sh &
BACKEND_PID=$!
cd crates/wyrd/wyrd-server/wyrd-ui && pnpm run dev --host 0.0.0.0 --port ${WYRD_UI_PORT:-3000} &
FRONTEND_PID=$!
trap 'kill $BACKEND_PID $FRONTEND_PID 2>/dev/null' EXIT INT TERM
wait $BACKEND_PID $FRONTEND_PID
"""

[tasks."dev:full"]
description = "Boot wyrd-server and UI on :3000"
run = """
cargo build -p wyrd-server
scripts/postgres/dev-server.sh &
SERVER_PID=$!
cd crates/wyrd/wyrd-server/wyrd-ui && pnpm install --frozen-lockfile && pnpm run dev --host 0.0.0.0 --port ${WYRD_UI_PORT:-3000} &
UI_PID=$!
trap 'kill $SERVER_PID $UI_PID 2>/dev/null' EXIT INT TERM
wait $SERVER_PID $UI_PID
"""

[tasks.check]
description = "Whole-plan closeout gate: fmt check + all-feature Clippy"
run = """
set -eu
mise run fmt:check
mise run check:workspace-hack
mise run lints
"""

[tasks."check:file-size"]
hide = true
description = "Pre-commit hook: refuse staged files over 1 MiB, lockfiles exempt. Install once per clone: mise generate git-pre-commit --write --task=check:file-size"
run = '''
big=$(git diff --cached --name-only --diff-filter=AM \
  | grep -vE '(^|/)(uv\.lock|Cargo\.lock|pnpm-lock\.yaml|package-lock\.json)$' \
  | while IFS= read -r f; do [ "$(git cat-file -s ":$f")" -le 1048576 ] || echo "$f"; done || true)
[ -z "$big" ] || { printf 'Staged files over 1 MiB; keep large data out of git:\n%s\n' "$big"; exit 1; }
'''

[tasks."check:workspace-hack"]
hide = true
description = "Fail when the hakari workspace-hack no longer matches the workspace's third-party feature union, or a member does not depend on it (fix with `cargo hakari generate` and `cargo hakari manage-deps`)"
run = """
set -eu
cargo hakari generate --diff
cargo hakari manage-deps --dry-run
cargo hakari verify
"""

[tasks."codegen:regen"]
description = "Regenerate the consumed contract outputs: UI problem examples, TypeScript error codes, and TypeScript wire types"
run = """
set -eu
cargo run --locked -p wyrd-spec --example gen_schemas --features server
cargo run --locked -q -p wyrd-spec --example gen_schemas --features server -- contracts \
  | python3 scripts/gen_ts_types.py
"""

[tasks."codegen:check"]
description = "Fail if UI problem examples, TypeScript error codes, TypeScript wire types, or UI theme tokens drift from source"
run = """
set -eu
GENERATED="crates/wyrd-spec/schemas/ui_problem_examples.json sdks/wyrd-sdk-ts/wyrd/src/error-codes.ts sdks/wyrd-sdk-ts/wyrd/src/card-types.ts"
BEFORE=$(mktemp)
AFTER=$(mktemp)
trap 'rm -f "$BEFORE" "$AFTER"' EXIT
shasum -a 256 $GENERATED > "$BEFORE"
mise run codegen:regen
shasum -a 256 $GENERATED > "$AFTER"
diff -u "$BEFORE" "$AFTER" \
  || { echo 'codegen drift detected - run mise run codegen:regen and commit'; exit 1; }
(cd crates/wyrd/wyrd-server/wyrd-ui && node --test brand/gen-theme.test.mjs && node brand/gen-theme.mjs --check)
"""

# --- napi TypeScript pipeline -----------------------------------------------------
# The OpenAPI contract is served at runtime from `GET /openapi.json`, composed from the
# same `utoipa-axum` registrations that mount the routes, and is proved by the served
# `pg_openapi_contract` suite in `test:principals:integration`, so nothing here emits or
# checks it.
# Every `ts:*` task needs the napi bindings + package roots (slice 13a). Two separate
# pnpm packages under `sdks/wyrd-sdk-ts/` glued by `sdks/wyrd-sdk-ts/pnpm-workspace.yaml`:
# public `wyrd-ai` (`sdks/wyrd-sdk-ts/wyrd`, built from `sdks/wyrd-sdk-ts/native`) and
# private `@wyrd/testing` (`sdks/wyrd-sdk-ts/testing`, built from
# `sdks/wyrd-sdk-ts/native-testing`, test-tier). One napi addon per package so the
# harness never overwrites the SDK's generated loader/`.d.ts`. 13a adds
# `ts:napi:check`/`ts:typecheck`/`ts:test:unit` to `gate`; `ts:test:integration`
# runs in the closeout journey lane.

[tasks."ts:install"]
hide = true
description = "Install the sdks/wyrd-sdk-ts/ pnpm workspace (wyrd-ai + @wyrd/testing) from the frozen lockfile (slice 13a)"
dir = "sdks/wyrd-sdk-ts"
run = "pnpm install --frozen-lockfile"

[tasks."ts:build"]
description = "Build the public wyrd-ai napi addon (sdks/wyrd-sdk-ts/native) + emit index.d.ts into sdks/wyrd-sdk-ts/wyrd (slice 13a)"
depends = ["ts:install"]
dir = "sdks/wyrd-sdk-ts/wyrd"
run = "pnpm exec napi build --platform --manifest-path ../native/Cargo.toml --output-dir . --package-json-path package.json && test ! -f index.js || mv index.js index.generated.cjs && cp index.d.ts index.d.cts && pnpm exec tsc -p tsconfig.build.json && node -e 'require(\"node:fs\").rmSync(\"index.generated.cjs\", { force: true })'"

[tasks."ts:build:testing"]
description = "Build the private @wyrd/testing napi harness addon (sdks/wyrd-sdk-ts/native-testing) into sdks/wyrd-sdk-ts/testing; feeds the integration lane only (slice 13a)"
depends = ["ts:install"]
dir = "sdks/wyrd-sdk-ts/testing"
run = "pnpm exec napi build --platform --manifest-path ../native-testing/Cargo.toml --output-dir . --package-json-path package.json --js native.cjs --dts native.d.cts"

[tasks."ts:napi:check"]
description = "Fail if the public wyrd-ai napi-generated index.d.ts is not committed/current (slice 13a; Node analogue of .pyi drift). Scoped to the SDK declaration, not the harness."
depends = ["ts:build"]
dir = "sdks/wyrd-sdk-ts/wyrd"
run = "git diff --exit-code -- index.d.ts || { echo 'napi .d.ts drift - run mise run ts:build and commit sdks/wyrd-sdk-ts/wyrd/index.d.ts'; exit 1; }"

[tasks."ts:pack:check"]
description = "Pack the compiled wyrd-ai and current-host napi addon, then import the installed package from a clean ESM project"
depends = ["ts:build"]
run = "node scripts/check_ts_package.mjs"

[tasks."ts:format"]
description = "Format the TypeScript SDK sources and tests with Biome"
dir = "sdks/wyrd-sdk-ts"
run = "pnpm exec biome format --write"

[tasks."ts:format:check"]
hide = true
description = "Check TypeScript SDK formatting with Biome"
dir = "sdks/wyrd-sdk-ts"
run = "pnpm exec biome format"

[tasks."ts:lints"]
hide = true
description = "Run Biome lint checks over the TypeScript SDK"
dir = "sdks/wyrd-sdk-ts"
run = "pnpm exec biome lint --error-on-warnings"

[tasks."ts:typecheck"]
description = "Typecheck wyrd-ai incl. integration sources that resolve the local @wyrd/testing workspace dep (slice 13a), the support-desk TypeScript reference app, and the docs examples"
depends = ["ts:build", "ts:build:testing"]
dir = "sdks/wyrd-sdk-ts/wyrd"
run = ["pnpm exec tsc --noEmit", "pnpm --dir .. --filter @wyrd/example-support-desk-app exec tsc --noEmit", "pnpm --dir .. --filter @wyrd/examples exec tsc --noEmit"]

[tasks."ts:test:unit"]
description = "wyrd-ai unit tests: auth-parity + an error-set native {value,error} envelope makes unwrapNative throw instanceof WyrdError (hand-authored TS class) exposing code/status/title/detail as properties, not parsed from message (slice 13a)"
depends = ["ts:build", "ts:build:testing"]
dir = "sdks/wyrd-sdk-ts/wyrd"
run = "pnpm exec vitest run tests/unit"

[tasks."ts:test:integration"]
description = """wyrd-ai client->server->client Bifrost journey (slice 13/13a).
Builds the public wyrd-ai addon and the private @wyrd/testing harness addon, then runs
Vitest, which boots WyrdTestServer IN-PROCESS against the repository-managed Postgres,
seeds a tenant, mints a key, and drives wyrd-ai against it, tearing down via shutdown()
in finally — symmetric with the Python journey.
"""
depends = ["ts:build", "ts:build:testing", "build:server"]

run = "scripts/postgres/with-test-postgres.sh -- bash -lc 'mise run db:migrate:inner && mise run ts:test:integration:inner'"
[tasks."ts:test:integration:inner"]
hide = true
description = """wyrd-ai client->server->client Bifrost journey (slice 13/13a).
Builds the public wyrd-ai addon and the private @wyrd/testing harness addon, then runs
Vitest, which boots WyrdTestServer IN-PROCESS against the repository-managed Postgres,
seeds a tenant, mints a key, and drives wyrd-ai against it, tearing down via shutdown()
in finally — symmetric with the Python journey.
"""
dir = "sdks/wyrd-sdk-ts/wyrd"
# The saved user login journeys need the identity lane's Keycloak; only
# test:identity:journey runs them.
run = "pnpm exec vitest run tests/integration --exclude tests/integration/saved-user-auth.test.ts --exclude tests/integration/signed-in-development.test.ts"

[tasks."gate"]
description = """Full repository aggregate for nightly, release, mixed, global, and unclassified changes: every lane,
each exactly once. Run as `mise run -c gate` to finish every lane and report all failures; without -c mise stops at
the first failed lane. CI runs each `gate:*` shard as its own parallel job, read from this list, so a lane belongs to
exactly one shard. The only tests outside gate are the scheduled production-geometry qualifications
(performance.yml) and the live-credential lanes (storage-integration-cloud.yml, the *:smoke:live tasks)."""
depends = [
  "gate:checks",
  "gate:rust:families",
  "gate:rust:gateway",
  "gate:rust:bifrost",
  "gate:rust:journeys",
  "gate:storage",
  "gate:python",
  "gate:typescript",
]

[tasks."gate:checks"]
hide = true
description = "Gate shard: format, Clippy, workspace-hack, boundary, codegen, docs, example, and CI-selection checks"
depends = ["check", "check:deps", "check:tenant-isolation", "check:storage:drift", "check:ci-selection", "check:docs", "check:examples", "codegen:check", "docs:check"]

# The Rust lanes are four shards so CI runs them in parallel; one sequential
# shard took about two hours on a hosted runner.
[tasks."gate:rust:families"]
hide = true
description = "Gate shard: every Rust family lane"
depends = ["test:wyrd", "test:skald", "test:vala", "test:shared"]

[tasks."gate:rust:gateway"]
