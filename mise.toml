depends = ["check", "test:unit", "test:bifrost", "codegen:check", "cardkind:check", "check:client-tier", "check:registry-no-server-routes", "check:pyo3-scope", "check:mocks-scope", "check:unwrap-audit", "check:audit-script", "check:storage:drift", "check:registry-tx-coupling", "check:registry-immutable-spec-hash", "check:registry-single-table", "check:object-store-pin", "check:error-coverage", "check:tenant-isolation", "check:test-contracts", "check:tokens", "py:setup", "py:format:check", "py:lints", "py:typecheck", "py:test:unit", "examples:python:datacard", "check:examples", "check:docs", "check:no-legacy-server-vocab", "check:no-tonic-outside-wyrd-tonic"]

[tasks."db:setup-roles"]
hide = true
description = """Create wyrd_app and wyrd_platform_admin roles in the target Postgres instance.
Targets the local docker-compose Postgres by default; the docker-compose
bootstrap user is wyrd_migrator (which owns the database).
"""
env = { WYRD_MIGRATOR_DSN = "postgres://wyrd_migrator:wyrd_migrator_pw@localhost/wyrd" }
run = """
for i in $(seq 1 30); do
  if psql "$WYRD_MIGRATOR_DSN" -c "SELECT 1" >/dev/null 2>&1; then
    break
  fi
  sleep 1
done
psql "$WYRD_MIGRATOR_DSN" -c "ALTER ROLE wyrd_migrator BYPASSRLS;" || true
psql "$WYRD_MIGRATOR_DSN" -c "CREATE ROLE wyrd_app LOGIN PASSWORD 'wyrd_app_pw';" || true
psql "$WYRD_MIGRATOR_DSN" -c "CREATE ROLE wyrd_platform_admin LOGIN PASSWORD 'wyrd_platform_admin_pw' BYPASSRLS;" || true
psql "$WYRD_MIGRATOR_DSN" -c "CREATE ROLE vala_recovery_owner NOLOGIN BYPASSRLS;" || true
psql "$WYRD_MIGRATOR_DSN" -c "CREATE ROLE vala_recovery LOGIN PASSWORD 'vala_recovery_pw';" || true
psql "$WYRD_MIGRATOR_DSN" -c "GRANT vala_recovery_owner TO wyrd_migrator;" || true
"""

[tasks."db:migrate"]
description = """Apply wyrd-sql migrations against the local docker-compose Postgres.
Runs the idempotent migration test, which also verifies that required Postgres
roles (wyrd_migrator BYPASSRLS, wyrd_app no-BYPASSRLS, wyrd_platform_admin
BYPASSRLS) are present before applying DDL.
"""
depends = ["db:setup-roles"]
env = { WYRD_DATABASE_URL = "postgres://wyrd_app:wyrd_app_pw@localhost/wyrd", WYRD_DATABASE_MIGRATOR_PASSWORD = "wyrd_migrator_pw" }
run = "cargo test --locked -p wyrd-sql --all-features --test migration_pg -- migrations_apply_and_are_idempotent --nocapture"

[tasks."test:sql"]
hide = true
description = """Run live Postgres SQL integration tests against docker-compose Postgres.
Brings up Postgres, provisions roles, and applies migrations before running tests.
"""
depends = ["build:postgres", "db:setup-roles", "db:migrate"]
env = { WYRD_DATABASE_URL = "postgres://wyrd_app:wyrd_app_pw@localhost/wyrd", WYRD_DATABASE_MIGRATOR_PASSWORD = "wyrd_migrator_pw", WYRD_DATABASE_PLATFORM_ADMIN_PASSWORD = "wyrd_platform_admin_pw" }
run = "cargo test --locked -p wyrd-sql --all-features --test migration_pg -- --nocapture"

[tasks."db:migrate:all"]
hide = true
description = """Provision the dedicated wyrd_test database and migrate it once.
Adds the cluster-global wyrd_catalog role (db:setup-roles omits it; roles are
cluster-global, so one step serves both DBs), creates wyrd_test owned by the
migrator superuser, and applies the wyrd-sql migrations to it. wyrd_test is a
second logical DB on the same docker-compose container — not a second boot — and
is distinct from the `wyrd` DB the concurrent e2e/migration tasks use, so the
clean-slate reset shard's database-global wipe can never reach them (D8).
"""
depends = ["build:postgres", "db:setup-roles"]
env = { WYRD_ADMIN_DSN = "postgres://wyrd_migrator:wyrd_migrator_pw@localhost/wyrd", WYRD_DATABASE_URL = "postgres://wyrd_app:wyrd_app_pw@localhost/wyrd_test", WYRD_DATABASE_MIGRATOR_PASSWORD = "wyrd_migrator_pw", WYRD_DATABASE_PLATFORM_ADMIN_PASSWORD = "wyrd_platform_admin_pw" }
run = """
set -e
psql "$WYRD_ADMIN_DSN" -c "CREATE ROLE wyrd_catalog NOLOGIN;" || true
psql "$WYRD_ADMIN_DSN" -tc "SELECT 1 FROM pg_database WHERE datname = 'wyrd_test'" | grep -q 1 \
  || psql "$WYRD_ADMIN_DSN" -c "CREATE DATABASE wyrd_test OWNER wyrd_migrator;"
cargo test --locked -p wyrd-sql --all-features --test migration_pg -- migrations_apply_and_are_idempotent --nocapture
cargo test --locked -p vala-sql --all-features --test migration_pg -- vala_migrations_apply_and_are_idempotent --nocapture
"""

[tasks."test:pg"]
hide = true
description = """Serial clean-slate reset self-tests against the dedicated wyrd_test DB.
Single-threaded because reset_owned_schemas issues a database-global
TRUNCATE … RESTART IDENTITY CASCADE; sharing a worker with other DB tests would
race. Depends on db:migrate:all so wyrd_test is migrated exactly once — the reset
primitive never migrates, drops, or re-runs (binding decision D4).
"""
depends = ["build:postgres", "db:migrate:all"]
env = { WYRD_DATABASE_URL = "postgres://wyrd_app:wyrd_app_pw@localhost/wyrd_test", WYRD_DATABASE_MIGRATOR_PASSWORD = "wyrd_migrator_pw", WYRD_DATABASE_PLATFORM_ADMIN_PASSWORD = "wyrd_platform_admin_pw" }
run = """
cargo test --locked -p wyrd-sql --all-features --test reset_pg -- --test-threads=1 --nocapture
cargo test --locked -p wyrd-dev-fixtures --all-features -- --test-threads=1
cargo test --locked -p wyrd-storage --all-features -- --test-threads=1
cargo test --locked -p wyrd-testing --all-features -- --test-threads=1
cargo test --locked -p wyrd-server --all-features -- --test-threads=1
"""

