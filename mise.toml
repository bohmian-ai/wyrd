[tasks."test:identity:journey"]
hide = true
description = """Stand up real OIDC providers (Keycloak + Dex), seed test users via the Keycloak
admin REST API, export env gates, run the identity e2e suite against both issuers, then tear down.
Its tests are #[ignore]d so the family lanes, which start no identity providers, skip them visibly.
"""
env = { WYRD_KEYCLOAK_ISSUER = "http://localhost:8180/realms/wyrd-test", WYRD_DEX_ISSUER = "http://localhost:5556" }

run = "scripts/postgres/with-test-postgres.sh -- bash -lc 'mise run db:migrate:inner && mise run test:identity:journey:inner'"
[tasks."test:identity:journey:inner"]
hide = true
description = """Stand up real OIDC providers (Keycloak + Dex), seed test users via the Keycloak
admin REST API, export env gates, run the identity e2e suite against both issuers, then tear down.
Its tests are #[ignore]d so the family lanes, which start no identity providers, skip them visibly.
"""
env = { WYRD_KEYCLOAK_ISSUER = "http://localhost:8180/realms/wyrd-test", WYRD_DEX_ISSUER = "http://localhost:5556" }
run = """
set -e

# Bring up Keycloak and Dex (postgres was brought up by depends). Recreate them:
# Keycloak start-dev keeps its realm in an embedded H2 database inside the
# container filesystem, and H2's lock file names the container hostname that
# opened it. A run killed mid-flight leaves that lock behind, so reusing the
# stopped container made Keycloak resolve a hostname that no longer exists and
# exit before serving. A fresh container each run has no stale lock to inherit.
docker compose rm --force --stop --volumes keycloak dex
# Removed on every exit, including a failed seed, a failed suite, and an
# interrupt, so the next run never inherits a container this one left behind.
trap 'docker compose rm --force --stop --volumes keycloak dex' EXIT
docker compose up -d keycloak dex --wait

# Seed Keycloak users via admin REST API (realm import only defines clients/groups)
uv run python - <<'PYEOF'
import json, urllib.request, urllib.parse, time, sys

BASE = "http://localhost:8180"
REALM = "wyrd-test"

def get_admin_token():
    data = urllib.parse.urlencode({
        "grant_type": "password",
        "client_id": "admin-cli",
        "username": "admin",
        "password": "admin",
    }).encode()
    req = urllib.request.Request(
        f"{BASE}/realms/master/protocol/openid-connect/token", data=data
    )
    resp = json.loads(urllib.request.urlopen(req).read())
    return resp["access_token"]

def api(method, path, body=None, token=None, realm=REALM):
    url = f"{BASE}/admin/realms/{realm}{path}"
    data = json.dumps(body).encode() if body else None
    headers = {"Content-Type": "application/json"}
    if token:
        headers["Authorization"] = f"Bearer {token}"
    req = urllib.request.Request(url, data=data, headers=headers, method=method)
    try:
        r = urllib.request.urlopen(req)
        raw = r.read()
        return json.loads(raw) if raw else None
    except urllib.error.HTTPError as e:
        body = e.read()
        if e.code == 409:  # already exists — idempotent
            return None
        raise RuntimeError(f"API {method} {path} → {e.code}: {body}") from e

for attempt in range(30):
    try:
        token = get_admin_token()
        break
    except Exception:
        time.sleep(2)
else:
    sys.exit("Keycloak admin API not ready after 60s")

def create_user(username, email, password, group_path, realm=REALM):
    api("POST", "/users", {
        "username": username,
        "email": email,
        "firstName": username.capitalize(),
        "lastName": "Wyrd",
        "emailVerified": True,
        "enabled": True,
        "requiredActions": [],
    }, token, realm)
    users = api("GET", f"/users?username={username}", token=token, realm=realm) or []
    if not users:
        sys.exit(f"user {username} not found after creation")
    uid = users[0]["id"]
    api("PUT", f"/users/{uid}/reset-password", {
        "type": "password",
        "temporary": False,
        "value": password,
    }, token, realm)
    groups = api("GET", f"/groups?search={group_path.lstrip('/')}", token=token, realm=realm) or []
    if groups:
        api("PUT", f"/users/{uid}/groups/{groups[0]['id']}", token=token, realm=realm)

create_user("alice", "alice@wyrd.test", "alice-password", "wyrd-admins")
create_user("bob", "bob@wyrd.test", "wyrd-test", "wyrd-viewers")
# The second provider's alice shares the first's email: a provider switch must
# still make her a separate Wyrd user.
create_user("alice", "alice@wyrd.test", "alice-password", "wyrd-admins", realm="wyrd-test-2")
print("Keycloak users seeded")
PYEOF

# WYRD_IDENTITY_TARGET selects the suite: `server` (Rust identity_e2e), `ui`
# (the production BFF journey: identity_ui_e2e starts the real server and two
# `node build` BFF replicas sharing its Postgres and public origin, then runs
# the Vitest HTTP journey against them), or one saved-login journey: `cli`
# (`wyrd auth login`), `rust`, `python`, and `typescript` (each public SDK over
# a CLI-established login), and `client` (concurrent saved-login renewal
# across processes). WYRD_IDENTITY_FILTER selects one exact test of that suite
# and must select exactly one. Unfiltered runs every suite, and first proves
# each named journey still selects exactly one test so a rename cannot
# silently drop it.
target="${WYRD_IDENTITY_TARGET:-}"
case "$target" in
  ""|server|ui|cli|rust|client|python|typescript) ;;
  *) echo "unsupported WYRD_IDENTITY_TARGET=$target (supported: server, ui, cli, rust, client, python, typescript)" >&2; exit 2 ;;
esac
# One saved-login journey: its exact selector must select exactly one test,
# and a filter, when given, must name that journey.
saved_login_journey() {
  case "$1" in
    cli) name=cli_device_login_journey ;;
    rust) name=saved_user_auth_journey ;;
    client) name=concurrent_saved_renewal ;;
    python) name=test_saved_user_auth_journey ;;
    typescript) name="saved user auth journey" ;;
  esac
  if [ -n "${WYRD_IDENTITY_FILTER:-}" ] && [ "$WYRD_IDENTITY_FILTER" != "$name" ]; then
    echo "WYRD_IDENTITY_FILTER=$WYRD_IDENTITY_FILTER selects no $1 journey; expected '$name'" >&2
    exit 1
  fi
  case "$1" in
    cli) rust_journey wyrd-cli cli "$name" ;;
    rust) rust_journey wyrd-sdk-rust integration "cards_state::$name" ;;
    client) rust_journey wyrd-client integration "pg_auth_e2e_against_fixture::$name" ;;
    python)
      mise run py:setup
      selector="tests/integration/auth/test_saved_user_auth.py::$name"
      count="$(cd sdks/wyrd-sdk-python && uv run python -m pytest -q --collect-only -m identity "$selector" | grep -c "::$name" || true)"
      if [ "$count" != 1 ]; then
        echo "Python journey $name selects $count tests; expected exactly 1" >&2
        exit 1
      fi
      (cd sdks/wyrd-sdk-python && uv run python -m pytest -q -m identity "$selector")
      ;;
    typescript)
      mise run ts:build
      mise run ts:build:testing
      journey=tests/integration/saved-user-auth.test.ts
      count="$(cd sdks/wyrd-sdk-ts/wyrd && pnpm exec vitest list "$journey" -t "$name" | grep -cF "$name" || true)"
      if [ "$count" != 1 ]; then
        echo "TypeScript journey '$name' selects $count tests; expected exactly 1" >&2
        exit 1
      fi
      (cd sdks/wyrd-sdk-ts/wyrd && pnpm exec vitest run "$journey" -t "$name")
      ;;
  esac
}
# One ignored Rust journey by exact name, after proving it selects one test.
rust_journey() {
  expr="test(=$3)"
  count="$(cargo nextest list --locked -p "$1" --test "$2" --run-ignored=all --message-format oneline -E "$expr" | grep -c . || true)"
  if [ "$count" != 1 ]; then
    echo "$1 --test $2 $3 selects $count tests; expected exactly 1" >&2
    exit 1
  fi
  cargo nextest run --locked -p "$1" --test "$2" --run-ignored=all -E "$expr"
}
if [ -n "${WYRD_IDENTITY_FILTER:-}" ] && [ -z "$target" ]; then
  target=server
fi
ui_dir=crates/wyrd/wyrd-server/wyrd-ui
ui_journey=src/lib/server/auth/production-auth.integration.test.ts
# The server journeys author issuers and bindings through the real `wyrd` CLI.
cargo build --locked -p wyrd-cli --bin wyrd
selected_count() {
  cargo nextest list --locked -p wyrd-server --test integration --run-ignored=all --message-format oneline -E "$1" | grep -c . || true
}
ui_selected_count() {
  (cd "$ui_dir" && WYRD_UI_INTEGRATION=1 pnpm exec vitest list "$ui_journey" -t "$1" | grep -cF "$1") || true
}
run_ui() {
  pnpm --dir "$ui_dir" install --frozen-lockfile
  pnpm --dir "$ui_dir" build
  for required in "production SSO crosses replicas" "OIDC-off credential UI" "production multi-provider tenant switch" "production provider replacement settings"; do
    count="$(ui_selected_count "$required")"
    if [ "$count" != 1 ]; then
      echo "UI identity journey '$required' selects $count tests; expected exactly 1" >&2
      exit 1
    fi
  done
  # The host test's own name selects every UI journey it runs.
  if [ -n "${WYRD_IDENTITY_FILTER:-}" ] && [ "$WYRD_IDENTITY_FILTER" != production_ui_bff_journey ]; then
    count="$(ui_selected_count "$WYRD_IDENTITY_FILTER")"
    if [ "$count" != 1 ]; then
      echo "WYRD_IDENTITY_FILTER=$WYRD_IDENTITY_FILTER selects $count UI tests; expected exactly 1" >&2
      exit 1
    fi
    export WYRD_UI_FILTER="$WYRD_IDENTITY_FILTER"
  fi
  cargo nextest run --locked -p wyrd-server --test integration --run-ignored=all --no-capture -E 'test(=identity_ui_e2e::production_ui_bff_journey)'
}
if [ "$target" = ui ]; then
  run_ui
elif [ -n "$target" ] && [ "$target" != server ]; then
  saved_login_journey "$target"
elif [ -n "${WYRD_IDENTITY_FILTER:-}" ]; then
  expr="test(=identity_e2e::${WYRD_IDENTITY_FILTER})"
  count="$(selected_count "$expr")"
  if [ "$count" != 1 ]; then
    echo "WYRD_IDENTITY_FILTER=$WYRD_IDENTITY_FILTER selects $count tests; expected exactly 1" >&2
    exit 1
  fi
  cargo nextest run --locked -p wyrd-server --test integration --run-ignored=all --test-threads=1 -E "$expr"
else
  for required in tenant_connection_admin_journey tenant_connection_rotation_journey tenant_connection_session_cutoff_journey tenant_human_login_journey tenant_callback_refusal_journey tenant_callback_issuer_binding_journey tenant_connection_test_sign_in_journey tenant_provider_switch_journey tenant_machine_independence_journey; do
    count="$(selected_count "test(=identity_e2e::$required)")"
    if [ "$count" != 1 ]; then
      echo "identity journey $required selects $count tests; expected exactly 1" >&2
      exit 1
    fi
  done
  if [ "$target" != server ]; then
    run_ui
  fi
  cargo nextest run --locked -p wyrd-server --test integration --run-ignored=all --test-threads=1 -E 'test(/^identity_e2e::/)'
  if [ "$target" != server ]; then
    for journey in cli rust client python typescript; do
      saved_login_journey "$journey"
    done
  fi
fi
"""

