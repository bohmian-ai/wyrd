[tasks."codegen:check"]
description = "Fail if generated openapi/schemas/MCP/pyi drift from source"
run = """
snapshot_codegen() {
  {
    test -f openapi.yaml && printf '%s\n' openapi.yaml
    find crates/wyrd-spec/schemas crates/wyrd-spec/tests/schemas -type f -name '*.json'
    find crates/shared/wyrd-client/schemas crates/shared/wyrd-client/tests/schemas -type f -name '*.json'
    find crates/vala/vala-core/schemas crates/vala/vala-core/tests/schemas -type f -name '*.json'
    find python/py-wyrd/python/wyrd -type f -name '*.pyi' \
      ! -path 'python/py-wyrd/python/wyrd/stubs/*'
  } | sort | while IFS= read -r file; do
    shasum -a 256 "$file"
  done
}
BEFORE=$(mktemp)
AFTER=$(mktemp)
trap 'rm -f "$BEFORE" "$AFTER"' EXIT
snapshot_codegen > "$BEFORE"
mise run codegen:regen
snapshot_codegen > "$AFTER"
diff -u "$BEFORE" "$AFTER" \
  || { echo 'codegen drift detected - run mise run codegen:regen and commit'; exit 1; }
"""

[tasks."check:single-into-response-impl"]
hide = true
description = "Assert Wyrd HTTP errors flow through one server IntoResponse mapper"
run = """
set -eu

matches=$(rg -n 'impl IntoResponse for (WyrdErrorResponse|.*Wyrd.*Error)' crates --glob '*.rs' || true)
count=$(printf '%s\n' "$matches" | sed '/^$/d' | wc -l | tr -d ' ')

if [ "$count" != "1" ]; then
  echo "expected exactly one Wyrd error IntoResponse mapper, found $count"
  printf '%s\n' "$matches"
  exit 1
fi

case "$matches" in
  crates/wyrd/wyrd-server/src/error.rs:*'impl IntoResponse for WyrdErrorResponse'*)
    ;;
  *)
    echo "Wyrd error IntoResponse mapper must stay in wyrd-server/src/error.rs"
    printf '%s\n' "$matches"
    exit 1
    ;;
esac
"""

[tasks."check:no-legacy-server-vocab"]
hide = true
description = "Reject legacy server vocabulary and orphan-rule violations"
run = """
set -e

# 1. Route prefix lock: /api/v1 may only appear in the router mount points, not scattered handlers
! rg -n --no-heading -e '/api/v1' crates/wyrd/wyrd-server/src/ \
    --glob '!router.rs'

# 2. Identity vocabulary (server source only)
! rg -n --no-heading -e '\\bActor\\b' crates/wyrd/wyrd-server/src/
! rg -n --no-heading -e '\\bScope\\b' crates/wyrd/wyrd-server/src/

# 3. JWT claim leak
! rg -n --no-heading -e '"scopes"' crates/wyrd/wyrd-server/src/

# 4. Predecessor names
! rg -n --no-heading -e 'opsml|scouter' crates/wyrd/wyrd-server/src/

# 5. Plan docs: predecessor names allowed only in audit + verification files
! rg -n --no-heading -e 'opsml|scouter' .dev/plan/foundations/07-server-skeleton \
    --glob '!11-parity-audit.md' --glob '!10-verification.md'

# 6. Predecessor domain nouns
! rg -n --no-heading -e '\\b(SubAgent|Skill|RecoveryCode|ScouterApiClient)\\b' \
    crates/wyrd/wyrd-server/src/

# 7. Single IntoResponse impl for Wyrd errors
COUNT=$(rg -n --no-heading -e 'impl[[:space:]]+IntoResponse[[:space:]]+for[[:space:]]+Wyrd' crates/ | wc -l)
test "$COUNT" -eq 1

# 8. Orphan rule: no From<WyrdError> for tonic::Status (impl blocks only, not comments)
! rg -n --no-heading -e 'impl[[:space:]]+From<WyrdError>[[:space:]]+for[[:space:]]+([a-zA-Z_:]+::)?Status\\b' crates/
! rg -n --no-heading -e '^[[:space:]]*impl[^/]*From<WyrdError>[[:space:]]+for[[:space:]]+\\S*tonic\\S*::' crates/

# 9. Authorization header not consumed by auth/route handlers
! rg -n --no-heading -e 'header::AUTHORIZATION' \
    crates/wyrd/wyrd-server/src/auth/ crates/wyrd/wyrd-server/src/routes/

# 10. Wyrd-Caller-Identity not consumed
! rg -n --no-heading -e 'Wyrd-Caller-Identity' crates/wyrd/wyrd-server/src/ \
    | rg -n -e '\\.extract|\\.get'

# 11. tower-http body-limit layer absent from server source (F-02 closeout).
#     LengthLimitError from http_body_util is permitted in the custom body limiter.
! rg -n --no-heading -e 'RequestBodyLimitLayer' \
    crates/wyrd/wyrd-server/src/

# 12. Tower middleware logs do not format raw inner errors (F-05 closeout).
#     Scoped to middleware only — domain error functions in error.rs log raw
#     sqlx/storage errors deliberately and are excluded from this gate.
! rg -n --no-heading -e 'error\\s*=\\s*%error\\b' \
    crates/wyrd/wyrd-server/src/middleware/
"""


[tasks."check:no-tonic-outside-wyrd-tonic"]
hide = true
description = "Reject tonic-family dep declarations outside wyrd-tonic + workspace pins"
run = """
set -e

# 1. Manifest declarations must only appear in wyrd-tonic and workspace root
! rg -n --no-heading \
    -e '^[[:space:]]*(tonic|tonic-health|tonic-reflection|prost)[[:space:]]*=' \
    --glob '!crates/wyrd/wyrd-tonic/Cargo.toml' \
    --glob '!Cargo.toml' \
    crates/ python/

# 1a. Renamed-dep evasion (package = "tonic")
! rg -n --no-heading \
    -e 'package[[:space:]]*=[[:space:]]*"(tonic|tonic-health|tonic-reflection|prost)"' \
    --glob '!crates/wyrd/wyrd-tonic/Cargo.toml' \
    --glob '!Cargo.toml' \
    crates/ python/

# 2. Source-code imports must not bypass wyrd-tonic re-exports
! rg -n --no-heading \
    -e '^[[:space:]]*(pub(\\([^)]+\\))?[[:space:]]+)?use[[:space:]]+(tonic|tonic_health|tonic_reflection|prost)::' \
    --glob '!crates/wyrd/wyrd-tonic/src/**' \
    crates/ python/

# 2a. extern crate form
! rg -n --no-heading \
    -e '^[[:space:]]*extern[[:space:]]+crate[[:space:]]+(tonic|tonic_health|tonic_reflection|prost)\\b' \
    --glob '!crates/wyrd/wyrd-tonic/src/**' \
    crates/ python/

# 3. Workspace pin sanity
rg -q -e '^[[:space:]]*tonic[[:space:]]*=' Cargo.toml
rg -q -e '^[[:space:]]*tonic-health[[:space:]]*=' Cargo.toml
rg -q -e '^[[:space:]]*tonic-reflection[[:space:]]*=' Cargo.toml
rg -q -e '^[[:space:]]*prost[[:space:]]*=' Cargo.toml

# 4. wyrd-server consumes wyrd-tonic with features = ["server"]
if command -v cargo >/dev/null && command -v jq >/dev/null; then
    server_features=$(cargo metadata --format-version=1 --no-deps |
        jq -r '.packages[] | select(.name=="wyrd-server")
               | .dependencies[]
               | select(.name=="wyrd-tonic")
               | .features[]')
    echo "$server_features" | rg -q '^server$'
else
    rg -q -U \
        -e 'wyrd-tonic[[:space:]]*=.*features[^\n]*"server"' \
        crates/wyrd/wyrd-server/Cargo.toml || \
    rg -q -U \
        -e '\\[dependencies\\.wyrd-tonic\\][^\\[]*features[^\n]*"server"' \
        crates/wyrd/wyrd-server/Cargo.toml
fi
"""

