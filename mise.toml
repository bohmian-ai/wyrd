[tasks."codegen:check"]
description = "Fail if generated openapi/schemas/MCP/pyi drift from source"
run = """
snapshot_codegen() {
  {
    test -f openapi.yaml && printf '%s\n' openapi.yaml
    find crates/wyrd-spec/schemas crates/wyrd-spec/tests/schemas -type f -name '*.json'
    find crates/shared/wyrd-client/schemas crates/shared/wyrd-client/tests/schemas -type f -name '*.json'
    find crates/vala/vala-core/schemas crates/vala/vala-core/tests/schemas -type f -name '*.json'
    find python/py-wyrd/python/wyrd -type f -name '*.pyi' \
      ! -path 'python/py-wyrd/python/wyrd/stubs/*'
  } | sort | while IFS= read -r file; do
    shasum -a 256 "$file"
  done
}
BEFORE=$(mktemp)
AFTER=$(mktemp)
trap 'rm -f "$BEFORE" "$AFTER"' EXIT
snapshot_codegen > "$BEFORE"
mise run codegen:regen
snapshot_codegen > "$AFTER"
diff -u "$BEFORE" "$AFTER" \
  || { echo 'codegen drift detected - run mise run codegen:regen and commit'; exit 1; }
"""

# --- Stage-5 OpenAPI + napi TypeScript pipeline -----------------------------------
# Task shells defined ahead of implementation, mirroring `test:bifrost:journey`. They
# are INERT until their owning slice lands the code: `codegen:openapi` needs the
# `wyrd-server` `gen_openapi` example (slice 06c); every `ts:*` task needs the napi
# bindings + package roots (slice 13a). Two separate pnpm packages under `typescript/`
# glued by `typescript/pnpm-workspace.yaml`: public `@wyrd/sdk` (`typescript/wyrd`,
# built from `crates/bindings/wyrd-node`) and private `@wyrd/testing`
# (`typescript/testing`, built from `crates/bindings/wyrd-node-testing`, test-tier).
# One napi addon per package so the harness never overwrites the SDK's generated
# loader/`.d.ts`. 06c wires `codegen:openapi` into `codegen:regen`; 13a adds
# `ts:napi:check`/`ts:typecheck`/`ts:test:unit` to `gate`; `ts:test:integration`
# runs in the closeout journey lane.
[tasks."codegen:openapi"]
description = "Emit openapi.yaml from wyrd-server WyrdApiDoc (slice 06c; wired into codegen:regen). Requires utoipa 'yaml' feature on wyrd-server."
# Emit to a temp file and move on success so a build/emit failure cannot truncate the
# committed openapi.yaml to empty.
run = "cargo run --locked -p wyrd-server --example gen_openapi > openapi.yaml.tmp && mv openapi.yaml.tmp openapi.yaml"

[tasks."ts:install"]
hide = true
description = "Install the typescript/ pnpm workspace (@wyrd/sdk + @wyrd/testing) from the frozen lockfile (slice 13a)"
dir = "typescript"
run = "pnpm install --frozen-lockfile"

[tasks."ts:build"]
description = "Build the public @wyrd/sdk napi addon (crates/bindings/wyrd-node) + emit index.d.ts into typescript/wyrd (slice 13a)"
depends = ["ts:install"]
dir = "typescript/wyrd"
run = "pnpm exec napi build --platform --manifest-path ../../crates/bindings/wyrd-node/Cargo.toml --output-dir . --package-json-path package.json && test ! -f index.js || mv index.js index.generated.cjs && cp index.d.ts index.d.cts && pnpm exec tsc -p tsconfig.build.json && node -e 'require(\"node:fs\").rmSync(\"index.generated.cjs\", { force: true })'"

[tasks."ts:build:testing"]
description = "Build the private @wyrd/testing napi harness addon (crates/bindings/wyrd-node-testing) into typescript/testing; feeds the integration lane only (slice 13a)"
depends = ["ts:install"]
dir = "typescript/testing"
run = "pnpm exec napi build --platform --manifest-path ../../crates/bindings/wyrd-node-testing/Cargo.toml --output-dir . --package-json-path package.json"

[tasks."ts:napi:check"]
description = "Fail if the public @wyrd/sdk napi-generated index.d.ts is not committed/current (slice 13a; Node analogue of .pyi drift). Scoped to the SDK declaration, not the harness."
depends = ["ts:build"]
dir = "typescript/wyrd"
run = "git diff --exit-code -- index.d.ts || { echo 'napi .d.ts drift - run mise run ts:build and commit typescript/wyrd/index.d.ts'; exit 1; }"

[tasks."ts:pack:check"]
description = "Pack the compiled @wyrd/sdk and current-host napi addon, then import the installed package from a clean ESM project"
depends = ["ts:build"]
run = "node scripts/check_ts_package.mjs"

[tasks."ts:typecheck"]
description = "Typecheck @wyrd/sdk incl. integration sources that resolve the local @wyrd/testing workspace dep (slice 13a)"
depends = ["ts:build", "ts:build:testing"]
dir = "typescript/wyrd"
run = "pnpm exec tsc --noEmit"

[tasks."ts:test:unit"]
description = "@wyrd/sdk unit tests: auth-parity + an error-set native {value,error} envelope makes unwrapNative throw instanceof WyrdError (hand-authored TS class) exposing code/status/title/detail as properties, not parsed from message (slice 13a)"
depends = ["ts:build"]
dir = "typescript/wyrd"
run = "pnpm exec vitest run tests/unit"

[tasks."ts:test:integration"]
description = """@wyrd/sdk client->server->client Bifrost journey (slice 13/13a).
Builds the public @wyrd/sdk addon and the private @wyrd/testing harness addon, then runs
Vitest, which boots WyrdTestServer IN-PROCESS against the repository-managed Postgres,
seeds a tenant, mints a key, and drives @wyrd/sdk against it, tearing down via shutdown()
in finally — symmetric with the Python journey.
"""
depends = ["ts:build", "ts:build:testing"]

run = "scripts/postgres/with-test-postgres.sh -- bash -lc 'mise run db:migrate:inner && mise run ts:test:integration:inner'"
[tasks."ts:test:integration:inner"]
hide = true
description = """@wyrd/sdk client->server->client Bifrost journey (slice 13/13a).
Builds the public @wyrd/sdk addon and the private @wyrd/testing harness addon, then runs
Vitest, which boots WyrdTestServer IN-PROCESS against the repository-managed Postgres,
seeds a tenant, mints a key, and drives @wyrd/sdk against it, tearing down via shutdown()
in finally — symmetric with the Python journey.
"""
dir = "typescript/wyrd"
run = "pnpm exec vitest run tests/integration"

