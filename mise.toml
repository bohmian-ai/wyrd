run = "cargo build --locked --release -p wyrd-server -p wyrd-testing --bin wyrd-server --bin capacity --target-dir target/profiling"

[tasks."bench:l1"]
description = "Level 1, every engine in order (Bifrost, Verification, Gateway), each under its own fresh Postgres and with its own record; forwards --profile and --allow-dirty, keeps going after a failed or invalid engine, and exits with the worst result (2 over 1 over 0); about 45 min. Opt-in benchmark experiment; part of no gate, CI or verify lane. Builds the release wyrd-server and capacity driver with frame pointers into target/profiling before the experiment clock starts, then runs under a fresh repository Postgres on the whole host (macOS arm64, Linux x86_64, Linux arm64) with a file:// store. Discards the run (exit 2) on a busy host, dirty source (unless --allow-dirty), overrun or unresolved evidence; fails (exit 1) on a declared criterion. Appends one v1 record under benchmarks/<engine>/<experiment>/ and prints its report; raw artifacts stay under target/benchmarks/. `--profile` adds optional samply captures, `--steps a,b` runs a declared subset that records its omissions. See benchmarks/README.md."
depends = ["bench:build"]
run = "target/profiling/release/capacity l1"

[tasks."bench:l1:bifrost"]
description = "Level 1 Bifrost `isolated` (5 s warmup, 3 x 10 s per step, 15 min budget): the standard 10M-row events fixture published as Parquet, exact-checked point lookups at 1/4/16/64 clients (p99 < 5 ms at 64), small aggregates and full scans at 1/64, and 2M-row native, OTLP spans and OTLP logs write sweeps at 1/4/16/64 with peak sanity floors (native >= 200k rows/s, OTLP >= 30 wire MiB per server CPU-second) and regression against benchmarks/bifrost/baselines.toml. Opt-in benchmark experiment; part of no gate, CI or verify lane. Builds the release wyrd-server and capacity driver with frame pointers into target/profiling before the experiment clock starts, then runs under a fresh repository Postgres on the whole host (macOS arm64, Linux x86_64, Linux arm64) with a file:// store. Discards the run (exit 2) on a busy host, dirty source (unless --allow-dirty), overrun or unresolved evidence; fails (exit 1) on a declared criterion. Appends one v1 record under benchmarks/<engine>/<experiment>/ and prints its report; raw artifacts stay under target/benchmarks/. `--profile` adds optional samply captures, `--steps a,b` runs a declared subset that records its omissions. See benchmarks/README.md."
depends = ["bench:build"]
run = "scripts/postgres/with-test-postgres.sh -- target/profiling/release/capacity l1 bifrost"

[tasks."bench:l1:verification"]
description = "Level 1 Verification `direct-verify` (5 s warmup, 3 x 10 s per step, 15 min budget): direct observe().verify at 1/4/16/64 closed-loop clients, server overhead p99 < 500 us at 64 clients, server overhead components and verifications per server CPU-second, with correct verdicts and no refusal in every repetition. Opt-in benchmark experiment; part of no gate, CI or verify lane. Builds the release wyrd-server and capacity driver with frame pointers into target/profiling before the experiment clock starts, then runs under a fresh repository Postgres on the whole host (macOS arm64, Linux x86_64, Linux arm64) with a file:// store. Discards the run (exit 2) on a busy host, dirty source (unless --allow-dirty), overrun or unresolved evidence; fails (exit 1) on a declared criterion. Appends one v1 record under benchmarks/<engine>/<experiment>/ and prints its report; raw artifacts stay under target/benchmarks/. `--profile` adds optional samply captures, `--steps a,b` runs a declared subset that records its omissions. See benchmarks/README.md."
