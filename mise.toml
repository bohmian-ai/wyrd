depends = ["build:postgres", "db:setup-roles", "db:migrate"]
env = { WYRD_DATABASE_URL = "postgres://wyrd_app:wyrd_app_pw@localhost/wyrd", WYRD_DATABASE_MIGRATOR_PASSWORD = "wyrd_migrator_pw", WYRD_DATABASE_PLATFORM_ADMIN_PASSWORD = "wyrd_platform_admin_pw" }
run = "cargo test --locked -p wyrd-sql --all-features --test migration_pg -- --nocapture"

[tasks."check:security-schema-drift"]
description = "wyrd-spec::security goldens match the generator's output (no test-utils)"
run = "cargo test --locked -p wyrd-spec --no-default-features --features server --tests security -- schema_drift"

[tasks."check:security-inline-gate"]
description = "Prove SecretRef::Inline is absent without `test-utils`"
run = "cargo test --locked -p wyrd-spec --no-default-features --features server --tests security -- inline_rejected_without_test_utils"

[tasks."check:transport-schema-drift"]
description = "wyrd-client::transport goldens match the generator's output"
run = "cargo test --locked -p wyrd-client --tests transport -- schema_drift"

[tasks."check:alert-router-schema-drift"]
description = "vala-core::alert_router goldens match the generator's output"
run = "cargo test --locked -p vala-core --tests alert_router -- schema_drift"

[tasks."dev:pg:nuke"]
description = "Wipe embedded pg cache"
run = "rm -rf ${WYRD_DEV_PG_CACHE}"

[tasks."bench"]
description = """vala-bifrost criterion microbenches against docker-compose Postgres.
Brings up a clean Postgres, provisions roles, applies migrations, then runs the
benches. The warehouse dir is reset so a fresh catalog never disagrees with
stale on-disk Iceberg metadata.
"""
depends = ["build:postgres", "db:setup-roles", "db:migrate"]
env = { BIFROST_TEST_DB_URL = "postgres://wyrd_migrator:wyrd_migrator_pw@localhost/wyrd" }
run = """
rm -rf /tmp/vala-bifrost-bench
cargo bench -p vala-bifrost --features bench-bin
"""

[tasks."bench:workload"]
description = """vala-bifrost large-workload bench (~5 min, release) against docker-compose Postgres.
Brings up a clean Postgres, provisions roles, and applies migrations first.
"""
depends = ["build:postgres", "db:setup-roles", "db:migrate"]
env = { WYRD_BENCH_PG_URL = "postgres://wyrd_migrator:wyrd_migrator_pw@localhost/wyrd" }
run = """
cargo run --release -p vala-bifrost --bin bench_workload --features bench-bin -- \
  --rows 10000000 --batch-size 65536 --workload selective \
  --postgres-url "$WYRD_BENCH_PG_URL" \
  --output crates/vala/vala-bifrost/benches/reports/workload-selective.json
"""

[tasks."bench:check"]
description = "Fail if microbenches regressed >10% vs the stage1 baseline"
run = """
cargo run --release -p vala-bifrost --bin bench_check --features bench-bin -- \
  --baseline crates/vala/vala-bifrost/benches/baselines/stage1.json \
  --criterion-dir target/criterion
"""
