# ============================================================================
# Canonical developer loop — these are the tasks you run directly.
# `mise tasks` lists only these; every other task is a CI shard or invariant
# check that runs as a `pre-pr` dependency (still runnable by name, just hidden).
#
#   mise run check       Fast pre-commit loop: fmt --check + clippy + cargo check.
#   mise run pre-pr      The full gate. Run this before pushing — it is the
#                        answer to "make sure everything passes" (Rust + Python +
#                        codegen + docs + every boundary invariant).
#
#   mise run test:unit   All Rust tests except Bifrost, Forge SQL scale, and real-cloud storage.
#   mise run test:bifrost   DataFusion/Postgres Rust tests (separate CI job).
#   mise run test:wyrd/skald/vala/shared   Family lanes (skip pg_tests, no docker needed).
#   mise run py:test:unit   Python suite (builds the extension, then pytest).
#
#   cargo test -p <crate> <name> --all-features    Iterate on one crate/test.
#
# Need a hidden task? `mise run <name>` still works; `mise tasks --hidden` lists all.
# ============================================================================
[tools]
node = "26.2.0"
uv = "0.11.16"
rust = "1.95.0"
"npm:pnpm" = "11.4.0"
cmake = "3.26.4"
protoc = "33.2"

[settings]
env_shell_expand = false
# jobs = 1: serializes all tasks to prevent concurrent test:sql / test:bifrost /
# test:wyrd-server from racing the shared Postgres database. Side-effect: also
# serializes unrelated tasks (lints, codegen). Lift when DB tasks gain explicit
# depends chains that prevent races without global serialization.
jobs = 1

[env]
UI_DIR = "crates/wyrd/wyrd-server/wyrd-ui"
PY_DIR = "python/py-wyrd"
WYRD_DEV_PG_CACHE = "${HOME}/.cache/wyrd/pg"

[tasks.fmt]
description = "Format all Rust code"
run = "cargo fmt --all"

[tasks.lints]
description = "Workspace clippy with -D warnings (all features, all targets)"
run = "cargo clippy --locked --workspace --all-features --all-targets -- -D warnings"

[tasks."build:postgres"]
hide = true
description = "Start a clean Postgres container via docker compose and wait for it to be healthy"
# --force-recreate --renew-anon-volumes guarantees a genuinely fresh container
# and storage even if a healthy container is already running (otherwise `up` is a
# no-op and reuses the old PGDATA). Combined with the postgres tmpfs mount, the
# test DB is empty on every invocation — no stale _sqlx_migrations ledger.
run = """
set -eu

lock_dir=".mise-postgres.lock"
locked=0
for _ in $(seq 1 180); do
  if mkdir "$lock_dir" 2>/dev/null; then
    trap 'rmdir "$lock_dir"' EXIT INT TERM
    locked=1
    break
  fi
  sleep 1
done
if [ "$locked" -ne 1 ]; then
  echo "could not acquire Postgres setup lock" >&2
  exit 1
fi

for id in $(docker ps -aq --filter publish=55432); do
  echo "removing Docker container publishing 55432: $id"
  error_file="$(mktemp)"
  if ! docker rm -f -v "$id" 2>"$error_file"; then
    if ! grep -q "removal of container .* is already in progress" "$error_file"; then
      cat "$error_file" >&2
      rm -f "$error_file"
      exit 1
    fi
  fi
  rm -f "$error_file"
done

docker compose down --volumes --remove-orphans
docker compose up -d --build --force-recreate --renew-anon-volumes postgres --wait
"""

[tasks."pg:teardown"]
description = "Tear down the Postgres docker container and remove volumes"
run = "docker compose down --volumes --remove-orphans"

[tasks."setup:postgres"]
description = "Start a clean Postgres container and provision all test roles (single entry point for SQL-dependent tasks)"
depends = ["setup:db-roles"]

[tasks."impl:setup"]
hide = true
description = "One-time environment bring-up before the first wyrd-implement wave: shared docker Postgres that every worktree reaches at 127.0.0.1:55432. Run once, not per worktree."
depends = ["setup:postgres"]
run = "echo 'impl env ready: shared Postgres up; mise supplies DATABASE_URL / WYRD_* per verify task'"

[tasks."impl:warm"]
hide = true
description = "Seed the shared cargo target dir by compiling the workspace before dispatching a wave. All executors share one CARGO_TARGET_DIR, so warming once builds the heavy deps (DataFusion/Arrow/Iceberg) a single time; each executor then reuses them instead of cold-building in parallel and racing on cargo's build lock."
run = "cargo build --workspace --all-features --all-targets"

