[tools]
node = "latest"
python = "3.12"
uv = "latest"
rust = "stable"
"npm:pnpm" = "latest"
cmake = "3.26.4"
protoc = "33.2"

[settings]
env_shell_expand = false

[env]
UI_DIR = "crates/wyrd/wyrd-server/wyrd-ui"
PY_DIR = "python/py-wyrd"
WYRD_DEV_PG_CACHE = "${HOME}/.cache/wyrd/pg"

[tasks.fmt]
description = "Format all Rust code"
run = "cargo fmt --all"

[tasks.lints]
description = "Workspace clippy with -D warnings (all features, all targets)"
run = "cargo clippy --workspace --all-features --all-targets -- -D warnings"

[tasks."test:unit"]
description = "Run all Rust unit tests"
run = "cargo test --workspace --all-features --lib"

[tasks."py:setup"]
description = "uv sync placeholder for the future Python package"
dir = "python/py-wyrd"
run = "true"

[tasks."py:test:unit"]
description = "Run Python unit tests"
dir = "python/py-wyrd"
run = "true"

[tasks."dev:backend"]
description = "Build and run wyrd-server on :8080"
run = [
  "cargo build -p wyrd-server",
  "WYRD_SERVER_PORT=${WYRD_SERVER_PORT:-8080} ./target/debug/wyrd-server",
]

[tasks."dev:frontend"]
description = "SvelteKit dev server on :3000"
dir = "crates/wyrd/wyrd-server/wyrd-ui"
run = "pnpm run dev --host 0.0.0.0 --port ${WYRD_UI_PORT:-3000}"

[tasks."dev:both"]
description = "Run wyrd-server (:8080) and UI (:3000) in parallel"
run = """
cargo build -p wyrd-server
WYRD_SERVER_PORT=${WYRD_SERVER_PORT:-8080} ./target/debug/wyrd-server &
BACKEND_PID=$!
cd crates/wyrd/wyrd-server/wyrd-ui && pnpm run dev --host 0.0.0.0 --port ${WYRD_UI_PORT:-3000} &
FRONTEND_PID=$!
trap 'kill $BACKEND_PID $FRONTEND_PID 2>/dev/null' EXIT INT TERM
wait $BACKEND_PID $FRONTEND_PID
"""

[tasks."dev:full"]
description = "Boot wyrd-server, wyrd-observability-server, and UI on :3000"
run = """
cargo build -p wyrd-server -p wyrd-observability-server
WYRD_SERVER_PORT=${WYRD_SERVER_PORT:-8080} ./target/debug/wyrd-server &
SERVER_PID=$!
WYRD_OBS_SERVER_PORT=${WYRD_OBS_SERVER_PORT:-8090} ./target/debug/wyrd-observability-server &
OBS_PID=$!
cd crates/wyrd/wyrd-server/wyrd-ui && pnpm install --frozen-lockfile && pnpm run dev --host 0.0.0.0 --port ${WYRD_UI_PORT:-3000} &
UI_PID=$!
trap 'kill $SERVER_PID $OBS_PID $UI_PID 2>/dev/null' EXIT INT TERM
wait $SERVER_PID $OBS_PID $UI_PID
"""

[tasks.check]
description = "Phase 0 gate: fmt --check + clippy + cargo check (workspace, all features)"
run = """
cargo fmt --all -- --check
cargo clippy --workspace --all-features --all-targets -- -D warnings
cargo check --workspace --all-features
"""

[tasks."codegen:regen"]
description = "Regenerate OpenAPI / JSON schemas / MCP tool list / pyi stubs from source"
run = """
mkdir -p crates/wyrd-spec/schemas
touch crates/wyrd-spec/schemas/.gitkeep
test -f openapi.yaml || { echo 'openapi.yaml missing'; exit 1; }
"""

[tasks."codegen:check"]
description = "Fail if generated openapi/schemas/MCP/pyi drift from source"
run = """
mise run codegen:regen
git diff --exit-code -- openapi.yaml crates/wyrd-spec/schemas/ python/py-wyrd/ \
  || { echo 'codegen drift detected - run mise run codegen:regen and commit'; exit 1; }
"""

[tasks."pre-pr"]
description = "Aggregate gate: check + codegen:check"
depends = ["check", "codegen:check"]

[tasks."dev:pg:nuke"]
description = "Wipe embedded pg cache"
run = "rm -rf ${WYRD_DEV_PG_CACHE}"
