# ============================================================================
# Canonical developer loop — these are the tasks you run directly.
# `mise tasks` lists only these; every other task is a CI shard or invariant
# check that runs as a `gate` dependency (still runnable by name, just hidden).
#
#   mise run check       Pre-commit loop: fmt --check, workspace-hack, and Clippy.
#   mise run gate        Full nightly/release/fallback aggregate (CI runs its gate:* shards in parallel).
#
#   mise run test:rust   Broad Rust aggregate.
#   mise run verify:bifrost   Complete scoped Bifrost gate.
#   mise run test:wyrd/skald/vala/shared   Complete default-feature family lanes.
#   mise run py:test:unit   Python suite (builds the extension, then pytest).
#
#   mise exec -- cargo nextest run --locked -p <crate> --lib \
#     -E 'test(=module::tests::name)'                     Iterate on one named test.
#
# Need a hidden task? `mise run <name>` still works; `mise tasks --hidden` lists all.
# ============================================================================
[tools]
node = "26.2.0"
uv = "0.11.16"
rust    = "1.99.0"
"npm:pnpm" = "11.4.0"
cmake = "3.26.4"
protoc = "33.2"
# mise installs cargo: tools with cargo-binstall when it is present, so CI
# downloads these prebuilt instead of compiling them from source.
cargo-binstall = "1.25.3"
"cargo:cargo-nextest" = "0.9.143"
"cargo:cargo-hakari" = "0.9.38"

[settings]
disable_tools = ["python"]
env_shell_expand = false
# jobs = 1 keeps the repository task graph deterministic. Postgres-backed leaves
# own isolated Compose projects, so concurrent direct wrapper invocations remain
# safe even though mise itself schedules tasks serially by default.
jobs = 1

[env]
# A panicking test should say where it panicked. Every lane below runs under
# this, so a failure report never costs a second run to reproduce with
# backtraces enabled.
RUST_BACKTRACE = "1"

[tasks.fmt]
description = "Format all Rust code"
run = "cargo fmt --all"

[tasks."fmt:check"]
hide = true
description = "Check Rust formatting without rewriting files"
run = "cargo fmt --all -- --check"

[tasks.lints]
description = "Whole-plan workspace Clippy with -D warnings (all features, all targets), then the shipped wyrd-server binary alone at its release features, which workspace feature unification otherwise hides"
run = [
  "cargo clippy --locked --workspace --all-features --all-targets -- -D warnings",
  "cargo clippy --locked -p wyrd-server --bin wyrd-server -- -D warnings",
]

[tasks."lint:wyrd-sdk-python"]
hide = true
description = "Run the wyrd-sdk-python library clippy check without and with its python boundary feature"
run = [
  "cargo clippy --locked -p wyrd-sdk-python --lib -- -D warnings",
  "cargo clippy --locked -p wyrd-sdk-python --lib --features python -- -D warnings",
]

[tasks."impl:warm"]
hide = true
description = "Seed the shared cargo target dir by compiling the workspace before dispatching a wave. All executors share one CARGO_TARGET_DIR, so warming once builds the heavy deps (DataFusion/Arrow/Iceberg) a single time; each executor then reuses them instead of cold-building in parallel and racing on cargo's build lock."
run = "cargo build --workspace --all-features --all-targets"

[tasks."test:wyrd"]
hide = true
description = "Run wyrd family tests inside an isolated Postgres lifecycle; packages are the crates under the family directory"
run = "scripts/postgres/with-test-postgres.sh -- bash -lc 'mise run db:migrate:all:inner && mise run test:wyrd:inner'"

[tasks."test:wyrd:inner"]
hide = true
description = "Run wyrd family tests with the lifecycle already provisioned; packages are the crates under the family directory"
depends = ["build:server"]
run = "bash scripts/run-family-tests.sh wyrd"

[tasks."test:cards:unit"]
hide = true
description = "Run the card registration SQL and server unit slices"
run = """
cargo test --locked -p wyrd-sql --lib queries::cards::declare
cargo test --locked -p wyrd-server --lib components::cards
"""

[tasks."test:cards:integration"]
description = "Run the durable card registration and manual verification Postgres suite"
env = { WYRD_REG_E2E = "1" }
run = "scripts/postgres/with-test-postgres.sh -- bash -lc 'mise run db:migrate:all:inner && mise run test:cards:integration:inner'"

[tasks."test:cards:integration:inner"]
hide = true
description = "Run the durable card registration Postgres suite with its lifecycle already provisioned"
run = """
cargo test --locked -p wyrd-sql --test integration -- pg_cards_declare:: --nocapture --test-threads=1
cargo nextest run --locked -p wyrd-server --test integration --test-threads=1 -E 'test(/^pg_card_declaration_route::/)'
cargo nextest run --locked -p wyrd-server --test integration --test-threads=1 -E 'test(/^pg_verification_routes::/)'
cargo nextest run --locked -p wyrd-ai --test integration -P journey --run-ignored=all -E 'test(/^declare_and_pull::/)'
"""

[tasks."test:principals:unit"]
description = "Run the principal and credential model unit slices"
run = """
cargo nextest run --locked -p wyrd-spec --lib -E 'test(/^auth::principal_kind::/)'
cargo nextest run --locked -p wyrd-runtime --lib -E 'test(/^principal::/)'
cargo nextest run --locked -p wyrd-auth-verify --lib -E 'test(/^tests::(into_verified_|token_verifier_)/)'
cargo nextest run --locked -p wyrd-auth-issue --lib -E 'test(/^tests::issue_access_token_/)'
cargo nextest run --locked -p wyrd-auth --lib -E 'test(/^platform_credentials::tests::/)'
cargo nextest run --locked -p wyrd-auth --lib -E 'test(/^issuance::tests::/)'
"""

[tasks."test:platform:journey"]
description = "Real-server operator journey: init, platform session, tenant provisioning, recovery"
run = "scripts/postgres/with-test-postgres.sh -- bash -lc 'mise run db:migrate:all:inner && mise run test:platform:journey:inner'"

[tasks."test:platform:journey:inner"]
hide = true
description = "Run the real-server platform administration journey with its lifecycle already provisioned"
run = "cargo nextest run --locked -p wyrd-server --test integration -E 'test(/^platform_admin_e2e::/)'"

[tasks."test:principals:integration"]
description = "Run the durable principal, credential, and grant Postgres suites"
run = "scripts/postgres/with-test-postgres.sh -- bash -lc 'mise run db:migrate:all:inner && mise run test:principals:integration:inner'"

[tasks."test:principals:integration:inner"]
hide = true
description = "Run the durable principal, credential, and grant Postgres suites with their lifecycle already provisioned"
run = """
cargo nextest run --locked -p wyrd-sql --test integration -E 'test(/^(pg_admin_principals|pg_platform_identity)::/)'
cargo nextest run --locked -p wyrd-auth --lib -E 'test(/^platform_authz::pg_tests::/)'
cargo nextest run --locked -p wyrd-auth --lib -E 'test(/^platform_credentials::pg_tests::/)'
cargo nextest run --locked -p wyrd-auth --lib -E 'test(/^platform_sessions::pg_tests::/)'
cargo nextest run --locked -p wyrd-auth --lib -E 'test(/^platform_login::pg_tests::/)'
cargo nextest run --locked -p wyrd-auth --lib -E 'test(/^issuance::pg_tests::/)'
cargo nextest run --locked -p wyrd-auth --lib -E 'test(/^exchange_api_key::pg_tests::/)'
cargo nextest run --locked -p wyrd-auth --lib -E 'test(/^revoke::pg_tests::/)'
cargo nextest run --locked -p wyrd-auth --lib -E 'test(/^refresh::pg_tests::/)'
cargo nextest run --locked -p wyrd-server --lib -E 'test(/^components::admin::routes::pg_tests::/)'
cargo nextest run --locked -p wyrd-server --test integration -E 'test(/^(pg_openapi_contract|pg_principal_roles)::/)'
cargo nextest run --locked -p wyrd-ai --test integration -P journey --run-ignored=all -E 'test(/^principal_roles::/)'
"""

[tasks."test:cli:journey"]
description = "Run the real-server CLI Card lifecycle journey"
run = "scripts/postgres/with-test-postgres.sh -- bash -lc 'mise run db:migrate:all:inner && mise run test:cli:journey:inner'"

[tasks."test:cli:journey:inner"]
hide = true
description = "Run the real-server CLI Card lifecycle journey with its lifecycle already provisioned"
run = "cargo test --locked -p wyrd-cli --test cli -- --nocapture --test-threads=1"

[tasks."test:local-dev:journey"]
description = "Installed CLI bootstrap, guided setup, CLI gateway setup, and fresh saved-config Rust, Python, TypeScript, and MCP callers"
depends = ["py:setup", "ts:build", "ts:build:testing"]
run = [
  # --tests puts the dev-only workspace-hack in the graph, so these binaries
  # share the test builds' third-party artifacts instead of rebuilding them.
  "cargo build --locked -p wyrd-cli -p wyrd-server --bins --tests",
  # `wyrd init` launches the installed production UI build.
  "pnpm --dir crates/wyrd/wyrd-server/wyrd-ui install --frozen-lockfile",
  "pnpm --dir crates/wyrd/wyrd-server/wyrd-ui build",
  "scripts/postgres/with-test-postgres.sh -- cargo nextest run --locked -p wyrd-cli --test cli --run-ignored=all -E 'test(=pg_tests::init_first_run_is_client_ready) | test(=pg_tests::init_repeat_and_partial_failure_preserve_state) | test(=pg_tests::init_selected_mcp_host_reads) | test(=pg_tests::init_keeps_the_gateway_managed_secret_key) | test(=pg_tests::init_saved_settings_survive_working_directory_change) | test(=pg_tests::guided_init_lifecycle_and_prompt)'",
  "scripts/postgres/with-test-postgres.sh -- uv run --directory sdks/wyrd-sdk-python python -m pytest -q -m local_dev tests/integration/test_local_development.py::test_installed_cli_guided_setup",
  "scripts/postgres/with-test-postgres.sh -- uv run --directory sdks/wyrd-sdk-python python -m pytest -q -m local_dev tests/integration/test_local_development.py::test_standalone_examples_use_saved_local_setup",
  "scripts/postgres/with-test-postgres.sh -- uv run --directory sdks/wyrd-sdk-python python -m pytest -q -m local_dev tests/integration/test_local_development.py::test_installed_cli_bootstrap[rust]",
  "scripts/postgres/with-test-postgres.sh -- uv run --directory sdks/wyrd-sdk-python python -m pytest -q -m local_dev tests/integration/test_local_development.py::test_installed_cli_bootstrap[interrupt]",
  "scripts/postgres/with-test-postgres.sh -- uv run --directory sdks/wyrd-sdk-python python -m pytest -q -m local_dev tests/integration/test_local_development.py::test_installed_cli_bootstrap[exit]",
  "scripts/postgres/with-test-postgres.sh -- uv run --directory sdks/wyrd-sdk-python python -m pytest -q -m local_dev tests/integration/test_local_development.py::test_installed_cli_bootstrap[python]",
  "scripts/postgres/with-test-postgres.sh -- node scripts/check_ts_package.mjs mise exec -- uv run --directory sdks/wyrd-sdk-python python -m pytest -q -m local_dev tests/integration/test_local_development.py::test_installed_cli_bootstrap[typescript]",
  "scripts/postgres/with-test-postgres.sh -- node scripts/check_ts_package.mjs mise exec -- uv run --directory sdks/wyrd-sdk-python python -m pytest -q -m local_dev tests/integration/test_local_development.py::test_installed_cli_gateway_setup",
  "scripts/postgres/with-test-postgres.sh -- node scripts/check_ts_package.mjs mise exec -- uv run --directory sdks/wyrd-sdk-python python -m pytest -q -m local_dev tests/integration/test_local_development.py::test_guided_setup_prompt_surfaces tests/integration/test_local_development.py::test_guided_manual_setup",
]

[tasks."test:wyrdstate:journey"]
description = "Run the real-server CLI and Rust SDK typed WyrdState and gateway administration journeys"
run = "scripts/postgres/with-test-postgres.sh -- bash -lc 'mise run db:migrate:all:inner && mise run test:wyrdstate:journey:inner'"

[tasks."test:wyrdstate:journey:inner"]
hide = true
description = "Run the real-server CLI and Rust SDK typed WyrdState journeys with their lifecycle already provisioned"
run = [
  "cargo nextest run --locked -p wyrd-cli --test cli -E 'test(=card_lifecycle::pg_tests::cli_bundle_loads_typed_wyrdstate_after_server_shutdown)'",
  "cargo nextest run --locked -p wyrd-ai --test integration -P journey --run-ignored=all -E 'test(=declare_and_pull::service_graph_declares_and_pulls)'",
  "cargo nextest run --locked -p wyrd-ai --test integration -P journey --run-ignored=all -E 'test(/^(gateway_admin|operator_connections)::/)'",
]

[tasks."test:gateway:native"]
description = "Run the real-server native Anthropic and Gemini gateway ingress journeys (Rust HTTP and official Python clients)"
depends = ["py:setup"]
run = "scripts/postgres/with-test-postgres.sh -- bash -lc 'mise run db:migrate:all:inner && mise run test:gateway:native:inner && mise run py:test:gateway:native:inner'"

[tasks."test:gateway:native:inner"]
hide = true
description = "Run the Rust gateway journeys — ingress, operation families, and resilience — with their lifecycle already provisioned"
env = { WYRD_TEST_GATEWAY_PROVIDER_KEY = "sk-native-upstream" }
run = "cargo nextest run --locked -p wyrd-testing --test gateway -P journey --run-ignored=all -E 'not test(/^vault::/)'"

[tasks."py:test:gateway:native:inner"]
hide = true
description = "Run the official Anthropic and Google GenAI client gateway journeys with their lifecycle already provisioned"
dir = "sdks/wyrd-sdk-python"
run = "uv run python -m pytest -q -m integration tests/integration/gateway/test_gateway_native_clients.py"

[tasks."test:gateway:journey"]
description = """The focused gateway lane: every gateway journey across the public surfaces, on one Postgres lifecycle.
Composes the Rust ingress journeys (OpenAI-compatible, Anthropic Messages, Gemini GenerateContent,
stream termination, capture outage), the ExternalSecret journeys against a real dev Vault, the CLI,
MCP, and Rust SDK administration journeys, the Python
official-client journeys over all four provider backends with their Bifrost capture evidence, and the
TypeScript inference journey. Credential-free: every provider is a local mock upstream.
"""
depends = ["py:setup", "ts:build", "ts:build:testing"]
run = """scripts/postgres/with-test-postgres.sh -- bash -lc 'mise run db:migrate:all:inner \
  && mise run test:gateway:native:inner \
  && mise run test:gateway:vault:inner \
  && mise run test:gateway:journey:surfaces:inner \
  && cargo nextest run --locked -p wyrd-ai --test integration -P journey --run-ignored=all -E \"test(/^(gateway_admin|gateway_inference|gateway_jev)::/)\" \
  && mise run py:test:gateway:journey:inner \
  && mise run ts:test:gateway:journey:inner'"""

[tasks."test:gateway:gate"]
hide = true
description = """The gate's share of the gateway: only the ignored Rust, Vault, CLI, and MCP journeys. The
verify:*-sdk tasks own the Rust, Python, and TypeScript SDK gateway journeys. Run
`test:gateway:journey` for the complete, standalone lane."""
run = """scripts/postgres/with-test-postgres.sh -- bash -lc 'mise run db:migrate:all:inner \
  && mise run test:gateway:native:inner \
  && mise run test:gateway:vault:inner \
  && mise run test:gateway:journey:surfaces:inner'"""

[tasks."test:gateway:vault:inner"]
hide = true
tools = { vault = "2.1.1" }
description = "Run the ExternalSecret journeys against a real dev Vault with their lifecycle already provisioned"
env = { WYRD_TEST_GATEWAY_PROVIDER_KEY = "sk-native-upstream", WYRD_TEST_GATEWAY_VAULT_TOKEN = "wyrd-test-vault-root", WYRD_TEST_GATEWAY_VAULT_TOKEN_DENIED = "wyrd-test-vault-denied" }
run = "cargo nextest run --locked -p wyrd-testing --test gateway -P journey --run-ignored=all -E 'test(/^vault::/)'"

[tasks."test:gateway:journey:surfaces:inner"]
hide = true
description = "Run the CLI and MCP gateway administration journeys with their lifecycle already provisioned"
env = { WYRD_CLI_E2E = "1" }
run = [
  "cargo test --locked -p wyrd-cli --test cli -- --ignored gateway_server_journey:: --nocapture --test-threads=1",
  "cargo nextest run --locked -p wyrd-mcp --test mcp -P journey --run-ignored=all -E 'test(=gateway::pg_tests::agent_administers_redacted_gateway_configuration)'",
]

[tasks."py:test:gateway:journey:inner"]
hide = true
description = "Run every Python gateway journey — administration, native clients, and the official OpenAI client over all four provider backends — with their lifecycle already provisioned"
dir = "sdks/wyrd-sdk-python"
run = "uv run python -m pytest -q -m integration tests/integration/gateway tests/integration/test_gateway_admin.py tests/integration/test_gateway_inference.py tests/integration/test_gateway_jev.py"

[tasks."test:gateway:smoke:live"]
description = """Opt-in live provider sweep against real OpenAI, Anthropic, Gemini, and Jev with the operator's own keys.
Part 1 sends each provider's own client through a live gateway; part 2 renders portable and native Wyrd Prompts
and posts each native request straight to the provider, isolating Prompt lowering from the gateway. Credentials
come from the environment, normally an untracked mise.local.toml: OPENAI_API_KEY, ANTHROPIC_API_KEY,
GOOGLE_API_KEY or GEMINI_API_KEY, and TYPESAFE_API_KEY. A provider without a key is skipped explicitly.
WYRD_SMOKE_<PROVIDER>_MODEL overrides a provider's model. Vertex is excluded: its credential is a short-lived
OAuth token, which never enters managed-secret storage. Deliberately outside test:gateway:journey and the CI gate.
"""
depends = ["py:setup"]
run = "scripts/postgres/with-test-postgres.sh -- bash -lc 'mise run db:migrate:all:inner && mise run test:gateway:smoke:live:inner'"

[tasks."test:gateway:smoke:live:inner"]
hide = true
description = "Run the live provider gateway smoke tests with their lifecycle already provisioned"
dir = "sdks/wyrd-sdk-python"
run = "uv run python -m pytest -q -rs -m smoke tests/smoke"

[tasks."ts:test:gateway:journey:inner"]
hide = true
description = "Run the TypeScript gateway administration and inference journeys with their lifecycle already provisioned"
dir = "sdks/wyrd-sdk-ts/wyrd"
run = "pnpm exec vitest run tests/integration/gateway-admin.test.ts tests/integration/gateway-inference.test.ts tests/integration/gateway-streaming.test.ts tests/integration/gateway-jev.test.ts"

[tasks."test:skald"]
hide = true
description = "Run skald family tests (no DB required); packages are the crates under the family directory"
run = "bash scripts/run-family-tests.sh skald"

[tasks."test:vala"]
hide = true
description = "Run Vala family tests with the canonical local Postgres environment; packages are the crates under the family directory"

run = "scripts/postgres/with-test-postgres.sh -- bash -lc 'mise run db:migrate:all:inner && mise run test:vala:inner'"
[tasks."test:vala:inner"]
hide = true
description = "Run Vala family tests with the canonical local Postgres environment; packages are the crates under the family directory"
run = "bash scripts/run-family-tests.sh vala"

[tasks."test:shared"]
hide = true
description = "Run complete shared family tests inside an isolated Postgres lifecycle; packages are the crates under the family directory"
run = "scripts/postgres/with-test-postgres.sh -- bash -lc 'mise run db:migrate:all:inner && mise run test:shared:inner'"

[tasks."test:shared:inner"]
hide = true
description = "Run shared family tests with the lifecycle already provisioned; packages are the crates under the family directory"
run = "bash scripts/run-family-tests.sh shared"

[tasks."test:wyrd-sdk"]
hide = true
description = "Run the Rust SDK projection unit tests"
run = "cargo nextest run --locked -p wyrd-ai --lib"

[tasks."test:bifrost"]
description = "Run every Bifrost unit, integration, and Rust/Python/TypeScript journey test under one Postgres lifecycle."
run = "scripts/postgres/with-test-postgres.sh -- bash -lc 'mise run db:migrate:all:inner && mise run test:bifrost:inner'"

[tasks."test:bifrost:gate"]
hide = true
description = """The gate's share of Bifrost: only the ignored Rust tests. Every non-ignored Rust test belongs to a family lane, and py:test:integration,
ts:test:integration, and ts:test:unit own the SDK Bifrost files. One `nextest` invocation schedules
every selected binary together. Run `test:bifrost` for the complete, standalone lane."""
depends = ["build:server"]
run = """
scripts/postgres/with-test-postgres.sh -- bash -lc '
set -e
mise run db:migrate:all:inner
if [[ ${CI:-} == true ]]; then export NEXTEST_TEST_THREADS=2; fi
cargo nextest run --locked \
  -p wyrd-client --test integration \
  -p wyrd-testing --test forge --test scribe --test oracle --test otlp --test server \
  -p wyrd-mcp --test mcp \
  -p vala-bifrost-redux --test integration \
  -P journey --run-ignored=only \
  -E "not test(=qualification::scribe_512_mib_physical_object_qualifies) and (not package(wyrd-client) or test(/^pg_bifrost_e2e::/))"'
"""

[tasks."test:bifrost:inner"]
hide = true
description = "Run the complete Bifrost test scope against an already-provisioned Postgres lifecycle."
run = "bash scripts/run-bifrost-tests.sh"

[tasks."test:bifrost:unit:rust:inner"]
hide = true
description = "Run Bifrost-facing unit tests in shared server, harness, SDK, and MCP owners."
run = """
cargo nextest run --locked -p wyrd-testing -p wyrd-server -p wyrd-client --lib --features wyrd-server/test-support -E '(package(wyrd-testing) & (test(/^bifrost::/) | test(/^interleaving::/) | test(/^server::production_composition_tests::/))) | (package(wyrd-server) & (test(/^bifrost::/) | test(/^oracle::/) | test(/^query::/) | test(/^grpc::(query|scribe_tail)::/) | test(/bifrost|oracle|scribe|forge/))) | (package(wyrd-client) & (test(/^bifrost::query::/) | test(/^bifrost::sdk::/)))'
"""

[tasks."test:bifrost:unit:typescript:inner"]
hide = true
description = "Run TypeScript Bifrost unit tests."
dir = "sdks/wyrd-sdk-ts/wyrd"
depends = ["ts:build"]
run = "pnpm exec vitest run tests/unit/bifrost-query.test.ts"

[tasks."test:bifrost:integration:redux:inner"]
hide = true
description = "Run the complete vala-bifrost-redux tier-2 suite; its manifest owns the test-only features."
run = "cargo nextest run --locked -p vala-bifrost-redux -P journey --run-ignored=all"

[tasks."test:bifrost:integration:redux"]
description = "Run the complete vala-bifrost-redux tier-2 suite."
run = "scripts/postgres/with-test-postgres.sh -- mise run test:bifrost:integration:redux:inner"

[tasks."test:bifrost:integration:sql:inner"]
hide = true
description = "Run Vala's Bifrost control-plane SQL tests, excluding the separately bounded Forge scale case."
run = "cargo nextest run --locked -p vala-sql --test-threads=1"

[tasks."test:bifrost:integration:sql"]
description = "Run Vala's Bifrost control-plane SQL tests."
run = "scripts/postgres/with-test-postgres.sh -- mise run test:bifrost:integration:sql:inner"

[tasks."test:bifrost:integration:server:inner"]
hide = true
description = "Run explicit wyrd-server integration targets that exercise Bifrost serving seams."
run = "cargo nextest run --locked -p wyrd-server --features test-support --test integration --test-threads=1 -E 'test(/^(pg_grpc_ingest_smoke|pg_grpc_smoke|pg_merge_http_protected|pg_router_smoke|pg_verification_runtime)::/)'"

[tasks."test:operators:integration"]
description = "Run the Operator connection and delivery Postgres suites: redacted encrypted connections, fanout, retries, deadlines, and pool fairness against local provider fixtures."
run = "scripts/postgres/with-test-postgres.sh -- bash -lc 'mise run db:migrate:all:inner && mise run test:operators:integration:inner'"

[tasks."test:operators:integration:inner"]
hide = true
description = "Run the Operator Postgres suites with their lifecycle already provisioned."
run = "cargo nextest run --locked -p wyrd-server --features test-support --test integration --test-threads=1 -E 'test(/^(pg_operator_connection_routes|pg_operator_delivery)::/)'"

[tasks."test:operators:smoke:live"]
description = """Release-gated live Operator smoke: delivers through the production Operator runner to a dedicated
Slack test channel and PagerDuty test service. Reads WYRD_LIVE_SLACK_BOT_TOKEN, WYRD_LIVE_SLACK_WORKSPACE_ID,
WYRD_LIVE_SLACK_CHANNEL_ID, and WYRD_LIVE_PAGERDUTY_KEY from the environment, normally an untracked
mise.local.toml. Deliberately outside every credential-free lane and the CI gate."""
run = "scripts/postgres/with-test-postgres.sh -- bash -lc 'mise run db:migrate:all:inner && cargo nextest run --locked -p wyrd-server --features test-support --test integration --run-ignored only --test-threads=1 -E \"test(=pg_operator_delivery::live_smoke_delivers_to_slack) | test(=pg_operator_delivery::live_smoke_delivers_to_pagerduty)\"'"

[tasks."test:agent-readiness:smoke:live"]
description = """Opt-in live coding-agent readiness: Claude Code and Codex each build and run a Wyrd-verified Python
application from this checkout's locally served docs and connected MCP, against a foreground `wyrd init` the
harness owns for that agent alone. Only authorized server evidence decides each outcome. Calls paid agents. Claude
Code reads ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`), normally from an untracked
mise.local.toml; Codex uses the owner's existing `codex login` through a linked auth.json. A missing one blocks that
agent. Transcripts, apps, and report.json land in
target/agent-readiness/<UTC time>/. Deliberately outside the CI gate."""
