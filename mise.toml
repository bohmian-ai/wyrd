[tasks."setup:db-roles"]
hide = true
description = """Create wyrd_app and wyrd_platform_admin roles in the target Postgres instance.
Targets the local docker-compose Postgres by default; the docker-compose
bootstrap user is wyrd_migrator (which owns the database).
"""
depends = ["build:postgres"]
env = { WYRD_MIGRATOR_DSN = "postgres://wyrd_migrator:wyrd_migrator_pw@127.0.0.1:55432/wyrd" }
run = """
for i in $(seq 1 30); do
  if psql "$WYRD_MIGRATOR_DSN" -c "SELECT 1" >/dev/null 2>&1; then
    break
  fi
  sleep 1
done
psql "$WYRD_MIGRATOR_DSN" -c "ALTER ROLE wyrd_migrator BYPASSRLS;" || true
psql "$WYRD_MIGRATOR_DSN" -c "CREATE ROLE wyrd_app LOGIN PASSWORD 'wyrd_app_pw';" || true
psql "$WYRD_MIGRATOR_DSN" -c "CREATE ROLE wyrd_platform_admin LOGIN PASSWORD 'wyrd_platform_admin_pw' BYPASSRLS;" || true
psql "$WYRD_MIGRATOR_DSN" -c "CREATE ROLE wyrd_catalog NOLOGIN;" || true
psql "$WYRD_MIGRATOR_DSN" -c "CREATE ROLE wyrd_catalog_app LOGIN PASSWORD 'wyrd_catalog_app_pw';" || true
psql "$WYRD_MIGRATOR_DSN" -c "GRANT wyrd_catalog TO wyrd_migrator;" || true
psql "$WYRD_MIGRATOR_DSN" -c "GRANT wyrd_catalog TO wyrd_catalog_app;" || true
"""

[tasks."db:migrate"]
hide = true
description = """Verify wyrd-sql migrations are idempotent against the local docker-compose Postgres.
Checks that required Postgres roles (wyrd_migrator BYPASSRLS, wyrd_app no-BYPASSRLS,
wyrd_platform_admin BYPASSRLS) are present before applying DDL.
"""
depends = ["setup:postgres"]
env = { WYRD_DATABASE_URL = "postgres://wyrd_app:wyrd_app_pw@127.0.0.1:55432/wyrd", WYRD_DATABASE_MIGRATOR_PASSWORD = "wyrd_migrator_pw", WYRD_DATABASE_CATALOG_APP_PASSWORD = "wyrd_catalog_app_pw" }
run = "cargo test --locked -p wyrd-sql --test pg_migration -- migrations_apply_and_are_idempotent --nocapture"

[tasks."test:sql"]
hide = true
description = """Run live Postgres SQL integration tests against docker-compose Postgres.
Brings up Postgres, provisions roles, then runs the SQL migration, reset, fixture, Vala SQL, and registry e2e suites. The 10,000-row Forge scale regression runs through test:sql:forge-scale.
"""
depends = ["dev:pg:nuke", "setup:postgres"]
env = { WYRD_REG_E2E = "1", WYRD_DATABASE_URL = "postgres://wyrd_app:wyrd_app_pw@127.0.0.1:55432/wyrd", WYRD_DATABASE_MIGRATOR_PASSWORD = "wyrd_migrator_pw", WYRD_DATABASE_PLATFORM_ADMIN_PASSWORD = "wyrd_platform_admin_pw", WYRD_DATABASE_CATALOG_APP_PASSWORD = "wyrd_catalog_app_pw" }
run = """
cargo test --locked -p wyrd-sql -- --nocapture --test-threads=1
cargo test --locked -p wyrd-dev-fixtures -- --test-threads=1
cargo test --locked -p vala-sql -- --skip open_set_scan_remains_bounded_after_terminal_growth --test-threads=1
cargo test --locked -p wyrd-storage --test pg_sweeper -- --test-threads=1
"""

