run = "cargo nextest run --locked -p vala-bifrost-redux -P journey --run-ignored=all"

[tasks."test:bifrost:integration:redux"]
description = "Run the complete vala-bifrost-redux tier-2 suite."
run = "scripts/postgres/with-test-postgres.sh -- mise run test:bifrost:integration:redux:inner"

[tasks."test:bifrost:integration:sql:inner"]
hide = true
description = "Run Vala's Bifrost control-plane SQL tests, excluding the separately bounded Forge scale case."
run = "cargo nextest run --locked -p vala-sql --test-threads=1"

[tasks."test:bifrost:integration:sql"]
description = "Run Vala's Bifrost control-plane SQL tests."
run = "scripts/postgres/with-test-postgres.sh -- mise run test:bifrost:integration:sql:inner"

[tasks."test:bifrost:integration:server:inner"]
hide = true
description = "Run explicit wyrd-server integration targets that exercise Bifrost serving seams."
run = "cargo nextest run --locked -p wyrd-server --features test-support --test integration --test-threads=1 -E 'test(/^(pg_grpc_ingest_smoke|pg_grpc_smoke|pg_merge_http_protected|pg_router_smoke|pg_verification_runtime)::/)'"

[tasks."test:operators:integration"]
description = "Run the Operator connection and delivery Postgres suites: redacted encrypted connections, fanout, retries, deadlines, and pool fairness against local provider fixtures."
run = "scripts/postgres/with-test-postgres.sh -- bash -lc 'mise run db:migrate:all:inner && mise run test:operators:integration:inner'"

[tasks."test:operators:integration:inner"]
hide = true
description = "Run the Operator Postgres suites with their lifecycle already provisioned."
run = "cargo nextest run --locked -p wyrd-server --features test-support --test integration --test-threads=1 -E 'test(/^(pg_operator_connection_routes|pg_operator_delivery)::/)'"

[tasks."test:operators:smoke:live"]
description = """Release-gated live Operator smoke: delivers through the production Operator runner to a dedicated
Slack test channel and PagerDuty test service. Reads WYRD_LIVE_SLACK_BOT_TOKEN, WYRD_LIVE_SLACK_WORKSPACE_ID,
WYRD_LIVE_SLACK_CHANNEL_ID, and WYRD_LIVE_PAGERDUTY_KEY from the environment, normally an untracked
mise.local.toml. Deliberately outside every credential-free lane and the CI gate."""
run = "scripts/postgres/with-test-postgres.sh -- bash -lc 'mise run db:migrate:all:inner && cargo nextest run --locked -p wyrd-server --features test-support --test integration --run-ignored only --test-threads=1 -E \"test(=pg_operator_delivery::live_smoke_delivers_to_slack) | test(=pg_operator_delivery::live_smoke_delivers_to_pagerduty)\"'"

[tasks."test:bifrost:integration:server"]
description = "Run wyrd-server integration targets that exercise Bifrost serving seams."
run = "scripts/postgres/with-test-postgres.sh -- bash -lc 'mise run db:migrate:all:inner && mise run test:bifrost:integration:server:inner'"

[tasks."test:bifrost:journey"]
description = """Run the current Bifrost/Scribe Rust user-journey tests (marked #[ignore]
so they stay out of default family lanes) against live Postgres."""

run = "scripts/postgres/with-test-postgres.sh -- bash -lc 'mise run db:migrate:inner && mise run test:bifrost:journey:inner'"
[tasks."test:bifrost:journey:inner"]
hide = true
description = """Run every Bifrost tier-1 capability binary, one after another, against
the live Postgres this lane's parent already stood up. Each capability has a
`test:bifrost:journey:<capability>` lane of its own; the script calls their
`:inner` halves so every binary is defined in exactly one place and runs under
one database lifecycle rather than standing up seven.

The script exists because this cannot be a multiline `run`: mise aborts such a
run at its first failing line, which would hide every capability behind the
first broken one. The script runs all seven and reports them together."""
run = "bash scripts/run-bifrost-journeys.sh"

# --- Per-capability tier-1 lanes -------------------------------------------
#
# These lanes run under cargo-nextest (`-P journey`), which gives every test its
# own process. That isolation is the point, not the speed. The harness installs
# the production telemetry stack once per process — a global metrics recorder
# and tracing subscriber, borrowed by every cluster — and tier-1 tests assert on
# `checkpoint()` deltas of those counters. Under one shared process, concurrent
# tests fold each other's Forge counters into their own delta: `cargo test
# --test-threads=6` fails convergence.rs:240 where nextest passes. The old
# `--test-threads=1` pin avoided that by never running tests at the same time;
# per-test processes make it correct instead.
#
# Concurrency is bounded by Postgres connections rather than CPU. `-P journey`
# sets test-threads in .config/nextest.toml; the ceiling comes from
# WYRD_DB_MAX_CONNECTIONS (scripts/postgres/with-test-postgres.sh) against
# max_connections (docker-compose.yml). Raise those together, never one alone.
#
# `--run-ignored=all` replaces libtest's `--include-ignored`: tier-1 journeys are
# `#[ignore]` so they stay out of default family lanes. Nextest does not fail fast by
# default and `fail-fast = false` is set in the profile, so one broken test
# never hides the rest of a binary. Nextest also never runs doctests, which this
# repository does not use.
#
# Every lane below selects a Cargo *target* and runs it whole. Cargo resolves a
# target against the manifest and fails loudly when it is missing, while a
# positional test-name filter is unverified and exits 0 after selecting nothing.
# Adding a journey to an existing binary therefore needs no edit in this file.
#
# Each capability is a pair: a public lane that stands up Postgres and migrates,
# and a hidden `:inner` that is just the cargo line. `test:bifrost:journey`
# composes the inners; a developer iterating on one capability runs the public
# lane. There is one definition of each binary's command, in the `:inner`.
#
# `crates/wyrd/wyrd-testing/tests/README.md` maps binaries to the sources they
# aggregate and is the place to look before adding a journey.

[tasks."test:bifrost:journey:sdk"]
description = "Tier-1 journeys: the wyrd_client::Bifrost public client path"
run = "scripts/postgres/with-test-postgres.sh -- bash -lc 'mise run db:migrate:inner && mise run test:bifrost:journey:sdk:inner'"
[tasks."test:bifrost:journey:sdk:inner"]
hide = true
description = "wyrd-client pg_bifrost_e2e binary, whole"
run = "cargo nextest run --locked -p wyrd-client --test integration -P journey --run-ignored=all -E 'test(/^pg_bifrost_e2e::/)'"

[tasks."test:bifrost:journey:observe"]
description = "Tier-1 journeys: the scoped observation surface over one WyrdState Bifrost lifetime"
run = "scripts/postgres/with-test-postgres.sh -- bash -lc 'mise run db:migrate:all:inner && mise run test:bifrost:journey:observe:inner'"
[tasks."test:bifrost:journey:observe:inner"]
