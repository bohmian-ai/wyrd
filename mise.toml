uv run python scripts/assemble_stubs.py
uv run ruff check --fix --select I python/wyrd
"""

[tasks."codegen:check"]
description = "Fail if generated schemas, pyi stubs, TypeScript error codes, typed Card envelopes, or UI theme tokens drift from source"
run = """
snapshot_codegen() {
  {
    find crates/wyrd-spec/schemas crates/wyrd-spec/tests/schemas -type f -name '*.json'
    find crates/shared/wyrd-client/schemas crates/shared/wyrd-client/tests/schemas -type f -name '*.json'
    printf '%s\n' sdks/wyrd-sdk-ts/wyrd/src/error-codes.ts sdks/wyrd-sdk-ts/wyrd/src/card-types.ts \
      sdks/wyrd-sdk-python/python/wyrd/_card_types.py
    find sdks/wyrd-sdk-python/python/wyrd -type f -name '*.pyi' \
      ! -path 'sdks/wyrd-sdk-python/python/wyrd/stubs/*'
  } | sort | while IFS= read -r file; do
    shasum -a 256 "$file"
  done
}
BEFORE=$(mktemp)
AFTER=$(mktemp)
trap 'rm -f "$BEFORE" "$AFTER"' EXIT
snapshot_codegen > "$BEFORE"
mise run codegen:regen
snapshot_codegen > "$AFTER"
diff -u "$BEFORE" "$AFTER" \
  || { echo 'codegen drift detected - run mise run codegen:regen and commit'; exit 1; }
(cd crates/wyrd/wyrd-server/wyrd-ui && node brand/gen-theme.mjs --check)
"""

# --- napi TypeScript pipeline -----------------------------------------------------
# The OpenAPI contract is served at runtime from `GET /openapi.json`, composed from the
# same `utoipa-axum` registrations that mount the routes, and is proved by the served
# `pg_openapi_contract` suite in `test:principals:integration`, so nothing here emits or
# checks it.
# Every `ts:*` task needs the napi bindings + package roots (slice 13a). Two separate
# pnpm packages under `sdks/wyrd-sdk-ts/` glued by `sdks/wyrd-sdk-ts/pnpm-workspace.yaml`:
# public `@wyrd/sdk` (`sdks/wyrd-sdk-ts/wyrd`, built from `sdks/wyrd-sdk-ts/native`) and
# private `@wyrd/testing` (`sdks/wyrd-sdk-ts/testing`, built from
# `sdks/wyrd-sdk-ts/native-testing`, test-tier). One napi addon per package so the
# harness never overwrites the SDK's generated loader/`.d.ts`. 13a adds
# `ts:napi:check`/`ts:typecheck`/`ts:test:unit` to `gate`; `ts:test:integration`
# runs in the closeout journey lane.

[tasks."ts:install"]
hide = true
description = "Install the sdks/wyrd-sdk-ts/ pnpm workspace (@wyrd/sdk + @wyrd/testing) from the frozen lockfile (slice 13a)"
dir = "sdks/wyrd-sdk-ts"
run = "pnpm install --frozen-lockfile"

[tasks."ts:build"]
description = "Build the public @wyrd/sdk napi addon (sdks/wyrd-sdk-ts/native) + emit index.d.ts into sdks/wyrd-sdk-ts/wyrd (slice 13a)"
depends = ["ts:install"]
dir = "sdks/wyrd-sdk-ts/wyrd"
run = "pnpm exec napi build --platform --manifest-path ../native/Cargo.toml --output-dir . --package-json-path package.json && test ! -f index.js || mv index.js index.generated.cjs && cp index.d.ts index.d.cts && pnpm exec tsc -p tsconfig.build.json && node -e 'require(\"node:fs\").rmSync(\"index.generated.cjs\", { force: true })'"

[tasks."ts:build:testing"]
description = "Build the private @wyrd/testing napi harness addon (sdks/wyrd-sdk-ts/native-testing) into sdks/wyrd-sdk-ts/testing; feeds the integration lane only (slice 13a)"
depends = ["ts:install"]
dir = "sdks/wyrd-sdk-ts/testing"
run = "pnpm exec napi build --platform --manifest-path ../native-testing/Cargo.toml --output-dir . --package-json-path package.json"

[tasks."ts:napi:check"]
description = "Fail if the public @wyrd/sdk napi-generated index.d.ts is not committed/current (slice 13a; Node analogue of .pyi drift). Scoped to the SDK declaration, not the harness."
depends = ["ts:build"]
dir = "sdks/wyrd-sdk-ts/wyrd"
run = "git diff --exit-code -- index.d.ts || { echo 'napi .d.ts drift - run mise run ts:build and commit sdks/wyrd-sdk-ts/wyrd/index.d.ts'; exit 1; }"

[tasks."ts:pack:check"]
description = "Pack the compiled @wyrd/sdk and current-host napi addon, then import the installed package from a clean ESM project"
depends = ["ts:build"]
run = "node scripts/check_ts_package.mjs"

[tasks."ts:typecheck"]
description = "Typecheck @wyrd/sdk incl. integration sources that resolve the local @wyrd/testing workspace dep (slice 13a)"
depends = ["ts:build", "ts:build:testing"]
dir = "sdks/wyrd-sdk-ts/wyrd"
run = "pnpm exec tsc --noEmit"

[tasks."ts:test:unit"]
description = "@wyrd/sdk unit tests: auth-parity + an error-set native {value,error} envelope makes unwrapNative throw instanceof WyrdError (hand-authored TS class) exposing code/status/title/detail as properties, not parsed from message (slice 13a)"
depends = ["ts:build"]
dir = "sdks/wyrd-sdk-ts/wyrd"
run = "pnpm exec vitest run tests/unit"

[tasks."ts:test:integration"]
description = """@wyrd/sdk client->server->client Bifrost journey (slice 13/13a).
Builds the public @wyrd/sdk addon and the private @wyrd/testing harness addon, then runs
Vitest, which boots WyrdTestServer IN-PROCESS against the repository-managed Postgres,
seeds a tenant, mints a key, and drives @wyrd/sdk against it, tearing down via shutdown()
in finally — symmetric with the Python journey.
"""
depends = ["ts:build", "ts:build:testing"]

run = "scripts/postgres/with-test-postgres.sh -- bash -lc 'mise run db:migrate:inner && mise run ts:test:integration:inner'"
[tasks."ts:test:integration:inner"]
hide = true
description = """@wyrd/sdk client->server->client Bifrost journey (slice 13/13a).
Builds the public @wyrd/sdk addon and the private @wyrd/testing harness addon, then runs
Vitest, which boots WyrdTestServer IN-PROCESS against the repository-managed Postgres,
seeds a tenant, mints a key, and drives @wyrd/sdk against it, tearing down via shutdown()
in finally — symmetric with the Python journey.
"""
dir = "sdks/wyrd-sdk-ts/wyrd"
# The saved user login journey needs the identity lane's Keycloak; only
# test:identity:journey runs it.
run = "pnpm exec vitest run tests/integration --exclude tests/integration/saved-user-auth.test.ts"

[tasks."gate"]
description = "Full repository aggregate for nightly, release, mixed, global, and unclassified changes. Run as `mise run -c gate` to finish every lane and report all failures; without -c mise stops at the first failed lane."
depends = [
  "check",
  "check:deps",
  "check:tenant-isolation",
  "check:storage:drift",
  "check:ci-selection",
  "check:docs",
  "check:examples",
  "codegen:check",
  "docs:check",
  "test:rust",
  "test:bifrost:gate",
  "test:gateway:gate",
  "test:identity:journey",
  "py:setup",
  "py:format:check",
  "py:lints",
  "py:typecheck",
  "py:test:unit",
  "py:test:integration",
  "ts:napi:check",
  "ts:typecheck",
  "ts:test:unit",
  "ts:test:integration",
  "examples:python:datacard",
]

[tasks."db:migrate"]
hide = true
description = """Verify wyrd-sql migrations are idempotent against the local docker-compose Postgres.
Runs as the database owner, as `wyrd-server migrate` does, after checking that the serving
roles (wyrd_app no-BYPASSRLS, wyrd_platform_admin BYPASSRLS) are present.
"""

run = "scripts/postgres/with-test-postgres.sh -- mise run db:migrate:inner"
[tasks."db:migrate:inner"]
hide = true
description = """Verify wyrd-sql migrations are idempotent against the local docker-compose Postgres.
Runs as the database owner, as `wyrd-server migrate` does, after checking that the serving
roles (wyrd_app no-BYPASSRLS, wyrd_platform_admin BYPASSRLS) are present.
"""
run = "cargo nextest run --locked -p wyrd-sql --test integration -E 'test(=pg_migration::pg_tests::migrations_apply_and_are_idempotent)'"

[tasks."test:sql"]
hide = true
description = """Run live Postgres SQL integration tests against docker-compose Postgres.
Brings up Postgres, provisions roles, then runs the SQL migration, reset, fixture, Vala SQL, and registry e2e suites.
"""

run = "scripts/postgres/with-test-postgres.sh -- mise run test:sql:inner"
[tasks."test:sql:inner"]
hide = true
description = """Run live Postgres SQL integration tests against docker-compose Postgres.
Brings up Postgres, provisions roles, then runs the SQL migration, reset, fixture, Vala SQL, and registry e2e suites.
"""
run = """
cargo nextest run --locked -p wyrd-sql --test-threads=1
cargo nextest run --locked -p wyrd-dev-fixtures --features pg --test-threads=1
cargo nextest run --locked -p vala-sql --test-threads=1
cargo nextest run --locked -p wyrd-storage --test integration --test-threads=1 -E 'test(/^pg_sweeper::/)'
"""

[tasks."db:migrate:all"]
hide = true
description = "Manual Wyrd + Vala migration smoke test against local docker-compose Postgres."

run = "scripts/postgres/with-test-postgres.sh -- mise run db:migrate:all:inner"
[tasks."db:migrate:all:inner"]
hide = true
description = "Manual Wyrd + Vala migration smoke test against local docker-compose Postgres."
run = """
cargo nextest run --locked -p wyrd-sql --test integration -E 'test(=pg_migration::pg_tests::migrations_apply_and_are_idempotent)'
cargo nextest run --locked -p vala-sql --test integration -E 'test(=pg_migration::pg_tests::vala_migrations_apply_and_are_idempotent)'
"""

