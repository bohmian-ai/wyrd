        schedule:
          $ref: '#/components/schemas/TriggerSchedule'
          description: Required evaluation schedule.
        source:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TriggerSource'
            description: Optional observation stream to evaluate on each schedule tick.
      additionalProperties: false
    UploadId:
      type: string
      description: Typed upload identifier displayed as `wyu_{uuid_v7}`.
    UploadPlan:
      oneOf:
      - type: object
        description: Single PUT to a presigned URL.
        required:
        - data
        - protocol
        properties:
          data:
            type: object
            description: Single PUT to a presigned URL.
            required:
            - put_url
            - ttl_secs
            properties:
              put_url:
                type: string
                description: Presigned PUT URL.
              required_headers:
                type: array
                items:
                  $ref: '#/components/schemas/HeaderPair'
                description: Headers the client must include on the PUT.
              ttl_secs:
                type: integer
                format: int32
                description: URL time-to-live in seconds.
                minimum: 0
          protocol:
            type: string
            enum:
            - single_put
      - type: object
        description: |-
          Local filesystem auth-gated upload.

          Signals that the upload URL is an auth-gated server route for one
          server-minted upload capability, not a caller-selected storage path.
        required:
        - data
        - protocol
        properties:
          data:
            type: object
            description: |-
              Local filesystem auth-gated upload.

              Signals that the upload URL is an auth-gated server route for one
              server-minted upload capability, not a caller-selected storage path.
            required:
            - put_url
            - ttl_secs
            properties:
              put_url:
                type: string
                description: Server route PUT URL.
              ttl_secs:
                type: integer
                format: int32
                description: URL time-to-live in seconds.
                minimum: 0
          protocol:
            type: string
            enum:
            - local_fs
      - type: object
        description: AWS S3 multipart upload.
        required:
        - data
        - protocol
        properties:
          data:
            type: object
            description: AWS S3 multipart upload.
            required:
            - part_count
            - part_size_bytes
            - part_url_ttl_secs
            properties:
              part_count:
                type: integer
                format: int32
                description: Number of parts planned.
                minimum: 0
              part_size_bytes:
                type: integer
                format: int64
                description: Size of each non-final part.
                minimum: 0
              part_url_ttl_secs:
                type: integer
                format: int32
                description: Time-to-live for per-part URLs in seconds.
                minimum: 0
              required_headers:
                type: array
                items:
                  $ref: '#/components/schemas/HeaderPair'
                description: Headers the client must include on each part PUT.
          protocol:
            type: string
            enum:
            - s3_multipart
      - type: object
        description: Google Cloud Storage resumable upload.
        required:
        - data
        - protocol
        properties:
          data:
            type: object
            description: Google Cloud Storage resumable upload.
            required:
            - session_uri
            - chunk_size_bytes
            properties:
              chunk_size_bytes:
                type: integer
                format: int64
                description: Recommended chunk size in bytes.
                minimum: 0
              session_uri:
                type: string
                description: Resumable session URI returned once to the client.
          protocol:
            type: string
            enum:
            - gcs_resumable
      - type: object
        description: Azure block blob upload.
        required:
        - data
        - protocol
        properties:
          data:
            type: object
            description: Azure block blob upload.
            required:
            - sas_url
            - block_size_bytes
            - block_count_planned
            properties:
              block_count_planned:
                type: integer
                format: int32
                description: Number of blocks the server expects to commit.
                minimum: 0
              block_size_bytes:
                type: integer
                format: int64
                description: Recommended block size in bytes.
                minimum: 0
              sas_url:
                type: string
                description: SAS URL returned once to the client.
          protocol:
            type: string
            enum:
            - azure_block_blob
      description: Tagged union describing how the client uploads bytes.
    VersionBlock:
      type: string
      description: Semver-compatible version string.
    VersionBump:
      oneOf:
      - type: string
        description: Increment major and reset minor, patch, pre-release, and build metadata.
        enum:
        - major
      - type: string
        description: Increment minor and reset patch, pre-release, and build metadata.
        enum:
        - minor
      - type: string
        description: Increment patch and reset pre-release and build metadata.
        enum:
        - patch
      - type: object
        description: Set the pre-release identifier on the current triple (e.g. "rc.1").
        required:
        - pre
        properties:
          pre:
            type: object
            description: Set the pre-release identifier on the current triple (e.g. "rc.1").
            required:
            - identifier
            properties:
              identifier:
                type: string
                description: Pre-release identifier as defined by SemVer 2.0 §9.
      - type: object
        description: Set the build metadata on the current triple (e.g. "001", "sha-abc123").
        required:
        - build
        properties:
          build:
            type: object
            description: Set the build metadata on the current triple (e.g. "001", "sha-abc123").
            required:
            - metadata
            properties:
              metadata:
                type: string
                description: Build metadata as defined by SemVer 2.0 §10.
      - type: object
        description: Set both pre-release and build metadata on the current triple.
        required:
        - pre_build
        properties:
          pre_build:
            type: object
            description: Set both pre-release and build metadata on the current triple.
            required:
            - pre
            - build
            properties:
              build:
                type: string
                description: Build metadata.
              pre:
                type: string
                description: Pre-release identifier.
      description: |-
        Semantic version bump level.

        `Major`, `Minor`, and `Patch` perform a conventional semver bump and clear
        any pre-release / build metadata. `Pre`, `Build`, and `PreBuild` are
        additive: they apply the requested pre-release or build metadata to the
        existing triple without resetting it.
    VersionSpec:
      type: string
      description: Authored version on the card-registration path. Either a full semver triple pin (e.g. "1.4.2", "1.4.2-rc.1+meta") or a bare partial scope (e.g. "1", "1.0"). Range comparators (^, ~, *, >=, ...) are rejected on this path.
    VisibilityMode:
      type: string
      description: Visibility tiers included in one immutable Oracle query cut.
      enum:
      - published_only
      - fused
    WorkflowSpec:
