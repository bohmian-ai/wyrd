openapi: 3.1.0
info:
  title: Wyrd API
  description: ''
  contact:
    name: Thorrester
    email: sjforrester32@gmail.com
  license:
    name: Apache-2.0
  version: 0.0.1
paths:
  /auth/platform/callback:
    post:
      tags:
      - Platform
      summary: Complete a platform federated login and return a platform session.
      description: |-
        # Errors
        Returns a stable Wyrd error when the state is missing or replayed, the
        provider cannot be reached, or the identity is not accepted.
      operationId: complete_login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformCallbackRequest'
        required: true
      responses:
        '200':
          description: Platform session for the resolved administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTokenResponse'
        '401':
          description: Identity not accepted, indistinguishably for every cause
        '503':
          description: Identity provider unavailable
  /auth/platform/login:
    post:
      tags:
      - Platform
      summary: Begin a platform federated login.
      description: |-
        # Errors
        Returns a stable Wyrd error when federated login is not configured, the
        provider cannot be reached, or the login state cannot be persisted.
      operationId: begin_login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformLoginRequest'
        required: true
      responses:
        '200':
          description: Provider authorization URL and opaque state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginInitResponse'
        '404':
          description: Federated login is not configured
        '503':
          description: Identity provider unavailable
  /auth/platform/token:
    post:
      tags:
      - Platform
      summary: Exchange a platform credential for a short-lived session.
      description: |-
        The one route that reads credential material. Every other platform route
        takes the session this mints, so no served surface after this point handles
        a secret.

        # Errors
        Returns an unauthenticated error for every credential rejection, so no
        caller can distinguish which condition failed.
      operationId: platform_token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformTokenRequest'
        required: true
      responses:
        '200':
          description: Short-lived platform session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTokenResponse'
        '401':
          description: Credential rejected, indistinguishably for every cause
  /platform/admins:
    get:
      tags:
      - Platform
      summary: |-
        List every platform principal, including the ones no longer permitted to
        act.
      description: |-
        A suspended administrator is shown rather than hidden: an operator auditing
        who can administer the deployment needs to see that a revoked one really is
        revoked. Nothing secret appears — a principal has no credential material to
        leak, and its pinned subject is not one.

        # Errors
        Returns a stable Wyrd error when the caller is unauthorized or the read
        fails.
      operationId: list_platform_admins
      responses:
        '200':
          description: Every platform principal, including suspended ones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformPrincipalListResponse'
        '401':
          description: Platform session required
    post:
      tags:
      - Platform
      summary: Pre-register a human platform administrator.
      description: |-
        The principal is created with no credential at all: this human will
        authenticate by federated identity, and their subject is pinned on first
        login. Only a caller who already holds platform authority reaches here,
        which is what stops a login from manufacturing platform authority.

        The registration carries no grant. Authority is granted separately and
        deliberately, so registering someone is never the same act as empowering
        them.

        # Errors
        Returns a stable Wyrd error when the caller is unauthorized, no connection
        is configured, the name or claim is already registered, or a write fails.
      operationId: register_admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPlatformAdminRequest'
        required: true
      responses:
        '200':
          description: Administrator registered, awaiting first login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterPlatformAdminResponse'
        '401':
          description: Platform session required
        '409':
          description: Name or matching claim already registered
        '422':
          description: No platform OIDC connection is configured
  /platform/admins/{principal_id}/status:
    put:
      tags:
      - Platform
      summary: Suspend or restore a platform principal.
      description: |-
        This is what makes the active-status check every platform request already
        performs a live guard: without it nothing in the deployment could stop a
        platform principal from acting, and a federated administrator whose identity
        was pinned in error would be unremovable without direct database access.

        Suspending the last active principal is refused. A deployment with no
        principal that can authenticate cannot be recovered through any served
        surface, and locking an operator out of their own control plane is not an
        outcome a single request should be able to reach.

        # Errors
        Returns a stable Wyrd error when the caller is unauthorized, the status is
        not a lifecycle value, the principal is unknown, the change would leave no
        active principal, or the write fails.
      operationId: set_admin_status
      parameters:
      - name: principal_id
        in: path
        description: Platform principal to change
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPlatformPrincipalStatusRequest'
        required: true
      responses:
        '204':
          description: Status changed
        '401':
          description: Platform session required
        '404':
          description: Platform principal not found
        '409':
          description: Would leave the deployment with no active principal
  /platform/oidc/connection:
    get:
      tags:
      - Platform
      summary: Read the configured connection, with its secret omitted.
      description: |-
        # Errors
        Returns a stable Wyrd error when the caller is unauthorized, no connection
        is configured, or the read fails.
      operationId: read_connection
      responses:
        '200':
          description: The configured connection, never its provider secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOidcConnectionView'
        '401':
          description: Platform session required
        '404':
          description: No connection configured
    put:
      tags:
      - Platform
      summary: Install or replace the deployment's platform OIDC connection.
      description: |-
        # Errors
        Returns a stable Wyrd error when the caller is unauthorized, the client
        secret cannot be sealed, or the write fails.
      operationId: configure_connection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurePlatformOidcRequest'
        required: true
      responses:
        '200':
          description: Connection installed; the JWKS endpoint comes from discovery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOidcConnectionView'
        '401':
          description: Platform session required
        '403':
          description: Platform identity administration required
        '422':
          description: Issuer invalid, unreachable, or resolving to a blocked address
    delete:
      tags:
      - Platform
      summary: Remove the platform OIDC connection.
      description: |-
        Platform principals and their grants are untouched. Federated login stops
        working; the global credential does not, which is the whole reason removal
        is safe to expose.

        # Errors
        Returns a stable Wyrd error when the caller is unauthorized or the delete
        fails.
      operationId: remove_connection
      responses:
        '204':
          description: Connection removed; the global credential still administers
        '401':
          description: Platform session required
        '404':
          description: No connection configured
  /platform/tenants:
    post:
      tags:
      - Platform
      summary: Provision a tenant and return its one-time administrative credential.
      description: |-
        # Errors
        Returns a stable Wyrd error when the caller is unauthorized, the slug is
        taken, the platform plane is unconfigured, or provisioning fails.
      operationId: create_tenant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
        required: true
      responses:
        '200':
          description: Provisioned tenant and its one-time administrative credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTenantResponse'
        '401':
          description: Platform session required
        '403':
          description: Tenant creation not granted
        '409':
          description: Slug already in use by a live tenant
  /platform/tenants/admin/credentials:
    post:
      tags:
      - Platform
      summary: Restore administrative access to a tenant that has lost it.
      description: |-
        # Errors
        Returns a stable Wyrd error when the caller is unauthorized, the tenant has
        no administrative principal, or a write fails.
      operationId: recover_tenant_admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoverTenantAdminRequest'
        required: true
      responses:
        '200':
          description: Replacement credential for the tenant's existing administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionedTenantAdmin'
        '401':
          description: Platform session required
        '403':
          description: Tenant administrative recovery not granted
  /v1/bifrost/tables:
    get:
      tags:
      - Bifrost
      summary: Lists the schema-free table entries the authenticated tenant may name.
      description: |-
        # Errors

        Returns structured authorization or catalog-availability errors from the
        catalog service.
      operationId: list
      responses:
        '200':
          description: Visible table entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BifrostTableEntry'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '403':
          description: Bifrost table read permission required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '503':
          description: Catalog unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        default:
          description: Other catalog-backed refusal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
    post:
      tags:
      - Bifrost
      summary: |-
        Registers one Bifrost table for the authenticated tenant, or matches an
        existing table with the same schema fingerprint.
      description: |-
        # Errors

        Returns structured validation, authorization, fingerprint-conflict, or
        catalog-availability errors from the catalog service.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterTableRequest'
        required: true
      responses:
        '200':
          description: Table created or matched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterTableResponse'
        '400':
          description: Invalid table declaration
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '403':
          description: Bifrost table registration permission required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '409':
          description: Schema fingerprint conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '503':
          description: Catalog unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        default:
          description: Other catalog-backed refusal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
  /v1/bifrost/tables/{namespace}/{name}:
    get:
      tags:
      - Bifrost
      summary: Describes one visible table with its stored user and managed columns.
      description: |-
        # Errors

        Returns structured validation, authorization, not-found, or
        catalog-availability errors from the catalog service.
      operationId: describe
      parameters:
      - name: namespace
        in: path
        description: Table namespace
        required: true
        schema:
          type: string
      - name: name
        in: path
        description: Table name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Table description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BifrostTableDescription'
        '400':
          description: Invalid table name
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '403':
          description: Bifrost table read permission required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '404':
          description: No visible table
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '503':
          description: Catalog unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        default:
          description: Other catalog-backed refusal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
  /v1/cards:
    get:
      tags:
      - crate::components::cards::routes
      summary: List tenant-visible Card summaries with keyset pagination.
      operationId: list_cards_http
      parameters:
      - name: kind
        in: query
        description: Filter by Card kind
        required: false
        schema:
          type: string
      - name: space
        in: query
        description: Filter by Card space
        required: false
        schema:
          type: string
      - name: name
        in: query
        description: Filter by Card name
        required: false
        schema:
          type: string
      - name: version_range
        in: query
        description: Filter by semver range
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Filter by lifecycle status
        required: false
        schema:
          type: string
      - name: filter
        in: query
        description: Metadata query filter
        required: false
        schema:
          type: string
      - name: include_prerelease
        in: query
        description: Include prerelease versions
        required: false
        schema:
          type: boolean
      - name: limit
        in: query
        description: Maximum result count
        required: false
        schema:
          type: integer
          format: int32
      - name: cursor
        in: query
        description: Opaque continuation cursor
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Card summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCardsResponse'
        '400':
          description: Invalid list query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '403':
          description: Card read permission required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '503':
          description: Registry unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
    post:
      tags:
      - crate::components::cards::routes
      summary: Accept a card registration request and return its durable registration result.
      description: |-
        The required `Idempotency-Key` lets a caller safely retry after a lost
        response. The service binds that key to the authenticated principal and
        canonical request content, so an exact replay is safe while reuse for a
        different request is rejected.

        The `card:write` verdict is recorded exactly once: inside the service's
        registration transaction when that transaction commits the Card, and
        standalone otherwise — a missing or invalid `Idempotency-Key`, an exact
        replay, a lost idempotency race, or any failure before commit.

        # Errors
        Returns `WYRD_PERMISSION_403_DENIED_RBAC` without `card:write`, the
        audit-unavailable error when the verdict cannot be recorded, a validation
        error for a missing or invalid `Idempotency-Key` or Card body, an
        idempotency or version conflict, and registry or storage unavailability.
      operationId: register_card_http
      parameters:
      - name: Idempotency-Key
        in: header
        description: Stable key reused for retries
        required: true
        schema:
          type: string
        example: card-register-001
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardRequest'
        required: true
      responses:
        '201':
          description: Card registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCardResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '403':
          description: Card write permission required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '409':
          description: Idempotency or version conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '503':
          description: Registry unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
  /v1/cards/by-ref:
    get:
      tags:
      - crate::components::cards::routes
      summary: Fetch one Card by its exact kind/space/name/version identity.
      operationId: get_card_by_ref_http
      parameters:
      - name: kind
        in: query
        description: Exact Card kind
        required: true
        schema:
          type: string
      - name: space
        in: query
        description: Exact Card space
        required: true
        schema:
          type: string
      - name: name
        in: query
        description: Exact Card name
        required: true
        schema:
          type: string
      - name: version
        in: query
        description: Exact Card version
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Hydrated Card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCardResponse'
        '404':
          description: Card not found
        '503':
          description: Registry unavailable
    delete:
      tags:
      - crate::components::cards::routes
      summary: Delete one Card by its exact kind/space/name/version identity.
      description: |-
        The `card:write` verdict commits inside the soft-delete transaction; a delete
        that commits nothing (not found, inbound references, or a failure) records it
        standalone exactly once. Storage cleanup runs after that commit.

        # Errors
        Returns a validation error for an invalid kind, space, name, or version,
        `WYRD_PERMISSION_403_DENIED_RBAC` without `card:write`, the audit-unavailable
        error when the verdict cannot be recorded, not found, an inbound-reference
        conflict, registry unavailability, and incomplete storage cleanup.
      operationId: delete_card_by_ref_http
      parameters:
      - name: kind
        in: query
        description: Exact Card kind
        required: true
        schema:
          type: string
      - name: space
        in: query
        description: Exact Card space
        required: true
        schema:
          type: string
      - name: name
        in: query
        description: Exact Card name
        required: true
        schema:
          type: string
      - name: version
        in: query
        description: Exact Card version
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Card deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCardResponse'
        '404':
          description: Card not found
        '409':
          description: Card has inbound references
        '503':
          description: Registry unavailable
        '507':
          description: Storage cleanup incomplete
  /v1/cards/by-uid/{kind}/{card_uid}:
    get:
      tags:
      - crate::components::cards::routes
      summary: Fetch one Card by its exact kind-qualified UID.
      operationId: get_card_http
      parameters:
      - name: kind
        in: path
        description: Card kind namespace
        required: true
        schema:
          type: string
      - name: card_uid
        in: path
        description: Server-minted Card UID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Hydrated Card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCardResponse'
        '401':
          description: Authentication required
        '403':
          description: Card read permission required
        '404':
          description: Card not found
        '503':
          description: Registry unavailable
    delete:
      tags:
      - crate::components::cards::routes
      summary: Delete one Card by its exact UID.
      description: |-
        The `card:write` verdict commits inside the soft-delete transaction; a delete
        that commits nothing (not found, inbound references, or a failure) records it
        standalone exactly once. Storage cleanup runs after that commit.

        # Errors
        Returns a validation error for an invalid kind or UID,
        `WYRD_PERMISSION_403_DENIED_RBAC` without `card:write`, the audit-unavailable
        error when the verdict cannot be recorded, not found, an inbound-reference
        conflict, registry unavailability, and incomplete storage cleanup.
      operationId: delete_card_http
      parameters:
      - name: kind
        in: path
        description: Card kind namespace
        required: true
        schema:
          type: string
      - name: card_uid
        in: path
        description: Server-minted Card UID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Card deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCardResponse'
        '404':
          description: Card not found
        '409':
          description: Card has inbound references
        '503':
          description: Registry unavailable
        '507':
          description: Storage cleanup incomplete
  /v1/cards/download/init:
    post:
      tags:
      - crate::components::storage::routes
      summary: Create a signed or local download plan for a stored artifact.
      operationId: download_init
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadInitRequest'
        required: true
      responses:
        '200':
          description: Download plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadInitResponse'
        '403':
          description: Card read permission required
        '404':
          description: Card artifact not found
        '503':
          description: Storage unavailable
  /v1/cards/{card_uid}/artifacts:
    get:
      tags:
      - crate::components::cards::routes
      summary: List server-authoritative stored artifacts for one Card.
      operationId: list_artifacts_http
      parameters:
      - name: card_uid
        in: path
        description: Card UID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Artifact inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactInventoryResponse'
        '404':
          description: Card not found
        '503':
          description: Registry unavailable
  /v1/cards/{card_uid}/complete:
    post:
      tags:
      - crate::components::cards::routes
      summary: Complete a Pending Card after the client-side storage transfer finishes.
      description: |-
        The server rechecks every manifest and stores the immutable Card blob before
        activating the Card. Repeating the request with the registration key is an
        idempotent Active no-op; provider URLs and transfer details never cross
        this lifecycle boundary.
      operationId: complete_card_http
      parameters:
      - name: card_uid
        in: path
        description: Server-minted Card UID
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        description: Registration key reused for retries
        required: true
        schema:
          type: string
        example: card-register-001
      responses:
        '200':
          description: Card completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCardResponse'
        '400':
          description: Invalid Card UID or idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '403':
          description: Card write permission required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '404':
          description: Card not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '409':
          description: Card is not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '503':
          description: Registry unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '507':
          description: Artifact verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
  /v1/cards/{kind}/{space}/{name}/latest:
    get:
      tags:
      - crate::components::cards::routes
      summary: Resolve the newest stable Active Card in an identity line.
      operationId: get_latest_card_http
      parameters:
      - name: kind
        in: path
        description: Card kind
        required: true
        schema:
          type: string
      - name: space
        in: path
        description: Card space
        required: true
        schema:
          type: string
      - name: name
        in: path
        description: Card name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Latest Active Card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCardResponse'
        '404':
          description: Card not found
        '503':
          description: Registry unavailable
  /v1/cards/{kind}/{space}/{name}/versions:
    get:
      tags:
      - crate::components::cards::routes
      summary: List versions in one exact Card identity line.
      operationId: list_versions_http
      parameters:
      - name: kind
        in: path
        description: Card kind
        required: true
        schema:
          type: string
      - name: space
        in: path
        description: Card space
        required: true
        schema:
          type: string
      - name: name
        in: path
        description: Card name
        required: true
        schema:
          type: string
      - name: include_prerelease
        in: query
        description: Include prerelease versions
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Card versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVersionsResponse'
        '503':
          description: Registry unavailable
  /v1/principals:
    post:
      tags:
      - Principals
      summary: Create a Card-free machine principal and issue its first credential.
      description: |-
        # Errors
        Returns a stable Wyrd error when the caller is unauthorized, a requested
        role does not exist in the tenant, or a write fails.
      operationId: create_service_principal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServicePrincipalRequest'
        required: true
      responses:
        '200':
          description: Principal created with its first credential, returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateServicePrincipalResponse'
        '401':
          description: Authentication required
        '403':
          description: Tenant principal administration required
        '422':
          description: A requested role does not exist in this tenant
  /v1/principals/{principal_id}/credentials:
    get:
      tags:
      - Principals
      summary: List a principal's credential metadata.
      description: |-
        # Errors
        Returns a stable Wyrd error when the caller is unauthorized or the read
        fails.
      operationId: list_credentials
      parameters:
      - name: principal_id
        in: path
        description: Principal whose credentials to list
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Non-secret credential metadata, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialListResponse'
        '401':
          description: Authentication required
        '403':
          description: Tenant principal administration required
    post:
      tags:
      - Principals
      summary: Issue an additional credential for an existing principal.
      description: |-
        This is the first half of a rotation: the principal now holds two live
        credentials, so the old one can be retired once the new one is verified.

        # Errors
        Returns a stable Wyrd error when the caller is unauthorized or a write
        fails.
      operationId: issue_credential
      parameters:
      - name: principal_id
        in: path
        description: Principal to issue for
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Credential issued, plaintext returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedCredential'
        '401':
          description: Authentication required
        '403':
          description: Tenant principal administration required
  /v1/principals/{principal_id}/credentials/{credential_id}:
    delete:
      tags:
      - Principals
      summary: Revoke one credential, leaving the principal and its roles untouched.
      description: |-
        Revocation has to mean two things, and marking the credential row only
        achieves the first: the credential can mint no new token, *and* the tokens
        it already minted stop working. The second is the one that matters when a
        credential leaks, and a bearer token is useful to whoever holds it for its
        whole lifetime. So this also advances the principal's revocation epoch,
        which the verifier checks on every request.

        That epoch is per-principal, which is the granularity the schema offers, so
        it also invalidates live tokens minted by the principal's *other*
        credentials. That does not reintroduce a rotation gap — a surviving
        credential re-exchanges immediately — and the alternative, letting a leaked
        credential's tokens outlive their revocation, is not a trade worth making.

        Both writes are in one transaction: a credential marked revoked whose tokens
        still authorize is precisely the state this exists to prevent.

        # Errors
        Returns a stable Wyrd error when the caller is unauthorized, the credential
        is unknown in this tenant, or a write fails.
      operationId: revoke_credential
      parameters:
      - name: principal_id
        in: path
        description: Principal that owns the credential
        required: true
        schema:
          type: string
      - name: credential_id
        in: path
        description: Credential to retire
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Credential retired
        '401':
          description: Authentication required
        '403':
          description: Tenant principal administration required
        '404':
          description: No live credential for this principal
  /v1/query:
    post:
      tags:
      - Bifrost
      summary: Streams one authenticated SQL query as canonical protobuf frames.
      description: |-
        Body collection, authentication, and admission are bounded by the server
        request timeout; once the query is dispatched, its own deadline governs.
      operationId: sync_query
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BifrostQueryRequest'
        required: true
      responses:
        '200':
          description: Length-delimited protobuf QueryStreamFrame stream
          headers:
            x-wyrd-schema-fingerprint:
              schema:
                type: string
              description: Hex SHA-256 fingerprint of the response schema
          content:
            application/vnd.wyrd.bifrost-query-stream:
              schema:
                type: array
                items:
                  type: integer
                  format: int32
                  minimum: 0
        '400':
          description: Invalid query request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '403':
          description: Query permission required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '503':
          description: Oracle role is unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        default:
          description: Other catalog-backed refusal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
  /v1/query/running:
    get:
      tags:
      - Bifrost
      summary: Lists active queries for the authenticated tenant.
      description: |-
        Cancelling the handler future abandons the pending owner lookup without
        creating durable lifecycle state.

        # Errors

        Returns structured authorization, audit, role-availability, or owner-control errors.
      operationId: list_running_queries
      responses:
        '200':
          description: Active queries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRunningQueriesResponse'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '403':
          description: Query lifecycle permission required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '409':
          description: Query owner conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '503':
          description: Query control unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        default:
          description: Other catalog-backed refusal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
  /v1/query/{request_id}:
    get:
      tags:
      - Bifrost
      summary: Returns one active query for the authenticated tenant.
      description: |-
        Cancelling the handler future abandons the pending owner lookup without
        changing the active query.

        # Errors

        Returns structured request-ID validation, authorization, audit,
        role-availability, not-found, or owner-conflict errors.
      operationId: get_running_query
      parameters:
      - name: request_id
        in: path
        description: Canonical query request ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Active query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunningQuerySummary'
        '400':
          description: Invalid request ID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '403':
          description: Query lifecycle permission required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '404':
          description: No visible active query
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '409':
          description: Query owner conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '503':
          description: Query control unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        default:
          description: Other catalog-backed refusal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
    delete:
      tags:
      - Bifrost
      summary: Requests idempotent cancellation for one active query in the authenticated tenant.
      description: |-
        Once an owner accepts cancellation, dropping this handler future does not
        undo that server-side lifecycle transition.

        # Errors

        Returns structured request-ID validation, authorization, audit,
        role-availability, not-found, or owner-conflict errors.
      operationId: cancel_running_query
      parameters:
      - name: request_id
        in: path
        description: Canonical query request ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelRunningQueryResponse'
        '400':
          description: Invalid request ID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '403':
          description: Query lifecycle permission required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '404':
          description: No visible active query
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '409':
          description: Query owner conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        '503':
          description: Query control unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
        default:
          description: Other catalog-backed refusal
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/WyrdProblem'
components:
  schemas:
    AbsoluteUrl:
      type: string
      format: uri
      description: Absolute URL with a scheme and authority.
    AgentSpec:
      type: object
      description: Agent authoring body inside a Wyrd Agent Card envelope.
      required:
      - prompt
      properties:
        prompt:
          description: Prompt reference preserved on disk and resolved by `skald-agent`.
        publishes_to:
          type: array
          items:
            $ref: '#/components/schemas/Ref'
          description: Eval and Drift cards that receive observations from this agent.
        run_config:
          $ref: '#/components/schemas/AgentRunConfigSpec'
          description: Agent run configuration.
        tool_names:
          type: array
          items:
            type: string
          description: Runtime-local tool names resolved from a local Skald tool registry.
      additionalProperties: false
    ApiVersion:
      type: string
      description: Canonical Wyrd API version.
    ArtifactInventoryResponse:
      type: object
      description: Stored artifact inventory response.
      required:
      - artifacts
      properties:
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/StoredArtifactEntry'
          description: Stored artifacts.
      additionalProperties: false
    ArtifactManifestEntry:
      type: object
      description: One heavy artifact declared by a submission.
      required:
      - relative_path
      - sha256
      - size_bytes
      properties:
        content_type:
          type:
          - string
          - 'null'
          description: Optional MIME type for the stored object.
        relative_path:
          $ref: '#/components/schemas/RelativeArtifactPath'
          description: Validated path below the registered card's artifact prefix.
        sha256:
          type: string
          description: Base64-encoded SHA-256 digest of the artifact bytes.
        size_bytes:
          type: integer
          format: int64
          description: Declared artifact size in bytes.
          minimum: 0
      additionalProperties: false
    ArtifactSpec:
      type: object
      description: Versioned artifact descriptor.
      required:
      - artifact_kind
      properties:
        artifact_kind:
          type: string
          description: Artifact kind.
        artifact_uris:
          type: array
          items:
            type: string
          description: Artifact URIs.
        content_type:
          type:
          - string
          - 'null'
          description: MIME content type.
        external_uri:
          type:
          - string
          - 'null'
          description: External URI.
        framework_adapter:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/FrameworkAdapterRef'
            description: Framework adapter metadata for runtime loaders.
        integrity:
          type:
          - string
          - 'null'
          description: Integrity digest.
        metadata:
          type: object
          description: Artifact metadata.
          additionalProperties:
            $ref: '#/components/schemas/NonSecretValue'
          propertyNames:
            type: string
        schema_ref:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Ref'
            description: Schema Card reference.
        size_bytes:
          type:
          - integer
          - 'null'
          format: int64
          description: Size in bytes.
          minimum: 0
    AuditSpec:
      type: object
      description: Audit artifact or evidence bundle metadata.
      properties:
        description:
          type:
          - string
          - 'null'
          description: Audit description.
        details:
          type: object
          description: Free-form details.
          additionalProperties:
            $ref: '#/components/schemas/NonSecretValue'
          propertyNames:
            type: string
        evidence_refs:
          type: array
          items:
            $ref: '#/components/schemas/Ref'
          description: Evidence artifact references.
        policy_refs:
          type: array
          items:
            $ref: '#/components/schemas/Ref'
          description: Policy references.
        subject_refs:
          type: array
          items:
            $ref: '#/components/schemas/Ref'
          description: Subject Card references.
    BTreeMap:
      type: object
      additionalProperties:
        type: string
        description: Validated value for free-form Card annotations.
      propertyNames:
        type: string
        description: Validated key for free-form Card annotations.
    BifrostQueryRequest:
      type: object
      description: Public synchronous Oracle query request.
      required:
      - sql
      - visibility
      - freshness
      properties:
        deadline_ms:
          type:
          - integer
          - 'null'
          format: int64
          description: |-
            Optional caller deadline in milliseconds, valid in `1..=u32::MAX`.

            The field is a wide signed integer so ordinary below- and above-range
            values deserialize and reach request validation, which owns the one
            closed range every client surface shares.
          maximum: 4294967295
          minimum: 1
        freshness:
          $ref: '#/components/schemas/FreshnessPolicy'
          description: Required freshness behavior.
        sql:
          type: string
          description: SELECT-only SQL text.
        visibility:
          $ref: '#/components/schemas/VisibilityMode'
          description: Visibility tiers requested by the caller.
    BifrostTableDescription:
      type: object
      description: Per-table describe response — the lightweight entry plus the stored schema.
      required:
      - entry
      - user_fields
      - correlation_fields
      - managed_candidates
      - physical_layout
      properties:
        canonical_physical_fingerprint:
          type:
          - string
          - 'null'
          description: |-
            Lower-case 64-character hex of the complete canonical physical
            fingerprint, present only for a canonical `OTel` signal built-in.

            [`BifrostTableEntry::fingerprint`] keeps its user-schema meaning for
            every table; this is the separate whole-physical-schema identity, and it
            is omitted for a dynamically registered table.
        correlation_fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldSpec'
          description: |-
            The correlation inputs a writer supplies alongside its user fields.

            Exactly nullable `card_ref: Utf8` — a Gate input tagged
            [`INPUT_CLASS_KEY`]`=`[`INPUT_CLASS_GATE_CORRELATION`] that resolves to
            the stored `card_uid` and therefore carries no field id — followed by
            nullable `run_id: Utf8` with the field id its physical column holds.

            Card correlation is optional, so a writer may omit `card_ref` entirely;
            the server then stores the row with its authenticated `principal_id` and
            a null `card_uid`.
        entry:
          $ref: '#/components/schemas/BifrostTableEntry'
          description: The same lightweight entry returned by the list route.
        managed_candidates:
          type: array
          items:
            $ref: '#/components/schemas/FieldSpec'
          description: |-
            Managed columns a writer may supply itself rather than let the server
            stamp: non-null `wyrd_event_time: Timestamp(Microsecond, UTC)`.
        physical_layout:
          $ref: '#/components/schemas/PhysicalLayoutWire'
          description: The server-resolved canonical physical layout, fully populated.
        user_fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldSpec'
          description: |-
            The table's own declared columns, in stored order.

            Server-owned correlation and managed columns are not here; they are
            reported separately so a writer can tell what it declares from what the
            server appends.
    BifrostTableEntry:
      type: object
      description: |-
        Lightweight table listing entry — one row of the list-tables response.

        Schema-free by design (review M-04): the stored schema is carried only by the
        per-table describe contract, [`BifrostTableDescription`], so the list stays
        small.
      required:
      - namespace
      - name
      - table_uid
      - status
      - fingerprint
      - registered_at
      - updated_at
      properties:
        fingerprint:
          type: string
          description: Lower-case hex of the 32-byte user-schema fingerprint.
        name:
          type: string
          description: Name component of the fully-qualified name (`<ns>.<name>` → name).
        namespace:
          type: string
          description: Namespace component of the fully-qualified name (`<ns>.<name>` → ns).
        registered_at:
          type: string
          format: date-time
          description: Wall-clock registration time.
        status:
          $ref: '#/components/schemas/TableStatus'
          description: Lifecycle status.
        table_uid:
          type: string
          description: Lower-case hex of the 16-byte table uid.
        updated_at:
          type: string
          format: date-time
          description: Wall-clock last-update time.
    CancelRunningQueryResponse:
      type: object
      description: Idempotent cancellation result for one active Oracle query.
      required:
      - request_id
      - cancellation_started
      properties:
        cancellation_started:
          type: boolean
          description: Whether this call changed the registry from active to cancelling.
        request_id:
          $ref: '#/components/schemas/RequestId'
          description: Request identity selected by the caller.
    Card:
      type: object
      description: Universal registered Card envelope.
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          $ref: '#/components/schemas/ApiVersion'
          description: API version. Must be `wyrd/v1` for v1 Cards.
        kind:
          $ref: '#/components/schemas/CardKind'
          description: Card kind discriminator.
        metadata:
          $ref: '#/components/schemas/Metadata'
          description: Card metadata.
        relationships:
          $ref: '#/components/schemas/Relationships'
          description: Server-derived relationship summary.
        spec:
          $ref: '#/components/schemas/Spec'
          description: Kind-specific spec payload.
        status:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Status'
            description: Optional server-derived status.
    CardKind:
      type: string
      description: Native Wyrd Card kind plus forward-compatible external catch-all.
      enum:
      - Data
      - Model
      - Experiment
      - Prompt
      - Agent
      - Workflow
      - Eval
      - Drift
      - Service
      - Policy
      - Mcp
      - Audit
      - Artifact
      - Trigger
      - Operator
      - Source
      - External
    CardLifecycleStatus:
      type: string
      description: Server-managed lifecycle state for a Card.
      enum:
      - pending
      - active
      - deprecated
      - failed
      - expired
      - deleted
    CardName:
      type: string
      description: Human-visible Card name.
    CardRef:
      type: object
      description: Reference to a registered Card by kind, name, version, optional space, and optional UID.
      required:
      - kind
      - name
      - version
      properties:
        kind:
          $ref: '#/components/schemas/CardKind'
          description: Referenced Card kind.
        name:
          $ref: '#/components/schemas/CardName'
          description: Referenced Card name.
        space:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SpaceName'
            description: |-
              Space pinning identity together with `name` and `version`.

              Authors may omit it; the loader inherits the enclosing card's resolved
              metadata space before the reference crosses a wire boundary.
        uid:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CardUid'
            description: |-
              Optional server-resolved durable UID.

              Authors identify a dependency with `(kind, space, name, version)` and
              may omit this field. The server resolves that reference to a [`CardUid`]
              before registration; the UID is then used for durable authorization and
              lineage without changing the authored reference identity.
        version:
          $ref: '#/components/schemas/VersionBlock'
          description: Exact referenced Card version.
    CardRegistrationOutcome:
      type: object
      description: Outcome for one submission in a composite registration.
      required:
      - card_ref
      - spec_hash
      - status
      - outcome
      properties:
        artifact_hash:
          type:
          - string
          - 'null'
          description: BLAKE3 hex hash of the sorted artifact manifest, when present.
        card_blob_uri:
          type:
          - string
          - 'null'
          description: URI of the durable card blob once written.
        card_ref:
          $ref: '#/components/schemas/CardRef'
          description: Server-resolved card identity.
        outcome:
          $ref: '#/components/schemas/RegistrationOutcomeKind'
          description: Registration result for this submission.
        spec_hash:
          type: string
          description: BLAKE3 hex hash of the JCS-canonical resolved spec.
        status:
          $ref: '#/components/schemas/CardLifecycleStatus'
          description: Server-managed lifecycle state.
      additionalProperties: false
    CardRelationship:
      type: object
      description: One server-derived relationship edge.
      required:
      - ref
      properties:
        alias:
          type:
          - string
          - 'null'
          description: Optional user-facing alias assigned by a parent composition.
        ref:
          $ref: '#/components/schemas/CardRef'
          description: Exact related Card reference.
    CardSubmission:
      type: object
      description: |-
        One card submitted for registration.

        The server derives relationships, lifecycle status, resolved version, and
        UID. A submission is therefore intentionally smaller than a stored Card
        envelope and cannot carry those server-managed fields.
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          $ref: '#/components/schemas/ApiVersion'
          description: API version.
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactManifestEntry'
          description: Heavy artifact manifest for this submission.
        kind:
          $ref: '#/components/schemas/CardKind'
          description: Card kind.
        metadata:
          $ref: '#/components/schemas/Metadata'
          description: Author-supplied card metadata.
        spec:
          description: Kind-specific spec body.
      additionalProperties: false
    CardSummary:
      type: object
      description: Metadata-only card list item.
      required:
      - card_uid
      - kind
      - space
      - name
      - version
      - spec_hash
      - status
      - created_at
      - updated_at
      properties:
        artifact_hash:
          type:
          - string
          - 'null'
          description: Optional BLAKE3-hex artifact hash.
        card_uid:
          $ref: '#/components/schemas/CardUid'
          description: Card UID.
        created_at:
          type: string
          format: date-time
          description: Creation time.
        kind:
          $ref: '#/components/schemas/CardKind'
          description: Card kind.
        name:
          $ref: '#/components/schemas/CardName'
          description: Card name.
        space:
          $ref: '#/components/schemas/SpaceName'
          description: Workspace.
        spec_hash:
          type: string
          description: BLAKE3-hex spec hash.
        status:
          $ref: '#/components/schemas/CardLifecycleStatus'
          description: Lifecycle status.
        updated_at:
          type: string
          format: date-time
          description: Last update time.
        version:
          $ref: '#/components/schemas/VersionBlock'
          description: Resolved version.
      additionalProperties: false
    CardUid:
      type: string
      description: Resolved immutable Card UID.
    CardUploadEntry:
      type: object
      description: One tenant-scoped, server-minted upload for a card artifact.
      required:
      - relative_path
      - upload_id
      - plan
      properties:
        plan:
          $ref: '#/components/schemas/UploadPlan'
          description: Backend-specific transfer protocol minted by the storage service.
        relative_path:
          $ref: '#/components/schemas/RelativeArtifactPath'
          description: Manifest path this upload accepts.
        upload_id:
          $ref: '#/components/schemas/UploadId'
          description: Durable storage upload identifier used for part URLs and completion.
      additionalProperties: false
    CardUploadPlan:
      type: object
      description: Upload plan group keyed by the resolved card reference.
      required:
      - card_ref
      - entries
      properties:
        card_ref:
          $ref: '#/components/schemas/CardRef'
          description: Card whose submission declared the artifact manifest.
        entries:
          type: array
          items:
            $ref: '#/components/schemas/CardUploadEntry'
          description: One server-minted upload per manifest entry.
      additionalProperties: false
    CommitSha:
      type: string
      description: |-
        Git commit object name a card or observation was produced from.

        Wire format is a 7- to 40-character lowercase hex string (an abbreviated or
        full git SHA). Deserialization validates, so wire payloads cannot carry a
        malformed commit.
    ConfigurePlatformOidcRequest:
      type: object
      description: Install or replace the deployment's platform OIDC connection.
      required:
      - issuer_url
      - expected_audience
      - client_id
      - client_auth
      properties:
        client_auth:
          $ref: '#/components/schemas/PlatformClientAuth'
          description: How Wyrd authenticates to the provider.
        client_id:
          type: string
          description: Wyrd's client identifier at the provider.
        expected_audience:
          type: string
          description: Audience pinned as the `aud` of every accepted token.
        issuer_url:
          type: string
          description: |-
            Issuer URL, pinned as the `iss` of every accepted token.

            The JWKS endpoint is not accepted from the caller. It is resolved once,
            here, by OIDC discovery against this issuer under the deployment's
            address screening — so configuring a connection cannot be used to point
            the server's key fetches at an arbitrary host.
        jwks_ttl_secs:
          type: integer
          format: int64
          description: JWKS cache lifetime in seconds.
      additionalProperties: false
    CreateCardRequest:
      type: object
      description: Composite registration request.
      required:
      - submissions
      properties:
        submissions:
          type: array
          items:
            $ref: '#/components/schemas/CardSubmission'
          description: Flat list of cards. The server topo-sorts the graph and derives root.
      additionalProperties: false
    CreateCardResponse:
      type: object
      description: Composite registration response.
      required:
      - root
      - outcomes
      - upload_plans
      properties:
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/CardRegistrationOutcome'
          description: Per-submission outcomes in server topo order.
        root:
          $ref: '#/components/schemas/CardRef'
          description: Server-derived graph root.
        upload_plans:
          type: array
          items:
            $ref: '#/components/schemas/CardUploadPlan'
          description: Upload plans for artifact-bearing submissions.
      additionalProperties: false
    CreateServicePrincipalRequest:
      type: object
      description: |-
        Request to create a tenant-scoped machine principal.

        The principal binds no Card: it is tenant automation — a CI runner, a
        deployment agent — rather than a deployed workload with an emit scope.
      required:
      - name
      - roles
      properties:
        description:
          type:
          - string
          - 'null'
          description: Optional description.
        name:
          type: string
          description: Operator-facing name, unique within the tenant.
        roles:
          type: array
          items:
            type: string
          description: |-
            Roles to grant. Narrower than tenant administration, so automation never
            needs the tenant administrative credential.
      additionalProperties: false
    CreateServicePrincipalResponse:
      type: object
      description: A created machine principal and its first credential.
      required:
      - principal_id
      - credential
      properties:
        credential:
          $ref: '#/components/schemas/SecretBearer'
          description: Its first credential, returned exactly once.
        principal_id:
          $ref: '#/components/schemas/PrincipalId'
          description: Durable principal id, stable across credential rotation.
    CreateTenantRequest:
      type: object
      description: Request to provision a new tenant.
      required:
      - slug
      - display_name
      properties:
        display_name:
          type: string
          description: Human-readable tenant name.
        slug:
          $ref: '#/components/schemas/TenantSlug'
          description: URL-safe tenant identifier, unique across the deployment.
      additionalProperties: false
    CreateTenantResponse:
      type: object
      description: |-
        Result of provisioning a tenant.

        Carries the administrative credential exactly once. The server stores only
        its verifier, so a caller that discards this response must recover through
        the platform plane rather than by reading it back.
      required:
      - tenant
      - admin
      properties:
        admin:
          $ref: '#/components/schemas/ProvisionedTenantAdmin'
          description: Its administrative principal and one-time credential.
        tenant:
          $ref: '#/components/schemas/ProvisionedTenant'
          description: The provisioned tenant.
    CredentialListResponse:
      type: object
      description: A principal's credential metadata.
      required:
      - credentials
      properties:
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/CredentialMetadata'
          description: Credentials, newest first. Never any secret material.
    CredentialMetadata:
      type: object
      description: |-
        Non-secret metadata for one credential.

        Rotation works by overlap — issue, verify, then revoke — so a listing shows
        revoked and expired credentials too; an operator mid-rotation needs to see
        that the superseded one really is gone.
      required:
      - id
      - prefix
      - created_at
      properties:
        created_at:
          type: string
          description: Creation time, RFC 3339.
        expires_at:
          type:
          - string
          - 'null'
          description: Expiry, when bounded.
        id:
          type: string
          description: Credential id.
        last_used_at:
          type:
          - string
          - 'null'
          description: Last successful use.
        prefix:
          type: string
          description: Non-secret lookup prefix.
        revoked_at:
          type:
          - string
          - 'null'
          description: Revocation time, when revoked.
    DataSpec:
      type: object
      description: Pure-data contract for a Data Card.
      required:
      - interface
      - schema
      - stats
      properties:
        card_refs:
          type: array
          items:
            $ref: '#/components/schemas/Ref'
          description: Durable Artifact card references linked to this data card.
        interface:
          $ref: '#/components/schemas/DataInterface'
          description: Declared interface family and interface-specific metadata.
        schema:
          $ref: '#/components/schemas/DataSchema'
          description: Ordered schema fields for tabular interfaces.
        splits:
          type: object
          description: Declared split strategies by stable split label.
          additionalProperties:
            $ref: '#/components/schemas/DataSplit'
          propertyNames:
            type: string
            description: DataCard split label.
        sql:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SqlLogic'
            description: Optional SQL query bundle for SQL-backed data.
        stats:
          $ref: '#/components/schemas/DataStats'
          description: Local or durable byte statistics captured for this data source.
        target_columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnName'
          description: Target columns for supervised workflows.
      additionalProperties: false
    DataTenantId:
      type: string
      format: uuid
      description: Immutable tenant isolation key used by tenant-scoped Wyrd and Vala rows.
    DataTypeSpec:
      oneOf:
      - type: string
        description: Boolean.
        enum:
        - Bool
      - type: string
        description: Signed 8-bit integer.
        enum:
        - Int8
      - type: string
        description: Signed 16-bit integer.
        enum:
        - Int16
      - type: string
        description: Signed 32-bit integer.
        enum:
        - Int32
      - type: string
        description: Signed 64-bit integer.
        enum:
        - Int64
      - type: string
        description: Unsigned 8-bit integer.
        enum:
        - UInt8
      - type: string
        description: Unsigned 16-bit integer.
        enum:
        - UInt16
      - type: string
        description: Unsigned 32-bit integer.
        enum:
        - UInt32
      - type: string
        description: Unsigned 64-bit integer.
        enum:
        - UInt64
      - type: string
        description: 32-bit float.
        enum:
        - Float32
      - type: string
        description: 64-bit float.
        enum:
        - Float64
      - type: string
        description: UTF-8 string.
        enum:
        - Utf8
      - type: string
        description: Large UTF-8 string.
        enum:
        - LargeUtf8
      - type: string
        description: Variable-length binary.
        enum:
        - Binary
      - type: string
        description: Large variable-length binary.
        enum:
        - LargeBinary
      - type: object
        description: Fixed-width binary.
        required:
        - FixedSizeBinary
        properties:
          FixedSizeBinary:
            type: object
            description: Fixed-width binary.
            required:
            - len
            properties:
              len:
                type: integer
                format: int32
                description: Byte width.
      - type: string
        description: 32-bit date (days since epoch).
        enum:
        - Date32
      - type: string
        description: 64-bit date (milliseconds since epoch).
        enum:
        - Date64
      - type: object
        description: Timestamp with explicit precision and optional timezone.
        required:
        - Timestamp
        properties:
          Timestamp:
            type: object
            description: Timestamp with explicit precision and optional timezone.
            required:
            - unit
            properties:
              tz:
                type:
                - string
                - 'null'
                description: IANA timezone string, or `None` for timezone-naive.
              unit:
                $ref: '#/components/schemas/TimeUnit'
                description: Precision.
      - type: object
        description: Time-of-day at second/millisecond precision.
        required:
        - Time32
        properties:
          Time32:
            type: object
            description: Time-of-day at second/millisecond precision.
            required:
            - unit
            properties:
              unit:
                $ref: '#/components/schemas/TimeUnit'
                description: Precision.
      - type: object
        description: Time-of-day at microsecond/nanosecond precision.
        required:
        - Time64
        properties:
          Time64:
            type: object
            description: Time-of-day at microsecond/nanosecond precision.
            required:
            - unit
            properties:
              unit:
                $ref: '#/components/schemas/TimeUnit'
                description: Precision.
      - type: object
        description: 128-bit fixed-point decimal.
        required:
        - Decimal128
        properties:
          Decimal128:
            type: object
            description: 128-bit fixed-point decimal.
            required:
            - precision
            - scale
            properties:
              precision:
                type: integer
                format: int32
                description: Total number of digits.
                minimum: 0
              scale:
                type: integer
                format: int32
                description: Number of fractional digits.
      - type: object
        description: |-
          Variable-length list whose boxed element declaration carries the child's
          name, nullability, metadata, and stable field id.

          The element is a full [`FieldSpec`] rather than a bare type so a nested
          child keeps the same identity the physical schema stores; a client that
          rebuilds an Arrow schema from a description reproduces the stored list
          child exactly instead of inventing a nullable `item`.
        required:
        - List
        properties:
          List:
            $ref: '#/components/schemas/FieldSpec'
            description: |-
              Variable-length list whose boxed element declaration carries the child's
              name, nullability, metadata, and stable field id.

              The element is a full [`FieldSpec`] rather than a bare type so a nested
              child keeps the same identity the physical schema stores; a client that
              rebuilds an Arrow schema from a description reproduces the stored list
              child exactly instead of inventing a nullable `item`.
      - type: object
        description: Nested struct of named fields.
        required:
        - Struct
        properties:
          Struct:
            type: array
            items:
              $ref: '#/components/schemas/FieldSpec'
            description: Nested struct of named fields.
      description: |-
        Arrow-free logical column type. The exhaustive set Bifrost accepts on the
        register path; the `DataTypeSpec ↔ arrow::DataType` conversion lives in the
        server/engine, never in `wyrd-spec`.
    DeleteCardResponse:
      type: object
      description: Soft-delete response.
      required:
      - card_uid
      - deleted
      properties:
        card_uid:
          $ref: '#/components/schemas/CardUid'
          description: Card UID.
        deleted:
          type: boolean
          description: True only on the first delete.
      additionalProperties: false
    DownloadInitRequest:
      type: object
      description: Client request to initialize a download.
      required:
      - card_uid
      - relative_path
      properties:
        card_uid:
          $ref: '#/components/schemas/CardUid'
          description: Card that owns the stored object.
        relative_path:
          type: string
          description: Object path under the card.
        ttl_secs:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            Optional presign TTL override in seconds.

            Clamped to [60, 3600] seconds; out-of-range values are silently
            clamped. Defaults to the configured backend presign TTL when absent.
          minimum: 0
      additionalProperties: false
    DownloadInitResponse:
      type: object
      description: Server response to a download-init request.
      required:
      - plan
      - size_bytes
      - sha256
      properties:
        plan:
          $ref: '#/components/schemas/DownloadPlan'
          description: Backend-specific download plan.
        sha256:
          type: string
          description: Expected base64-encoded SHA-256 digest.
        size_bytes:
          type: integer
          format: int64
          description: Expected object size in bytes.
          minimum: 0
      additionalProperties: false
    DownloadPlan:
      type: object
      description: Presigned GET plan for any backend.
      required:
      - get_url
      - ttl_secs
      properties:
        get_url:
          type: string
          description: Presigned GET URL or local server route URL.
        ttl_secs:
          type: integer
          format: int32
          description: |-
            URL time-to-live in seconds.

            For presigned URL backends (S3, GCS, Azure) this is the URL expiry in
            seconds. For the local filesystem backend this field is `0` (the server
            route does not expire).
          minimum: 0
      additionalProperties: false
    DriftSpec:
      type: object
      description: DriftCard spec body.
      required:
      - method
      - signal
      - condition
      properties:
        condition:
          $ref: '#/components/schemas/DriftCondition'
          description: When a sample becomes an emittable observation.
        description:
          type:
          - string
          - 'null'
          description: Free-text description authored on the card.
        details:
          type: object
          description: Free-form non-secret authoring metadata.
          additionalProperties:
            $ref: '#/components/schemas/NonSecretValue'
          propertyNames:
            type: string
        method:
          $ref: '#/components/schemas/DriftMethod'
          description: Drift detection method. Drives which `DriftProfile` variant is allowed.
        profile:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/DriftProfile'
            description: |-
              Method-specific math configuration. Required for `Psi | Spc | Custom`,
              forbidden for `External`.
        signal:
          $ref: '#/components/schemas/DriftSignal'
          description: How the measurement enters the monitor.
      additionalProperties: false
    ExperimentSpec:
      type: object
      description: Grouping and comparison context for related runs.
      properties:
        best_run_ref:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RunRef'
            description: Best run reference.
        card_refs:
          type: array
          items:
            $ref: '#/components/schemas/Ref'
          description: Artifact references.
        default_parameters:
          type: object
          description: Default parameters applied to runs.
          additionalProperties:
            $ref: '#/components/schemas/ParameterValue'
          propertyNames:
            type: string
        description:
          type:
          - string
          - 'null'
          description: Experiment description.
        details:
          type: object
          description: Free-form details.
          additionalProperties:
            $ref: '#/components/schemas/NonSecretValue'
          propertyNames:
            type: string
        experiment_type:
          type:
          - string
          - 'null'
          description: Experiment type.
        run_refs:
          type: array
          items:
            $ref: '#/components/schemas/RunRef'
          description: Associated runs.
        summary_metrics:
          type: array
          items:
            $ref: '#/components/schemas/MetricEntry'
          description: Summary metrics for comparison.
        target_refs:
          type: array
          items:
            $ref: '#/components/schemas/Ref'
          description: Primary target Cards.
    FieldSpec:
      type: object
      description: |-
        Arrow-free field declaration. Follows the `card::field::FieldSpec` precedent
        but carries a typed [`DataTypeSpec`] instead of a loose dtype string.
      required:
      - name
      - data_type
      properties:
        data_type:
          $ref: '#/components/schemas/DataTypeSpec'
          description: Logical column type.
        metadata:
          type: object
          description: |-
            String metadata carried verbatim through every schema conversion.

            Two keys are meaningful to Bifrost: [`PARQUET_FIELD_ID_KEY`] holds the
            stored stable field id as decimal text, and [`INPUT_CLASS_KEY`] marks a
            declaration that is a write-time input rather than a stored column.
          additionalProperties:
            type: string
          propertyNames:
            type: string
        name:
          type: string
          description: Column name.
        nullable:
          type: boolean
          description: Whether the column is nullable. Defaults to `true`.
    FreshnessPolicy:
      type: string
      description: Behavior when a requested live source cannot complete.
      enum:
      - strict
      - allow_degraded
    GetCardResponse:
      type: object
      description: Full card response.
      required:
      - card
      - created_at
      - updated_at
      properties:
        card:
          $ref: '#/components/schemas/Card'
          description: Card envelope.
        created_at:
          type: string
          format: date-time
          description: Creation time.
        updated_at:
          type: string
          format: date-time
          description: Last update time.
      additionalProperties: false
    HeaderPair:
      type: object
      description: Required HTTP header for a client upload request.
      required:
      - name
      - value
      properties:
        name:
          type: string
          description: Header name.
        value:
          type: string
          description: Header value.
      additionalProperties: false
    IssuedCredential:
      type: object
      description: A newly issued credential for an existing principal.
      required:
      - id
      - credential
      properties:
        credential:
          $ref: '#/components/schemas/SecretBearer'
          description: The plaintext, returned exactly once.
        id:
          type: string
          description: Credential id, used to revoke it.
    ListCardsResponse:
      type: object
      description: A page of card summaries.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CardSummary'
          description: Page items.
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque continuation cursor.
      additionalProperties: false
    ListRunningQueriesResponse:
      type: object
      description: Response containing every active Oracle query visible to one tenant.
      required:
      - queries
      properties:
        queries:
          type: array
          items:
            $ref: '#/components/schemas/RunningQuerySummary'
          description: Active request summaries in deterministic request-ID order.
    ListVersionsResponse:
      type: object
      description: Versions available for one card identity.
      required:
      - versions
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/VersionBlock'
          description: Resolved versions.
      additionalProperties: false
    LoginInitResponse:
      type: object
      description: '`GET /auth/login` response.'
      required:
      - authorization_url
      - state
      properties:
        authorization_url:
          $ref: '#/components/schemas/AbsoluteUrl'
          description: Authorization URL used as the redirect target.
        state:
          type: string
          description: Opaque login state echoed for SDK correlation.
      additionalProperties: false
    McpSpec:
      type: object
      description: MCP server or tool catalog metadata.
      required:
      - server_name
      properties:
        description:
          type:
          - string
          - 'null'
          description: MCP description.
        details:
          type: object
          description: Free-form details.
          additionalProperties:
            $ref: '#/components/schemas/NonSecretValue'
          propertyNames:
            type: string
        scopes:
          type: array
          items:
            type: string
          description: Required scopes.
        server_name:
          type: string
          description: Server name.
        tool_refs:
          type: array
          items:
            $ref: '#/components/schemas/Ref'
          description: Tool references.
        transport:
          type:
          - string
          - 'null'
          description: Transport descriptor.
    Metadata:
      type: object
      description: |-
        Card metadata common to every kind.

        `version` and `bump` capture the author's declarative intent on the
        register path. The server resolves both to a concrete pin before the
        envelope is returned to the caller:

        - Pre-register: `version` may be `None` (server bumps absolute latest or
          seeds `0.1.0`), `Some(VersionSpec::Scope("1.0"))` (server bumps within
          the prefix line), or `Some(VersionSpec::Pin("1.4.2"))` (exact pin).
          `bump` selects the bump level applied on the auto-bump paths (defaults
          to `Patch` if unset).
        - Post-register: `version` is always `Some(VersionSpec::Pin(resolved))`;
          readers may use [`Metadata::resolved_pin`] to extract the
          [`VersionBlock`].
      required:
      - name
      properties:
        annotations:
          $ref: '#/components/schemas/BTreeMap'
          description: |-
            Free-form annotations for automation, UI, and integration metadata.

            As of 2026-05-18, keys under `wyrd.io/*` MUST remain reserved for
            Wyrd-owned runtime and registry metadata. User and vendor annotations
            MUST use another DNS-style prefix, such as `acme.com/cost-center`, to
            avoid collisions.
        artifact_hash:
          type:
          - string
          - 'null'
          description: Artifact content hash.
        bump:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/VersionBump'
            description: |-
              Bump level applied on the auto-bump paths (`None` or `Scope`
              `version`). Defaults to `Patch` when unset. Ignored on the exact-pin
              path.
        labels:
          $ref: '#/components/schemas/BTreeMap'
          description: Display labels.
        name:
          $ref: '#/components/schemas/CardName'
          description: Card name.
        origin:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Origin'
            description: |-
              Code-origin provenance: the repository commit this card was declared
              from. Populated on the register path for cards authored in a repo;
              `None` for cards with no code origin (e.g. UI-authored).
        space:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SpaceName'
            description: Optional space.
        spec_hash:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SpecHash'
            description: Spec content hash.
        uid:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CardUid'
            description: Optional resolved UID.
        version:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/VersionSpec'
            description: |-
              Authored version: `None` (auto-bump from absolute latest), a bare
              partial scope (`"1"` / `"1.0"` — bump within the prefix line), or a
              full triple pin (`"1.4.2"`). Always populated and always a pin
              post-register.
    ModelSpec:
      type: object
      description: |-
        Body of a Model card.

        This pure contract describes which framework loads the model, which task it
        performs, which fields it consumes and produces, and which Artifact cards
        hold model-related bytes.
      required:
      - interface
      - task_type
      - signature
      properties:
        card_refs:
          type: array
          items:
            $ref: '#/components/schemas/Ref'
          description: Durable Artifact card references linked to this model card.
        interface:
          $ref: '#/components/schemas/ModelInterface'
          description: Framework interface tag and per-interface config metadata.
        sample_input:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SampleInput'
            description: Optional canonical sample input description.
        signature:
          $ref: '#/components/schemas/ModelSignature'
          description: Typed input and output schema.
        task_type:
          $ref: '#/components/schemas/TaskType'
          description: Closed Wyrd ML task taxonomy.
      additionalProperties: false
    NullOrderWire:
      type: string
      description: Null placement of one declared physical sort key.
      enum:
      - first
      - last
    OperatorSpec:
      type: object
      description: A server-owned side-effect template.
      required:
      - action
      properties:
        action:
          $ref: '#/components/schemas/OperatorAction'
          description: The single action performed when this operator fires.
        budget:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/OperatorBudget'
            description: Optional execution limits.
        description:
          type:
          - string
          - 'null'
          description: Optional human-readable purpose.
      additionalProperties: false
    Origin:
      type: object
      description: |-
        Code-origin provenance for a card: the repository commit it was declared
        from, plus the in-repo path for monorepo disambiguation.
      required:
      - repo
      - commit
      properties:
        commit:
          $ref: '#/components/schemas/CommitSha'
          description: |-
            Commit the card was declared from. When `dirty`, this is the base commit
            of the uncommitted working tree.
        dirty:
          type: boolean
          description: Whether the card was declared from an uncommitted working tree.
        path:
          type:
          - string
          - 'null'
          description: Declaration path within the repository (monorepo disambiguation).
        repo:
          type: string
          description: Normalized repository identifier, e.g. `github.com/org/repo`.
    PhysicalLayoutWire:
      type: object
      description: |-
        The authoritative physical layout of one Bifrost table.

        The same shape is used three ways: as the optional declaration on
        [`RegisterTableRequest`], as the canonical server-resolved layout returned by
        [`BifrostTableDescription`], and as the exact JSON persisted in the control
        row. In the latter two it is always fully populated: the sort order carries
        at least one key and the Bloom list begins with the schema-present managed
        floor.

        The partition itself is system-owned. Every table is partitioned on
        `wyrd_event_time`, so the declaration carries only the granularity and no
        wire field names a partition column.

        On the request path an omitted `sort_keys` and an explicit empty `sort_keys`
        resolve identically, because the server injects nothing ahead of a declared
        key and defaults an empty order to `wyrd_event_time` descending.
      required:
      - partition_granularity
      properties:
        bloom_columns:
          type: array
          items:
            type: string
          description: Ordered Bloom-filtered columns.
        partition_granularity:
          $ref: '#/components/schemas/TimeGranularityWire'
          description: Required partition granularity on the managed `wyrd_event_time` column.
        sort_keys:
          type: array
          items:
            $ref: '#/components/schemas/SortKeyWire'
          description: Ordered sort keys; at most four may be declared.
    PlatformCallbackRequest:
      type: object
      description: Complete a platform federated login.
      required:
      - code
      - state
      properties:
        code:
          type: string
          description: Authorization code returned by the provider.
        state:
          type: string
          description: Opaque state key issued when the login began.
      additionalProperties: false
    PlatformClientAuth:
      oneOf:
      - type: object
        description: HTTP Basic with a client secret.
        required:
        - secret
        - method
        properties:
          method:
            type: string
            enum:
            - secret_basic
          secret:
            $ref: '#/components/schemas/SecretBearer'
            description: The client secret, sealed before storage and never returned.
      - type: object
        description: Client secret in the request body.
        required:
        - secret
        - method
        properties:
          method:
            type: string
            enum:
            - secret_post
          secret:
            $ref: '#/components/schemas/SecretBearer'
            description: The client secret, sealed before storage and never returned.
      - type: object
        description: A public client with no secret.
        required:
        - method
        properties:
          method:
            type: string
            enum:
            - public
      description: |-
        How Wyrd authenticates to the platform provider's token endpoint.

        The secret arms carry [`SecretBearer`], not `String`. This type derives
        `Debug`, and a plain `String` would print the provider's client secret into
        any log line, trace span, or error that formatted the request.
    PlatformLoginRequest:
      type: object
      description: Begin a platform federated login.
      required:
      - redirect_uri
      properties:
        redirect_uri:
          type: string
          description: Where the provider returns the browser after authentication.
      additionalProperties: false
    PlatformOidcConnectionView:
      type: object
      description: The configured connection, with nothing secret in it.
      required:
      - issuer_url
      - jwks_uri
      - expected_audience
      - client_id
      - client_auth
      - jwks_ttl_secs
      properties:
        client_auth:
          type: string
          description: Client authentication method name only — never the secret itself.
        client_id:
          type: string
          description: Client identifier.
        expected_audience:
          type: string
          description: Expected audience.
        issuer_url:
          type: string
          description: Issuer URL.
        jwks_ttl_secs:
          type: integer
          format: int64
          description: JWKS cache lifetime in seconds.
        jwks_uri:
          type: string
          description: JWKS endpoint.
    PlatformPrincipalListResponse:
      type: object
      description: Every platform principal, including the ones no longer permitted to act.
      required:
