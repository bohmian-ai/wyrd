openapi: 3.1.0
info:
  title: wyrd-server
  description: ''
  contact:
    name: Thorrester
    email: sjforrester32@gmail.com
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  version: 0.0.1
paths:
  /v1/query:
    post:
      tags:
      - Bifrost
      summary: Streams one authenticated SQL query as canonical protobuf frames.
      operationId: sync_query
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BifrostQueryRequest'
        required: true
      responses:
        '200':
          description: Length-delimited protobuf QueryStreamFrame stream
          headers:
            x-wyrd-schema-fingerprint:
              schema:
                type: string
              description: Hex SHA-256 fingerprint of the response schema
          content:
            application/vnd.wyrd.bifrost-query-stream:
              schema:
                type: array
                items:
                  type: integer
                  format: int32
                  minimum: 0
        '503':
          description: Oracle role is unavailable
  /v1/query/running:
    get:
      tags:
      - Bifrost
      summary: Lists active queries for the authenticated tenant.
      description: |-
        Cancelling the handler future abandons the pending owner lookup without
        creating durable lifecycle state.

        # Errors

        Returns structured authorization, audit, role-availability, or owner-control errors.
      operationId: list_running_queries
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRunningQueriesResponse'
  /v1/query/{request_id}:
    get:
      tags:
      - Bifrost
      summary: Returns one active query for the authenticated tenant.
      description: |-
        Cancelling the handler future abandons the pending owner lookup without
        changing the active query.

        # Errors

        Returns structured request-ID validation, authorization, audit,
        role-availability, not-found, or owner-conflict errors.
      operationId: get_running_query
      parameters:
      - name: request_id
        in: path
        description: Canonical query request ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunningQuerySummary'
        '404':
          description: No visible active query
    delete:
      tags:
      - Bifrost
      summary: Requests idempotent cancellation for one active query in the authenticated tenant.
      description: |-
        Once an owner accepts cancellation, dropping this handler future does not
        undo that server-side lifecycle transition.

        # Errors

        Returns structured request-ID validation, authorization, audit,
        role-availability, not-found, or owner-conflict errors.
      operationId: cancel_running_query
      parameters:
      - name: request_id
        in: path
        description: Canonical query request ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelRunningQueryResponse'
        '404':
          description: No visible active query
components:
  schemas:
    BifrostQueryRequest:
      type: object
      description: Public synchronous Oracle query request.
      required:
      - sql
      - visibility
      - freshness
      properties:
        deadline_ms:
          type:
          - integer
          - 'null'
          format: int64
          description: Optional caller deadline in milliseconds.
          minimum: 0
        freshness:
          $ref: '#/components/schemas/FreshnessPolicy'
          description: Required freshness behavior.
        sql:
          type: string
          description: SELECT-only SQL text.
        visibility:
          $ref: '#/components/schemas/VisibilityMode'
          description: Visibility tiers requested by the caller.
    CancelRunningQueryResponse:
      type: object
      description: Idempotent cancellation result for one active Oracle query.
      required:
      - request_id
      - cancellation_started
      properties:
        cancellation_started:
          type: boolean
          description: Whether this call changed the registry from active to cancelling.
        request_id:
          $ref: '#/components/schemas/RequestId'
          description: Request identity selected by the caller.
    FreshnessPolicy:
      type: string
      description: Behavior when a requested live source cannot complete.
      enum:
      - strict
      - allow_degraded
    ListRunningQueriesResponse:
      type: object
      description: Response containing every active Oracle query visible to one tenant.
      required:
      - queries
      properties:
        queries:
          type: array
          items:
            $ref: '#/components/schemas/RunningQuerySummary'
          description: Active request summaries in deterministic request-ID order.
    QueryClass:
      type: string
      description: Server-derived admission class.
      enum:
      - interactive
      - analytical
    RequestId:
      type: string
      description: Request correlation ID; required to be a UUID v7.
    RunningQueryLifecycleState:
      type: string
      description: |-
        The current non-terminal lifecycle state of an admitted Oracle query.

        The state is projected by live controls only; completed queries are removed
        from the in-memory registry and are not durable query jobs.
      enum:
      - admitted
      - running
      - cancelling
    RunningQueryProgress:
      type: object
      description: Aggregate progress for one request-ID-keyed Oracle query.
      required:
      - completed_participants
      - total_participants
      properties:
        completed_participants:
          type: integer
          format: int32
          description: Number of selected participants that have reported completion.
          minimum: 0
        total_participants:
          type: integer
          format: int32
          description: Exact number of participants frozen into the immutable cut.
          minimum: 0
    RunningQuerySummary:
      type: object
      description: |-
        Public summary for one active Oracle query.

        This contract deliberately excludes SQL text, parameters, Arrow batches,
        and result rows. A summary is tenant-scoped by the serving boundary.
      required:
      - request_id
      - query_class
      - started_at
      - deadline
      - state
      - progress
      - cancellation_requested
      properties:
        cancellation_requested:
          type: boolean
          description: Whether cancellation has been requested for this request identity.
        deadline:
          type: string
          format: date-time
          description: Absolute query deadline.
        progress:
          $ref: '#/components/schemas/RunningQueryProgress'
          description: Aggregate progress over the immutable participant cut.
        query_class:
          $ref: '#/components/schemas/QueryClass'
          description: Server-derived admission class.
        request_id:
          $ref: '#/components/schemas/RequestId'
          description: Stable request identity used by live controls.
        started_at:
          type: string
          format: date-time
          description: Wall-clock admission time.
        state:
          $ref: '#/components/schemas/RunningQueryLifecycleState'
          description: Current non-terminal lifecycle state.
    VisibilityMode:
      type: string
      description: Visibility tiers included in one immutable Oracle query cut.
      enum:
      - published_only
      - fused
tags:
- name: Bifrost
  description: Bounded Bifrost query transport
