      title: Spec
      description: One typed Wyrd Card spec variant.
    SpecHash:
      type: string
      description: |-
        Canonical hash of a [`Spec`] over its RFC 8785 (JCS) canonicalized JSON.

        Two specs that differ only in field ordering, whitespace, or unicode escape
        representation produce the same hash. Field deletion, addition, or value
        change produces a different hash. This is the registry's drift-detection
        primitive.

        Wire form: 64 lowercase hex characters (BLAKE3-256 digest).
    Status:
      type: object
      description: Server-derived Card status.
      required:
      - phase
      properties:
        message:
          type:
          - string
          - 'null'
          description: Human-readable status message.
        phase:
          type: string
          description: Lifecycle phase such as `draft`, `active`, or `deprecated`.
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last status update timestamp.
    StoredArtifactEntry:
      type: object
      description: One stored artifact.
      required:
      - relative_path
      - sha256
      - size_bytes
      properties:
        content_type:
          type:
          - string
          - 'null'
          description: Optional MIME type.
        relative_path:
          $ref: '#/components/schemas/RelativeArtifactPath'
          description: Relative artifact path.
        sha256:
          type: string
          description: Base64-encoded SHA-256.
        size_bytes:
          type: integer
          format: int64
          description: Stored byte length.
      additionalProperties: false
    TableStatus:
      type: string
      description: Lifecycle status of a registered Bifrost table.
      enum:
      - Active
      - Deprecated
      - Quarantined
    TenantSlug:
      type: string
      description: Human-visible tenant slug resolved to a DataTenantId at the auth boundary.
    TimeGranularityWire:
      type: string
      description: |-
        Time-partition granularity on the wire.

        Bifrost v1 partitions every table on `wyrd_event_time` and admits exactly
        these two Iceberg-native transforms; nothing else is representable.
      enum:
      - hour
      - day
    TimeUnit:
      type: string
      description: Timestamp / time precision. Arrow-free mirror of `arrow::datatypes::TimeUnit`.
      enum:
      - Second
      - Millisecond
      - Microsecond
      - Nanosecond
    TriggerSpec:
      type: object
      description: Declarative schedule and optional observation source for an Operator.
      required:
      - schedule
      - operator_ref
      properties:
        description:
          type:
          - string
          - 'null'
          description: Optional human-readable purpose.
        operator_ref:
