      - status
      - detail
      - code
      - details
      - remediation
      properties:
        code:
          type: string
          description: Stable Wyrd error code.
        detail:
          type: string
          description: Human-readable problem detail.
        details:
          description: Structured machine-readable details.
        remediation:
          type: string
          description: Remediation guidance.
        status:
          type: integer
          format: int32
          description: HTTP status.
          minimum: 0
        title:
          type: string
          description: Short problem title.
        type:
          type: string
          description: Problem type URI.
      additionalProperties: false
