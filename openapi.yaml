      - principal_kind
      - name
      - status
      properties:
        match_claim:
          type:
          - string
          - 'null'
          description: Claim a human administrator was registered against.
        name:
          type: string
          description: Operator-facing name.
        principal_id:
          $ref: '#/components/schemas/PrincipalId'
          description: Durable principal id.
        principal_kind:
          type: string
          description: |-
            Principal kind: `global_admin` for the deployment root, `user` for a
            human administrator.
        status:
          type: string
          description: 'Lifecycle status: `active`, `suspended`, or `deleted`.'
        subject:
          type:
          - string
          - 'null'
          description: |-
            Subject pinned at first login, once one has happened. `None` means this
            administrator has never signed in.
    PlatformTokenRequest:
      type: object
      description: Request to exchange a platform credential for a session.
      required:
      - credential
      properties:
        credential:
          $ref: '#/components/schemas/SecretBearer'
          description: The platform credential established at initialization or rotated since.
      additionalProperties: false
    PlatformTokenResponse:
      type: object
      description: A minted platform session.
      required:
      - access_token
      - token_type
      - expires_in
      properties:
        access_token:
          $ref: '#/components/schemas/SecretBearer'
          description: Bearer token presented on subsequent platform requests.
        expires_in:
          type: integer
          format: int64
          description: Lifetime in seconds.
          minimum: 0
        token_type:
          type: string
          description: Token type, always `Bearer`.
    PolicySpec:
      type: object
      description: Declarative policy rule set.
      properties:
        description:
          type:
          - string
          - 'null'
          description: Policy description.
        details:
          type: object
          description: Free-form details.
          additionalProperties:
            $ref: '#/components/schemas/NonSecretValue'
          propertyNames:
            type: string
        enforcement:
          type:
          - string
          - 'null'
          description: Enforcement mode.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/PolicyRule'
          description: Policy rules.
    PrincipalId:
      type: string
      format: uuid
      description: Stable principal id on auth wire contracts.
    PromptSpec:
      allOf:
      - description: Native authored prompt. Provider-specific request shape lives here.
      description: |-
        PromptCard spec body wrapping the native Skald prompt.

        Serializes with the `prompt` fields flattened directly into the spec body
        (no `prompt:` nesting key on the wire). Accepts two input forms:

        - **Declarative** (`provider` present, `request` absent): a `PromptDraft`
          that is compiled into the native provider request.
        - **Native** (`request` present): the stored native `Prompt` shape, as
          produced by `save()`.
    ProvisionedTenant:
      type: object
      description: The tenant that was provisioned.
      required:
      - id
