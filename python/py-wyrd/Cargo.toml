[package]
name = "py-wyrd"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false

[lib]
name = "_wyrd"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"
test = false
doctest = false

[features]
testing = ["dep:wyrd-testing"]

[dependencies]
pyo3 = { workspace = true, features = ["extension-module", "abi3-py310", "chrono"] }
wyrd-cli = { workspace = true, features = ["python"] }
skald-agent = { workspace = true, features = ["python"] }
skald-observer = { workspace = true, features = ["python"] }
skald-workflow = { workspace = true, features = ["python"] }
skald-tool = { workspace = true, features = ["python"] }
skald-prompt = { workspace = true, features = ["python"] }
skald-runtime = { workspace = true, features = ["python"] }
wyrd-cards = { workspace = true, features = ["python"] }
wyrd-config = { workspace = true, features = ["python"] }
wyrd-utils = { workspace = true, features = ["python"] }
wyrd-spec = { workspace = true }
wyrd-runtime = { workspace = true }
wyrd-client = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }
arrow = { workspace = true }
arrow-schema = { workspace = true }
wyrd-queue = { workspace = true }
wyrd-sdk = { workspace = true, features = ["python"] }
wyrd-testing = { workspace = true, features = ["python"], optional = true }

[lints]
workspace = true
