apiVersion: wyrd/v1
metadata:
  space: default
  name: research
  version: "0.1.0"
kind: Workflow
spec:
  id: research
  steps:
    - id: planner
      action:
        kind: Agent
        spec:
          prompt:
            provider: mock
            model: gpt-4o-mini
            messages:
              - role: user
                content: "Plan research on: {{topic}}"
            variables: [topic]
            response_type:
              type: text
      depends_on: []
    - id: writer
      action:
        kind: Agent
        spec:
          prompt:
            provider: mock
            model: gpt-4o-mini
            messages:
              - role: user
                content: "Write a brief from: {{summary}}"
            variables: [summary]
            response_type:
              type: text
      depends_on: [planner]
