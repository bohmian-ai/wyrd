[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "wyrd"
version = "0.0.1"
description = "Python bindings for Wyrd"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Wyrd contributors" }]
dependencies = [
    "pyarrow>=18.0.0",
]

[project.scripts]
wyrd = "wyrd.cli:run_wyrd_cli"

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.27"]

[dependency-groups]
dev = [
    "blake3>=1.0.0",
    "catboost>=1.2.0",
    "datasets>=2.20.0",
    "lightgbm>=4.5.0",
    "maturin>=1.7,<2",
    "numpy>=1.26",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "pandas>=2.2,<3",
    "polars>=1.10.0",
    "pydantic>=2.0.0,<3.0.0",
    "pyarrow>=18.0.0",
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "pyyaml>=6.0.0",
    "ruff>=0.1.0,<1.0.0",
    "safetensors>=0.4.0",
    "scikit-learn>=1.5.0",
    "tensorflow>=2.18.0",
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "ty>=0.0.35,<0.1.0",
    "xgboost>=2.1.0",
    "pytorch-lightning>=2.4.0",
]

[tool.maturin]
python-source = "python"
module-name = "wyrd._wyrd"
bindings = 'pyo3'
features = ["pyo3/extension-module", "pyo3/abi3-py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
markers = [
    "tensorflow: marks TensorFlow tests that run in the dedicated TensorFlow task",
    "wyrd_covers(contract): declares that a Python test covers a tagged Wyrd Rust contract",
    "integration: marks tests that require a live WyrdTestServer and run in the gated integration lane",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.uv]
package = false
