[workspace]
dependencies_update = true
changelog_update = true
pr_labels = ["release"]
semver_check = true
publish_timeout = "10m"
git_tag_enable = false
git_release_enable = false
publish = false
repo_url = "https://github.com/bohmian-ai/wyrd"
publish_no_verify = true

# Opt-in crates for crates.io publishing: the Rust SDK (`wyrd-ai`) and every
# workspace crate it depends on, since crates.io requires each dependency of a
# published crate, optional ones included, to be published too. The release
# workflow reads this list.
# Server-tier crates (wyrd-server, wyrd-sql, wyrd-storage, wyrd-testing,
# wyrd-auth) stay unpublished.

[[package]]
name = "vala-eval"
publish = true

[[package]]
name = "wyrd-ai"
publish = true

