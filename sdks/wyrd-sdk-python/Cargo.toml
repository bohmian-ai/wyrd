[package]
name = "wyrd-sdk-python"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false

[lib]
name = "_wyrd"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"
test = false
doctest = false

[features]
# The one foreign-runtime boundary: PyO3 and every retained owner-crate
# Python feature activate only when the extension is built.
python = [
    "dep:pyo3",
    "wyrd-cli/python",
    "skald-agent/python",
    "skald-observer/python",
    "skald-workflow/python",
    "skald-tool/python",
    "skald-prompt/python",
    "skald-runtime/python",
    "wyrd-cards/python",
    "wyrd-config/python",
    "wyrd-utils/python",
]
testing = ["python", "dep:wyrd-testing"]

[dependencies]
pyo3 = { workspace = true, features = ["extension-module", "abi3-py310", "chrono"], optional = true }
wyrd-cli = { workspace = true }
skald-agent = { workspace = true }
skald-observer = { workspace = true }
skald-workflow = { workspace = true }
skald-tool = { workspace = true }
skald-prompt = { workspace = true }
skald-runtime = { workspace = true }
wyrd-cards = { workspace = true }
wyrd-config = { workspace = true }
wyrd-utils = { workspace = true }
wyrd-spec = { workspace = true }
wyrd-runtime = { workspace = true }
wyrd-client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }
arrow = { workspace = true }
arrow-schema = { workspace = true }
wyrd-queue = { workspace = true }
secrecy = { workspace = true }
tempfile = { workspace = true }
wyrd-interfaces = { workspace = true }
wyrd-loader = { workspace = true }
wyrd-semver = { workspace = true }
wyrd-testing = { workspace = true, features = ["python"], optional = true }

[lints]
workspace = true

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
debug = false