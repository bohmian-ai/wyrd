apiVersion: wyrd/v1
kind: Workflow
metadata:
  name: research
  version: 0.1.0
spec:
  inputs:
    topic:
      type: str
      value: ''
  steps:
  - id: planner
    action:
      type: agent
      target:
        kind: Agent
        name: planner
        space: default
        version: 0.1.0
    inputs:
      topic: input.topic
  - id: writer
    action:
      type: agent
      target:
        kind: Agent
        name: writer
        space: default
        version: 0.1.0
    depends_on:
    - planner
    inputs:
      summary: steps.planner.output.structured.summary
  outputs:
    brief: steps.writer.output.text
relationships:
  outbound: []
status: null
