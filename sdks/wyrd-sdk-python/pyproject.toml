[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "wyrd-ai"
version = "0.1.0"
description = "Python bindings for Wyrd"
readme = { text = "Python SDK for Wyrd verification and assurance.", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Wyrd contributors" }]
dependencies = [
    "pyarrow>=18.0.0",
]

[project.scripts]
wyrd = "wyrd.cli:run_wyrd_cli"

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
]
gateway = ["httpx>=0.27", "httpx2>=2.7"]
agents = ["openai-agents>=0.23"]

[dependency-groups]
dev = [
    "catboost>=1.2.0",
    "datasets>=2.20.0",
    "lightgbm>=4.5.0",
    "maturin>=1.7,<2",
    "numpy>=1.26",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
    "pandas>=2.2,<3",
    "polars>=1.10.0",
    "pydantic>=2.0.0,<3.0.0",
    "pyarrow>=18.0.0",
    "pytest>=7.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "pyyaml>=6.0.0",
    "ruff>=0.1.0,<1.0.0",
    "safetensors>=0.4.0",
    "scikit-learn>=1.5.0",
    # TensorFlow publishes no wheels past Python 3.13.
    "tensorflow>=2.18.0; python_version < '3.14'",
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "ty>=0.0.35,<0.1.0",
    "xgboost>=2.1.0",
    "pytorch-lightning>=2.4.0",
    "anthropic>=1.6.0",
    "google-genai>=2.24.0",
    "openai>=3.14.1",
]
# Agent frameworks the MCP journeys drive; only py:test:mcp-frameworks installs them.
mcp-frameworks = [
    "google-adk[mcp]>=2.12.0",
    "httpx2>=2.7",
    "mcp>=2.3.0",
    "openai-agents>=0.23.1",
    "pydantic-ai-slim[mcp]>=2.56.0",
]

[tool.maturin]
python-source = "python"
module-name = "wyrd._wyrd"
bindings = 'pyo3'
features = ["python", "pyo3/extension-module", "pyo3/abi3-py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
# The agent framework journeys need the mcp-frameworks group; only
# py:test:mcp-frameworks names their directories. The rest are pytest's defaults.
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "mcp_frameworks", "frameworks"]
markers = [
    "tensorflow: marks TensorFlow tests that run in the dedicated TensorFlow task",
    "integration: marks tests that require a live WyrdTestServer and run in the gated integration lane",
    "identity: marks integration journeys that need the identity lane's Keycloak; only test:identity:journey runs them",
    "local_dev: marks integration journeys that run the built wyrd and wyrd-server binaries; only test:local-dev:journey builds and runs them",
    "smoke: marks opt-in live provider smoke tests that need operator credentials and real upstreams",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D417"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Every documented stub parameter gets an ``Args:`` entry; the stubs are the
# public help text. Other modules keep their existing docstring style.
"!python/wyrd/**/*.pyi" = ["D417"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
# A module with native members is typed by its ``__init__.pyi``, so its
# ``__init__.py`` is not checked twice; a pure-Python module has no stub.
include = ["python/wyrd", "scripts", "tests"]
# The agent framework journeys import the mcp-frameworks group, which only
# their own lane installs.
exclude = [
    "python/wyrd/**/__init__.py",
    "!python/wyrd/eval/__init__.py",
    "tests/integration/mcp_frameworks",
    "tests/integration/otel/frameworks",
]

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.uv]
package = false

[tool.uv.dependency-groups]
# Pydantic AI and Google ADK require Python 3.11.
mcp-frameworks = { requires-python = ">=3.11" }

# Linux takes the CPU-only torch build: no test uses a GPU, and the default
# Linux wheel pulls about 3 GB of CUDA libraries into every environment.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
