[package]
name = "wyrd-sdk-rust"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
description = "First-class Rust Wyrd SDK: a thin projection of wyrd-client."

[lib]
name = "wyrd_sdk"
path = "src/lib.rs"

[features]
# In-process `wyrd` CLI commands (`wyrd_sdk::cli`), the same implementation
# the executable renders.
cli = ["dep:wyrd-cli"]

[dependencies]
wyrd-cli = { workspace = true, optional = true }
wyrd-client = { workspace = true }
wyrd-spec = { workspace = true }

[dev-dependencies]
workspace-hack.workspace = true
# The journeys run the in-process CLI commands, `wyrd_sdk::cli`.
wyrd-sdk-rust = { path = ".", features = ["cli"] }
arrow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
parquet = { workspace = true, features = ["arrow"] }
# The workload-role journey issues its Service key over the public HTTP route.
reqwest = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# The integrated Service journey builds its native LLM-judge Prompt.
skald-prompt = { workspace = true }
skald-workflow = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
url = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
# Local OpenAI-compatible judge and HTTP Operator endpoint of the integrated
# Service journey.
wiremock = { workspace = true }
wyrd-testing = { workspace = true }
# OTLP/gRPC span export the Eval trace-join journey correlates against.
wyrd-tonic = { workspace = true, features = ["client"] }

[lints]
workspace = true
