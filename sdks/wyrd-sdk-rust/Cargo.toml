[package]
name = "wyrd-ai"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
description = "First-class Rust Wyrd SDK: a thin projection of wyrd-client."

[features]
# Test-only surface: the in-process `wyrd` CLI commands (`wyrd_ai::cli`),
# the same implementation the executable renders. Never enabled by a
# production build.
testing = ["dep:wyrd-cli"]
# Stock OpenTelemetry OTLP/HTTP exporters authenticated by a `WyrdClient`,
# and `start_telemetry`'s `tracing` pipeline over them (`wyrd_ai::otel`).
otel = [
    "dep:async-trait",
    "dep:opentelemetry",
    "dep:opentelemetry-http",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:reqwest",
    "dep:serde_json",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]

[dependencies]
async-trait = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-http = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true, features = ["http-proto", "logs"] }
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
skald-spec = { workspace = true }
wyrd-cli = { workspace = true, optional = true }
wyrd-client = { workspace = true }
wyrd-spec = { workspace = true }

[dev-dependencies]
workspace-hack.workspace = true
# Short access-token lifetimes for the signed-in expiry story.
chrono = { workspace = true }
wyrd-auth-verify = { workspace = true }
# The journeys run the in-process CLI commands, `wyrd_ai::cli`.
wyrd-ai = { path = ".", features = ["otel", "testing"] }
# Reads the Arrow batches a streamed Bifrost query yields.
arrow = { workspace = true }
# The stock OpenTelemetry exporter the OTLP export story configures from
# `OTEL_EXPORTER_OTLP_*`.
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
# The spans the local-development story starts inside a `Run::scope`.
tracing = { workspace = true }
# Parents the traced-verify story's span on a known caller trace under an
# OpenTelemetry subscriber scoped to that verify.
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
# The OpenAI-compatible Chat Completions caller of the gateway inference story.
reqwest = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Local judge, model upstream, and Operator hook the stories call through the
# server.
wiremock = { workspace = true }
wyrd-testing = { workspace = true }

[lints]
workspace = true
