[package]
name = "wyrd-sdk-rust"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
description = "First-class Rust Wyrd SDK: a thin projection of wyrd-client."

[lib]
name = "wyrd_sdk"
path = "src/lib.rs"

[features]
# In-process `wyrd` CLI commands (`wyrd_sdk::cli`), the same implementation
# the executable renders.
cli = ["dep:wyrd-cli"]

[dependencies]
wyrd-cli = { workspace = true, optional = true }
wyrd-client = { workspace = true }
wyrd-spec = { workspace = true }

[dev-dependencies]
workspace-hack.workspace = true
# The journeys run the in-process CLI commands, `wyrd_sdk::cli`.
wyrd-sdk-rust = { path = ".", features = ["cli"] }
chrono = { workspace = true }
# The stock OpenTelemetry exporter the OTLP export story configures from
# `OTEL_EXPORTER_OTLP_*`.
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
# The OpenAI-compatible Chat Completions caller of the gateway inference story.
reqwest = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
skald-workflow = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Local judge, model upstream, and Operator hook the stories call through the
# server.
wiremock = { workspace = true }
wyrd-testing = { workspace = true }

[lints]
workspace = true
