[package]
name = "wyrd-sdk-ts"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# The benchmark recorder and heap sampler of a local diagnostic build: the
# `benchmark*` functions and a sampling global allocator. Only
# `bench:build:sdks` enables it; no published addon does (`check:deps`).
bench = ["wyrd-benchmark/bench"]

[dependencies]
arrow = { workspace = true }
chrono = { workspace = true }
wyrd-queue = { workspace = true }
napi = { workspace = true, features = ["serde-json"] }
napi-derive = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
wyrd-cli = { workspace = true }
wyrd-client = { workspace = true, features = ["internal"] }
wyrd-semver = { workspace = true }
wyrd-spec = { workspace = true }
wyrd-types = { workspace = true }
wyrd-benchmark = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }

[lints]
workspace = true
