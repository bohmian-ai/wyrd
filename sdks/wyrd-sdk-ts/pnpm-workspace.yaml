packages:
  - testing
  - wyrd
  - wyrd-linux-x64-gnu
  - wyrd-linux-arm64-gnu
  - wyrd-darwin-arm64
  - ../../examples/support-desk/typescript
allowBuilds:
  esbuild: true
  # `@grpc/grpc-js`, which the upstream OTLP/gRPC exporters dial through,
  # pulls in protobufjs; its postinstall generates the CommonJS wrappers.
  protobufjs: true
# The root package's platform optional dependencies resolve to these workspace
# directories, never to the registry copies of the same names.
linkWorkspacePackages: true
