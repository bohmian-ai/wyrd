issuer: http://localhost:5556

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true
  responseTypes:
    - code

# The workload journey exchanges client_credentials against the static client below.
# Dex requires a valid auth source to boot, so the built-in password DB is enabled and
# seeded with one well-known test user (password: wyrd-test) for the human-login path.
# Dex has no "local" connector type — local users come from enablePasswordDB/staticPasswords.
enablePasswordDB: true
staticPasswords:
  - email: "alice@wyrd.test"
    hash: "$2y$10$gFDA1PC55z/bXIwnlLjgbus8HD.iyk8gBE8./6ruVV4AzAMh7.7sS"
    username: "alice"
    userID: "dex-alice-0001"

# Static clients for the Wyrd test suite.
staticClients:
  - id: wyrd-workload
    secret: wyrd-workload-dex-secret
    name: Wyrd Workload (Dex)
    public: false
    redirectURIs:
      - http://localhost:8888/callback
