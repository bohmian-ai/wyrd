apiVersion: wyrd/v1
kind: Workflow
metadata:
  space: workflow-loading
  name: code-review
  version: "1.0.0"
spec:
  description: Team reviewer Agents referenced from the registry, with a local final reviewer.
  llm_route:
    kind: native
  inputs:
    code:
      type: str
      value: ""

  steps:
    - id: security
      action:
        type: agent
        target:
          kind: Agent
          name: security-reviewer
          version: "1.0.0"
      inputs:
        code: input.code
      timeout_seconds: 60
      retry:
        max_retries: 1

    - id: correctness
      action:
        type: agent
        target:
          kind: Agent
          name: correctness-reviewer
          version: "1.0.0"
      inputs:
        code: input.code
      timeout_seconds: 60
      retry:
        max_retries: 1

    - id: final_review
      action:
        type: agent
        target: ./agents/final-reviewer.yaml
      depends_on: [security, correctness]
      inputs:
        code: input.code
        security_review: steps.security.output.text
        correctness_review: steps.correctness.output.text
      timeout_seconds: 60
      retry:
        max_retries: 1

  outputs:
    review: steps.final_review.output.text
