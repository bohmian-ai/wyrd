apiVersion: wyrd/v1
kind: Prompt
metadata:
  space: workflow-loading
  name: security-review-prompt
  version: "1.0.0"
spec:
  model: gpt-5-5
  request:
    provider: open_ai_chat_compatible
    body:
      provider:
        custom: mock
      request:
        model: gpt-5-5
        messages:
          - role: system
            content: |
              You are a security reviewer. Report only exploitable security findings.
              For every finding, identify the affected code and a concrete failure path.
          - role: user
            content: "registered security review of {{code}}"
  variables: [code]
  response_type: text
